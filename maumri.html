,"ready":true,"originalAnswer":"족보 이미지 명시 정답 4번"},{"id":"2021-2-19","source":"2021-2","no":19,"text":"Big 5모형에 대한 다음 설명 중 가장 옳지 않은 것은?","options":[{"id":"1","text":"외향성: 사교적이고 명랑하며 말이 많고 자신감이 넘친다."},{"id":"2","text":"개방성: 호기심이 많고, 새로운 것에 대해 많은 관심을 보이지만 변화에 두려워하는 경향을 보인다."},{"id":"3","text":"성실성: 소수의 한정된 목표에 초점과 관심을 집중시키는 정도를 나타낸다."},{"id":"4","text":"친화성: 남에게 양보하는 정도를 나타내는 것이다."}],"answer":"2","type":"mc","originalKey":"족보 이미지 명시 정답 2번","note":"사용자가 첨부한 2021-2 화면에서 문제·선지·정답 표시를 직접 판독했습니다.","review":"이미지 판독 · 직접 풀이","status":"solved","explanation":"개방성은 새로운 경험·생각을 받아들이는 경향이다. 변화에 두려움을 보인다는 부분은 높은 개방성과 맞지 않는다.","refs":[],"topic":"성격·조직","originalText":"Big 5모형에 대한 다음 설명 중 가장 옳지 않은 것은?","ready":true,"originalAnswer":"족보 이미지 명시 정답 2번"},{"id":"2021-2-20","source":"2021-2","no":20,"text":"사장 A에 대한 나의 태도를 기술한 것이다. 다음에 해당하는 태도의 구성요소를 옳게 연결한 것은?\nㄱ. 나의 사장 A는 권위적이다.\nㄴ. 나는 사장 A가 권위적이어서 좋아하지 않는다.\nㄷ. 나는 권위적인 사장 A의 지시를 따르지 않았다.","originalText":"사장 A에 대한 나의 태도를 기술한 것이다. 다음에 해당하는 태도의 구성요소를 옳게 연결한 것은?\nㄱ. 나의 사장 A는 권위적이다.\nㄴ. 나는 사장 A가 권위적이어서 좋아하지 않는다.\nㄷ. 나는 권위적인 사장 A의 지시를 따르지 않았다.","type":"mc","options":[{"id":"1","text":"ㄱ. 인지적 요소 / ㄴ. 정서적 요소 / ㄷ. 행동적 요소"},{"id":"2","text":"ㄱ. 정서적 요소 / ㄴ. 인지적 요소 / ㄷ. 행동적 요소"},{"id":"3","text":"ㄱ. 정서적 요소 / ㄴ. 행동적 요소 / ㄷ. 인지적 요소"},{"id":"4","text":"ㄱ. 인지적 요소 / ㄴ. 행동적 요소 / ㄷ. 정서적 요소"}],"answer":"1","originalKey":"족보 이미지 명시 정답 1번","originalAnswer":"족보 이미지 명시 정답 1번","note":"사용자가 첨부한 2021-2 화면에서 문제·선지·정답 표시를 직접 판독했습니다.","ready":true,"status":"solved","review":"이미지 판독 · 자료 대조","refs":["attitude"],"topic":"성격·조직","explanation":"ㄱ은 사장에 대한 믿음·판단이므로 인지적 요소, ㄴ은 좋아하지 않는 감정이므로 정서적 요소, ㄷ은 실제로 지시를 따르지 않은 행동이므로 행동적 요소다. 따라서 1번이며 족보 답과 일치한다."},{"id":"2021-2-21","source":"2021-2","no":21,"text":"프렌치와 레이븐의 권력원천의 분류에 따라서 개인적 원천의 권력에 해당하는 것을 모두 고르시오.\nA: 강압적 권력 B: 준거적 권력 C: 전문적 권력 D: 합법적 권력 E: 보상적 권력","options":[{"id":"1","text":"A, B"},{"id":"2","text":"A, B, C"},{"id":"3","text":"B, C"},{"id":"4","text":"C, D"}],"answer":"3","type":"mc","originalKey":"족보 이미지 명시 정답 3번","note":"사용자가 첨부한 2021-2 화면에서 문제·선지·정답 표시를 직접 판독했습니다.","review":"이미지 판독 · 자료 대조","status":"solved","explanation":"준거적 권력과 전문적 권력은 개인의 매력·역량에서 생긴다. 보상·강압·합법적 권력은 지위에 기반한다.","refs":["power"],"topic":"권력·조직","originalText":"프렌치와 레이븐의 권력원천의 분류에 따라서 개인적 원천의 권력에 해당하는 것을 모두 고르시오.\nA: 강압적 권력 B: 준거적 권력 C: 전문적 권력 D: 합법적 권력 E: 보상적 권력","ready":true,"originalAnswer":"족보 이미지 명시 정답 3번"},{"id":"2021-2-22","source":"2021-2","no":22,"text":"다음 중 갈등의 의미와 기능에 관한 설명으로 옳지 않은 것은?","options":[{"id":"1","text":"갈등의 해결은 조직의 생산성을 증진시키고 조직의 문제를 해결하는 원동력이다."},{"id":"2","text":"갈등은 현실적으로는 부분적으로 예방하거나 관리할 수 있어도 제거할 수는 없다."},{"id":"3","text":"갈등을 관리 가능한 것으로 파악한다."},{"id":"4","text":"갈등이 조직과정에서 부정적인 역할임을 강조하였다."}],"answer":"4","type":"mc","originalKey":"족보 이미지 명시 정답 4번","note":"사용자가 첨부한 2021-2 화면에서 문제·선지·정답 표시를 직접 판독했습니다.","review":"이미지 판독 · 자료 대조","status":"solved","explanation":"현대적 관점에서는 갈등이 문제 발견과 개선에 도움이 될 수도 있다. 항상 부정적인 역할만 한다는 설명이 틀렸다. 모든 갈등이 유익하다는 의미도 아니다.","refs":["conflict"],"topic":"권력·조직","originalText":"다음 중 갈등의 의미와 기능에 관한 설명으로 옳지 않은 것은?","ready":true,"originalAnswer":"족보 이미지 명시 정답 4번"},{"id":"2021-2-23","source":"2021-2","no":23,"text":"다음은 마키아벨리가 어떤 사람을 평가한 인물평이다. 이 사람은 누구인가?\n[첨부 화면에 인물평 본문이 없습니다.]","originalText":"다음은 마키아벨리가 어떤 사람을 평가한 인물평이다. 이 사람은 누구인가?\n[첨부 화면에 인물평 본문이 없습니다.]","type":"mc","options":[{"id":"1","text":"로렌초 데 메디치"},{"id":"2","text":"코시모 데 메디치"},{"id":"3","text":"피에로 데 메디치"},{"id":"4","text":"카테리나"}],"answer":"2","originalKey":"족보 이미지 명시 정답 2번","originalAnswer":"족보 이미지 명시 정답 2번","note":"사용자가 첨부한 2021-2 화면에서 문제·선지·정답 표시를 직접 판독했습니다.","ready":false,"status":"pending","review":"본문 누락 · 검증 보류","refs":[],"topic":"메디치·인문학","explanation":"족보의 선택 표시와 하단 답은 모두 2번 코시모 데 메디치다. 필기에는 “30년간 피렌체 지배”라는 단서가 있으나 평가문 자체가 없어 독립 검증할 수 없다. 다른 연도 인물평을 임의로 끼워 넣지 않았으며 자동 출제에서 제외한다."},{"id":"2021-2-24","source":"2021-2","no":24,"text":"다음 메디치 가문의 내용 중 옳지 않은 것은?","options":[{"id":"1","text":"비르투스는 메디치 가문의 정신이다."},{"id":"2","text":"마르첼로 아드리아니(피렌체 임시시장)는 그의 연설에서 리더의 사명은 비르투스의 실천을 강조했다."},{"id":"3","text":"일반적으로 리더는 포르투나가 따르기 마련이지만 진정한 리더는 비르투스를 추구해야 한다."},{"id":"4","text":"비르투스는 덕행, 선, 가치, 순결을 의미하고 이것은 완벽함을 의미한다."}],"answer":"4","type":"mc","originalKey":"족보 이미지 명시 정답 4번","note":"사용자가 첨부한 2021-2 화면에서 문제·선지·정답 표시를 직접 판독했습니다.","review":"강의 해석 · 검증 보류","status":"pending","explanation":"화면의 답은 4번이며 필기는 “완벽함”을 “탁월함”으로 고친다. 강의의 대비 개념상 답은 타당하지만, 비르투스·포르투나에 관한 강의 고유 해석과 인용은 외부 자료로 모두 확인하지 못했다. 원본 답을 보존하고 검증 보류로 둔다.","refs":[],"topic":"메디치·인문학","originalText":"다음 메디치 가문의 내용 중 옳지 않은 것은?","ready":false,"originalAnswer":"족보 이미지 명시 정답 4번"},{"id":"2021-2-25","source":"2021-2","no":25,"text":"조직현장에서 권한 위임이 원활하지 않은 이유가 아닌 것은?","options":[{"id":"1","text":"조직정치와 관련하여 인간적인 신뢰가 부족"},{"id":"2","text":"결과에 대한 책임의 문제가 위임을 주저하게 만든다."},{"id":"3","text":"상급자의 능력에 대한 신뢰의 부족"},{"id":"4","text":"인간의 권력욕구와 관련이 되어 있다."}],"answer":"3","type":"mc","originalKey":"족보 이미지 명시 정답 3번","note":"사용자가 첨부한 2021-2 화면에서 문제·선지·정답 표시를 직접 판독했습니다.","review":"이미지 판독 · 직접 풀이","status":"solved","explanation":"위임하는 상급자가 하급자의 역량을 신뢰하지 못하는 것이 장애가 된다. 상급자의 능력에 대한 신뢰 부족으로 방향을 바꾼 선지가 출제 의도상 답이다.","refs":[],"topic":"권력·조직","originalText":"조직현장에서 권한 위임이 원활하지 않은 이유가 아닌 것은?","ready":true,"originalAnswer":"족보 이미지 명시 정답 3번"},{"id":"2023-1-1","source":"2023-1","no":1,"text":"메디치 효과란 상이한 것에 희망을 두고 이질적인 것과 결합함으로써 새로운 창조세계를 만드는 것이다.","options":[{"id":"O","text":"O"},{"id":"X","text":"X"}],"answer":"O","type":"ox","originalKey":"화면에 저장된 선택 답안: 참","note":"첨부 화면의 “작성한 답안이 저장되었습니다”는 정답 판정이 아닙니다. 원본의 저장 답안과 검토 답안을 분리했습니다.","review":"이미지 판독 · 직접 풀이","status":"solved","explanation":"서로 다른 분야·관점이 만나는 지점에서 혁신이 생긴다는 메디치 효과를 가리킨다.","refs":[],"topic":"메디치·인문학","originalText":"메디치 효과란 상이한 것에 희망을 두고 이질적인 것과 결합함으로써 새로운 창조세계를 만드는 것이다.","ready":true,"originalAnswer":"화면에 저장된 선택 답안: 참 (채점 결과 아님)"},{"id":"2023-1-2","source":"2023-1","no":2,"text":"다음 관리자와 리더의 관점을 연결하시오. (FOCUS 측면)\n① 관리자 FOCUS\n② 리더 FOCUS","options":[],"answer":"① 단기적 관점 / ② 장기적 관점","type":"short","originalKey":"화면에 저장된 선택 답안: 관리자: 단기적 관점 / 리더: 장기적 관점","note":"첨부 화면의 “작성한 답안이 저장되었습니다”는 정답 판정이 아닙니다. 원본의 저장 답안과 검토 답안을 분리했습니다.","review":"이미지 판독 · 자료 대조","status":"solved","explanation":"전통적인 비교에서 관리자는 단기적 운영·효율성을, 리더는 장기적 방향·비전을 강조한다. 실제 역할이 언제나 배타적이라는 뜻은 아니다. 연결형은 단답형 자가 채점으로 옮겼다.","refs":["nature"],"topic":"리더십의 기초","originalText":"다음 관리자와 리더의 관점을 연결하시오. (FOCUS 측면)\n① 관리자 FOCUS\n② 리더 FOCUS","ready":true,"originalAnswer":"화면에 저장된 선택 답안: 관리자: 단기적 관점 / 리더: 장기적 관점 (채점 결과 아님)"},{"id":"2023-1-3","source":"2023-1","no":3,"text":"서번트 리더십의 특성으로 옳은 것을 모두 고르시오.","options":[{"id":"1","text":"부하의 감정에 공감하고, 이해하려고 노력한다."},{"id":"2","text":"비전 달성을 위해 위험감수 등 비범한 행동을 보인다."},{"id":"3","text":"부하의 성장을 위해 헌신한다."},{"id":"4","text":"조직의 구성원들에게 공동체 정신을 심어준다."}],"answer":"1,3,4","type":"multi","originalKey":"화면에 저장된 선택 답안: 1,3,4번","note":"첨부 화면의 “작성한 답안이 저장되었습니다”는 정답 판정이 아닙니다. 원본의 저장 답안과 검토 답안을 분리했습니다.","review":"이미지 판독 · 자료 대조","status":"solved","explanation":"공감, 구성원 성장, 공동체 형성은 서번트 리더십의 특성이다. 2번은 이 수업의 유형 비교에서 카리스마 리더십에 해당한다.","refs":["servant"],"topic":"현대적 리더십","originalText":"서번트 리더십의 특성으로 옳은 것을 모두 고르시오.","ready":true,"originalAnswer":"화면에 저장된 선택 답안: 1,3,4번 (채점 결과 아님)"},{"id":"2023-1-4","source":"2023-1","no":4,"type":"ox","text":"비전을 단계적으로 나누어서 단계적으로 승리를 거두고 승리하는 습관을 만들어 본인이 희망한 비전을 달성하는 전략을 Step by Step 전략이라고 한다.\n[원문 마지막의 “우리 수업에서는 …” 부분은 작은 글씨로 정확한 판독이 어렵습니다.]","originalText":"비전을 단계적으로 나누어서 단계적으로 승리를 거두고 승리하는 습관을 만들어 본인이 희망한 비전을 달성하는 전략을 Step by Step 전략이라고 한다.\n[원문 마지막의 “우리 수업에서는 …” 부분은 작은 글씨로 정확한 판독이 어렵습니다.]","options":[{"id":"O","text":"O"},{"id":"X","text":"X"}],"answer":"O","originalKey":"화면에 저장된 선택 답안: 참","originalAnswer":"화면에 저장된 선택 답안: 참 (채점 결과 아님)","note":"첨부 화면의 “작성한 답안이 저장되었습니다”는 정답 판정이 아닙니다. 원본의 저장 답안과 검토 답안을 분리했습니다.","explanation":"단계별 목표 달성이라는 설명은 타당하다. 다만 강의에서 사용하는 별칭을 포함한 문장 전체를 판독하지 못했으므로 원문 OX 정답 확정은 보류한다.","refs":[],"topic":"리더십의 기초","ready":false,"status":"pending","review":"이미지 판독 · 검증 보류"},{"id":"2023-1-5","source":"2023-1","no":5,"text":"다음 중 리더십 연구과정에서 나타나는 공통점을 모두 고르시오.","options":[{"id":"1","text":"리더십은 결국 목표달성을 위한 과정이다."},{"id":"2","text":"리더십은 영향력과 관계가 있다."},{"id":"3","text":"리더십은 결과이다."},{"id":"4","text":"리더십은 집단 상황에서 발생한다."}],"answer":"1,2,4","type":"multi","originalKey":"화면에 저장된 선택 답안: 1,2,4번","note":"첨부 화면의 “작성한 답안이 저장되었습니다”는 정답 판정이 아닙니다. 원본의 저장 답안과 검토 답안을 분리했습니다.","review":"이미지 판독 · 자료 대조","status":"solved","explanation":"리더십의 공통 요소는 목표를 향한 과정, 영향력, 집단 상황이다. 단순한 결과로 규정한 3번은 제외한다.","refs":["nature"],"topic":"리더십의 기초","originalText":"다음 중 리더십 연구과정에서 나타나는 공통점을 모두 고르시오.","ready":true,"originalAnswer":"화면에 저장된 선택 답안: 1,2,4번 (채점 결과 아님)"},{"id":"2023-1-6","source":"2023-1","no":6,"type":"multi","text":"다음 유물 사진에 대한 설명으로 옳은 것을 모두 고르시오.\n[원본: 손가락 성유물함과 손가락 확대 사진]","originalText":"다음 유물 사진에 대한 설명으로 옳은 것을 모두 고르시오.\n[원본: 손가락 성유물함과 손가락 확대 사진]","options":[{"id":"1","text":"이 손가락의 의미는 한번 맺은 고객과의 관계는 끝까지 배신하지 않는 메디치 가문의 의리이다."},{"id":"2","text":"요하네스 23세 사후 많은 유력자들과 교황들은 메디치 가문과 거래를 시작하였다."},{"id":"3","text":"교황 레오 10세는 레오나르도 다빈치에게 세례자 성 요한을 그리게 하였다."},{"id":"4","text":"요하네스 23세의 선물이다."}],"answer":null,"originalKey":"화면에 저장된 선택 답안: 1,2,3,4번","originalAnswer":"화면에 저장된 선택 답안: 1,2,3,4번 (채점 결과 아님)","note":"첨부 화면의 “작성한 답안이 저장되었습니다”는 정답 판정이 아닙니다. 원본의 저장 답안과 검토 답안을 분리했습니다.","explanation":"사진과 선지는 옮겼지만 성유물의 정확한 소장처·기원, 레오 10세의 주문 여부와 강의의 상징 해석을 확정할 근거는 부족하다. 화면에서 전부 체크되어 있다고 전부 정답으로 처리하지 않는다.","refs":[],"topic":"리더십의 기초","ready":false,"status":"pending","review":"이미지 판독 · 검증 보류"},{"id":"2023-1-7","source":"2023-1","no":7,"type":"ox","text":"좋은 비전이란 비전실현의 주체들이 효과적이고 올바른 방법으로 활동하도록 동기를 부여하게 만드는 것이다.","originalText":"좋은 비전이란 비전실현의 주체들이 효과적이고 올바른 방법으로 활동하도록 동기를 부여하게 만드는 것이다.","options":[{"id":"O","text":"O"},{"id":"X","text":"X"}],"answer":"O","originalKey":"화면에 저장된 선택 답안: 참","originalAnswer":"화면에 저장된 선택 답안: 참 (채점 결과 아님)","note":"첨부 화면의 “작성한 답안이 저장되었습니다”는 정답 판정이 아닙니다. 원본의 저장 답안과 검토 답안을 분리했습니다.","explanation":"비전은 지향점을 제시하고 구성원이 목표를 향해 행동하도록 동기를 부여한다. 좋은 비전의 기능을 설명하므로 O로 판단한다.","refs":["nature"],"topic":"리더십의 기초","ready":true,"status":"solved","review":"이미지 판독 · 자료 대조"},{"id":"2023-1-8","source":"2023-1","no":8,"text":"조직현장에서 권한 위임이 원활하지 않은 이유를 모두 고르시오.","options":[{"id":"1","text":"상급자의 능력에 대한 신뢰의 부족이다."},{"id":"2","text":"결과에 대한 책임의 문제가 위임을 주저하게 만든다."},{"id":"3","text":"인간의 권력욕구와 관련이 되어 있다."},{"id":"4","text":"조직정치와 관련하여 인간적인 신뢰가 부족하다."}],"answer":"2,3,4","type":"multi","originalKey":"화면에 저장된 선택 답안: 2,3,4번","note":"첨부 화면의 “작성한 답안이 저장되었습니다”는 정답 판정이 아닙니다. 원본의 저장 답안과 검토 답안을 분리했습니다.","review":"이미지 판독 · 직접 풀이","status":"solved","explanation":"상급자가 하급자에게 위임하는 맥락에서 책임 부담, 권력 유지 욕구, 인간적 신뢰 부족은 장애다. 1번의 능력 신뢰 대상은 출제 의도상 하급자여야 한다.","refs":[],"topic":"권력·조직","originalText":"조직현장에서 권한 위임이 원활하지 않은 이유를 모두 고르시오.","ready":true,"originalAnswer":"화면에 저장된 선택 답안: 2,3,4번 (채점 결과 아님)"},{"id":"2023-1-9","source":"2023-1","no":9,"text":"리더십 이론에 관한 설명으로 옳지 않은 것은?","options":[{"id":"1","text":"[작은 글씨로 문장 전체 판독 불가: 구조주도·배려 및 리더의 수에 관한 설명]"},{"id":"2","text":"허쉬와 블랜차드의 상황적 리더십 이론에서는 부하들의 성숙도를 중요한 요소로 고려하고 있다."},{"id":"3","text":"하우스의 경로-목표이론에 의하면 내부적 통제위치를 지닌 부하의 경우 참여적 리더십이 적합하다."},{"id":"4","text":"리더십 특성이론은 리더가 지니는 카리스마, 결단력, 열정, 용기 등과 같은 특성을 찾아내는 데 초점을 둔다."},{"id":"5","text":"피들러의 상황적합모형에 의하면 개인의 리더십 유형은 상황에 따라 변화한다고 한다."}],"answer":"5","type":"mc","originalKey":"화면에 저장된 선택 답안: 3번","note":"첨부 화면의 “작성한 답안이 저장되었습니다”는 정답 판정이 아닙니다. 원본의 저장 답안과 검토 답안을 분리했습니다.","review":"이미지 판독 · 검증 보류","status":"pending","explanation":"판독된 선지만 보면 5번이 틀린 설명이다. 피들러는 리더의 기본 유형을 비교적 안정적인 것으로 보고 상황과의 적합을 중시한다. 내부 통제위치와 참여적 리더십을 연결한 3번은 타당하다. 다만 1번 전체가 불명확하여 최종 단일 정답 검증은 보류한다.","refs":["situation"],"topic":"행동·상황이론","originalText":"리더십 이론에 관한 설명으로 옳지 않은 것은?","ready":false,"originalAnswer":"화면에 저장된 선택 답안: 3번 (채점 결과 아님)"},{"id":"2023-1-10","source":"2023-1","no":10,"type":"ox","text":"언어적 커뮤니케이션에서 가장 중요한 것은 말하는 사람의 목소리 톤이다.","originalText":"언어적 커뮤니케이션에서 가장 중요한 것은 말하는 사람의 목소리 톤이다.","options":[{"id":"O","text":"O"},{"id":"X","text":"X"}],"answer":"X","originalKey":"화면에 저장된 선택 답안: 거짓","originalAnswer":"화면에 저장된 선택 답안: 거짓 (채점 결과 아님)","note":"첨부 화면의 “작성한 답안이 저장되었습니다”는 정답 판정이 아닙니다. 원본의 저장 답안과 검토 답안을 분리했습니다.","explanation":"언어적 메시지는 말의 내용·의미를 중심으로 한다. 목소리 톤은 준언어적 단서이며 중요할 수 있지만, 모든 언어적 커뮤니케이션에서 가장 중요하다고 일반화할 수 없다.","refs":[],"topic":"리더십의 기초","ready":true,"status":"solved","review":"이미지 판독 · 직접 풀이"},{"id":"2023-1-11","source":"2023-1","no":11,"text":"프렌치와 레이븐의 권력 원천을 각각의 의미와 연결하시오.\n① 보상적 권력\n② 강제적 권력\n③ 합법적 권력\n④ 전문적 권력\n⑤ 준거적 권력","options":[],"answer":"① 보상을 제공할 수 있는 능력 / ② 처벌·강등·해고 등 불이익을 가할 수 있는 능력 / ③ 공식 지위와 정당한 권한의 인정 / ④ 전문지식·기술에 대한 신뢰 / ⑤ 존경·호감·동일시","type":"short","originalKey":"화면에 저장된 선택 답안: 각 드롭다운에 대응 설명 선택 (문장 끝 일부 잘림)","note":"첨부 화면의 “작성한 답안이 저장되었습니다”는 정답 판정이 아닙니다. 원본의 저장 답안과 검토 답안을 분리했습니다.","review":"이미지 판독 · 자료 대조","status":"solved","explanation":"다섯 권력 원천의 개념을 기준으로 연결형을 단답형 자가 채점으로 옮겼다. 드롭다운에 보이지 않는 문장 끝을 원문이라고 추정하지 않고, 검토 답안에는 각 개념의 뜻을 제시했다.","refs":["power"],"topic":"권력·조직","originalText":"프렌치와 레이븐의 권력 원천을 각각의 의미와 연결하시오.\n① 보상적 권력\n② 강제적 권력\n③ 합법적 권력\n④ 전문적 권력\n⑤ 준거적 권력","ready":true,"originalAnswer":"화면에 저장된 선택 답안: 각 드롭다운에 대응 설명 선택 (문장 끝 일부 잘림) (채점 결과 아님)"},{"id":"2023-1-12","source":"2023-1","no":12,"text":"허시와 블랜차드의 상황적 리더십 이론에 관한 설명으로 옳은 것은?","options":[{"id":"1","text":"리더십 유형을 지시형, 설득형, 거래형, 위임형의 4가지로 구분한다."},{"id":"2","text":"리더가 부하를 섬기고 봉사함으로써 조직을 이끈다."},{"id":"3","text":"부하의 성과에 따른 리더의 보상에 초점을 맞춘다."},{"id":"4","text":"리더는 부하의 성숙도에 맞는 리더십을 행사함으로써 리더십의 유효성을 높일 수 있다."},{"id":"5","text":"리더십에 영향을 줄 수 있는 상황적 요소는 과업구조, 리더의 지위권력 등이다."}],"answer":"4","type":"mc","originalKey":"화면에 저장된 선택 답안: 4번","note":"첨부 화면의 “작성한 답안이 저장되었습니다”는 정답 판정이 아닙니다. 원본의 저장 답안과 검토 답안을 분리했습니다.","review":"이미지 판독 · 자료 대조","status":"solved","explanation":"구성원의 성숙도·준비도에 맞게 과업행동과 관계행동을 조절하는 설명이 맞다. 1번은 거래형을 잘못 포함했고, 2번은 서번트, 3번은 거래적, 5번은 피들러의 상황 변수에 가까운 설명이다.","refs":["slii"],"topic":"행동·상황이론","originalText":"허시와 블랜차드의 상황적 리더십 이론에 관한 설명으로 옳은 것은?","ready":true,"originalAnswer":"화면에 저장된 선택 답안: 4번 (채점 결과 아님)"},{"id":"2023-1-13","source":"2023-1","no":13,"type":"ox","text":"작업동기(work motivation)란 개인의 작업행동을 일으키고 그 행동의 강도, 방향성 그리고 지속성을 결정하는 역동적인 힘의 결합이다.","originalText":"작업동기(work motivation)란 개인의 작업행동을 일으키고 그 행동의 강도, 방향성 그리고 지속성을 결정하는 역동적인 힘의 결합이다.","options":[{"id":"O","text":"O"},{"id":"X","text":"X"}],"answer":"O","originalKey":"화면에 저장된 선택 답안: 참","originalAnswer":"화면에 저장된 선택 답안: 참 (채점 결과 아님)","note":"첨부 화면의 “작성한 답안이 저장되었습니다”는 정답 판정이 아닙니다. 원본의 저장 답안과 검토 답안을 분리했습니다.","explanation":"동기는 행동을 일으키고 방향·강도·지속에 영향을 주는 힘으로 설명된다. 작업동기의 일반적인 정의와 부합한다.","refs":["process"],"topic":"리더십의 기초","ready":true,"status":"solved","review":"이미지 판독 · 자료 대조"},{"id":"2023-1-14","source":"2023-1","no":14,"text":"변혁적 리더십의 특징에 해당하지 않는 것을 모두 고른 것은?\nA: 부하들에게 장기적인 목표를 위해 노력하도록 동기를 부여한다.\nB: 부하들을 위해 문제를 해결하거나 해답을 찾을 수 있는 곳을 알려준다.\nC: 부하들에게 즉각적이고 가시적인 보상으로 동기 부여한다.\nD: 부하들에게 자아실현과 같은 높은 수준의 개인적인 목표를 동경하도록 동기를 부여한다.\nE: 질문을 하여 부하들에게 스스로 해결책을 찾거나 격려하도록 함께 일을 한다.","options":[{"id":"1","text":"B, C"},{"id":"2","text":"D, E"},{"id":"3","text":"A, B"},{"id":"4","text":"C, D"}],"answer":"1","type":"mc","originalKey":"화면에 저장된 선택 답안: 1번","note":"첨부 화면의 “작성한 답안이 저장되었습니다”는 정답 판정이 아닙니다. 원본의 저장 답안과 검토 답안을 분리했습니다.","review":"이미지 판독 · 자료 대조","status":"solved","explanation":"C의 즉각적 보상은 거래적 리더십에 해당한다. B는 리더가 답을 제공하는 방식이며, E의 자율적 해결 촉진과 대비된다. 출제 의도상 B와 C를 고른다. 다만 B의 행동은 현실에서 변혁적 리더도 할 수 있으므로, 이 답은 거래적·변혁적 리더십을 대조하는 시험 문맥의 판단이다.","refs":["transform"],"topic":"현대적 리더십","originalText":"변혁적 리더십의 특징에 해당하지 않는 것을 모두 고른 것은?\nA: 부하들에게 장기적인 목표를 위해 노력하도록 동기를 부여한다.\nB: 부하들을 위해 문제를 해결하거나 해답을 찾을 수 있는 곳을 알려준다.\nC: 부하들에게 즉각적이고 가시적인 보상으로 동기 부여한다.\nD: 부하들에게 자아실현과 같은 높은 수준의 개인적인 목표를 동경하도록 동기를 부여한다.\nE: 질문을 하여 부하들에게 스스로 해결책을 찾거나 격려하도록 함께 일을 한다.","ready":true,"originalAnswer":"화면에 저장된 선택 답안: 1번 (채점 결과 아님)"},{"id":"2023-1-15","source":"2023-1","no":15,"text":"허시와 블랜차드의 상황적 리더십 이론에서 설명한 4가지 리더십 스타일이 아닌 것은?","options":[{"id":"1","text":"설득형"},{"id":"2","text":"위임형"},{"id":"3","text":"설명형"},{"id":"4","text":"청유형"},{"id":"5","text":"참여형"}],"answer":"4","type":"mc","originalKey":"화면에 저장된 선택 답안: 4번","note":"첨부 화면의 “작성한 답안이 저장되었습니다”는 정답 판정이 아닙니다. 원본의 저장 답안과 검토 답안을 분리했습니다.","review":"이미지 판독 · 자료 대조","status":"solved","explanation":"설명형(지시형), 설득형, 참여형, 위임형이 네 유형이다. 청유형은 이 분류에 해당하지 않는다.","refs":["slii"],"topic":"행동·상황이론","originalText":"허시와 블랜차드의 상황적 리더십 이론에서 설명한 4가지 리더십 스타일이 아닌 것은?","ready":true,"originalAnswer":"화면에 저장된 선택 답안: 4번 (채점 결과 아님)"},{"id":"2023-1-16","source":"2023-1","no":16,"type":"mc","text":"스티븐 코비 박사의 성공하는 사람의 7가지 습관 중 아닌 것은?","originalText":"스티븐 코비 박사의 성공하는 사람의 7가지 습관 중 아닌 것은?","options":[{"id":"1","text":"경청한 다음에 이해시켜라"},{"id":"2","text":"부족하더라도 행동하라"},{"id":"3","text":"소중한 것을 먼저 하라"},{"id":"4","text":"주도적이 되어라"}],"answer":"2","originalKey":"화면에 저장된 선택 답안: 3번","originalAnswer":"화면에 저장된 선택 답안: 3번 (채점 결과 아님)","note":"첨부 화면의 “작성한 답안이 저장되었습니다”는 정답 판정이 아닙니다. 원본의 저장 답안과 검토 답안을 분리했습니다.","explanation":"화면의 저장 답안 3번은 잘못 선택되었다. “소중한 것을 먼저 하라”는 공식 Habit 3이다. 1번은 Habit 5, 4번은 Habit 1에 대응한다. 2번은 일곱 습관의 항목이 아니므로 정답은 2번이다.","refs":["covey"],"topic":"리더십의 기초","ready":true,"status":"correction","review":"저장 답안 수정"},{"id":"2023-1-18","source":"2023-1","no":18,"type":"multi","text":"다음 사진과 관련된 설명으로 옳은 것을 모두 고르시오.\n[카레지 메디치 별장으로 보이는 건축물 사진]","originalText":"다음 사진과 관련된 설명으로 옳은 것을 모두 고르시오.\n[카레지 메디치 별장으로 보이는 건축물 사진]","options":[{"id":"1","text":"코시모는 많은 학자들을 이곳으로 초청하여 토론을 즐겼다."},{"id":"2","text":"마르실리오 피치노는 플라톤 전집을 라틴어로 번역하였다."},{"id":"3","text":"코시모는 초월적 사고, 감성적 직관, 창조적 영감을 중시하던 플라톤주의에 주목하였다. [작은 글씨 판독 재확인 필요]"},{"id":"4","text":"코시모가 마르실리오 피치노에게 제시한 플라톤 아카데미의 원칙은 “당신이 … 하고 싶은 일을 하시오”였다. [인용 일부 판독 불가]"}],"answer":null,"originalKey":"화면에 저장된 선택 답안: 1,2,3,4번","originalAnswer":"화면에 저장된 선택 답안: 1,2,3,4번 (채점 결과 아님)","note":"첨부 화면의 “작성한 답안이 저장되었습니다”는 정답 판정이 아닙니다. 원본의 저장 답안과 검토 답안을 분리했습니다.","explanation":"공식 토스카나 자료는 카레지의 학자 모임 및 코시모와 피치노의 관계를 뒷받침한다. 그러나 3·4번의 강의상 표현과 인용을 완전히 판독·대조하지 못했으므로 모든 선지를 정답으로 확정하지 않는다.","refs":["careggi"],"topic":"리더십의 기초","ready":false,"status":"pending","review":"이미지 판독 · 검증 보류"},{"id":"2023-1-19","source":"2023-1","no":19,"text":"브룸의 기대이론의 개념과 의미를 연결하시오.\n① 수단성\n② 기대감\n③ 유인가","options":[],"answer":"① 성과(1차 결과)가 보상(2차 결과)으로 이어질 것이라는 지각 / ② 노력하면 성과를 낼 수 있다는 기대 / ③ 결과·보상에 대해 느끼는 가치","type":"short","originalKey":"화면에 저장된 선택 답안: 수단성: 1차 결과와 2차 결과 간 연계 / 기대감: 자기 능력과 가능성… / 유인가: 산출물의 중요성이나 가치의 정도","note":"첨부 화면의 “작성한 답안이 저장되었습니다”는 정답 판정이 아닙니다. 원본의 저장 답안과 검토 답안을 분리했습니다.","review":"이미지 판독 · 자료 대조","status":"solved","explanation":"연결형을 단답형 자가 채점으로 옮겼다. 기대감은 노력에서 성과로, 수단성은 성과에서 보상으로 이어질 가능성에 관한 지각이고 유인가는 보상의 매력·가치다.","refs":["process"],"topic":"동기부여","originalText":"브룸의 기대이론의 개념과 의미를 연결하시오.\n① 수단성\n② 기대감\n③ 유인가","ready":true,"originalAnswer":"화면에 저장된 선택 답안: 수단성: 1차 결과와 2차 결과 간 연계 / 기대감: 자기 능력과 가능성… / 유인가: 산출물의 중요성이나 가치의 정도 (채점 결과 아님)"},{"id":"2023-1-20","source":"2023-1","no":20,"text":"관리격자모델의 리더 유형에 관한 설명으로 옳지 않은 것은?","options":[{"id":"1","text":"(5,5)형은 과업의 능률과 인간적 요소를 절충하여 적당한 수준에서 성과를 추구하는 중도형 리더이다."},{"id":"2","text":"(1,9)형은 생산에 관심을 보이는 인기형 리더이다."},{"id":"3","text":"(9,1)형은 과업상의 능력을 우선적으로 생각하는 과업형 리더이다."},{"id":"4","text":"(1,1)형은 조직구성원으로서 자리를 유지하는 데 필요한 최소한의 노력만을 투입하는 무관심형 리더이다."}],"answer":"2","type":"mc","originalKey":"화면에 저장된 선택 답안: 2번","note":"첨부 화면의 “작성한 답안이 저장되었습니다”는 정답 판정이 아닙니다. 원본의 저장 답안과 검토 답안을 분리했습니다.","review":"이미지 판독 · 자료 대조","status":"solved","explanation":"(1,9)는 인간에 대한 관심이 높고 생산에 대한 관심이 낮은 인기형이다. 두 축을 바꾸어 설명한 선지가 틀렸다.","refs":["grid"],"topic":"행동·상황이론","originalText":"관리격자모델의 리더 유형에 관한 설명으로 옳지 않은 것은?","ready":true,"originalAnswer":"화면에 저장된 선택 답안: 2번 (채점 결과 아님)"},{"id":"2023-1-21","source":"2023-1","no":21,"type":"multi","text":"다음 그림 및 그림과 관련된 설명으로 옳은 것을 모두 고르시오.\n[갑옷을 입고 왕홀을 든 여성이 의자에 앉아 있는 그림]","originalText":"다음 그림 및 그림과 관련된 설명으로 옳은 것을 모두 고르시오.\n[갑옷을 입고 왕홀을 든 여성이 의자에 앉아 있는 그림]","options":[{"id":"1","text":"이 그림의 제목은 불굴의 용기로 레오나르도 다빈치의 그림이다."},{"id":"2","text":"이 그림의 후원자는 로렌초이다."},{"id":"3","text":"이 그림은 탁월함의 개념을 상징하는 알레고리 연작 중 하나이다."},{"id":"4","text":"이 그림은 진정한 용기, 불굴의 용기를 그린 것으로 그의 후원자의 리더십을 표현한 것이다."}],"answer":"3","originalKey":"화면에 저장된 선택 답안: 1,3번","originalAnswer":"화면에 저장된 선택 답안: 1,3번 (채점 결과 아님)","note":"첨부 화면의 “작성한 답안이 저장되었습니다”는 정답 판정이 아닙니다. 원본의 저장 답안과 검토 답안을 분리했습니다.","explanation":"1번의 작가를 레오나르도로 적은 부분은 명백한 오류다. 작품은 보티첼리의 「강인함(Fortitude)」이며 미덕 연작에 속한다. 공식 기록은 토마소 소데리니의 관여와 상업재판소의 주문을 설명하므로 2번의 로렌초 후원 단정도 지지하지 않는다. 3번은 타당하다. 4번의 “후원자의 리더십 표현”은 강의 해석 확인이 필요하여 완전한 복수정답 조합은 보류한다.","refs":["fortitude"],"topic":"리더십의 기초","ready":false,"status":"pending","review":"저장 답안 오류 확인 · 검증 보류"},{"id":"2023-1-22","source":"2023-1","no":22,"type":"multi","text":"다음 그림과 관련된 설명으로 옳은 것을 모두 고르시오.\n[피렌체의 바사리 회랑 경로도 / 화면 하단 일부가 재생 막대에 가려짐]","originalText":"다음 그림과 관련된 설명으로 옳은 것을 모두 고르시오.\n[피렌체의 바사리 회랑 경로도 / 화면 하단 일부가 재생 막대에 가려짐]","options":[{"id":"1","text":"이곳은 바사리 회랑이다."},{"id":"2","text":"피티궁과 베키오 궁을 연결한 회랑이다."},{"id":"3","text":"코시모 3세의 전용 피트니스센터가 되었다."},{"id":"4","text":"바사리 회랑은 시민과의 물리적인 결별을 의미하고, 이는 메디치 가문의 몰락으로 이어졌다."},{"id":"5","text":"안에서는 밖을 볼 수 있지만 밖에서는 안을 볼 수 없도록 설계되었다. [하단 가림으로 재확인 필요]"}],"answer":null,"originalKey":"화면에 저장된 선택 답안: 1,2,3,4번 체크 확인 / 5번 상태 가림","originalAnswer":"화면에 저장된 선택 답안: 1,2,3,4번 체크 확인 / 5번 상태 가림 (채점 결과 아님)","note":"첨부 화면의 “작성한 답안이 저장되었습니다”는 정답 판정이 아닙니다. 원본의 저장 답안과 검토 답안을 분리했습니다.","explanation":"1·2번은 우피치 공식 설명과 일치한다. 회랑은 코시모 1세가 1565년 주문하여 거처와 관청 사이를 안전하게 이동하도록 만든 시설이다. 3번은 후대 사용 일화일 수 있으므로 건립자가 코시모 1세라는 이유만으로 오답 처리하지 않는다. 피트니스 일화, 가문 몰락과의 인과관계, 5번의 정확한 문구는 추가 검증이 필요하다.","refs":["corridor"],"topic":"리더십의 기초","ready":false,"status":"pending","review":"이미지 판독 · 검증 보류"},{"id":"2023-1-23","source":"2023-1","no":23,"type":"mc","text":"레오나르도에 대한 다음과 같은 평가를 한 사람은 누구인가?\n레오나르도는 분명히 예술에 대한 이해가 탁월했기 때문에 많은 것을 시도했다. 그러나 어느 것도 끝내지 못했다. 자신이 생각했던 완벽한 작품을 만들 수 없다는 것을 깨달았기 때문이다. 그의 이상은 고매했다. 그의 손이 아무리 뛰어난 솜씨를 가졌다 해도 그 이상은 실현할 수 없었다.","originalText":"레오나르도에 대한 다음과 같은 평가를 한 사람은 누구인가?\n레오나르도는 분명히 예술에 대한 이해가 탁월했기 때문에 많은 것을 시도했다. 그러나 어느 것도 끝내지 못했다. 자신이 생각했던 완벽한 작품을 만들 수 없다는 것을 깨달았기 때문이다. 그의 이상은 고매했다. 그의 손이 아무리 뛰어난 솜씨를 가졌다 해도 그 이상은 실현할 수 없었다.","options":[{"id":"1","text":"바사리"},{"id":"2","text":"미켈란젤로"},{"id":"3","text":"코시모"},{"id":"4","text":"보티첼리"}],"answer":"1","originalKey":"화면에 저장된 선택 답안: 1번","originalAnswer":"화면에 저장된 선택 답안: 1번 (채점 결과 아님)","note":"첨부 화면의 “작성한 답안이 저장되었습니다”는 정답 판정이 아닙니다. 원본의 저장 답안과 검토 답안을 분리했습니다.","explanation":"레오나르도의 완벽주의와 미완성 작품을 설명한 전기 작가는 조르조 바사리다. 앞선 족보의 “평가받은 인물이 누구인가”와 달리 이 문제는 평가한 사람을 묻는다.","refs":["vasari"],"topic":"리더십의 기초","ready":true,"status":"solved","review":"이미지 판독 · 자료 대조"},{"id":"2023-1-24","source":"2023-1","no":24,"text":"리더십 특성이론의 한계점이 아닌 것은?","options":[{"id":"1","text":"오랜 시간 걸친 연구에도 불구하고 모든 연구결과에서 공통적으로 제시되는 특성요인이 없다."},{"id":"2","text":"특성이론은 현재에는 사용되고 있지 않다."},{"id":"3","text":"행동이론과 상황이론에 비해 이론의 구성이 단순하다."},{"id":"4","text":"리더십 특성들을 확인하였을 뿐 그러한 특성과 조직성과, 또는 조직효과성 간의 상관관계를 규명하려는 노력을 기울이지 않았다."},{"id":"5","text":"오랜 기간에 걸쳐 깊이 있는 연구가 진행되었음에도 불구하고 리더십 훈련이나 개발을 위해 유용하게 적용되기 어렵다."}],"answer":"3","type":"mc","originalKey":"화면에 저장된 선택 답안: 3번","note":"첨부 화면의 “작성한 답안이 저장되었습니다”는 정답 판정이 아닙니다. 원본의 저장 답안과 검토 답안을 분리했습니다.","review":"선지 확인 완료 · 정답 모호성 검토","status":"pending","explanation":"사용자가 ② 선지를 “특성이론은 현재에는 사용되고 있지 않다”로 확인했다. ③의 단순한 이론 구성은 통상 한계점으로 보지 않으므로 출제 의도상 잠정 답은 ③이다. 그러나 특성 접근은 현대 리더십 연구에서도 활용되므로 ② 역시 일반적으로 타당하지 않은 설명이다. 따라서 단일 정답의 모호성이 남아 있으며, 강의 기준 또는 공식 정답 확인 전까지 자동 출제는 보류한다.","refs":["traitReview"],"topic":"리더십의 기초","originalText":"리더십 특성이론의 한계점이 아닌 것은?","ready":false,"originalAnswer":"화면에 저장된 선택 답안: 3번 (채점 결과 아님)","contentRevision":1},{"id":"2023-1-25","source":"2023-1","no":25,"type":"ox","text":"“용서할 줄 아는 사람이 정복할 줄 안다”라고 말한 사람은 관용의 리더십의 대표인 피에로이다.","originalText":"“용서할 줄 아는 사람이 정복할 줄 안다”라고 말한 사람은 관용의 리더십의 대표인 피에로이다.","options":[{"id":"O","text":"O"},{"id":"X","text":"X"}],"answer":"O","originalKey":"화면에 저장된 선택 답안: 참","originalAnswer":"화면에 저장된 선택 답안: 참 (채점 결과 아님)","note":"첨부 화면의 “작성한 답안이 저장되었습니다”는 정답 판정이 아닙니다. 원본의 저장 답안과 검토 답안을 분리했습니다.","explanation":"화면의 저장 답안은 참이다. 피에로의 관용을 강조하는 강의 내용과 연결되지만, 이 문구의 정확한 사료 출처와 인물 귀속을 확인하지 못하여 검증 보류로 남긴다.","refs":[],"topic":"리더십의 기초","ready":false,"status":"pending","review":"이미지 판독 · 검증 보류"}],"refs":{"grid":["관리격자·행동이론","https://openstax.org/books/organizational-behavior/pages/12-5-behavioral-approaches-to-leadership"],"situation":["상황이론·경로목표이론","https://openstax.org/books/principles-management/pages/13-6-situational-contingency-approaches-to-leadership"],"needs":["욕구·ERG·2요인 이론","https://openstax.org/books/principles-management/pages/14-2-content-theories-of-motivation"],"process":["공정성·기대이론","https://openstax.org/books/organizational-behavior/pages/7-3-process-theories-of-motivation"],"servant":["서번트 리더십","https://greenleaf.org/product/voices-6/"],"transform":["변혁적·거래적 리더십","https://openstax.org/books/organizational-behavior/pages/12-8-transformational-visionary-and-charismatic-leadership"],"nature":["리더십의 정의와 관리","https://openstax.org/books/organizational-behavior/pages/12-1-the-nature-of-leadership"],"conflict":["갈등의 기능","https://openstax.org/books/organizational-behavior/pages/14-1-conflict-in-organizations-basic-considerations"],"slii":["상황적 리더십 4유형","https://www.blanchard.com/blog/a-situational-approach-to-effective-leadership"],"power":["권력의 원천","https://openstax.org/books/organizational-behavior/pages/13-summary-of-learning-outcomes"],"history":["마키아벨리 피렌체사","https://oll-resources.s3.us-east-2.amazonaws.com/oll3/store/titles/774/Machiavelli_0076-01.html"],"louvre":["루브르 작품 기록","https://collections.louvre.fr/ark:/53355/cl010062374"],"medici":["메디치 예배당 작품 기록","https://bargellomusei.it/en/museum/cappelle-medicee/"],"attitude":["태도의 인지·정서·행동 요소","https://openstax.org/books/psychology-2e/pages/12-3-attitudes-and-persuasion"],"covey":["FranklinCovey 공식 7가지 습관","https://www.franklincovey.com/courses/the-7-habits/"],"fortitude":["우피치: Botticelli, Fortitude","https://www.uffizi.it/en/artworks/fortitude"],"pallas":["우피치: Pallas and the Centaur","https://www.uffizi.it/en/artworks/pallas-and-the-centaur"],"corridor":["우피치: 바사리 회랑 역사","https://www.uffizi.it/en/corridoio-vasariano/history"],"careggi":["토스카나: 카레지 별장과 피치노","https://cultura.toscana.it/en/percorso/-/approfondimento/la-villa-medicea-di-careggi/3e29a8bf-7d14-4499-9865-8dd36edc8363"],"vasari":["Notre Dame: 바사리의 레오나르도 평가","https://magazine.nd.edu/stories/undone/"],"traitReview":["OpenStax: The Trait Approach to Leadership","https://openstax.org/books/organizational-behavior/pages/12-4-the-trait-approach-to-leadership"]},"coverage":[{"name":"마움리 K-MOCC 족보.docx","state":"18문항 반영"},{"name":"마움리 22-1 족보-1.pdf","state":"20문항 반영"},{"name":"마움리 22-1 족보.pdf","state":"30개 문항·학습 메모 반영 / 일부 보류"},{"name":"마움리 22-2 족보.pdf","state":"25문항 반영 / 그림 2문항 보류"},{"name":"마움리 22_2.pdf","state":"22-2 족보와 추출 본문 동일 / 별도 중복 추가 안 함"},{"name":"마움리 21-1 족보(캡쳐본).pdf","state":"학습문항 20개 반영 / 시험서약 제외"},{"name":"21_1_족보.docx","state":"13문항 읽음 / 동일 내용은 21-1 및 22-1 문제로 통합"},{"name":"마움리 19-20 족보.pdf","state":"20문항 읽음 / 동일 내용은 21-1 및 22-1 문제로 통합"},{"name":"21_2_족보.docx","state":"사용자 첨부 이미지로 1~25번 모두 판독·반영 / 23번 본문 누락, 24번 강의 해석 검증 보류"},{"name":"마움리 21-2 족보(캡쳐본).pdf","state":"사용자 첨부 이미지로 1~25번 모두 판독·반영 / 23번 본문 누락, 24번 강의 해석 검증 보류"},{"name":"마움리 23-1문제모음.docx","state":"24문항 등록: 17번 사용자 요청으로 제외 / 24번 ② 선지 사용자 확인, 정답 모호성 보류"}],"removedQuestionIds":["2023-1-17"]}</script>
<script>
'use strict';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initial=JSON.parse($('#bank-data').textContent),KEY='maumri-bank-v1',SK='maumri-study-v1';
let data=structuredClone(initial),study={history:{},exam:null},view='home',editing=null;
try{let v=JSON.parse(localStorage.getItem(KEY)||'null');if(v?.version===initial.version&&Array.isArray(v.questions))data=v;let s=JSON.parse(localStorage.getItem(SK)||'null');if(s?.history)study=s;}catch(e){setTimeout(()=>toast('저장 자료를 불러오지 못했습니다. 기본 문항으로 열었습니다.'),100)}
// Add new source questions while preserving locally edited questions and study records.
for(const incoming of initial.questions){if(!data.questions.some(q=>q.id===incoming.id))data.questions.push(structuredClone(incoming));}
data.removedQuestionIds=initial.removedQuestionIds||[];
data.questions=data.questions.filter(q=>!data.removedQuestionIds.includes(q.id));
for(const incoming of initial.questions){const i=data.questions.findIndex(q=>q.id===incoming.id);if(i>=0&&(incoming.contentRevision||0)>(data.questions[i].contentRevision||0))data.questions[i]=structuredClone(incoming);}
if(study.exam?.items?.some(i=>data.removedQuestionIds.includes(i.q.id)||initial.questions.some(q=>q.id===i.q.id&&(q.contentRevision||0)>(i.q.contentRevision||0))))study.exam=null;
data.refs={...data.refs,...initial.refs};data.coverage=initial.coverage;
let selected=new Set(data.questions.map(q=>q.source)),filter={text:'',source:'',status:''};
const stateLabel=q=>q.review||(q.ready?'사용자 확인':'확인 대기');
const isReady=q=>q.ready&&q.answer!==null&&String(q.answer).trim()!=='';
function toast(s){$('#toast').textContent=s;$('#toast').hidden=false;setTimeout(()=>$('#toast').hidden=true,5000)}
function save(bank=false){try{if(bank)localStorage.setItem(KEY,JSON.stringify(data));localStorage.setItem(SK,JSON.stringify(study));return true}catch(e){toast('브라우저 저장에 실패했습니다. 백업 메뉴에서 파일을 내려받아 주세요.');return false}}
function shuffle(arr){let a=[...arr];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function sameAnswer(a,b,type){if(type==='multi')return JSON.stringify(String(a).split(',').filter(Boolean).sort())===JSON.stringify(String(b).split(',').filter(Boolean).sort());return String(a??'').trim().toLowerCase().replace(/\s+/g,'')===String(b??'').trim().toLowerCase().replace(/\s+/g,'')}
function sources(){return [...new Set(data.questions.map(q=>q.source))]}
function tag(q){return `<span class="tag ${isReady(q)?'':'warning'}">${esc(stateLabel(q))}</span>`}
function answerText(q){if(q.answer===null)return '확정하지 않음';if(q.type==='short'||q.type==='ox')return q.answer;return String(q.answer).split(',').map(k=>q.options.find(o=>o.id===k)?.text||k).join(' / ')}
function reference(q){return(q.refs||[]).map(k=>data.refs[k]?`<a target="_blank" rel="noopener noreferrer" href="${esc(data.refs[k][1])}">${esc(data.refs[k][0])}</a>`:'').join(' · ')}
function explain(q){return `<div class="answerbox"><div class="row">${tag(q)}<span class="small muted">${esc(q.source)} · 원본 ${esc(q.no)}번</span></div><h3 style="margin-top:18px">${isReady(q)?'정답':'판단 / 잠정 답안'}: ${esc(answerText(q))}</h3><p>${esc(q.explanation)}</p><p class="small muted">족보 기록: ${esc(q.originalAnswer||'추가 문항')}</p>${q.note?`<details><summary>원본 주석 / 편집 기록</summary><p class="small">${esc(q.note)}</p></details>`:''}${reference(q)?`<p class="small">검토 근거: ${reference(q)}</p>`:''}</div>`}
function go(v){view=v;document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===v));render();window.scrollTo(0,0)}
function render(){if(view==='home')home();else if(view==='bank'||view==='review')list();else if(view==='exam')exam();else if(view==='result')result();else backup()}
function home(){let ready=data.questions.filter(isReady),done=ready.filter(q=>study.history[q.id]?.attempts),wrong=ready.filter(q=>study.history[q.id]?.lastCorrect===false);$('#app').innerHTML=`<span class="eyebrow">마음을 움직이는 리더십</span><h1>오늘도, 한 문제씩 확실하게.</h1><p class="muted">족보별로 골라 풀고, 틀린 개념을 다시 확인하세요.<br>정답과 직접 풀이, 검토 근거는 답안을 제출한 뒤에 보여줍니다.</p><div class="layout"><section><section class="card"><div class="row"><h2>학습할 족보 선택</h2><button onclick="selectAll()">전체 선택</button></div>${sources().map(s=>{const arr=data.questions.filter(q=>q.source===s);return `<div class="chapter"><input type="checkbox" aria-label="${esc(s)} 선택" data-source="${esc(s)}" ${selected.has(s)?'checked':''}><div><h3>${esc(s)}</h3><p class="muted">출제 가능 ${arr.filter(isReady).length} · 보류 ${arr.filter(q=>!isReady(q)).length}</p></div><button data-manage="${esc(s)}">문항 보기</button></div>`}).join('')}<footer>선택 범위에서 문제·선지·정답이 같은 문항은 한 번만 출제하며 ★ 중요 표시를 붙입니다. 선지나 정답이 다르면 별도로 출제합니다. 선택지가 누락된 복원 문항은 자가 채점 방식입니다.</footer></section><div class="alert"><strong>일부 자료 확인 중</strong> · 2021-2 25문항, 2023-1 24문항을 등록했습니다(2023-1 17번 제외). 일부 문항은 본문·선지 판독 또는 답안 검증이 남아 있습니다. 검증 보류 문항은 기본 출제에서 제외됩니다. <button onclick="go('review')">검토 현황 보기</button></div><div class="stats"><div class="stat"><span class="number">${ready.length}</span><span class="muted">출제 가능 문항</span></div><div class="stat"><span class="number">${done.length}<small style="font-size:16px"> / ${ready.length}</small></span><span class="muted">풀어 본 문항</span></div><div class="stat"><span class="number">${wrong.length}</span><span class="muted">최근 오답</span></div></div></section><aside><section class="card"><span class="eyebrow">TEST SETTINGS</span><h2>이번 시험 범위</h2><label for="topic">학습 주제</label><select id="topic"><option value="">모든 주제</option>${[...new Set(data.questions.map(q=>q.topic))].map(t=>`<option>${esc(t)}</option>`).join('')}</select><label for="count">출제 문항 수</label><input id="count" type="number" min="1" step="1" value="10" placeholder="비워 두면 전체"><p class="small muted">원하는 문항 수를 입력하세요. 비워 두면 전체 문항을 출제합니다.</p><div class="check"><input id="mixed" type="checkbox" checked><label for="mixed">문제 순서 섞기</label></div><div class="check"><input id="choices" type="checkbox" checked><label for="choices">객관식 선지 섞기</label></div><div class="check"><input id="unseen" type="checkbox"><label for="unseen">아직 안 푼 문제만</label></div><button class="primary full" onclick="start()">문제 풀기 시작</button><p class="small muted">OX 순서는 항상 O, X입니다.</p></section><section class="card stack"><h3>이어지는 복습</h3><button onclick="start('wrong')" ${wrong.length?'':'disabled'}>틀린 문제 다시 풀기 (${wrong.length})</button>${study.exam&&!study.exam.finished?'<button onclick="go(\'exam\')">풀던 문제 이어하기</button>':''}<button onclick="filter.status='pending';go('review')">검증 보류 ${data.questions.length-ready.length}개 보기</button></section></aside></div>`;
 document.querySelectorAll('[data-source]').forEach(el=>el.onchange=()=>el.checked?selected.add(el.dataset.source):selected.delete(el.dataset.source));document.querySelectorAll('[data-manage]').forEach(el=>el.onclick=()=>{filter.source=el.dataset.manage;filter.status='';go('bank')});}
function selectAll(){selected=new Set(sources());home()}

function duplicateKey(q){
 const norm=v=>String(v??'').normalize('NFKC').toLowerCase().replace(/\s+/g,'').replace(/[.,，。!?？！“”"'‘’]/g,'');
 const opts=(q.options||[]).map(o=>norm(o.text));
 const answers=q.type==='short'?norm(q.answer):String(q.answer??'').split(',').map(id=>{const o=(q.options||[]).find(o=>String(o.id)===id.trim());return o?norm(o.text):'id:'+id.trim()}).sort();
 return JSON.stringify([q.type,norm(q.text),opts.slice().sort(),answers,q.image||'']);
}
function uniqueQuestions(pool){
 const groups=new Map();
 for(const q of pool){const key=duplicateKey(q);if(!groups.has(key))groups.set(key,[]);groups.get(key).push(q)}
 return [...groups.values()].map(group=>({...group[0],duplicateIds:group.map(q=>q.id),duplicateCount:group.length,duplicateSources:[...new Set(group.map(q=>q.source))]}));
}
function duplicateBadge(q){return q.duplicateCount>1?'<div class="repeat-important" role="note"><strong>★ 중요 · 반복 출제 '+q.duplicateCount+'회</strong><div>선택 범위에서 겹치는 문항을 한 번만 출제합니다.</div><small>'+q.duplicateSources.map(esc).join(' · ')+'</small></div>':''}

function start(mode){let pool=data.questions.filter(q=>isReady(q)&&selected.has(q.source)&&(!$('#topic').value||q.topic===$('#topic').value));if(mode==='wrong')pool=pool.filter(q=>study.history[q.id]?.lastCorrect===false);else if($('#unseen').checked)pool=pool.filter(q=>!study.history[q.id]?.attempts);pool=uniqueQuestions(pool);if(!pool.length)return toast('선택한 조건에 맞는 문항이 없습니다.');const countText=$('#count').value.trim();const count=countText===''?pool.length:Number(countText);if(!Number.isInteger(count)||count<1||count>pool.length)return toast('중복 제외 후 출제 가능한 문항은 '+pool.length+'개입니다. 1~'+pool.length+' 사이의 정수로 입력하세요.');if(study.exam&&!study.exam.finished&&!confirm('진행 중인 문제 세트를 새 세트로 바꿀까요? 이미 채점한 기록은 유지됩니다.'))return;let mixed=$('#mixed').checked,choice=$('#choices').checked;pool=(mixed?shuffle(pool):pool).slice(0,count);study.exam={index:0,finished:false,items:pool.map(q=>({q:structuredClone(q),options:q.type==='ox'?q.options:choice?shuffle(q.options):q.options,answer:q.type==='multi'?[]:'',revealed:false,graded:false,correct:null}))};save();go('exam')}
function exam(){const ex=study.exam;if(!ex)return go('home');const item=ex.items[ex.index],q=item.q;$('#app').innerHTML=`<div class="row"><div><span class="eyebrow">${esc(q.topic)}</span><h1>문제 ${ex.index+1}<span class="muted" style="font-size:22px"> / ${ex.items.length}</span></h1></div><button onclick="go('home')">나중에 이어하기</button></div><div class="layout"><section class="card"><div class="row"><span class="tag">${q.type==='ox'?'OX':q.type==='short'?'단답형 · 자가 채점':q.type==='multi'?'복수 선택':'객관식'}</span><span class="small muted">${esc(q.source)} · ${esc(q.no)}번</span></div><div class="progress"><i style="width:${(ex.index+1)/ex.items.length*100}%"></i></div>${duplicateBadge(q)}<div class="question">${esc(q.text)}</div>${q.image?`<img class="qimage" src="${esc(q.image)}" alt="문제 참고 이미지" onclick="zoom(this.src)">`:''}${q.type==='short'?`<label for="shortanswer">내 답안</label><textarea id="shortanswer" rows="4" ${item.revealed?'disabled':''}>${esc(item.answer)}</textarea>`:item.options.map((o,i)=>{let chosen=q.type==='multi'?item.answer.includes(o.id):item.answer===o.id,correct=item.revealed&&String(q.answer).split(',').includes(o.id);return `<button class="option ${chosen?'selected':''} ${correct?'correct':item.revealed&&chosen?'wrong':''}" data-choice="${esc(o.id)}" ${item.revealed?'disabled':''} aria-pressed="${chosen}"><b>${q.type==='ox'?esc(o.id):i+1}</b><span>${q.type==='ox'?(o.id==='O'?'맞다':'아니다'):esc(o.text)}</span></button>`}).join('')}${item.revealed?`${item.graded?`<h3 class="${item.correct?'good':'bad'}">${item.correct?'정답입니다':'다시 복습해 보세요'}</h3>`:''}${explain(q)}${q.type==='short'&&!item.graded?'<p>내 답안과 비교하여 채점하세요.</p><button onclick="gradeSelf(true)">정답으로 기록</button> <button onclick="gradeSelf(false)">오답으로 기록</button>':''}`:`<button class="primary full" style="margin-top:20px" onclick="check()">${q.type==='short'?'답안 확인':'채점하고 해설 보기'}</button>`}<div class="row" style="margin-top:24px"><button onclick="move(-1)" ${ex.index===0?'disabled':''}>이전 문제</button>${ex.index<ex.items.length-1?'<button onclick="move(1)">다음 문제</button>':'<button class="primary" onclick="finish()">결과 보기</button>'}</div></section><aside class="card" style="align-self:start"><h2>문항 이동</h2><p class="muted small">${ex.items.filter(i=>i.graded).length} / ${ex.items.length}문항 채점 완료</p><div class="navgrid">${ex.items.map((it,i)=>`<button class="${it.graded?'done':''} ${i===ex.index?'active':''}" onclick="jump(${i})">${i+1}</button>`).join('')}</div><button class="full" style="margin-top:25px" onclick="finish()">현재까지 결과 보기</button></aside></div>`;document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{if(q.type==='multi'){let k=item.answer.indexOf(b.dataset.choice);if(k>=0)item.answer.splice(k,1);else item.answer.push(b.dataset.choice)}else item.answer=b.dataset.choice;save();exam()});if($('#shortanswer'))$('#shortanswer').oninput=e=>{item.answer=e.target.value;save()};}
function record(item,correct){if(item.graded)return;item.graded=true;item.correct=correct;let h=study.history[item.q.id]||{attempts:0,correct:0};h.attempts++;h.correct+=correct?1:0;h.lastCorrect=correct;h.lastAt=new Date().toISOString();study.history[item.q.id]=h;save()}
function check(){let i=study.exam.items[study.exam.index];if(!i.answer||Array.isArray(i.answer)&&!i.answer.length)return toast('답안을 먼저 입력하거나 선택해 주세요.');i.revealed=true;if(i.q.type!=='short')record(i,sameAnswer(Array.isArray(i.answer)?i.answer.join(','):i.answer,i.q.answer,i.q.type));save();exam()}
function gradeSelf(ok){let i=study.exam.items[study.exam.index];record(i,ok);exam()}
function move(n){jump(study.exam.index+n)}function jump(n){study.exam.index=n;save();exam();window.scrollTo(0,0)}
function finish(){let missing=study.exam.items.filter(i=>!i.graded).length;if(missing&&!confirm(`${missing}문항이 미채점입니다. 결과 화면에서 다시 이어 풀 수 있습니다. 결과를 볼까요?`))return;study.exam.finished=missing===0;save();go('result')}
function result(){let ex=study.exam,sc=ex.items.filter(i=>i.correct===true).length,done=ex.items.filter(i=>i.graded).length;$('#app').innerHTML=`<span class="eyebrow">학습 결과</span><h1>오늘의 기록</h1><section class="card"><div class="row"><div><span class="number">${sc} / ${done}</span><p class="muted">채점한 문항 기준 · 전체 ${ex.items.length}문항 중 ${ex.items.length-done}개 미채점</p></div><button class="primary" onclick="go('home')">학습 홈</button></div><button onclick="go('exam')">문제 다시 확인하기</button></section><section class="card">${ex.items.map((it,i)=>`<div class="listitem"><div class="row"><span class="tag ${it.correct===false?'warning':''}">${!it.graded?'미채점':it.correct?'정답':'오답'}</span><button onclick="study.exam.index=${i};go('exam')">${i+1}번 보기</button></div><p>${esc(it.q.text)}</p></div>`).join('')}</section>`}
function list(){let review=view==='review';$('#app').innerHTML=`<span class="eyebrow">${review?'정답과 근거를 함께':'내가 관리하는 족보'}</span><div class="row"><h1>${review?'답안 검토 기록':'문항 관리'}</h1><button class="primary" onclick="edit(null)">문항 추가</button></div><p class="muted">${review?'자료 대조는 연결된 자료와 직접 풀이를 함께 검토한 문항입니다. 직접 풀이는 외부 근거 대조까지 마치지 않은 문항입니다. 보류 항목은 자동 출제하지 않습니다.':'문제·선지·정답·해설을 수정할 수 있습니다. 변경 내용은 이 브라우저에 저장됩니다.'}</p>${review?`<details class="card"><summary><strong>첨부 자료 11개 반영 현황 — 판독·검증 보류 확인</strong></summary><div class="tablewrap"><table><thead><tr><th>파일</th><th>반영 상태</th></tr></thead><tbody>${data.coverage.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.state)}</td></tr>`).join('')}</tbody></table></div></details>`:''}<div class="searchbar"><input id="search" aria-label="문항 검색" placeholder="문제 내용·해설 검색" value="${esc(filter.text)}"><select id="sourcefilter" aria-label="족보 필터"><option value="">모든 족보</option>${sources().map(s=>`<option ${s===filter.source?'selected':''}>${esc(s)}</option>`).join('')}</select><select id="statefilter" aria-label="검토 상태"><option value="">모든 상태</option><option value="pending" ${filter.status==='pending'?'selected':''}>검증 보류</option><option value="ready" ${filter.status==='ready'?'selected':''}>출제 가능</option><option value="correction" ${filter.status==='correction'?'selected':''}>족보 수정</option><option value="wrong" ${filter.status==='wrong'?'selected':''}>최근 오답</option></select></div><div id="listitems" class="card"></div>`;$('#search').oninput=e=>{filter.text=e.target.value;listitems()};$('#sourcefilter').onchange=e=>{filter.source=e.target.value;listitems()};$('#statefilter').onchange=e=>{filter.status=e.target.value;listitems()};listitems()}
function listitems(){let arr=data.questions.filter(q=>(!filter.text||(q.text+' '+q.explanation).includes(filter.text))&&(!filter.source||q.source===filter.source)&&(!filter.status||(filter.status==='ready'?isReady(q):filter.status==='pending'?!isReady(q):filter.status==='correction'?q.review.includes('수정'):study.history[q.id]?.lastCorrect===false)));$('#listitems').innerHTML=`<p class="muted">${arr.length}개 항목</p>${arr.map(q=>`<div class="listitem"><div class="row">${tag(q)}<span class="small muted">${esc(q.source)} · ${esc(q.no)}번</span></div><p class="title">${esc(q.text)}</p><details><summary>선지·답안·검토 근거 보기</summary>${q.image?`<img class="qimage" src="${esc(q.image)}" alt="문제 이미지" onclick="zoom(this.src)">`:''}${q.options.map((o,i)=>`<p class="small">${i+1}. ${esc(o.text)}</p>`).join('')}${explain(q)}</details><button data-edit="${esc(q.id)}">문항 편집</button></div>`).join('')||'<div class="empty">검색 조건에 맞는 문항이 없습니다.</div>'}`;document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(b.dataset.edit))}
function edit(id){editing=id?structuredClone(data.questions.find(q=>q.id===id)):{id:crypto.randomUUID(),no:'추가',source:'내 문항',topic:'리더십의 기초',type:'mc',text:'',options:[{id:'1',text:''},{id:'2',text:''},{id:'3',text:''},{id:'4',text:''}],answer:null,explanation:'',ready:false,refs:[],note:'',originalAnswer:'사용자 추가'};const q=editing;$('#editor').innerHTML=`<div class="row"><h2>문항 편집</h2><button onclick="$('#editor').close()" aria-label="편집 닫기">닫기</button></div><div class="fields"><div><label for="esource">족보 / 단원 이름</label><input id="esource" value="${esc(q.source)}"></div><div><label for="etype">유형</label><select id="etype">${[['mc','객관식'],['multi','복수 선택'],['ox','OX'],['short','단답형 · 자가 채점']].map(([v,n])=>`<option value="${v}" ${q.type===v?'selected':''}>${n}</option>`).join('')}</select></div></div><label for="etext">문제 내용</label><textarea id="etext" rows="4">${esc(q.text)}</textarea><div id="optioneditor"></div><label for="enote">해설 / 검토 기록</label><textarea id="enote" rows="4">${esc(q.explanation)}</textarea><label for="eimage">문제 이미지 추가 (PNG / JPG / WebP, 1MB 이하)</label><input id="eimage" type="file" accept="image/png,image/jpeg,image/webp">${q.image?'<button onclick="editing.image=null;toast(\'이미지 제거가 선택되었습니다. 저장하면 반영됩니다.\')">기존 이미지 제거</button>':''}<div class="check"><input type="checkbox" id="eready" ${q.ready?'checked':''}><label for="eready">내용과 정답을 확인했으며 출제를 허용합니다</label></div><p class="muted small">수정하면 검토 상태는 ‘사용자 수정’으로 바뀝니다. 자동 검증 완료로 처리하지 않습니다.</p><div id="editerror" class="bad" role="alert"></div><div class="editor-actions">${data.questions.some(x=>x.id===q.id)?'<button class="danger" onclick="deleteQuestion()">문항 삭제</button>':''}<button onclick="$('#editor').close()">취소</button><button class="primary" onclick="saveEdit()">저장</button></div>`;optionEditor();$('#etype').onchange=()=>{editing.type=$('#etype').value;editing.answer=null;if(editing.type==='ox')editing.options=[{id:'O',text:'O'},{id:'X',text:'X'}];else if(editing.type!=='short')editing.options=[1,2,3,4].map(i=>({id:String(i),text:''}));optionEditor()};$('#eimage').onchange=async e=>{let f=e.target.files[0];if(!f)return;if(f.size>1024*1024||!['image/png','image/jpeg','image/webp'].includes(f.type)){toast('PNG/JPG/WebP, 1MB 이하 파일을 선택해 주세요.');return}editing.image=await new Promise(resolve=>{let r=new FileReader;r.onload=()=>resolve(r.result);r.readAsDataURL(f)})};$('#editor').showModal()}
function deleteQuestion(){const id=editing?.id;const q=data.questions.find(x=>x.id===id);if(!q)return;if(!confirm(q.source+' '+q.no+'번 문항을 삭제할까요? 학습 기록도 삭제되며, 이 문항이 포함된 진행 중 시험은 종료됩니다.'))return;const oldData=structuredClone(data),oldStudy=structuredClone(study);data.questions=data.questions.filter(x=>x.id!==id);delete study.history[id];if(study.exam?.items.some(i=>i.q.id===id))study.exam=null;if(!save(true)){data=oldData;study=oldStudy;save(true);return;}if(!sources().includes(q.source)){selected.delete(q.source);if(filter.source===q.source)filter.source='';}$('#editor').close();render();toast('문항을 삭제했습니다.');}
function optionEditor(){let q=editing;$('#optioneditor').innerHTML=q.type==='short'?`<label for="eshort">정답 / 채점 기준</label><textarea id="eshort" rows="3">${esc(q.answer||'')}</textarea>`:`<label>선지 · 왼쪽 선택란으로 정답 지정</label><div class="editor-options">${q.options.map((o,i)=>`<div class="editor-option"><input name="eanswer" aria-label="${i+1}번 정답" type="${q.type==='multi'?'checkbox':'radio'}" value="${esc(o.id)}" ${String(q.answer||'').split(',').includes(o.id)?'checked':''}><input data-option="${esc(o.id)}" aria-label="${i+1}번 선지" value="${esc(o.text)}" ${q.type==='ox'?'readonly':''}></div>`).join('')}</div>${q.type==='ox'?'':'<button style="margin-top:12px" onclick="addOption()">선지 추가</button>'}`}
function addOption(){editing.options=Array.from(document.querySelectorAll('[data-option]')).map(i=>({id:i.dataset.option,text:i.value}));editing.answer=Array.from(document.querySelectorAll('[name=eanswer]:checked')).map(i=>i.value).join(',');editing.options.push({id:String(editing.options.length+1),text:''});optionEditor()}
function saveEdit(){let q=editing;q.text=$('#etext').value.trim();q.source=$('#esource').value.trim();q.explanation=$('#enote').value.trim();q.ready=$('#eready').checked;q.type=$('#etype').value;if(q.type==='short'){q.options=[];q.answer=$('#eshort').value.trim()}else{q.options=Array.from(document.querySelectorAll('[data-option]')).map(i=>({id:i.dataset.option,text:i.value.trim()}));q.answer=Array.from(document.querySelectorAll('[name=eanswer]:checked')).map(i=>i.value).join(',')}if(!q.text||!q.source)return $('#editerror').textContent='문제 내용과 족보 이름을 입력하세요.';if(q.options.some(o=>!o.text))return $('#editerror').textContent='빈 선지 내용을 채워 주세요.';if(q.ready&&!q.answer)return $('#editerror').textContent='출제 허용 전에 정답을 지정하세요.';q.answer=q.answer||null;q.review='사용자 수정';q.status=q.ready?'user':'pending';q.refs=[];const idx=data.questions.findIndex(x=>x.id===q.id);if(idx<0)data.questions.push(q);else data.questions[idx]=q;selected.add(q.source);const ok=save(true);$('#editor').close();render();if(ok)toast('문항을 저장했습니다.')}
function zoom(src){$('#lightbox img').src=src;$('#lightbox').showModal()}
function download(name,body,type){const url=URL.createObjectURL(new Blob([body],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportHTML(){const copy=document.documentElement.cloneNode(true);copy.querySelector('#app').innerHTML='';copy.querySelector('#editor').innerHTML='';copy.querySelectorAll('dialog').forEach(d=>d.removeAttribute('open'));copy.querySelector('#toast').hidden=true;copy.querySelector('#bank-data').textContent=JSON.stringify(data).replace(/</g,'\\u003c');download('maumri-question-bank.html','<!doctype html>\n'+copy.outerHTML,'text/html;charset=utf-8');toast('수정된 문항을 포함한 실행 HTML을 내보냈습니다. 학습 기록은 JSON 백업에 포함됩니다.')}
function validData(d){return d&&Array.isArray(d.questions)&&d.questions.every(q=>q&&typeof q.id==='string'&&typeof q.text==='string'&&typeof q.source==='string'&&['mc','multi','ox','short'].includes(q.type)&&Array.isArray(q.options)&&q.options.every(o=>typeof o.id==='string'&&typeof o.text==='string')&&(q.answer===null||typeof q.answer==='string')&&(!q.image||/^data:image\/(png|jpeg|webp);base64,/.test(q.image)))&&new Set(d.questions.map(q=>q.id)).size===d.questions.length}
function backup(){$('#app').innerHTML=`<span class="eyebrow">학습 자료 보관</span><h1>내 문제은행 백업</h1><div class="layout"><section class="card stack"><h2>파일로 내보내기</h2><p class="muted">HTML은 문제은행을 실행하는 파일입니다. JSON 백업에는 수정 문항과 학습 기록이 모두 들어 있습니다.</p><button class="primary" onclick="exportHTML()">실행 HTML 내려받기</button><button onclick="download('maumri-backup.json',JSON.stringify({data,study},null,2),'application/json')">문항 + 학습 기록 JSON 백업</button><footer>저장은 기기·브라우저별로 구분됩니다. 다른 기기에서는 JSON 백업을 가져오세요.</footer></section><section class="card"><h2>백업 가져오기</h2><p class="muted">현재 자료와 학습 기록을 백업 내용으로 교체합니다.</p><label for="importfile">JSON 백업 선택</label><input type="file" id="importfile" accept=".json,application/json"></section></div>`;$('#importfile').onchange=async e=>{try{let f=e.target.files[0];if(!f)return;let value=JSON.parse(await f.text());if(!validData(value.data)||!value.study?.history)throw Error('올바른 마움리 백업 파일이 아닙니다.');if(!confirm('현재 문항과 학습 기록을 이 백업으로 교체할까요?'))return;data={...value.data,version:initial.version,refs:initial.refs,coverage:value.data.coverage||initial.coverage};study={history:value.study.history,exam:null};selected=new Set(sources());save(true);go('home');toast('백업을 가져왔습니다.')}catch(e){toast('가져오기 실패: '+e.message)}}}
document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>go(b.dataset.nav));go('home');
</script><script>(()=>{const bar=document.getElementById('subject-bar'),button=document.getElementById('subject-toggle'),menu=document.getElementById('subject-drawer');function close(){menu.hidden=true;button.setAttribute('aria-expanded','false')}button.addEventListener('click',()=>{const open=menu.hidden;menu.hidden=!open;button.setAttribute('aria-expanded',String(open))});document.addEventListener('click',e=>{if(!bar.contains(e.target))close()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!menu.hidden){close();button.focus()}})})();</script></body></html>
