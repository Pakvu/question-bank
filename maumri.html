<script id="bank-data" type="application/json">{"version":"maumri-review-1","questions":[{"id":"2022-1 객관식-1","source":"2022-1 객관식","no":1,"text":"브레이크와 모우튼의 관리격자모델의 리더 유형에 관한 설명으로 옳지 않은 것은?","options":[{"id":"1","text":"(9,1)형은 과업상의 능력을 우선적으로 생각하는 과업형 리더이다."},{"id":"2","text":"(9,9)형은 인간과 과업에 대한 관심이 모두 높은 팀형 리더이다."},{"id":"3","text":"(1,9)형은 생산에 관심을 보이는 인기형 리더이다."},{"id":"4","text":"(1,1)형은 조직구성원으로서 자리를 유지하는데 필요한 최소한의 노력만을 투입하는 무관심형 리더이다."}],"answer":"3","type":"mc","originalKey":"정답 표시 형식 확인 전","note":"","review":"자료 대조","status":"solved","explanation":"(1,9)는 인간에 대한 관심이 높고 생산에 대한 관심이 낮은 인기형이다. 두 축을 바꾸어 설명한 선지가 틀렸다.","refs":["grid"],"topic":"행동·상황이론","originalText":"브레이크와 모우튼의 관리격자모델의 리더 유형에 관한 설명으로 옳지 않은 것은?","ready":true,"originalAnswer":"정답 표시 형식 확인 전"},{"id":"2022-1 객관식-2","source":"2022-1 객관식","no":2,"text":"다음 중 그 설명이 옳지 않은 것은?","options":[{"id":"1","text":"문화는 특정사회의 구성원들이 공유하고 있는 후천적으로 학습된 신념, 가치관, 규칙, 규범, 상징, 전통등을 의미한다."},{"id":"2","text":"리더십 없는 관리는 도전과 혁신을 방해하고, 관리 없는 리더십은 조직의 질서와 효율성을 와해한다."},{"id":"3","text":"조직문화는 특정 조직의 특정 계층이 공유하고 있는 신념, 가치관, 규칙, 규범, 상징, 전통 등을 의미한다."},{"id":"4","text":"리더와 관리자는 역할상의 차이에도 불구하고 상호 배타적 관계가 아닌 상호 보완적 관계이다."}],"answer":"3","type":"mc","originalKey":"정답 표시 형식 확인 전","note":"","review":"직접 풀이","status":"solved","explanation":"조직문화는 조직 구성원이 공유하는 의미와 가치 체계다. 특정 계층만의 공유로 한정한 정의가 틀렸다. 하위문화가 존재할 수는 있다.","refs":[],"topic":"권력·조직","originalText":"다음 중 그 설명이 옳지 않은 것은?","ready":true,"originalAnswer":"정답 표시 형식 확인 전"},{"id":"2022-1 객관식-3","source":"2022-1 객관식","no":3,"text":"허쯔버그의 2요인이론에서 동기요인을 모두 고른 것은? A: 상사와의 관계 B: 성취 C: 회사의 정책 및 관리방침 D: 작업조건 E: 인정","options":[{"id":"1","text":"B, C"},{"id":"2","text":"A, E"},{"id":"3","text":"A, B"},{"id":"4","text":"B, E"}],"answer":"4","type":"mc","originalKey":"정답 표시 형식 확인 전","note":"","review":"자료 대조","status":"solved","explanation":"성취·인정은 동기요인이다. 위생요인은 주로 불만족을 줄이며, 만족 증가와 불만족 감소를 같은 것으로 보지 않는다.","refs":["needs"],"topic":"동기부여","originalText":"허쯔버그의 2요인이론에서 동기요인을 모두 고른 것은? A: 상사와의 관계 B: 성취 C: 회사의 정책 및 관리방침 D: 작업조건 E: 인정","ready":true,"originalAnswer":"정답 표시 형식 확인 전"},{"id":"2022-1 객관식-4","source":"2022-1 객관식","no":4,"text":"다음 중 갈등의 의미와 기능에 관한 설명으로 옳지 않은 것은?","options":[{"id":"1","text":"갈등이 조직과정에서 부정적인 역할임을 강조하였다."},{"id":"2","text":"갈등을 관리 가능한 것으로 파악한다."},{"id":"3","text":"갈등은 현실적으로는 부분적으로 예방하거나 관리할 수 있어도 제거할 수는 없다."},{"id":"4","text":"갈등의 해결은 조직의 생산성을 증진시키고 조직의 문제를 해결하는 원동력이다."}],"answer":"1","type":"mc","originalKey":"정답 표시 형식 확인 전","note":"","review":"자료 대조","status":"solved","explanation":"현대적 관점에서는 갈등이 문제 발견과 개선에 도움이 될 수도 있다. 항상 부정적인 역할만 한다는 설명이 틀렸다. 모든 갈등이 유익하다는 의미도 아니다.","refs":["conflict"],"topic":"권력·조직","originalText":"다음 중 갈등의 의미와 기능에 관한 설명으로 옳지 않은 것은?","ready":true,"originalAnswer":"정답 표시 형식 확인 전"},{"id":"2022-1 객관식-5","source":"2022-1 객관식","no":5,"text":"서번트 리더십의 특성으로 옳지 않은 것은?","options":[{"id":"1","text":"부하의 감정에 공감하고, 이해하려고 노력한다."},{"id":"2","text":"조직의 구성원들에게 공동체 정신을 심어준다."},{"id":"3","text":"비전 달성을 위해 위험감수 등 비범한 행동을 보인다."},{"id":"4","text":"부하의 성장을 위해 헌신한다."}],"answer":"3","type":"mc","originalKey":"정답 표시 형식 확인 전","note":"","review":"자료 대조","status":"solved","explanation":"공감·구성원 성장·공동체 형성은 서번트 리더십의 특징이다. 비전을 위한 비범한 위험감수는 카리스마 리더십의 대표적 설명이다.","refs":["servant"],"topic":"현대적 리더십","originalText":"서번트 리더십의 특성으로 옳지 않은 것은?","ready":true,"originalAnswer":"정답 표시 형식 확인 전"},{"id":"2022-1 객관식-6","source":"2022-1 객관식","no":6,"text":"아담스의 공정성 이론에 대한 설명 중 가장 옳지 않은 것은?","options":[{"id":"1","text":"불공정을 결정하는 요인으로는 투입과 산출, 준거인물 등이 있다."},{"id":"2","text":"보상의 크기와 공정성을 극대화 시키는데 초점을 둔다."},{"id":"3","text":"페스팅거의 인지부조화 이론에 영향을 미쳤다."},{"id":"4","text":"자신의 공헌과 보상의 크기를 준거인물의 공헌과 보상의 크기와 비교하여 동기 부여의 수준을 결정한다."}],"answer":"3","type":"mc","originalKey":"정답 표시 형식 확인 전","note":"","review":"자료 대조","status":"solved","explanation":"공정성이론은 인지부조화 관점의 영향을 받았다. 영향의 방향을 거꾸로 쓴 선지가 틀렸다. 보상 절대액보다 상대적 투입·산출 비율이 핵심이다.","refs":["process"],"topic":"동기부여","originalText":"아담스의 공정성 이론에 대한 설명 중 가장 옳지 않은 것은?","ready":true,"originalAnswer":"정답 표시 형식 확인 전"},{"id":"2022-1 객관식-7","source":"2022-1 객관식","no":7,"text":"허쉬와 블랜차드의 상황적 리더십 이론에서 설명한 4가지 리더십 스타일이 아닌 것은?","options":[{"id":"1","text":"관료형"},{"id":"2","text":"지시형"},{"id":"3","text":"설득형"},{"id":"4","text":"위임형"}],"answer":"1","type":"mc","originalKey":"정답 표시 형식 확인 전","note":"","review":"자료 대조","status":"solved","explanation":"지시·설득(코칭)·참여(지원)·위임의 네 유형이다. 관료형은 이 분류에 속하지 않는다.","refs":["slii"],"topic":"행동·상황이론","originalText":"허쉬와 블랜차드의 상황적 리더십 이론에서 설명한 4가지 리더십 스타일이 아닌 것은?","ready":true,"originalAnswer":"정답 표시 형식 확인 전"},{"id":"2022-1 객관식-8","source":"2022-1 객관식","no":8,"text":"다음은 ‘마키아벨리’가 어떤 사람을 평가한 인물평이다. 이 사람은 누구인가? 그는 대단히 사려 깊은 사람이었다. 외모는 중후하고 예의 바르고 덕망이 넘쳤다. 초년은 고통과 유배와 신변 위협 속에서 살았으나 지칠 줄 모르는 관대한 성향으로 모든 정적을 누르고 백성에게 큰 인기를 얻었다. 큰 부자이면서도 살아가는 모습은 검소하고 소탈했다. 당대에 그만큼 국정에 통달한 사람도 없었다. 그렇기 때문에 변화무쌍한 도시에서 그는 30년간 실질적으로 피렌체를 지배했다.","options":[{"id":"1","text":"카테리나"},{"id":"2","text":"코시모 데 메디치"},{"id":"3","text":"피에르 데 메디치"},{"id":"4","text":"로렌초 데 메디치"}],"answer":"2","type":"mc","originalKey":"정답 표시 형식 확인 전","note":"","review":"자료 대조","status":"solved","explanation":"피렌체에서 장기간 실권을 행사하고 유배 후 복귀한 인물은 코시모 데 메디치다.","refs":["history"],"topic":"메디치·인문학","originalText":"다음은 ‘마키아벨리’가 어떤 사람을 평가한 인물평이다. 이 사람은 누구인가? 그는 대단히 사려 깊은 사람이었다. 외모는 중후하고 예의 바르고 덕망이 넘쳤다. 초년은 고통과 유배와 신변 위협 속에서 살았으나 지칠 줄 모르는 관대한 성향으로 모든 정적을 누르고 백성에게 큰 인기를 얻었다. 큰 부자이면서도 살아가는 모습은 검소하고 소탈했다. 당대에 그만큼 국정에 통달한 사람도 없었다. 그렇기 때문에 변화무쌍한 도시에서 그는 30년간 실질적으로 피렌체를 지배했다.","ready":true,"originalAnswer":"정답 표시 형식 확인 전"},{"id":"2022-1 객관식-9","source":"2022-1 객관식","no":9,"text":"다음 브룸의 기대이론에서 동기부여의 강도를 측정하기 위해 활용된 변수끼리 짝지어진 것 중 가장 옳은 것은? A: 기대감 B: 수단성 C: 유의성 D: 공정성","options":[{"id":"1","text":"A, C, D"},{"id":"2","text":"A, B, C"},{"id":"3","text":"B, C, D"},{"id":"4","text":"A, B, D"}],"answer":"2","type":"mc","originalKey":"정답 표시 형식 확인 전","note":"","review":"자료 대조","status":"solved","explanation":"기대이론은 기대감·수단성·유의성(유인가)으로 동기부여를 설명한다. 공정성은 해당 변수에 포함되지 않는다.","refs":["process"],"topic":"동기부여","originalText":"다음 브룸의 기대이론에서 동기부여의 강도를 측정하기 위해 활용된 변수끼리 짝지어진 것 중 가장 옳은 것은? A: 기대감 B: 수단성 C: 유의성 D: 공정성","ready":true,"originalAnswer":"정답 표시 형식 확인 전"},{"id":"2022-1 객관식-10","source":"2022-1 객관식","no":10,"text":"다음 중 오하이오 주립대 모형의 리더십 유형구분은?","options":[{"id":"1","text":"직무중심적 리더 - 종업원 중심적 리더"},{"id":"2","text":"과업주도형 리더 - 배려행동형 리더"},{"id":"3","text":"독재적 리더 - 민주적 리더"},{"id":"4","text":"이상형 리더 - 과업지향형 리더"}],"answer":"2","type":"mc","originalKey":"정답 표시 형식 확인 전","note":"","review":"자료 대조","status":"solved","explanation":"오하이오 연구는 과업주도(구조주도)와 배려라는 두 행동 차원을 구분한다.","refs":["grid"],"topic":"행동·상황이론","originalText":"다음 중 오하이오 주립대 모형의 리더십 유형구분은?","ready":true,"originalAnswer":"정답 표시 형식 확인 전"},{"id":"2022-1 객관식-11","source":"2022-1 객관식","no":11,"text":"다음 중 리더십에 해당하지 않는 것을 고르시오.","options":[{"id":"1","text":"효과성의 추구"},{"id":"2","text":"장기적, 미래지향적"},{"id":"3","text":"변화와 발전 추구"},{"id":"4","text":"효율성의 추구"}],"answer":"4","type":"mc","originalKey":"정답 표시 형식 확인 전","note":"","review":"자료 대조","status":"solved","explanation":"리더는 방향·비전과 장기적 효과성을 강조하고, 관리는 수행의 효율성을 강조한다. 두 역할은 서로 보완한다.","refs":["nature"],"topic":"리더십의 기초","originalText":"다음 중 리더십에 해당하지 않는 것을 고르시오.","ready":true,"originalAnswer":"정답 표시 형식 확인 전"},{"id":"2022-1 객관식-12","source":"2022-1 객관식","no":12,"text":"Big 5모형에 대한 다음 설명 중 가장 옳지 않은 것은?","options":[{"id":"1","text":"외향성: 사교적이고 명항하며 말이 많고 자신감이 넘친다."},{"id":"2","text":"친화성: 남에게 양보하는 정도를 나타내는 것이다."},{"id":"3","text":"성실성: 소수의 한정된 목표에 초점과 관심을 집중시키는 정도를 나타낸다."},{"id":"4","text":"개방성: 호기심이 많고, 새로운 것에 대해 많은 관심을 보이지만 변화에 두려워하는 경향을 보인다."}],"answer":"4","type":"mc","originalKey":"정답 표시 형식 확인 전","note":"","review":"직접 풀이","status":"solved","explanation":"개방성은 새로운 경험·생각을 받아들이는 경향이다. 변화에 두려움을 보인다는 부분은 높은 개방성과 맞지 않는다.","refs":[],"topic":"성격·조직","originalText":"Big 5모형에 대한 다음 설명 중 가장 옳지 않은 것은?","ready":true,"originalAnswer":"정답 표시 형식 확인 전"},{"id":"2022-1 객관식-13","source":"2022-1 객관식","no":13,"text":"다음 중 리더십에 대한 설명으로 옳지 않은 것은?","options":[{"id":"1","text":"카리스마 리더십은 비전달성을 위해 위험감수 등 비범한 행동을 보인다."},{"id":"2","text":"서번트 리더십은 목표달성이라는 결과보다 구성원에 대한 서비스에 초점을 둔다."},{"id":"3","text":"거래적 리더십은 리더와 구성원 사이의 교환이나 거래관계를 통해 발휘된다."},{"id":"4","text":"수퍼 리더십은 리더가 종업원을 관리하고 통제할 수 있는 힘과 기술을 가지도록 하는데 초점을 둔다."}],"answer":"4","type":"mc","originalKey":"정답 표시 형식 확인 전","note":"","review":"직접 풀이","status":"solved","explanation":"수퍼 리더십은 구성원이 스스로 자신을 이끄는 셀프리더가 되도록 돕는다. 리더가 구성원을 통제하는 힘을 키우는 데 초점을 둔다는 설명은 반대다.","refs":[],"topic":"현대적 리더십","originalText":"다음 중 리더십에 대한 설명으로 옳지 않은 것은?","ready":true,"originalAnswer":"정답 표시 형식 확인 전"},{"id":"2022-1 객관식-14","source":"2022-1 객관식","no":14,"text":"리더십 특성이론의 한계점이 아닌 것은?","options":[{"id":"1","text":"행동이론과 상황이론에 비해 이론의 구성이 복잡하다."},{"id":"2","text":"오랜시간 걸친 연구에도 불구하고 모든 연구결과에서 공통적으로 제시되는 특성요인이 없다."},{"id":"3","text":"리더십 특성들을 확인하였을 뿐 그러한 특성과 조직성과, 또는 조직효과성 간의 상관관계를 규명하려는 노력을 기울이지 않았다."},{"id":"4","text":"오랜 기간에 걸쳐 깊이 있는 연구가 진행되었음에도 불구하고 리더십 훈련이나 개발을 위해 유용하게 적용되기 어렵다."}],"answer":"1","type":"mc","originalKey":"정답 표시 형식 확인 전","note":"","review":"직접 풀이","status":"solved","explanation":"특성이론은 리더의 자질에 초점을 맞추어 구성이 비교적 단순하다. 복잡한 구성이 한계라고 한 선지는 해당하지 않는다. 공통 특성이 전혀 없다는 표현 역시 오늘날에는 과도한 단정이므로 고전적 이론의 한계라는 출제 맥락으로 읽어야 한다.","refs":[],"topic":"리더십의 기초","originalText":"리더십 특성이론의 한계점이 아닌 것은?","ready":true,"originalAnswer":"정답 표시 형식 확인 전"},{"id":"2022-1 객관식-15","source":"2022-1 객관식","no":15,"text":"다음은 무엇에 대한 설명인가? 상이한 것에 희망을 두고, 이질적인 것과 결합함으로써 새로운 세계를 창조","options":[{"id":"1","text":"플라톤 철학"},{"id":"2","text":"비르투스"},{"id":"3","text":"코시모 효과"},{"id":"4","text":"메디치 효과"}],"answer":"4","type":"mc","originalKey":"정답 표시 형식 확인 전","note":"","review":"직접 풀이","status":"solved","explanation":"서로 다른 분야·관점이 만나는 지점에서 혁신이 생긴다는 메디치 효과를 가리킨다.","refs":[],"topic":"메디치·인문학","originalText":"다음은 무엇에 대한 설명인가? 상이한 것에 희망을 두고, 이질적인 것과 결합함으로써 새로운 세계를 창조","ready":true,"originalAnswer":"정답 표시 형식 확인 전"},{"id":"2022-1 객관식-16","source":"2022-1 객관식","no":16,"text":"리더십 이론에 관한 설명으로 옳지 않은 것은?","options":[{"id":"1","text":"하우스의 경로-목표이론에 의하면 상황이 리더에게 아주 유리하거나 불리할 때는 과업지향적인 리더십이 효과적이다."},{"id":"2","text":"허쉬와 블랜차드는 부하들의 성숙도에 따른 효과적인 리더십 행동을 분석하였다."},{"id":"3","text":"리더십 이론은 특성론적 접근, 상황론적 접근, 행위론적 접근으로 구분할 수 있다."},{"id":"4","text":"피들러는 상황변수로 리더와 부화와의 관계, 과업구조화, 리더의 지휘권력 정도를 고려하였다."}],"answer":"1","type":"mc","originalKey":"정답 표시 형식 확인 전","note":"","review":"자료 대조","status":"solved","explanation":"상황이 매우 유리하거나 불리할 때 과업지향이 효과적이라는 설명은 피들러의 상황적합이론이다. 하우스 이론으로 제시한 선지가 틀렸다.","refs":["situation"],"topic":"행동·상황이론","originalText":"리더십 이론에 관한 설명으로 옳지 않은 것은?","ready":true,"originalAnswer":"정답 표시 형식 확인 전"},{"id":"2022-1 객관식-17","source":"2022-1 객관식","no":17,"text":"리더십 연구에서 나타나는 공통점이 아닌 것은?","options":[{"id":"1","text":"리더십은 영향력과의 관계에서 나온다."},{"id":"2","text":"리더십은 목표달성을 위한 과정이다."},{"id":"3","text":"리더십은 집단상황에서 발생한다."},{"id":"4","text":"리더십은 결과이다."}],"answer":"4","type":"mc","originalKey":"정답 표시 형식 확인 전","note":"","review":"자료 대조","status":"solved","explanation":"리더십은 집단의 공동 목표를 향한 사회적 영향 과정이다. 단순히 결과라고 규정한 설명이 틀렸다.","refs":["nature"],"topic":"리더십의 기초","originalText":"리더십 연구에서 나타나는 공통점이 아닌 것은?","ready":true,"originalAnswer":"정답 표시 형식 확인 전"},{"id":"2022-1 객관식-18","source":"2022-1 객관식","no":18,"text":"매슬로우의 욕구단계설과 알더퍼의 ERG이론에 관한 설명으로 옳지 않은 것은?","options":[{"id":"1","text":"욕구단계이론에서는 한 시점에 낮은 단계와 높은 단계의 욕구가 동시에 발생한다."},{"id":"2","text":"ERG이론에서는 욕구의 좌절-퇴행 과정도 이루어진다."},{"id":"3","text":"욕구단계이론과 ERG이론은 하위욕구가 충족되면 상위욕구를 추구한다고 보는 공통점이 있다."},{"id":"4","text":"욕구단계이론에서 자아실현의 욕구는 ERG이론에서 성장욕구에 해당한다."}],"answer":"1","type":"mc","originalKey":"정답 표시 형식 확인 전","note":"","review":"자료 대조","status":"solved","explanation":"교과서적 비교에서 매슬로우는 욕구의 위계적 충족을 강조하고, ERG는 여러 욕구와 좌절·퇴행을 인정한다. 현실의 인간에게 욕구가 절대 동시에 생기지 않는다는 뜻은 아니다.","refs":["needs"],"topic":"동기부여","originalText":"매슬로우의 욕구단계설과 알더퍼의 ERG이론에 관한 설명으로 옳지 않은 것은?","ready":true,"originalAnswer":"정답 표시 형식 확인 전"},{"id":"2022-1 객관식-19","source":"2022-1 객관식","no":19,"text":"변혁적 리더가 갖추어야 할 자질이 아닌 것은?","options":[{"id":"1","text":"설득력과 지도력"},{"id":"2","text":"비전제시 능력"},{"id":"3","text":"신뢰 확보"},{"id":"4","text":"조건적 보상"}],"answer":"4","type":"mc","originalKey":"정답 표시 형식 확인 전","note":"","review":"자료 대조","status":"solved","explanation":"조건적·성과연계 보상은 거래적 리더십의 요소다. 변혁적 리더십은 이상적 영향력·영감·지적 자극·개별적 배려를 강조한다.","refs":["transform"],"topic":"현대적 리더십","originalText":"변혁적 리더가 갖추어야 할 자질이 아닌 것은?","ready":true,"originalAnswer":"정답 표시 형식 확인 전"},{"id":"2022-1 객관식-20","source":"2022-1 객관식","no":20,"text":"하우스의 경로-목표이론에서 정의한 리더십 행동유형이 아닌 것은?","options":[{"id":"1","text":"참여적 리더"},{"id":"2","text":"성취지향적 리더"},{"id":"3","text":"지원적 리더"},{"id":"4","text":"혁신적 리더"}],"answer":"4","type":"mc","originalKey":"정답 표시 형식 확인 전","note":"","review":"자료 대조","status":"solved","explanation":"경로목표이론의 유형은 지시적·지원적·참여적·성취지향적이다. 혁신적 리더는 해당하지 않는다.","refs":["situation"],"topic":"행동·상황이론","originalText":"하우스의 경로-목표이론에서 정의한 리더십 행동유형이 아닌 것은?","ready":true,"originalAnswer":"정답 표시 형식 확인 전"},{"id":"2022-2-1","source":"2022-2","no":1,"text":"리더십 연구의 발전과정을 순서대로 설명한 것으로 가장 옳은 것은?","options":[{"id":"1","text":"행동이론 - 특성이론 - 상황이론"},{"id":"2","text":"특성이론 - 행동이론 – 상황이론"},{"id":"3","text":"특성이론 - 상황이론 - 행동이론"},{"id":"4","text":"특성이론 - 상황이론 - 유효성이론"}],"answer":"2","type":"mc","originalKey":"정답 표시 형식 확인 전","note":"","review":"직접 풀이","status":"solved","explanation":"전통적인 분류에서는 특성이론 다음 행동이론, 이후 상황이론의 순서로 발전을 설명한다.","refs":[],"topic":"리더십의 기초","originalText":"리더십 연구의 발전과정을 순서대로 설명한 것으로 가장 옳은 것은?","ready":true,"originalAnswer":"정답 표시 형식 확인 전"},{"id":"2022-2-2","source":"2022-2","no":2,"text":"부하들 스스로가 자신을 리드하도록 만드는 리더십은?","options":[{"id":"1","text":"변혁적 리더십"},{"id":"2","text":"서번트 리더십"},{"id":"3","text":"카리스마 리더십"},{"id":"4","text":"수퍼 리더십"}],"answer":"4","type":"mc","originalKey":"정답 표시 형식 확인 전","note":"","review":"직접 풀이","status":"solved","explanation":"수퍼 리더십은 구성원이 스스로 자신을 이끄는 셀프리더가 되도록 돕는다. 리더가 구성원을 통제하는 힘을 키우는 데 초점을 둔다는 설명은 반대다.","refs":[],"topic":"현대적 리더십","originalText":"부하들 스스로가 자신을 리드하도록 만드는 리더십은?","ready":true,"originalAnswer":"정답 표시 형식 확인 전"},{"id":"2022-2-3","source":"2022-2","no":3,"text":"리더십 이론에 관한 설명으로 옳지 않은 것은?","options":[{"id":"1","text":"하우스의 경로-목표이론에 의하면 상황이 리더에게 아주 유리하거나 불리할 때는 과 업지향적인 리더십이 효과적이다."},{"id":"2","text":"블래이크와 모우튼의 관리격자이론에 의하면 (9,9)형이 이상적인 리더십 유형이다."},{"id":"3","text":"리더십 이론은 특성론적 접근, 상황론적 접근, 행위론적 접근으로 구분할 수 있다."},{"id":"4","text":"허쉬와 블랜차드는 부하들의 성숙도에 따른 효과적인 리더십 행동을 분석하였다."}],"answer":"1","type":"mc","originalKey":"족보 해설에서 확인","note":" → (피들러의 상황적합이론에 해당)","review":"자료 대조","status":"solved","explanation":"상황이 매우 유리하거나 불리할 때 과업지향이 효과적이라는 설명은 피들러의 상황적합이론이다. 하우스 이론으로 제시한 선지가 틀렸다.","refs":["situation"],"topic":"행동·상황이론","originalText":"리더십 이론에 관한 설명으로 옳지 않은 것은?","ready":true,"originalAnswer":"족보 해설에서 확인"},{"id":"2022-2-4","source":"2022-2","no":4,"text":"다음 메디치 가문의 내용 중 옳지 않은 것은?","options":[{"id":"1","text":"비르투스는 덕행, 선, 가치, 순결을 의미하고 이것은 완벽함을 의미한다."},{"id":"2","text":"비르투스는 메디치 가문의 정신이다."},{"id":"3","text":"마르첼로 아드리아니(피렌체 임시시장)은 그의 연설에서 리더의 사명은 비르투스의 실천을 강조했다."},{"id":"4","text":"일반적으로 리더는 포르투나가 따르기 마련이지만 진정한 리더는 비르투스를 추구해 야 한다."}],"answer":"1","type":"mc","originalKey":"족보 해설에서 확인","note":" → (비르투스 : 탁월함)","review":"강의 확인 필요","status":"pending","explanation":"족보의 답 또는 해설은 보존했지만, 강의 고유 해석까지 독립적으로 확정할 근거는 확보하지 못했다.","refs":[],"topic":"메디치·인문학","originalText":"다음 메디치 가문의 내용 중 옳지 않은 것은?","ready":false,"originalAnswer":"족보 해설에서 확인"},{"id":"2022-2-5","source":"2022-2","no":5,"text":"그림에 대한 설명을 고르는 문항 (원본 이미지 확인 필요)","options":[{"id":"1","text":"이 그림을 주문한 레오 10세는 그림을 통해 메디치 가문의 의리와 신용, 인연에 대 해 어필한 것으로 해석된다."},{"id":"2","text":"이 손가락은 발데사레 코사, 요하네스 23세와 관련되어져 있다고 알려져 있다."},{"id":"3","text":"이 작품은 세례자 요한의 손가락을 통해서 메디치 가문을 보라는 메시지가 숨어 있 다고 해석된다."},{"id":"4","text":"이 그림은 레오나르도가 생애 마지막으로 그린 작품이다."}],"answer":null,"type":"multi","originalKey":"정답 표시 형식 확인 전","note":"","review":"이미지 확인 필요","status":"pending","explanation":"원본의 문제 그림과 정답 표시를 아직 확인하지 못했다. 선지의 사실 여부와 그림의 대상 식별을 함께 확인해야 하므로 자동 출제·채점에서 제외한다.","refs":["louvre"],"topic":"메디치·인문학","originalText":"그림에 대한 설명을 고르는 문항 (원본 이미지 확인 필요)","ready":false,"originalAnswer":"정답 표시 형식 확인 전"},{"id":"2022-2-6","source":"2022-2","no":6,"text":"그림에 대한 설명을 고르는 문항 (원본 이미지 확인 필요)","options":[{"id":"1","text":"산로렌초 성당 신 영구실에 안장되어 있다."},{"id":"2","text":"줄리아노를 비르투스를 추구하는 리더의 화신으로 표현하였다."},{"id":"3","text":"비르투스를 표현한 줄리아노 데 메디치의 영묘이다."},{"id":"4","text":"미켈란젤로의 작품이다."}],"answer":null,"type":"multi","originalKey":"정답 표시 형식 확인 전","note":"","review":"이미지 확인 필요","status":"pending","explanation":"원본의 문제 그림과 정답 표시를 아직 확인하지 못했다. 선지의 사실 여부와 그림의 대상 식별을 함께 확인해야 하므로 자동 출제·채점에서 제외한다.","refs":["medici"],"topic":"메디치·인문학","originalText":"그림에 대한 설명을 고르는 문항 (원본 이미지 확인 필요)","ready":false,"originalAnswer":"정답 표시 형식 확인 전"},{"id":"2022-2-7","source":"2022-2","no":7,"text":"변혁적 리더십에 포함되는 4가지 특성이 아닌 것은?","options":[{"id":"1","text":"카리스마"},{"id":"2","text":"영감적 동기부여"},{"id":"3","text":"성과에 따른 보상"},{"id":"4","text":"지적자극"}],"answer":"3","type":"mc","originalKey":"족보 해설에서 확인","note":" → (거래적 리더십의 특성)","review":"자료 대조","status":"solved","explanation":"조건적·성과연계 보상은 거래적 리더십의 요소다. 변혁적 리더십은 이상적 영향력·영감·지적 자극·개별적 배려를 강조한다.","refs":["transform"],"topic":"현대적 리더십","originalText":"변혁적 리더십에 포함되는 4가지 특성이 아닌 것은?","ready":true,"originalAnswer":"족보 해설에서 확인"},{"id":"2022-2-8","source":"2022-2","no":8,"text":"다음 리더 행동이론의 목적이 아닌 것은?","options":[{"id":"1","text":"효과적인 리더행동유형에 맞추어 교육훈련을 통해 효과적인 리더십을 개발하는 것이 다."},{"id":"2","text":"리더의 다양한 행동을 관찰하여, 그 정도를 측정하는 척도를 기술하고 만드는 것이다."},{"id":"3","text":"리더의 행동유형을 분류하여 어떤 유형이 조직성과에 효과적인 유형인가를 밝히는 것 이다."},{"id":"4","text":"효과적인 리더와 비효과적인 리더의 특성 차이를 파악하는 것이다."}],"answer":"4","type":"mc","originalKey":"족보 해설에서 확인","note":" → (리더십 특성이론에 대한 설명)","review":"자료 대조","status":"solved","explanation":"행동이론은 리더가 무엇을 하는지 분석한다. 개인의 특성 차이를 찾는 것은 특성이론의 접근이다.","refs":["grid"],"topic":"행동·상황이론","originalText":"다음 리더 행동이론의 목적이 아닌 것은?","ready":true,"originalAnswer":"족보 해설에서 확인"},{"id":"2022-2-9","source":"2022-2","no":9,"text":"다음 사례에서 A의 행동을 설명하는 동기부여 이론은? \u003c사례> 팀원 A는 작년도 목표대비 업무실적을 100% 달성하였다. 이에 반해 같은 팀 동료 B 는 동일 목표대비 업무실적이 10% 부족하였지만, A와 동일한 인센티브를 받았다. 이 사실을 알게 된 A는 팀장에게 추가 인센티브를 요구하였고, 받아들여지지 않자 결국 이직하였다.","options":[{"id":"1","text":"공정성이론"},{"id":"2","text":"욕구단계이론"},{"id":"3","text":"목표설정이론"},{"id":"4","text":"기대이론"}],"answer":"1","type":"mc","originalKey":"정답 표시 형식 확인 전","note":"","review":"자료 대조","status":"solved","explanation":"자신과 동료의 기여 대비 보상을 비교한 뒤 불공정을 줄이려 행동하므로 공정성이론이다.","refs":["process"],"topic":"동기부여","originalText":"다음 사례에서 A의 행동을 설명하는 동기부여 이론은? \u003c사례> 팀원 A는 작년도 목표대비 업무실적을 100% 달성하였다. 이에 반해 같은 팀 동료 B 는 동일 목표대비 업무실적이 10% 부족하였지만, A와 동일한 인센티브를 받았다. 이 사실을 알게 된 A는 팀장에게 추가 인센티브를 요구하였고, 받아들여지지 않자 결국 이직하였다.","ready":true,"originalAnswer":"정답 표시 형식 확인 전"},{"id":"2022-2-10","source":"2022-2","no":10,"text":"다음은 ‘마키아벨리’가 어떤 사람을 평가한 인물평이다. 이 사람은 누구인가? 그는 선한 사람이었다. 폭력과 과시를 싫어했다. 하 지만 동족들은 그의 선량함과 탁 월함을 제대로 평 가해주지 않았다. 주된 원인은 아버지 코시모가 죽 은 뒤 몇 년 동안 끊임없는 병에 시달린데 있었다. 폭력을 혐오하던 그는 자신을 제거하려는 음 모가 불거져 나왔을 때도 폭력을 쓰지 않은 채 즉각 반란을 진압했고, 정적들을 친 구로 돌려놓으려고 노력했 다. 국내정치와 파벌경쟁에는 관심이 없었으나, 대 외정치 에는 각별한 관심을 기울였으며 자기 도시보다 외국 궁정에서 더 높은 평가를 받았 다.","options":[{"id":"1","text":"카테리아 데 메디치"},{"id":"2","text":"피에로 데 메디치"},{"id":"3","text":"로렌초 데 메디치"},{"id":"4","text":"코시모 데 메디치"}],"answer":"2","type":"mc","originalKey":"정답 표시 형식 확인 전","note":"","review":"자료 대조","status":"solved","explanation":"코시모의 아들로 병을 앓았던 피에로 데 메디치에 대한 설명이다.","refs":["history"],"topic":"메디치·인문학","originalText":"다음은 ‘마키아벨리’가 어떤 사람을 평가한 인물평이다. 이 사람은 누구인가? 그는 선한 사람이었다. 폭력과 과시를 싫어했다. 하 지만 동족들은 그의 선량함과 탁 월함을 제대로 평 가해주지 않았다. 주된 원인은 아버지 코시모가 죽 은 뒤 몇 년 동안 끊임없는 병에 시달린데 있었다. 폭력을 혐오하던 그는 자신을 제거하려는 음 모가 불거져 나왔을 때도 폭력을 쓰지 않은 채 즉각 반란을 진압했고, 정적들을 친 구로 돌려놓으려고 노력했 다. 국내정치와 파벌경쟁에는 관심이 없었으나, 대 외정치 에는 각별한 관심을 기울였으며 자기 도시보다 외국 궁정에서 더 높은 평가를 받았 다.","ready":true,"originalAnswer":"정답 표시 형식 확인 전"},{"id":"2022-2-11","source":"2022-2","no":11,"text":"다음은 바사리가 누구를 지적한 말인가? 그는 분명히 예술에 대한 이해가 탁월했기 때문에 많은 것을 시도했다. 그러나 어느 것도 끝내지 못했다. 자신이 생각했던 완벽한 작품을 만들 수 없다는 것을 깨달었기 때문이다. 그의 이상은 고매했다. 그의 손이 아무리 뛰어난 솜씨를 가졌다 해도 그 이상은 실현될 수 없었다.","options":[{"id":"1","text":"미켈로초"},{"id":"2","text":"아르테미시아 젠틸레스키"},{"id":"3","text":"미켄란젤로"},{"id":"4","text":"레오나르도 다빈치"}],"answer":"4","type":"mc","originalKey":"정답 표시 형식 확인 전","note":"","review":"직접 풀이","status":"solved","explanation":"완벽한 이상 때문에 작품을 완성하기 어렵다고 평가받은 인물은 레오나르도 다빈치다. 원문 인용의 정확한 번역 대조는 남아 있다.","refs":[],"topic":"메디치·인문학","originalText":"다음은 바사리가 누구를 지적한 말인가? 그는 분명히 예술에 대한 이해가 탁월했기 때문에 많은 것을 시도했다. 그러나 어느 것도 끝내지 못했다. 자신이 생각했던 완벽한 작품을 만들 수 없다는 것을 깨달었기 때문이다. 그의 이상은 고매했다. 그의 손이 아무리 뛰어난 솜씨를 가졌다 해도 그 이상은 실현될 수 없었다.","ready":true,"originalAnswer":"정답 표시 형식 확인 전"},{"id":"2022-2-12","source":"2022-2","no":12,"text":"유약겸하 여민동락은 “강자와의 경쟁은 피하고 몸을 낮추되, 언제나 대중편에 서라”라는 코시모의 삶의 철학이다.","options":[{"id":"O","text":"O"},{"id":"X","text":"X"}],"answer":"X","type":"ox","originalKey":"족보 명시 정답 X","note":"족보: X, 조반니의 삶의 철학.","review":"강의 확인 필요","status":"pending","explanation":"족보의 답 또는 해설은 보존했지만, 강의 고유 해석까지 독립적으로 확정할 근거는 확보하지 못했다.","refs":[],"topic":"메디치·인문학","originalText":"유약겸하 여민동락은 “강자와의 경쟁은 피하고 몸을 낮추되, 언제나 대중편에 서라”라는 코시모의 삶의 철학이다.","ready":false,"originalAnswer":"족보 명시 정답 X"},{"id":"2022-2-13","source":"2022-2","no":13,"text":"다음 중 리더의 역할이 가장 아닌 것은 무엇인가?","options":[{"id":"1","text":"리더는 부하들의 장기적인 측면에서의 비전보다는 단기목표 달성을 위한 동기부여에 노력해야 한다."},{"id":"2","text":"리더는 부하에게 비전을 제시할 수 있어야 한다."},{"id":"3","text":"리더는 조직의 목표를 명확히 인식하여 부하들로 하여금, 과업과 관련된 행동을 수행 할 수 있도록 동기부여를 시켜야 한다."},{"id":"4","text":"리더는 부하에게 합리적이고 합법적인 권력을 행사하여 영향력을 미칠 수 있어야 한 다."}],"answer":"1","type":"mc","originalKey":"족보 해설에서 확인","note":" → (장기적인 측면에서의 비전을 위해 노력)","review":"자료 대조","status":"solved","explanation":"리더는 방향·비전과 장기적 효과성을 강조하고, 관리는 수행의 효율성을 강조한다. 두 역할은 서로 보완한다.","refs":["nature"],"topic":"리더십의 기초","originalText":"다음 중 리더의 역할이 가장 아닌 것은 무엇인가?","ready":true,"originalAnswer":"족보 해설에서 확인"},{"id":"2022-2-14","source":"2022-2","no":14,"text":"리더십 연구에서 나타나는 공통점이 아닌 것은?","options":[{"id":"1","text":"리더십은 영향력과의 관계에서 나온다."},{"id":"2","text":"리더십은 집단상황에서 발생한다."},{"id":"3","text":"리더십은 목표달성을 위한 과정이다."},{"id":"4","text":"리더십은 결과이다."}],"answer":"4","type":"mc","originalKey":"족보 해설에서 확인","note":" → (리더십은 과정이다)","review":"자료 대조","status":"solved","explanation":"리더십은 집단의 공동 목표를 향한 사회적 영향 과정이다. 단순히 결과라고 규정한 설명이 틀렸다.","refs":["nature"],"topic":"리더십의 기초","originalText":"리더십 연구에서 나타나는 공통점이 아닌 것은?","ready":true,"originalAnswer":"족보 해설에서 확인"},{"id":"2022-2-15","source":"2022-2","no":15,"text":"조직현장에서 권한 위임이 원활하지 않은 이유가 아닌 것은?","options":[{"id":"1","text":"상급자의 능력에 대한 신뢰의 부족"},{"id":"2","text":"결과에 대한 책임의 문제가 위임을 주저하게 만든다."},{"id":"3","text":"조직정치와 관련하여 인간적인 신뢰가 부족"},{"id":"4","text":"인간의 권력욕구와 관련이 되어 있다."}],"answer":"1","type":"mc","originalKey":"족보 해설에서 확인","note":" → (하급자의 능력에 대한 신뢰 부족)","review":"직접 풀이","status":"solved","explanation":"위임하는 상급자가 하급자의 역량을 신뢰하지 못하는 것이 장애가 된다. 상급자의 능력에 대한 신뢰 부족으로 방향을 바꾼 선지가 출제 의도상 답이다.","refs":[],"topic":"권력·조직","originalText":"조직현장에서 권한 위임이 원활하지 않은 이유가 아닌 것은?","ready":true,"originalAnswer":"족보 해설에서 확인"},{"id":"2022-2-16","source":"2022-2","no":16,"text":"허쯔버그의 2요인이론에 관한 설명으로 옳지 않은 것은?","options":[{"id":"1","text":"만족에 영향을 미치는 요인과 불만족에 영향을 미치는 요인은 별도로 존재한다."},{"id":"2","text":"위생요인은 만족을 증가시킬지의 여부에 영향을 미치며, 불만족 해소여부에는 영향을 미치지 못한다."},{"id":"3","text":"동기요인은 개인으로 하여금 열심히 일하게 되며 이에 따라 성과도 높여주는 요인이 다."},{"id":"4","text":"구성원의 만족도를 높이기 위해서는 위생요인보다 동기요인을 사용해야 한다."}],"answer":"2","type":"mc","originalKey":"족보 해설에서 확인","note":" → (위생요인은 불만족에 영향을 미치는 요인)","review":"자료 대조","status":"solved","explanation":"성취·인정은 동기요인이다. 위생요인은 주로 불만족을 줄이며, 만족 증가와 불만족 감소를 같은 것으로 보지 않는다.","refs":["needs"],"topic":"동기부여","originalText":"허쯔버그의 2요인이론에 관한 설명으로 옳지 않은 것은?","ready":true,"originalAnswer":"족보 해설에서 확인"},{"id":"2022-2-17","source":"2022-2","no":17,"text":"다음 중 갈등의 의미와 기능에 관한 설명으로 옳지 않은 것은?","options":[{"id":"1","text":"갈등이 조직과정에서 부정적인 역할임을 강조하였다."},{"id":"2","text":"갈등은 현실적으로는 부분적으로 예방하거나 관리할 수 있어도 제거할 수는 없다."},{"id":"3","text":"갈등의 해결은 조직의 생산성을 증진시키고 조직의 문제를 해결하는 원동력이다."},{"id":"4","text":"갈등을 관리 가능한 것으로 파악한다."}],"answer":"1","type":"mc","originalKey":"족보 해설에서 확인","note":" → (긍정적 역할)","review":"자료 대조","status":"solved","explanation":"현대적 관점에서는 갈등이 문제 발견과 개선에 도움이 될 수도 있다. 항상 부정적인 역할만 한다는 설명이 틀렸다. 모든 갈등이 유익하다는 의미도 아니다.","refs":["conflict"],"topic":"권력·조직","originalText":"다음 중 갈등의 의미와 기능에 관한 설명으로 옳지 않은 것은?","ready":true,"originalAnswer":"족보 해설에서 확인"},{"id":"2022-2-18","source":"2022-2","no":18,"text":"변혁적 리더십의 특징에 해당하지 않는 것을 모두 고른 것은? A : 부하들에게 장기적인 목표를 위해 노력하도록 동기를 부여한다. B : 부하들을 위해 문제를 해결하거나 해답을 찾을 수 있는 곳을 알려준다. C : 부하들에게 즉각적이고 가시적인 보상으로 동기 부여한다. D : 부하들에게 자아실현과 같은 높은 수준의 개인적인 목표를 동경하도록 동기를 부 여한다. E : 질문을 하여 부하들에게 스스로 해결책을 찾거나 격려하도록 함께 일을 한다.","options":[{"id":"1","text":"C, D"},{"id":"2","text":"D, E"},{"id":"3","text":"B, C"},{"id":"4","text":"A, B"}],"answer":"3","type":"mc","originalKey":"정답 표시 형식 확인 전","note":"","review":"자료 대조","status":"solved","explanation":"C의 즉각적 보상은 거래적 리더십에 해당한다. B는 리더가 답을 제공하는 방식이며, E의 자율적 해결 촉진과 대비된다. 출제 의도상 B와 C를 고른다.","refs":["transform"],"topic":"현대적 리더십","originalText":"변혁적 리더십의 특징에 해당하지 않는 것을 모두 고른 것은? A : 부하들에게 장기적인 목표를 위해 노력하도록 동기를 부여한다. B : 부하들을 위해 문제를 해결하거나 해답을 찾을 수 있는 곳을 알려준다. C : 부하들에게 즉각적이고 가시적인 보상으로 동기 부여한다. D : 부하들에게 자아실현과 같은 높은 수준의 개인적인 목표를 동경하도록 동기를 부 여한다. E : 질문을 하여 부하들에게 스스로 해결책을 찾거나 격려하도록 함께 일을 한다.","ready":true,"originalAnswer":"정답 표시 형식 확인 전"},{"id":"2022-2-19","source":"2022-2","no":19,"text":"리더십에 관한 설명으로 옳지 않은 것은?","options":[{"id":"1","text":"거래적 리더십은 리더와 구성원 사이의 교환이나 거래관계를 통해 발휘된다."},{"id":"2","text":"수퍼 리더십은 리더가 종업원을 관리하고 통제할 수 있는 힘과 기술을 가지도록 하는 데 초점을 둔다."},{"id":"3","text":"서번트 리더십은 목표달성이라는 결과보다 구성원에 대한 서비스에 초점을 둔다."},{"id":"4","text":"카리스마 리더십은 비전달성을 위해 위험감수 등 비범한 행동을 보인다."}],"answer":"2","type":"mc","originalKey":"정답 표시 형식 확인 전","note":"","review":"직접 풀이","status":"solved","explanation":"수퍼 리더십은 구성원이 스스로 자신을 이끄는 셀프리더가 되도록 돕는다. 리더가 구성원을 통제하는 힘을 키우는 데 초점을 둔다는 설명은 반대다.","refs":[],"topic":"현대적 리더십","originalText":"리더십에 관한 설명으로 옳지 않은 것은?","ready":true,"originalAnswer":"정답 표시 형식 확인 전"},{"id":"2022-2-20","source":"2022-2","no":20,"text":"아담스의 공정성 이론에서 조직구성원들이 개인적 불공정성을 시정하기 위한 방법에 해당하지 않는 것은?","options":[{"id":"1","text":"준거인물 유지"},{"id":"2","text":"장 이탈"},{"id":"3","text":"산출의 변경"},{"id":"4","text":"투입의 변경"}],"answer":"1","type":"mc","originalKey":"정답 표시 형식 확인 전","note":"","review":"자료 대조","status":"solved","explanation":"불공정을 줄이기 위해 투입·산출·준거인물 등을 바꾸거나 관계를 떠날 수 있다. 준거인물 유지는 변화 전략이 아니다.","refs":["process"],"topic":"동기부여","originalText":"아담스의 공정성 이론에서 조직구성원들이 개인적 불공정성을 시정하기 위한 방법에 해당하지 않는 것은?","ready":true,"originalAnswer":"정답 표시 형식 확인 전"},{"id":"2022-2-21","source":"2022-2","no":21,"text":"매슬로우의 욕구단계를 순서대로 나열한 것은? A : 생리욕구 B : 안전욕구 C : 소속욕구 D : 존경욕구 E : 자이실현 욕구","options":[{"id":"1","text":"A–C–B–D–E"},{"id":"2","text":"A–C–B–E–D"},{"id":"3","text":"B–A–C–D–E"},{"id":"4","text":"A–B–C–D–E"}],"answer":"4","type":"mc","originalKey":"정답 표시 형식 확인 전","note":"","review":"자료 대조","status":"solved","explanation":"생리 → 안전 → 소속 → 존경 → 자아실현 순이다.","refs":["needs"],"topic":"동기부여","originalText":"매슬로우의 욕구단계를 순서대로 나열한 것은? A : 생리욕구 B : 안전욕구 C : 소속욕구 D : 존경욕구 E : 자이실현 욕구","ready":true,"originalAnswer":"정답 표시 형식 확인 전"},{"id":"2022-2-22","source":"2022-2","no":22,"text":"프렌치와 레이븐의 권력원천의 분류에 따라서 개인적 원천의 권력에 해당하는 것을 모두 고르시오. A : 강압적 권력 B : 준거적 권력 C : 전문적 권력 D : 합법적 권력 E : 보상적 권력","options":[{"id":"1","text":"A, B, C"},{"id":"2","text":"A, B"},{"id":"3","text":"B, C"},{"id":"4","text":"C, D"}],"answer":"3","type":"mc","originalKey":"정답 표시 형식 확인 전","note":"","review":"자료 대조","status":"solved","explanation":"준거적 권력과 전문적 권력은 개인의 매력·역량에서 생긴다. 보상·강압·합법적 권력은 지위에 기반한다.","refs":["power"],"topic":"권력·조직","originalText":"프렌치와 레이븐의 권력원천의 분류에 따라서 개인적 원천의 권력에 해당하는 것을 모두 고르시오. A : 강압적 권력 B : 준거적 권력 C : 전문적 권력 D : 합법적 권력 E : 보상적 권력","ready":true,"originalAnswer":"정답 표시 형식 확인 전"},{"id":"2022-2-23","source":"2022-2","no":23,"text":"다음 중 리더십 특성이론에 관한 내용과 다른 것은?","options":[{"id":"1","text":"리더십 특성이론은 다른 이론들에 비해 비교적 이론의 구성이 단순하다."},{"id":"2","text":"선천적으로 타고난 리더십 자질과 특성 때문일 것이라는 일반의 믿음에 부응하기 때 문에 직관적으로 상당한 흥미를 불러일으킨다."},{"id":"3","text":"리더십 특성이론은 오직 리더에게 초점을 맞추고 있기 때문에 유능한 리더의 성격특 성에 관한 보다 깊이 있는 이해가 불가능하다."},{"id":"4","text":"리더십 특성이론은 복잡한 리더십 과정을 설명함에 있어서 리더의 특성과 자질에만 연구의 초점을 둔 것이다."}],"answer":"3","type":"mc","originalKey":"족보 해설에서 확인","note":" → (깊이 있는 이해 가능)","review":"직접 풀이","status":"solved","explanation":"리더의 특성에 집중하므로 개인 특성을 깊이 이해하는 데 장점이 있다. 깊이 있는 이해가 불가능하다는 설명은 반대다.","refs":[],"topic":"리더십의 기초","originalText":"다음 중 리더십 특성이론에 관한 내용과 다른 것은?","ready":true,"originalAnswer":"족보 해설에서 확인"},{"id":"2022-2-24","source":"2022-2","no":24,"text":"서번트 리더십의 특성으로 옳지 않은 것은?","options":[{"id":"1","text":"비전 달성을 위해 위험감수 등 비범한 행동을 보인다."},{"id":"2","text":"부하의 성장을 위해 헌신한다."},{"id":"3","text":"조직의 구성원들에게 공동체 정신을 심어준다."},{"id":"4","text":"부하의 감정에 공감하고, 이해하려고 노력한다."}],"answer":"1","type":"mc","originalKey":"족보 해설에서 확인","note":" → (카리스마 리더십 특성)","review":"자료 대조","status":"solved","explanation":"공감·구성원 성장·공동체 형성은 서번트 리더십의 특징이다. 비전을 위한 비범한 위험감수는 카리스마 리더십의 대표적 설명이다.","refs":["servant"],"topic":"현대적 리더십","originalText":"서번트 리더십의 특성으로 옳지 않은 것은?","ready":true,"originalAnswer":"족보 해설에서 확인"},{"id":"2022-2-25","source":"2022-2","no":25,"text":"브레이크와 모우튼의 관리격자모델의 리더 유형에 관한 설명으로 옳지 않은 것은?","options":[{"id":"1","text":"(1,9)형은 생산에 관심을 보이는 인기형 리더이다."},{"id":"2","text":"(9,1)형은 과업상의 능력을 우선적으로 생각하는 과업형 리더이다."},{"id":"3","text":"(5,5)형은 과업의 능률과 인간적 요소를 절충하여 적당한 수준에서 성과를 추구하는 중도형 리더이다."},{"id":"4","text":"(1,1)형은 조직구성원으로서 자리를 유지하는데 필요한 최소한의 노력만을 투입하는 무관심형 리더이다."}],"answer":"1","type":"mc","originalKey":"족보 해설에서 확인","note":" → (인간에 대한 관심은 높으나 생산에는 관심이 낮은 인기형 리더)","review":"자료 대조","status":"solved","explanation":"(1,9)는 인간에 대한 관심이 높고 생산에 대한 관심이 낮은 인기형이다. 두 축을 바꾸어 설명한 선지가 틀렸다.","refs":["grid"],"topic":"행동·상황이론","originalText":"브레이크와 모우튼의 관리격자모델의 리더 유형에 관한 설명으로 옳지 않은 것은?","ready":true,"originalAnswer":"족보 해설에서 확인"},{"id":"K-MOOC-1","source":"K-MOOC","no":1,"text":"허쯔버그의 2요인이론에 관한 설명으로 옳지 않은 것은?","options":[{"id":"1","text":"만족에 영향을 미치는 요인과 불만족에 영향을 미치는 요인은 별도로 존재한다."},{"id":"2","text":"위생요인은 만족을 증가시킬지의 여부에 영향을 미치며,불만족 해소여부에는 영향을 미치지 못한다."},{"id":"3","text":"동기요인은 개인으로 하여금 열심히 일하게 되며 이에 따라 성과도 높여주는 요인이다."},{"id":"4","text":"구성원의 만족도를 높이기 위해서는 위생요인보다 동기요인을 사용해야 한다."}],"answer":"2","type":"mc","originalKey":"족보 해설에서 확인","note":"위생요인 : 직무환경에서 생기는 외적,물리적인 요인들로써 제거하면 불만족을 없애주는 요인(회사정책, 감독,급여와 지위,대인관계,직무환경과 근무조건,직무안정 등)","review":"자료 대조","status":"solved","explanation":"성취·인정은 동기요인이다. 위생요인은 주로 불만족을 줄이며, 만족 증가와 불만족 감소를 같은 것으로 보지 않는다.","refs":["needs"],"topic":"동기부여","originalText":"허쯔버그의 2요인이론에 관한 설명으로 옳지 않은 것은?","ready":true,"originalAnswer":"족보 해설에서 확인"},{"id":"K-MOOC-2","source":"K-MOOC","no":2,"text":"변혁적 리더십에 포함되는 4가지 특성이 아닌 것은? (문제 15와 유사)","options":[{"id":"1","text":"카리스마"},{"id":"2","text":"성과에 대한 보상"},{"id":"3","text":"지적자극"},{"id":"4","text":"영감적 동기부여"}],"answer":"2","type":"mc","originalKey":"족보 해설에서 확인","note":"카리스마 : 변혁적 리더십의 핵심에너지로 부하들을 리더의 비전에 몰입적으로 헌신하게 함 개별적 배려 : 부하들에게 개인이나 집단별로 그들의 욕구와 희망에 대해 관심을 표명하고 배려함 , 그들이 리더에게 각별한 대상이라는 느낌을 갖게 함 지적자극 : 당면한 문제를 새로운 방식으로 보게 하여 해결을 위한 창의적이고 혁신적인 방안을 모색 영감적 동기부여 : 개인적 이익을 초월하여 새로운 비전과 전체의 이익실현에 헌신하도록 하는 감성적 커뮤니케이션 능력","review":"자료 대조","status":"solved","explanation":"조건적·성과연계 보상은 거래적 리더십의 요소다. 변혁적 리더십은 이상적 영향력·영감·지적 자극·개별적 배려를 강조한다.","refs":["transform"],"topic":"현대적 리더십","originalText":"변혁적 리더십에 포함되는 4가지 특성이 아닌 것은? (문제 15와 유사)","ready":true,"originalAnswer":"족보 해설에서 확인"},{"id":"K-MOOC-3","source":"K-MOOC","no":3,"text":"리더십 이론에 관한 설명으로 옳지 않은 것은? (문제 16과 유사)","options":[{"id":"1","text":"리더십 이론은 특성론적 접근,상황론적 접근,행위론적 접근으로 구분할 수 있다."},{"id":"2","text":"블레이크와 모우튼의 관리격자이론에 의하면 (9.9)형이 이상적인 리더십 유형이다."},{"id":"3","text":"허쉬와 블랜차드는 부하들의 성숙도에 따른 효과적인 리더십 행동을 분석하였다."},{"id":"4","text":"하우스의 경로-목표이론에 의하면 상황이 리더에게 아주 유리하거나 불리할 때는 과업지향적인 리더십이 효과적이다."}],"answer":"4","type":"mc","originalKey":"족보 해설에서 확인","note":"4번 설명은 하우스의 경로-목표이론이 아닌 피들러의 이론임","review":"자료 대조","status":"solved","explanation":"상황이 매우 유리하거나 불리할 때 과업지향이 효과적이라는 설명은 피들러의 상황적합이론이다. 하우스 이론으로 제시한 선지가 틀렸다.","refs":["situation"],"topic":"행동·상황이론","originalText":"리더십 이론에 관한 설명으로 옳지 않은 것은? (문제 16과 유사)","ready":true,"originalAnswer":"족보 해설에서 확인"},{"id":"K-MOOC-4","source":"K-MOOC","no":4,"text":"브레이크와 모우튼의 관리격자모델의 리더 유형에 관한 설명으로 옳지 않은 것은? (문제 17과 유사)","options":[{"id":"1","text":"(1.1)형은 조직구성원으로서 자리를 유지하는데 필요한 최소한의 노력만을 투입하는 무관심형 리더이다."},{"id":"2","text":"(1.9)형은 생산에 관심을 보이는 인기형 리더이다."},{"id":"3","text":"(9.1)형은 과업상의 능력을 우선적으로 생각하는 과업형 리더이다."},{"id":"4","text":"(5.5)형은 과업의 능률과 인간적 요소를 절충하여 적당한 수준에서 성과를 추구하는 중도형 리더이다."}],"answer":"2","type":"mc","originalKey":"정답 표시 형식 확인 전","note":"","review":"자료 대조","status":"solved","explanation":"(1,9)는 인간에 대한 관심이 높고 생산에 대한 관심이 낮은 인기형이다. 두 축을 바꾸어 설명한 선지가 틀렸다.","refs":["grid"],"topic":"행동·상황이론","originalText":"브레이크와 모우튼의 관리격자모델의 리더 유형에 관한 설명으로 옳지 않은 것은? (문제 17과 유사)","ready":true,"originalAnswer":"정답 표시 형식 확인 전"},{"id":"K-MOOC-5","source":"K-MOOC","no":5,"text":"다음 중 리더십 특성이론에 관한 내용과 다른 것은?","options":[{"id":"1","text":"리더십 특성이론은 복잡한 리더십 과정을 설명함에 있어서 리더의 특성과 자질에만 연구의 초점을 둔 것이다."},{"id":"2","text":"리더십 특성이론은 다른 이론들에 비해 비교적 이론의 구성이 단순하다."},{"id":"3","text":"리더십 특성이론은 오직 리더에게 초점을 맞추고 있기 때문에 유능한 리더의 성격특성에 관한 보다 깊이 있는 이해가 불가능하다."},{"id":"4","text":"선천적으로 타고난 리더십 자질과 특성 때문일 것이라는 일반의 믿음에 부응하기 때문에 직관적으로 상당한 흥미를 불러일으킨다."}],"answer":"3","type":"mc","originalKey":"정답 표시 형식 확인 전","note":"","review":"직접 풀이","status":"solved","explanation":"리더의 특성에 집중하므로 개인 특성을 깊이 이해하는 데 장점이 있다. 깊이 있는 이해가 불가능하다는 설명은 반대다.","refs":[],"topic":"리더십의 기초","originalText":"다음 중 리더십 특성이론에 관한 내용과 다른 것은?","ready":true,"originalAnswer":"정답 표시 형식 확인 전"},{"id":"K-MOOC-6","source":"K-MOOC","no":6,"text":"아담스의 공정성 이론에서 조직구성원들이 개인적 불공정성을 시정하기 위한 방법에 해당하지 않는 것은?","options":[{"id":"1","text":"투입의 변경"},{"id":"2","text":"산출의 변경"},{"id":"3","text":"장 이탈"},{"id":"4","text":"준거인물 유지"}],"answer":"4","type":"mc","originalKey":"정답 표시 형식 확인 전","note":"","review":"자료 대조","status":"solved","explanation":"불공정을 줄이기 위해 투입·산출·준거인물 등을 바꾸거나 관계를 떠날 수 있다. 준거인물 유지는 변화 전략이 아니다.","refs":["process"],"topic":"동기부여","originalText":"아담스의 공정성 이론에서 조직구성원들이 개인적 불공정성을 시정하기 위한 방법에 해당하지 않는 것은?","ready":true,"originalAnswer":"정답 표시 형식 확인 전"},{"id":"K-MOOC-7","source":"K-MOOC","no":7,"text":"매슬로우의 욕구단계를 순서대로 나열한 것은? A : 생리욕구 B : 안전욕구 C : 소속욕구 D : 존경욕구 E : 자아실현 욕구","options":[{"id":"1","text":"A-B-C-D-E"},{"id":"2","text":"A-C-B-D-E"},{"id":"3","text":"A-C-B-E-D"},{"id":"4","text":"B-A-C-D-E"}],"answer":"1","type":"mc","originalKey":"정답 표시 형식 확인 전","note":"","review":"자료 대조","status":"solved","explanation":"생리 → 안전 → 소속 → 존경 → 자아실현 순이다.","refs":["needs"],"topic":"동기부여","originalText":"매슬로우의 욕구단계를 순서대로 나열한 것은? A : 생리욕구 B : 안전욕구 C : 소속욕구 D : 존경욕구 E : 자아실현 욕구","ready":true,"originalAnswer":"정답 표시 형식 확인 전"},{"id":"K-MOOC-8","source":"K-MOOC","no":8,"text":"다음 리더 행동이론의 목적이 아닌 것은?","options":[{"id":"1","text":"리더의 다양한 행동을 관찰하여,그 정도를 측정하는 척도를 기술하고 만드는 것이다."},{"id":"2","text":"효과적인 리더와 비효과적인 리더의 특성 차이를 파악하는 것이다."},{"id":"3","text":"효과적인 리더행동유형에 맞추어 교육훈련을 통해 효과적인 리더십을 개발하는 것이다."},{"id":"4","text":"리더의 행동유형을 분류하여 어떤 유형이 조직성과에 효과적인 유형인가를 밝히는 것이다."}],"answer":"2","type":"mc","originalKey":"정답 표시 형식 확인 전","note":"","review":"자료 대조","status":"solved","explanation":"행동이론은 리더가 무엇을 하는지 분석한다. 개인의 특성 차이를 찾는 것은 특성이론의 접근이다.","refs":["grid"],"topic":"행동·상황이론","originalText":"다음 리더 행동이론의 목적이 아닌 것은?","ready":true,"originalAnswer":"정답 표시 형식 확인 전"},{"id":"K-MOOC-9","source":"K-MOOC","no":9,"text":"브룸의 기대이론에 대한 다음 설명 중 가장 옳지 않은 것은?","options":[{"id":"1","text":"기대감은 노력했을 때 얼마나 성과를 달성할 수 있는가에 대한 가능성 또는 확률에 대한 객관적인 확신이다."},{"id":"2","text":"기대감은 과거의 경험과 자신감 등에 의해 영향을 받는다."},{"id":"3","text":"수단성은 개인이 지각하는 1차적 결과와 2차적 결과와의 상관관계를 말한다."},{"id":"4","text":"유의성은 각 개인들이 보상에 대해 느끼는 중요성 또는 가치의 정도를 말한다."}],"answer":"1","type":"mc","originalKey":"정답 표시 형식 확인 전","note":"","review":"자료 대조","status":"solved","explanation":"기대감은 노력하면 성과를 낼 수 있다는 개인의 주관적 판단이다. 객관적 확신이라고 한 설명이 틀렸다.","refs":["process"],"topic":"동기부여","originalText":"브룸의 기대이론에 대한 다음 설명 중 가장 옳지 않은 것은?","ready":true,"originalAnswer":"정답 표시 형식 확인 전"},{"id":"K-MOOC-10","source":"K-MOOC","no":10,"text":"프렌치와 레이븐의 권력원천의 분류에 따라서 개인적 원천의 권력에 해당하는 것을 모두 고르시오. A : 강압적 권력 B: 준거적 권력 C : 전문적 권력 D : 합법적 권력, E : 보상적 권력","options":[{"id":"1","text":"A, B"},{"id":"2","text":"B, C"},{"id":"3","text":"C, D"},{"id":"4","text":"A, B, C"}],"answer":"2","type":"mc","originalKey":"족보 해설에서 확인","note":"지위권력(보상적,강제적,합법적 권력) :대부분의 조직은 지위권력에 의한 공식적인 규정을 갖고 있는데 자원사용,구성원에 대한 처벌,정보 등에 대한 통제권 등을 포함 개인권력(전문적,준거적 권력) : 개인권력은 특정인의 능력에 따른 권력이므로 조직 구성원에게 미치는 영향에 있어서는 지위권력 이상의 효과성을 가진다.","review":"자료 대조","status":"solved","explanation":"준거적 권력과 전문적 권력은 개인의 매력·역량에서 생긴다. 보상·강압·합법적 권력은 지위에 기반한다.","refs":["power"],"topic":"권력·조직","originalText":"프렌치와 레이븐의 권력원천의 분류에 따라서 개인적 원천의 권력에 해당하는 것을 모두 고르시오. A : 강압적 권력 B: 준거적 권력 C : 전문적 권력 D : 합법적 권력, E : 보상적 권력","ready":true,"originalAnswer":"족보 해설에서 확인"},{"id":"K-MOOC-11","source":"K-MOOC","no":11,"text":"다음중 리더십 보다 관리가 우선하는 일들로 알맞게 짝지어진 것은? A : 금전적 문제 B: 성문제 C : 갑질 D : 정보보안 E : 안전사고","options":[{"id":"1","text":"A, B"},{"id":"2","text":"A, B, E"},{"id":"3","text":"A, B, D, E"},{"id":"4","text":"A, B, C, D, E"}],"answer":"4","type":"mc","originalKey":"족보 해설에서 확인","note":"리더십 보다 관리가 우선해야 하는 일들은 바로 공든탑을 무너뜨릴 수 있는 조직윤리와 안전관리이며, 이것은 바로 금전, 성, 갑질, 정보보안, 안전사고이며, 이 분야에 있어서는 리더십 보다 관리가 우선해야 하고 리더는 항상 깨어 있어야 한다.","review":"강의 확인 필요","status":"pending","explanation":"족보 해설은 금전·성·갑질·정보보안·안전 모두를 제시한다. 이 다섯 항목을 관리 우선 영역으로 묶은 것은 강의의 분류여서 독립 검증은 보류한다.","refs":[],"topic":"리더십의 기초","originalText":"다음중 리더십 보다 관리가 우선하는 일들로 알맞게 짝지어진 것은? A : 금전적 문제 B: 성문제 C : 갑질 D : 정보보안 E : 안전사고","ready":false,"originalAnswer":"족보 해설에서 확인"},{"id":"K-MOOC-12","source":"K-MOOC","no":12,"text":"다음 사례에서 A의 행동을 설명하는 동기부여 이론은? -사례- 팀원 A는 작년도 목표대비 업무실적을 100%달성하였다. 이에 반해 같은 팀 동료 B는 동일 목표대비 업무실적이 10% 부족하였지만, A와 동일한 인센티브를 받았다. 이 사실을 알게된 A는 팀장에게 추가 인센티브를 요구하였고, 받아들여지지 않자 결국 이직하였다.","options":[{"id":"1","text":"기대이론"},{"id":"2","text":"공정성이론"},{"id":"3","text":"욕구단계이론"},{"id":"4","text":"목표설정이론"}],"answer":"2","type":"mc","originalKey":"정답 표시 형식 확인 전","note":"","review":"자료 대조","status":"solved","explanation":"자신과 동료의 기여 대비 보상을 비교한 뒤 불공정을 줄이려 행동하므로 공정성이론이다.","refs":["process"],"topic":"동기부여","originalText":"다음 사례에서 A의 행동을 설명하는 동기부여 이론은? -사례- 팀원 A는 작년도 목표대비 업무실적을 100%달성하였다. 이에 반해 같은 팀 동료 B는 동일 목표대비 업무실적이 10% 부족하였지만, A와 동일한 인센티브를 받았다. 이 사실을 알게된 A는 팀장에게 추가 인센티브를 요구하였고, 받아들여지지 않자 결국 이직하였다.","ready":true,"originalAnswer":"정답 표시 형식 확인 전"},{"id":"K-MOOC-13","source":"K-MOOC","no":13,"text":"변혁적 리더십의 특징에 해당하지 않는 것을 모두 고른 것은? A : 부하들에게 장기적인 목표를 위해 노력하도록 동기를 부여한다. B : 부하들을 위해 문제를 해결하거나 해답을 찾을 수 있는 곳을 알려준다. C : 부하들에게 즉각적이고 가시적인 보상으로 동기 부여한다. D : 부하들에게 자아실현과 같은 높은 수준의 개인적인 목표를 동경하도록 동기를 부여한다. E : 질문을 하여 부하들에게 스스로 해결책을 찾거나 격려하도록 함께 일을 한다.","options":[{"id":"1","text":"A, B"},{"id":"2","text":"B, C"},{"id":"3","text":"C, D"},{"id":"4","text":"D, E"}],"answer":"2","type":"mc","originalKey":"정답 표시 형식 확인 전","note":"","review":"자료 대조","status":"solved","explanation":"C의 즉각적 보상은 거래적 리더십에 해당한다. B는 리더가 답을 제공하는 방식이며, E의 자율적 해결 촉진과 대비된다. 출제 의도상 B와 C를 고른다.","refs":["transform"],"topic":"현대적 리더십","originalText":"변혁적 리더십의 특징에 해당하지 않는 것을 모두 고른 것은? A : 부하들에게 장기적인 목표를 위해 노력하도록 동기를 부여한다. B : 부하들을 위해 문제를 해결하거나 해답을 찾을 수 있는 곳을 알려준다. C : 부하들에게 즉각적이고 가시적인 보상으로 동기 부여한다. D : 부하들에게 자아실현과 같은 높은 수준의 개인적인 목표를 동경하도록 동기를 부여한다. E : 질문을 하여 부하들에게 스스로 해결책을 찾거나 격려하도록 함께 일을 한다.","ready":true,"originalAnswer":"정답 표시 형식 확인 전"},{"id":"K-MOOC-14","source":"K-MOOC","no":14,"text":"다음 메디치 가문의 내용 중 옳지 않은 것은?","options":[{"id":"1","text":"비르투스는 덕행, 선, 가치, 순결을 의미하고 이것은 완벽함을 의미한다."},{"id":"2","text":"일반적으로 리더는 포르투나가 따르기 마련이지만 진정한 리더는 비르투스를 추구해야 한다."},{"id":"3","text":"마르첼로 아드리아니(피렌체 임시시장)는 그의 연설에서 리더의 사명은 비르투스의 실천을 강조했다."},{"id":"4","text":"비르투스는 메디치 가문의 정신이다."}],"answer":"1","type":"mc","originalKey":"족보 해설에서 확인","note":"족보 해설: 비르투스는 탁월함을 의미.","review":"강의 확인 필요","status":"pending","explanation":"족보의 답 또는 해설은 보존했지만, 강의 고유 해석까지 독립적으로 확정할 근거는 확보하지 못했다.","refs":[],"topic":"메디치·인문학","originalText":"다음 메디치 가문의 내용 중 옳지 않은 것은?","ready":false,"originalAnswer":"족보 해설에서 확인"},{"id":"K-MOOC-15","source":"K-MOOC","no":15,"text":"조직현장에서 권한 위임이 원활하지 않은 이유가 아닌 것은?","options":[{"id":"1","text":"인간의 권력욕구와 관련이 되어 있다."},{"id":"2","text":"결과에 대한 책임의 문제가 위임을 주저하게 만든다."},{"id":"3","text":"상급자의 능력에 대한 신뢰의 부족"},{"id":"4","text":"조직정치와 관련하여 인간적인 신뢰가 부족"}],"answer":"3","type":"mc","originalKey":"정답 표시 형식 확인 전","note":"","review":"직접 풀이","status":"solved","explanation":"위임하는 상급자가 하급자의 역량을 신뢰하지 못하는 것이 장애가 된다. 상급자의 능력에 대한 신뢰 부족으로 방향을 바꾼 선지가 출제 의도상 답이다.","refs":[],"topic":"권력·조직","originalText":"조직현장에서 권한 위임이 원활하지 않은 이유가 아닌 것은?","ready":true,"originalAnswer":"정답 표시 형식 확인 전"},{"id":"K-MOOC-16","source":"K-MOOC","no":16,"text":"다음 중 리더에게 해당하지 않는 것을 고르시오","options":[{"id":"1","text":"일을 올바르게 하는 것"},{"id":"2","text":"장기적 관점"},{"id":"3","text":"방향성과 비전을 설정함"},{"id":"4","text":"구성원의 공통의 사명과 목적을 분명히 할 것을 기대함"}],"answer":"1","type":"mc","originalKey":"정답 표시 형식 확인 전","note":"","review":"자료 대조","status":"solved","explanation":"리더는 방향·비전과 장기적 효과성을 강조하고, 관리는 수행의 효율성을 강조한다. 두 역할은 서로 보완한다.","refs":["nature"],"topic":"리더십의 기초","originalText":"다음 중 리더에게 해당하지 않는 것을 고르시오","ready":true,"originalAnswer":"정답 표시 형식 확인 전"},{"id":"K-MOOC-17","source":"K-MOOC","no":17,"text":"리더십 연구의 발전과정을 순서대로 설명한 것으로 가장 옳은 것은?","options":[{"id":"1","text":"특성이론 - 상황이론 - 행동이론"},{"id":"2","text":"행동이론 - 특성이론 - 상황이론"},{"id":"3","text":"특성이론 - 행동이론 - 상황이론"},{"id":"4","text":"특성이론 - 상황이론 - 유효성 이론"}],"answer":"3","type":"mc","originalKey":"정답 표시 형식 확인 전","note":"","review":"직접 풀이","status":"solved","explanation":"전통적인 분류에서는 특성이론 다음 행동이론, 이후 상황이론의 순서로 발전을 설명한다.","refs":[],"topic":"리더십의 기초","originalText":"리더십 연구의 발전과정을 순서대로 설명한 것으로 가장 옳은 것은?","ready":true,"originalAnswer":"정답 표시 형식 확인 전"},{"id":"K-MOOC-18","source":"K-MOOC","no":18,"text":"다음 중 리더의 역할이 가장 아닌 것은 무엇인가?","options":[{"id":"1","text":"리더는 부하에게 비전을 제시할 수 있어야 한다."},{"id":"2","text":"리더는 부하에게 합리적이고 합법적인 권력을 행사하여 영향력을 미칠 수 있어야 한다."},{"id":"3","text":"리더는 조직의 목표를 명확히 인식하여 부하들로 하여금, 과업과 관련된 행동을 수행할 수 있도록 동기부여를 시켜야 한다."},{"id":"4","text":"리더는 부하들의 장기적 측면에서의 비전보다는 단기목표 달성을 위한 동기부여에 노력해야 한다."}],"answer":"4","type":"mc","originalKey":"정답 표시 형식 확인 전","note":"","review":"자료 대조","status":"solved","explanation":"리더는 방향·비전과 장기적 효과성을 강조하고, 관리는 수행의 효율성을 강조한다. 두 역할은 서로 보완한다.","refs":["nature"],"topic":"리더십의 기초","originalText":"다음 중 리더의 역할이 가장 아닌 것은 무엇인가?","ready":true,"originalAnswer":"정답 표시 형식 확인 전"},{"id":"2021-1 캡처-1","source":"2021-1 캡처","no":1,"text":"브레이크와 모우튼의 관리격자모델의 리더 유형에 관한 설명으로 옳지 않은 것은?","options":[{"id":"1","text":"(1.9)형은 생산에 관심을 보이는 인기형 리더이다."},{"id":"2","text":"(9.9)형은 인간과 과업에 대한 관심이 모두 높은 팀형 리더이다."},{"id":"3","text":"(9.1)형은 과업상의 능력을 우선적으로 생각하는 과업형 리더이다."},{"id":"4","text":"(1.1)형은 조직구성원으로서 자리를 유지하는 데 필요한 최소한의 노력만을 투입하는 무관심형 리더이다."}],"answer":"1","type":"mc","originalKey":"족보 명시 정답 1번","note":"원본 화면의 메뉴 및 중복 인식 문장을 제거했습니다.","review":"자료 대조","status":"solved","explanation":"(1,9)는 인간에 대한 관심이 높고 생산에 대한 관심이 낮은 인기형이다. 두 축을 바꾸어 설명한 선지가 틀렸다.","refs":["grid"],"topic":"행동·상황이론","originalText":"브레이크와 모우튼의 관리격자모델의 리더 유형에 관한 설명으로 옳지 않은 것은?","ready":true,"originalAnswer":"족보 명시 정답 1번"},{"id":"2021-1 캡처-2","source":"2021-1 캡처","no":2,"text":"정답 다음 중 갈등의 의미와 기능에 관한 설명으로 옳지 않은 것은?","options":[{"id":"1","text":"갈등은 현실적으로는 부분적으로 예방하거나 관리할 수 있어도 제거할 수 는 없다."},{"id":"2","text":"갈등을 관리 가능한 것으로 파악한다."},{"id":"3","text":"갈등이 조직과정에서 부정적인 역할임 강조하였다."},{"id":"4","text":"갈등의 해결은 조직의 생산성을 증진시키고 조직의 문제를 해결하는 원동 력이다."}],"answer":"3","type":"mc","originalKey":"족보 명시 정답 3번","note":"갈등의 역할을 살펴보면 관리가능하고, 조직과정에서 긍정적인 역할을 하며, 그 해결은 조직의 생산성을 증대시키고 조직의 문제를 해결하는 원동력이다.","review":"자료 대조","status":"solved","explanation":"현대적 관점에서는 갈등이 문제 발견과 개선에 도움이 될 수도 있다. 항상 부정적인 역할만 한다는 설명이 틀렸다. 모든 갈등이 유익하다는 의미도 아니다.","refs":["conflict"],"topic":"권력·조직","originalText":"정답 다음 중 갈등의 의미와 기능에 관한 설명으로 옳지 않은 것은?","ready":true,"originalAnswer":"족보 명시 정답 3번"},{"id":"2021-1 캡처-3","source":"2021-1 캡처","no":3,"text":"다음 중 리더십에 해당하지 않는 것을 고르시오","options":[{"id":"1","text":"효과성의 추구"},{"id":"2","text":"변화와 발전 추구"},{"id":"3","text":"효율성의 추구"},{"id":"4","text":"장기적, 미래지향적"}],"answer":"3","type":"mc","originalKey":"족보 명시 정답 3번","note":"리더십은 효과성을 추구하고, 관리는 계획과 예산, 조직과 집행과 같은 효율성을 추구한다.","review":"자료 대조","status":"solved","explanation":"리더는 방향·비전과 장기적 효과성을 강조하고, 관리는 수행의 효율성을 강조한다. 두 역할은 서로 보완한다.","refs":["nature"],"topic":"리더십의 기초","originalText":"다음 중 리더십에 해당하지 않는 것을 고르시오","ready":true,"originalAnswer":"족보 명시 정답 3번"},{"id":"2021-1 캡처-4","source":"2021-1 캡처","no":4,"text":"허쉬와 블랜차드의 상황적 리더십 이론에서 설명한 4가지 리더십 스타일이 아닌 것은?","options":[{"id":"1","text":"관료형"},{"id":"2","text":"지시형"},{"id":"3","text":"위임형"},{"id":"4","text":"지시형"}],"answer":"1","type":"mc","originalKey":"족보 명시 정답 1번","note":"허쉬와 블랜차드는 과업행동과 관계행동을 기준으로 리더의 유형을 지시형, 설득 형 위임형, 참여형으로 구분하였다.","review":"자료 대조","status":"solved","explanation":"지시·설득(코칭)·참여(지원)·위임의 네 유형이다. 관료형은 이 분류에 속하지 않는다.","refs":["slii"],"topic":"행동·상황이론","originalText":"허쉬와 블랜차드의 상황적 리더십 이론에서 설명한 4가지 리더십 스타일이 아닌 것은?","ready":true,"originalAnswer":"족보 명시 정답 1번"},{"id":"2021-1 캡처-5","source":"2021-1 캡처","no":5,"text":"허쯔버그의 2요인이론에서 동기요인을 모두 고른 것은? A : 상사와의 관계 B : 성취 C : 회사의 정책 및 관리방침 D : 작업조건 E : 인정","options":[{"id":"1","text":"B, E"},{"id":"2","text":"B, C"},{"id":"3","text":"A, B"},{"id":"4","text":"A, E"}],"answer":"1","type":"mc","originalKey":"족보 명시 정답 1번","note":"성취와 인정이 동기요인에 해당하고 상사와의 관계, 회사정책 및 관리방침, 작업 조건은 위생요인에 해당된다.","review":"자료 대조","status":"solved","explanation":"성취·인정은 동기요인이다. 위생요인은 주로 불만족을 줄이며, 만족 증가와 불만족 감소를 같은 것으로 보지 않는다.","refs":["needs"],"topic":"동기부여","originalText":"허쯔버그의 2요인이론에서 동기요인을 모두 고른 것은? A : 상사와의 관계 B : 성취 C : 회사의 정책 및 관리방침 D : 작업조건 E : 인정","ready":true,"originalAnswer":"족보 명시 정답 1번"},{"id":"2021-1 캡처-6","source":"2021-1 캡처","no":6,"text":"서번트 리더십의 특성으로 옳지 않은 것은?","options":[{"id":"1","text":"부하의 성장을 위해 헌신한다."},{"id":"2","text":"비전 달성을 위해 위험감수 등 비범한 행동을 보인다."},{"id":"3","text":"부하의 감정에 공감하고, 이해하려고 노력한다."},{"id":"4","text":"조직의 구성원들에게 공동체 정신을 심어준다."}],"answer":"2","type":"mc","originalKey":"족보 명시 정답 2번","note":"서번트 리더십이란 타인을 위한 봉사에 초점을 두고, 부하와 고객을 우선으로 그 들의 욕구를 만족시키기 위해 헌신하는 리더십을 말한다. 즉 인간존중을 바탕으 러 부하들의 잠재력을 발휘할 수 있도록 앞에서 이끌어주는 리더십이라 할 수 있 으며 그린리프가 정립한 리더십이다. ③은 카리스마 리더십에 해당하는 내용이 다.","review":"자료 대조","status":"solved","explanation":"공감·구성원 성장·공동체 형성은 서번트 리더십의 특징이다. 비전을 위한 비범한 위험감수는 카리스마 리더십의 대표적 설명이다.","refs":["servant"],"topic":"현대적 리더십","originalText":"서번트 리더십의 특성으로 옳지 않은 것은?","ready":true,"originalAnswer":"족보 명시 정답 2번"},{"id":"2021-1 캡처-7","source":"2021-1 캡처","no":7,"text":"다음 중 그 설명이 옳지 않은 것은?","options":[{"id":"1","text":"리더십 없는 관리는 도전과 혁신을 방해하고, 관리 없는 리더십은 조직의 질서와 효율성을 와해한다."},{"id":"2","text":"조직문화는 특정 조직의 특정 계층이 공유하고 있는 신념, 가치관, 규칙 규 범 상징, 전통등을 의미한다."},{"id":"3","text":"문화는 특정사회의 구성원들이 공유하고 있는 후천적으로 학습된 신념, 가치관, 규칙 규범 상징, 전통등을 의미한다."},{"id":"4","text":"리더와 관리자는 역할상의 차이에도 불구하고 상호 배타적 관계가 아닌 상호 보완적 관계이다."}],"answer":"2","type":"mc","originalKey":"족보 명시 정답 2번","note":"조직문화는 특정조직의 특정 계층이 아니라, 특정 조직이 공유하는 것이다.","review":"직접 풀이","status":"solved","explanation":"조직문화는 조직 구성원이 공유하는 의미와 가치 체계다. 특정 계층만의 공유로 한정한 정의가 틀렸다. 하위문화가 존재할 수는 있다.","refs":[],"topic":"권력·조직","originalText":"다음 중 그 설명이 옳지 않은 것은?","ready":true,"originalAnswer":"족보 명시 정답 2번"},{"id":"2021-1 캡처-8","source":"2021-1 캡처","no":8,"text":"다음 브룸의 기대이론에서 동기부여의 강도를 측정하기 위해 활용된 변수끼리 짝 지어진 것 중 가장 옳은 것은? A : 기대감 B : 수단성 C : 유인가D : 공정성","options":[{"id":"1","text":"B, C ,D"},{"id":"2","text":"A, B, C"},{"id":"3","text":"A, C, D"},{"id":"4","text":"A, B, D"}],"answer":"2","type":"mc","originalKey":"족보 명시 정답 2번","note":"브롬은 기대이론에서 동기부여의 강도를 기대성, 수단성, 유의성의 곱으로 측정 하였다.","review":"자료 대조","status":"solved","explanation":"기대이론은 기대감·수단성·유의성(유인가)으로 동기부여를 설명한다. 공정성은 해당 변수에 포함되지 않는다.","refs":["process"],"topic":"동기부여","originalText":"다음 브룸의 기대이론에서 동기부여의 강도를 측정하기 위해 활용된 변수끼리 짝 지어진 것 중 가장 옳은 것은? A : 기대감 B : 수단성 C : 유인가D : 공정성","ready":true,"originalAnswer":"족보 명시 정답 2번"},{"id":"2021-1 캡처-9","source":"2021-1 캡처","no":9,"text":"Big 5모형에 대한 다음 설명 중 가장 옳지 않은 것은?","options":[{"id":"1","text":"개방성 : 호기심이 많고, 새로운 것에 대해 많은 관심을 보이지만 변화에 두려워하는 경향을 보인다."},{"id":"2","text":"성실성 : 소수의 한정된 목표에 초점과 관심을 집중시키는 정도를 나타낸 다."},{"id":"3","text":"외향성 : 사교적이고 명향하며 말이 많고 자신감이 넘친다."},{"id":"4","text":"친화성 : 남에게 양보하는 정도를 나타내는 것이다."}],"answer":"1","type":"mc","originalKey":"족보 명시 정답 1번","note":"","review":"직접 풀이","status":"solved","explanation":"개방성은 새로운 경험·생각을 받아들이는 경향이다. 변화에 두려움을 보인다는 부분은 높은 개방성과 맞지 않는다.","refs":[],"topic":"성격·조직","originalText":"Big 5모형에 대한 다음 설명 중 가장 옳지 않은 것은?","ready":true,"originalAnswer":"족보 명시 정답 1번"},{"id":"2021-1 캡처-10","source":"2021-1 캡처","no":10,"text":"아담스의 공정성 이론에 대한 설명 중 가장 옳지 않은 것은?","options":[{"id":"1","text":"보상의 크기와 공정성을 극대화 시키는데 초점을 둔다"},{"id":"2","text":"불공정을 결정하는 요인으로는 투입, 산출, 투입과 산출, 준거인물 등이 있다."},{"id":"3","text":"패스팅거의 인지부조화 이론에 영향을 미쳤다."},{"id":"4","text":"자신의 공헌과 보상의 크기를 준거인물의 공헌과 보상의 크기와 비교하여 동기 부여의 수준을 결정한다."}],"answer":"3","type":"mc","originalKey":"족보 명시 정답 3번","note":"아담스의 공정성이론은 패스팅거의 인지부조화 이론에 영향을 받았다.","review":"자료 대조","status":"solved","explanation":"공정성이론은 인지부조화 관점의 영향을 받았다. 영향의 방향을 거꾸로 쓴 선지가 틀렸다. 보상 절대액보다 상대적 투입·산출 비율이 핵심이다.","refs":["process"],"topic":"동기부여","originalText":"아담스의 공정성 이론에 대한 설명 중 가장 옳지 않은 것은?","ready":true,"originalAnswer":"족보 명시 정답 3번"},{"id":"2021-1 캡처-11","source":"2021-1 캡처","no":11,"text":"다음은 오하이오 주립대 모형의 리더십 유형구분은?","options":[{"id":"1","text":"직무중심적 리더 - 종업원 중심적 리더"},{"id":"2","text":"과업주도형 리더 - 배려행동형 리더"},{"id":"3","text":"독재적 리더 - 민주적 리더"},{"id":"4","text":"이상형 리더- 과업지향형 리더"}],"answer":"2","type":"mc","originalKey":"족보 명시 정답 2번","note":"오하이오 주립대학 모형의 리더십 유형구분은 과업주도행동유형과 배려행동유형 으로 구분한다.","review":"자료 대조","status":"solved","explanation":"오하이오 연구는 과업주도(구조주도)와 배려라는 두 행동 차원을 구분한다.","refs":["grid"],"topic":"행동·상황이론","originalText":"다음은 오하이오 주립대 모형의 리더십 유형구분은?","ready":true,"originalAnswer":"족보 명시 정답 2번"},{"id":"2021-1 캡처-12","source":"2021-1 캡처","no":12,"text":"리더십 연구에서 나타나는 공통점이 아닌 것은?","options":[{"id":"1","text":"리더십은 결과이다."},{"id":"2","text":"리더십은 목표달성을 위한 과정이다."},{"id":"3","text":"리더십은 영향력과의 관계에서 나온다."},{"id":"4","text":"리더십은 집단상황에서 발생한다."}],"answer":"1","type":"mc","originalKey":"족보 명시 정답 1번","note":"리더십은 어떤 일을 하는 과정에서 조직의 구성원들에게 영향력을 미치는 것이 다. 따라서 리더십은 결과라기보다는 과정이다.","review":"자료 대조","status":"solved","explanation":"리더십은 집단의 공동 목표를 향한 사회적 영향 과정이다. 단순히 결과라고 규정한 설명이 틀렸다.","refs":["nature"],"topic":"리더십의 기초","originalText":"리더십 연구에서 나타나는 공통점이 아닌 것은?","ready":true,"originalAnswer":"족보 명시 정답 1번"},{"id":"2021-1 캡처-13","source":"2021-1 캡처","no":13,"text":"다음은 무엇에 대한 설명인가? 상이한 것에 희망을 두고, 이질적인 것과 결합함으로써 새로운 세계를 창조","options":[{"id":"1","text":"코시모 효과"},{"id":"2","text":"플라톤 철학"},{"id":"3","text":"메디치 효과"},{"id":"4","text":"비르투스"}],"answer":"3","type":"mc","originalKey":"족보 명시 정답 3번","note":"상이한 것에 희망을 두고, 이질적인 것과 결합함으로써 새로운 세계를 창조 : 메 디치 효과","review":"직접 풀이","status":"solved","explanation":"서로 다른 분야·관점이 만나는 지점에서 혁신이 생긴다는 메디치 효과를 가리킨다.","refs":[],"topic":"메디치·인문학","originalText":"다음은 무엇에 대한 설명인가? 상이한 것에 희망을 두고, 이질적인 것과 결합함으로써 새로운 세계를 창조","ready":true,"originalAnswer":"족보 명시 정답 3번"},{"id":"2021-1 캡처-14","source":"2021-1 캡처","no":14,"text":"리더십 이론에 관한 설명으로 옳지 않은 것은?","options":[{"id":"1","text":"하우스의 경로-목표이론에 의하면 상황이 리더에게 아주 유리하거나 불리 할 때는 과업지향적인 리더십이 효과적이다."},{"id":"2","text":"허쉬와 블랜차드는 부하들의 성숙도에 따른 효과적인 리더십 행동을 분석 하였다."},{"id":"3","text":"피들러는 상황변수로 리더와 부하와의 관계, 과업구조화, 리더의 지휘권 력 정도를 고려하였다."},{"id":"4","text":"리더십 이론은 특성론적 접근, 상황론적 접근, 행위론적 접근으로 구분할 수 있다."}],"answer":"1","type":"mc","originalKey":"족보 명시 정답 1번","note":"상황이 리더에게 아주 유리하거나 불리할 때 과업지향적 리더십이, 효과적이라고 주장하는 이론은 피들러의 이론이다.","review":"자료 대조","status":"solved","explanation":"상황이 매우 유리하거나 불리할 때 과업지향이 효과적이라는 설명은 피들러의 상황적합이론이다. 하우스 이론으로 제시한 선지가 틀렸다.","refs":["situation"],"topic":"행동·상황이론","originalText":"리더십 이론에 관한 설명으로 옳지 않은 것은?","ready":true,"originalAnswer":"족보 명시 정답 1번"},{"id":"2021-1 캡처-15","source":"2021-1 캡처","no":15,"text":"하우스의 경로-목표이론에서 정의한 리더십 행동유형이 아닌 것은?","options":[{"id":"1","text":"성취지향적 리더"},{"id":"2","text":"참여적 리더"},{"id":"3","text":"지원적 리더"},{"id":"4","text":"혁신적 리더"}],"answer":"4","type":"mc","originalKey":"족보 명시 정답 4번","note":"하우스는 오하이오 대학의 리더십 연구를 활용하여 리더십 유형을 지시적, 지원 적, 참여적, 성취지향적 리더로 구분하였다.","review":"자료 대조","status":"solved","explanation":"경로목표이론의 유형은 지시적·지원적·참여적·성취지향적이다. 혁신적 리더는 해당하지 않는다.","refs":["situation"],"topic":"행동·상황이론","originalText":"하우스의 경로-목표이론에서 정의한 리더십 행동유형이 아닌 것은?","ready":true,"originalAnswer":"족보 명시 정답 4번"},{"id":"2021-1 캡처-16","source":"2021-1 캡처","no":16,"text":"리더십 특성이론의 한계점이 아닌 것은?","options":[{"id":"1","text":"리더십 특성들을 확인하였을 뿐 그러한 특성과 조직성과, 또는 조직효과 성 간의 상관관계를 규명하려는 노력을 기울이지 않았다."},{"id":"2","text":"오랜 기간에 걸쳐 깊이 있는 연구가 진행되었음에도 불구하고 리더십 훈 련이나 개발을 위해 유용하게 적용되기 어렵다."},{"id":"3","text":"오랜시간 걸친 연구에도 불구하고 모든 연구결과에서 공통적으로 제시되 는 특성요인이 없다,"},{"id":"4","text":"행동이론과 상황이론에 비해 이론의 구성이 복잡하다."}],"answer":"4","type":"mc","originalKey":"족보 명시 정답 4번","note":"리더십 특성이론은 다른 이론들에 비해 비교적 이론의 구성이 단순하다.","review":"직접 풀이","status":"solved","explanation":"특성이론은 리더의 자질에 초점을 맞추어 구성이 비교적 단순하다. 복잡한 구성이 한계라고 한 선지는 해당하지 않는다. 공통 특성이 전혀 없다는 표현 역시 오늘날에는 과도한 단정이므로 고전적 이론의 한계라는 출제 맥락으로 읽어야 한다.","refs":[],"topic":"리더십의 기초","originalText":"리더십 특성이론의 한계점이 아닌 것은?","ready":true,"originalAnswer":"족보 명시 정답 4번"},{"id":"2021-1 캡처-17","source":"2021-1 캡처","no":17,"text":"리더십에 관한 설명으로 옳지 않은 것은?","options":[{"id":"1","text":"수퍼 리더십은 리더가 종업원을 관리하고 통제할 수 있는 힘과 기술을 가지 도록 하는데 초점을 둔다."},{"id":"2","text":"서번트 리더십은 목표달성이라는 결과보다 구성원에 대한 서비스에 초점을 둔다."},{"id":"3","text":"카리스마 리더십은 비전달성을 위해 위험감수 등 비범한 행동을 보인다."},{"id":"4","text":"거래적 리더십은 리더와 구성원 사이의 교환이나 거래관계를 통해 발휘된다."}],"answer":"1","type":"mc","originalKey":"족보 명시 정답 1번","note":"수퍼 리더십이란 지시와 통제에 의해서가 아니라 부하가 자발적으로 리더십을 발 휘하도록 여견을 조정하는 리더십을 의미한다. 즉 부하를 셀프리더로 만들어 주 는 리더십으로 부하의 주체적인 존재를 인정하고 그 역량 발휘를 지원하는 리더 십이다.","review":"직접 풀이","status":"solved","explanation":"수퍼 리더십은 구성원이 스스로 자신을 이끄는 셀프리더가 되도록 돕는다. 리더가 구성원을 통제하는 힘을 키우는 데 초점을 둔다는 설명은 반대다.","refs":[],"topic":"현대적 리더십","originalText":"리더십에 관한 설명으로 옳지 않은 것은?","ready":true,"originalAnswer":"족보 명시 정답 1번"},{"id":"2021-1 캡처-18","source":"2021-1 캡처","no":18,"text":"다음은 ‘마키아벨리’가 어떤 사람을 평가한 인물평이다. 이 사람은 누구인가? 그는 대단히 사려 깊은 사람이었다. 외모는 중후하고, 예의 바르고 덕망이 넘쳤 다. 초년은 고통과 유배와 신변 위협 속에서 살았으나 지칠 줄 모르는 관대한 성 향으로 모든 정적을 누르고 백성에게 큰 인기를 얻었다. 큰 부자이면서도 살아가 는 모습은 검소하고 소탈했다. 당대에 그만큼 국정에 통달한 사람도 없었다. 그렇 기 때문에 변화무쌍한 도시에서 그는 30년간 실질적으로 피렌체를 지배했다.","options":[{"id":"1","text":"로렌초 데 메디치"},{"id":"2","text":"카테리나"},{"id":"3","text":"코시모 데 메디치"},{"id":"4","text":"피에로 데 메디치"}],"answer":"3","type":"mc","originalKey":"족보 명시 정답 3번","note":"윗 글에서 유배, 관대한 성향, 검소하고 소탈한 모습, 국정에 통달한 사람을 의미 하는 사람은 바로 코시모 데 메디치이다.","review":"자료 대조","status":"solved","explanation":"피렌체에서 장기간 실권을 행사하고 유배 후 복귀한 인물은 코시모 데 메디치다.","refs":["history"],"topic":"메디치·인문학","originalText":"다음은 ‘마키아벨리’가 어떤 사람을 평가한 인물평이다. 이 사람은 누구인가? 그는 대단히 사려 깊은 사람이었다. 외모는 중후하고, 예의 바르고 덕망이 넘쳤 다. 초년은 고통과 유배와 신변 위협 속에서 살았으나 지칠 줄 모르는 관대한 성 향으로 모든 정적을 누르고 백성에게 큰 인기를 얻었다. 큰 부자이면서도 살아가 는 모습은 검소하고 소탈했다. 당대에 그만큼 국정에 통달한 사람도 없었다. 그렇 기 때문에 변화무쌍한 도시에서 그는 30년간 실질적으로 피렌체를 지배했다.","ready":true,"originalAnswer":"족보 명시 정답 3번"},{"id":"2021-1 캡처-20","source":"2021-1 캡처","no":20,"text":"매슬로우의 욕구단계설과 알더퍼의 ERG이론에 관한 설명으로 옳지 않은 것은?","options":[{"id":"1","text":"욕구단계이론에서는 한 시점에 낮은 단계와 높은 단계의 욕구가 동시에 발생한다."},{"id":"2","text":"욕구단계이론과 ERG이론은 하위욕구가 충족되면 상위욕구를 추구한다보 보는 공통점이 있다."},{"id":"3","text":"욕구단계이론에서 자아실현의 욕구는 ERG이론에서 성장욕구에 해당한 다."},{"id":"4","text":"ERG이론에서는 욕구의 좌절-퇴행 과정도 이루어진다."}],"answer":"1","type":"mc","originalKey":"족보 명시 정답 1번","note":"매슬로우의 욕구단계이론은 각 욕구의 동시발생가능성을 무시하였고, 알더퍼의 ERG이론은 한 가지 이상의 욕구를 동시에 충족시킬 수 있다고 주장하였다.","review":"자료 대조","status":"solved","explanation":"교과서적 비교에서 매슬로우는 욕구의 위계적 충족을 강조하고, ERG는 여러 욕구와 좌절·퇴행을 인정한다. 현실의 인간에게 욕구가 절대 동시에 생기지 않는다는 뜻은 아니다.","refs":["needs"],"topic":"동기부여","originalText":"매슬로우의 욕구단계설과 알더퍼의 ERG이론에 관한 설명으로 옳지 않은 것은?","ready":true,"originalAnswer":"족보 명시 정답 1번"},{"id":"2021-1 캡처-21","source":"2021-1 캡처","no":21,"text":"변혁적 리더가 갖추어야 할 자질이 아닌 것은?","options":[{"id":"1","text":"설득력과 지도력"},{"id":"2","text":"조건적 보상"},{"id":"3","text":"신뢰 확보"},{"id":"4","text":"비전제시 능력"}],"answer":"2","type":"mc","originalKey":"족보 명시 정답 2번","note":"거래적 리더십은 조건적 보상과 예외에 의한 관리가 대표적인 구성요소가 되고 변혁적 리더십은 카리스마, 개별적 배려, 지적자극, 영감적 동기부여등이 대표적 인 구성요소가 된다.","review":"자료 대조","status":"solved","explanation":"조건적·성과연계 보상은 거래적 리더십의 요소다. 변혁적 리더십은 이상적 영향력·영감·지적 자극·개별적 배려를 강조한다.","refs":["transform"],"topic":"현대적 리더십","originalText":"변혁적 리더가 갖추어야 할 자질이 아닌 것은?","ready":true,"originalAnswer":"족보 명시 정답 2번"},{"id":"memory22-1","source":"2022-1 기억 복원","no":1,"text":"리더는 단기적인 관점에서 올바른 일을 하는 것을 중시한다.","type":"ox","options":[{"id":"O","tex  기초","originalText":"리더십 연구에서 나타나는 공통점이 아닌 것은?","ready":true,"originalAnswer":"족보 이미지 명시 정답 2번"},{"id":"2021-2-2","source":"2021-2","no":2,"text":"다음 중 리더의 역할이 가장 아닌 것은 무엇인가?","options":[{"id":"1","text":"리더는 부하들의 장기적 측면에서의 비전보다는 단기목표 달성을 위한 동기부여에 노력해야 한다."},{"id":"2","text":"리더는 부하에게 합리적이고 합법적인 권력을 행사하여 영향력을 미칠 수 있어야 한다."},{"id":"3","text":"리더는 조직의 목표를 명확히 인식하여 부하들로 하여금, 과업과 관련된 행동을 수행할 수 있도록 동기부여를 시켜야 한다."},{"id":"4","text":"리더는 부하에게 비전을 제시할 수 있어야 한다."}],"answer":"1","type":"mc","originalKey":"족보 이미지 명시 정답 1번","note":"사용자가 첨부한 2021-2 화면에서 문제·선지·정답 표시를 직접 판독했습니다.","review":"이미지 판독 · 자료 대조","status":"solved","explanation":"리더는 방향·비전과 장기적 효과성을 강조하고, 관리는 수행의 효율성을 강조한다. 두 역할은 서로 보완한다.","refs":["nature"],"topic":"리더십의 기초","originalText":"다음 중 리더의 역할이 가장 아닌 것은 무엇인가?","ready":true,"originalAnswer":"족보 이미지 명시 정답 1번"},{"id":"2021-2-3","source":"2021-2","no":3,"text":"다음 중 리더십 특성이론에 관한 내용과 다른 것은?","options":[{"id":"1","text":"리더십 특성이론은 오직 리더에게 초점을 맞추고 있기 때문에 유능한 리더의 성격특성에 관한 보다 깊이 있는 이해가 불가능하다."},{"id":"2","text":"리더십 특성이론은 복잡한 리더십 과정을 설명함에 있어서 리더의 특성과 자질에만 연구의 초점을 둔 것이다."},{"id":"3","text":"선천적으로 타고난 리더십 자질과 특성 때문일 것이라는 일반의 믿음에 부응하기 때문에 직관적으로 상당한 흥미를 불러일으킨다."},{"id":"4","text":"리더십 특성이론은 다른 이론들에 비해 비교적 이론의 구성이 단순하다."}],"answer":"1","type":"mc","originalKey":"족보 이미지 명시 정답 1번","note":"사용자가 첨부한 2021-2 화면에서 문제·선지·정답 표시를 직접 판독했습니다.","review":"이미지 판독 · 직접 풀이","status":"solved","explanation":"리더의 특성에 집중하므로 개인 특성을 깊이 이해하는 데 장점이 있다. 깊이 있는 이해가 불가능하다는 설명은 반대다.","refs":[],"topic":"리더십의 기초","originalText":"다음 중 리더십 특성이론에 관한 내용과 다른 것은?","ready":true,"originalAnswer":"족보 이미지 명시 정답 1번"},{"id":"2021-2-4","source":"2021-2","no":4,"text":"다음 리더 행동이론의 목적이 아닌 것은?","options":[{"id":"1","text":"효과적인 리더행동유형에 맞추어 교육훈련을 통해 효과적인 리더십을 개발하는 것이다."},{"id":"2","text":"리더의 다양한 행동을 관찰하여, 그 정도를 측정하는 척도를 기술하고 만드는 것이다."},{"id":"3","text":"효과적인 리더와 비효과적인 리더의 특성 차이를 파악하는 것이다."},{"id":"4","text":"리더의 행동유형을 분류하여 어떤 유형이 조직성과에 효과적인 유형인가를 밝히는 것이다."}],"answer":"3","type":"mc","originalKey":"족보 이미지 명시 정답 3번","note":"사용자가 첨부한 2021-2 화면에서 문제·선지·정답 표시를 직접 판독했습니다.","review":"이미지 판독 · 자료 대조","status":"solved","explanation":"행동이론은 리더가 무엇을 하는지 분석한다. 개인의 특성 차이를 찾는 것은 특성이론의 접근이다.","refs":["grid"],"topic":"행동·상황이론","originalText":"다음 리더 행동이론의 목적이 아닌 것은?","ready":true,"originalAnswer":"족보 이미지 명시 정답 3번"},{"id":"2021-2-5","source":"2021-2","no":5,"text":"블레이크와 모우튼의 관리격자모델의 리더 유형에 관한 설명으로 옳지 않은 것은?","options":[{"id":"1","text":"(5,5)형은 과업의 능률과 인간적 요소를 절충하여 적당한 수준에서 성과를 추구하는 중도형 리더이다."},{"id":"2","text":"(9,1)형은 과업상의 능력을 우선적으로 생각하는 과업형 리더이다."},{"id":"3","text":"(1,9)형은 생산에 관심을 보이는 인기형 리더이다."},{"id":"4","text":"(1,1)형은 조직구성원으로서 자리를 유지하는 데 필요한 최소한의 노력만을 투입하는 무관심형 리더이다."}],"answer":"3","type":"mc","originalKey":"족보 이미지 명시 정답 3번","note":"사용자가 첨부한 2021-2 화면에서 문제·선지·정답 표시를 직접 판독했습니다.","review":"이미지 판독 · 자료 대조","status":"solved","explanation":"(1,9)는 인간에 대한 관심이 높고 생산에 대한 관심이 낮은 인기형이다. 두 축을 바꾸어 설명한 선지가 틀렸다.","refs":["grid"],"topic":"행동·상황이론","originalText":"블레이크와 모우튼의 관리격자모델의 리더 유형에 관한 설명으로 옳지 않은 것은?","ready":true,"originalAnswer":"족보 이미지 명시 정답 3번"},{"id":"2021-2-6","source":"2021-2","no":6,"text":"리더십 연구의 발전과정을 순서대로 설명한 것으로 가장 옳은 것은?","options":[{"id":"1","text":"특성이론 - 행동이론 - 상황이론"},{"id":"2","text":"특성이론 - 상황이론 - 행동이론"},{"id":"3","text":"행동이론 - 특성이론 - 상황이론"},{"id":"4","text":"특성이론 - 상황이론 - 유효성 이론"}],"answer":"1","type":"mc","originalKey":"족보 이미지 명시 정답 1번","note":"사용자가 첨부한 2021-2 화면에서 문제·선지·정답 표시를 직접 판독했습니다.","review":"이미지 판독 · 직접 풀이","status":"solved","explanation":"전통적인 분류에서는 특성이론 다음 행동이론, 이후 상황이론의 순서로 발전을 설명한다.","refs":[],"topic":"리더십의 기초","originalText":"리더십 연구의 발전과정을 순서대로 설명한 것으로 가장 옳은 것은?","ready":true,"originalAnswer":"족보 이미지 명시 정답 1번"},{"id":"2021-2-7","source":"2021-2","no":7,"text":"리더십 이론에 관한 설명으로 옳지 않은 것은?","options":[{"id":"1","text":"허쉬와 블랜차드는 부하들의 성숙도에 따른 효과적인 리더십 행동을 분석하였다."},{"id":"2","text":"하우스의 경로-목표이론에 의하면 상황이 리더에게 아주 유리하거나 불리할 때는 과업지향적인 리더십이 효과적이다."},{"id":"3","text":"리더십 이론은 특성론적 접근, 상황론적 접근, 행위론적 접근으로 구분할 수 있다."},{"id":"4","text":"블레이크와 모우튼의 관리격자이론에 의하면 (9,9)형이 이상적인 리더십 유형이다."}],"answer":"2","type":"mc","originalKey":"족보 이미지 명시 정답 2번","note":"사용자가 첨부한 2021-2 화면에서 문제·선지·정답 표시를 직접 판독했습니다.","review":"이미지 판독 · 자료 대조","status":"solved","explanation":"상황이 매우 유리하거나 불리할 때 과업지향이 효과적이라는 설명은 피들러의 상황적합이론이다. 하우스 이론으로 제시한 선지가 틀렸다.","refs":["situation"],"topic":"행동·상황이론","originalText":"리더십 이론에 관한 설명으로 옳지 않은 것은?","ready":true,"originalAnswer":"족보 이미지 명시 정답 2번"},{"id":"2021-2-8","source":"2021-2","no":8,"text":"변혁적 리더십에 포함되는 4가지 특성이 아닌 것은?","options":[{"id":"1","text":"영감적 동기부여"},{"id":"2","text":"카리스마"},{"id":"3","text":"성과에 대한 보상"},{"id":"4","text":"지적자극"}],"answer":"3","type":"mc","originalKey":"족보 이미지 명시 정답 3번","note":"사용자가 첨부한 2021-2 화면에서 문제·선지·정답 표시를 직접 판독했습니다.","review":"이미지 판독 · 자료 대조","status":"solved","explanation":"조건적·성과연계 보상은 거래적 리더십의 요소다. 변혁적 리더십은 이상적 영향력·영감·지적 자극·개별적 배려를 강조한다.","refs":["transform"],"topic":"현대적 리더십","originalText":"변혁적 리더십에 포함되는 4가지 특성이 아닌 것은?","ready":true,"originalAnswer":"족보 이미지 명시 정답 3번"},{"id":"2021-2-9","source":"2021-2","no":9,"text":"변혁적 리더가 갖추어야 할 자질이 아닌 것은?","options":[{"id":"1","text":"비전제시 능력"},{"id":"2","text":"신뢰 확보"},{"id":"3","text":"설득력과 지도력"},{"id":"4","text":"조건적 보상"}],"answer":"4","type":"mc","originalKey":"족보 이미지 명시 정답 4번","note":"사용자가 첨부한 2021-2 화면에서 문제·선지·정답 표시를 직접 판독했습니다.","review":"이미지 판독 · 자료 대조","status":"solved","explanation":"조건적·성과연계 보상은 거래적 리더십의 요소다. 변혁적 리더십은 이상적 영향력·영감·지적 자극·개별적 배려를 강조한다.","refs":["transform"],"topic":"현대적 리더십","originalText":"변혁적 리더가 갖추어야 할 자질이 아닌 것은?","ready":true,"originalAnswer":"족보 이미지 명시 정답 4번"},{"id":"2021-2-10","source":"2021-2","no":10,"text":"변혁적 리더십의 특징에 해당하지 않는 것을 모두 고른 것은?\nA: 부하들에게 장기적인 목표를 위해 노력하도록 동기를 부여한다.\nB: 부하들을 위해 문제를 해결하거나 해답을 찾을 수 있는 곳을 알려준다.\nC: 부하들에게 즉각적이고 가시적인 보상으로 동기 부여한다.\nD: 부하들에게 자아실현과 같은 높은 수준의 개인적인 목표를 동경하도록 동기를 부여한다.\nE: 질문을 하여 부하들에게 스스로 해결책을 찾거나 격려하도록 함께 일을 한다.","options":[{"id":"1","text":"C, D"},{"id":"2","text":"D, E"},{"id":"3","text":"A, B"},{"id":"4","text":"B, C"}],"answer":"4","type":"mc","originalKey":"족보 이미지 명시 정답 4번","note":"사용자가 첨부한 2021-2 화면에서 문제·선지·정답 표시를 직접 판독했습니다.","review":"이미지 판독 · 자료 대조","status":"solved","explanation":"C의 즉각적 보상은 거래적 리더십에 해당한다. B는 리더가 답을 제공하는 방식이며, E의 자율적 해결 촉진과 대비된다. 출제 의도상 B와 C를 고른다. 다만 B의 행동은 현실에서 변혁적 리더도 할 수 있으므로, 이 답은 거래적·변혁적 리더십을 대조하는 시험 문맥의 판단이다.","refs":["transform"],"topic":"현대적 리더십","originalText":"변혁적 리더십의 특징에 해당하지 않는 것을 모두 고른 것은?\nA: 부하들에게 장기적인 목표를 위해 노력하도록 동기를 부여한다.\nB: 부하들을 위해 문제를 해결하거나 해답을 찾을 수 있는 곳을 알려준다.\nC: 부하들에게 즉각적이고 가시적인 보상으로 동기 부여한다.\nD: 부하들에게 자아실현과 같은 높은 수준의 개인적인 목표를 동경하도록 동기를 부여한다.\nE: 질문을 하여 부하들에게 스스로 해결책을 찾거나 격려하도록 함께 일을 한다.","ready":true,"originalAnswer":"족보 이미지 명시 정답 4번"},{"id":"2021-2-11","source":"2021-2","no":11,"text":"서번트 리더십의 특성으로 옳지 않은 것은?","options":[{"id":"1","text":"부하의 감정에 공감하고, 이해하려고 노력한다."},{"id":"2","text":"조직의 구성원들에게 공동체 정신을 심어준다."},{"id":"3","text":"부하의 성장을 위해 헌신한다."},{"id":"4","text":"비전 달성을 위해 위험감수 등 비범한 행동을 보인다."}],"answer":"4","type":"mc","originalKey":"족보 이미지 명시 정답 4번","note":"사용자가 첨부한 2021-2 화면에서 문제·선지·정답 표시를 직접 판독했습니다.","review":"이미지 판독 · 자료 대조","status":"solved","explanation":"공감·구성원 성장·공동체 형성은 서번트 리더십의 특징이다. 비전을 위한 비범한 위험감수는 카리스마 리더십의 대표적 설명이다.","refs":["servant"],"topic":"현대적 리더십","originalText":"서번트 리더십의 특성으로 옳지 않은 것은?","ready":true,"originalAnswer":"족보 이미지 명시 정답 4번"},{"id":"2021-2-12","source":"2021-2","no":12,"text":"부하들 스스로가 자신을 리드하도록 만드는 리더십은?","options":[{"id":"1","text":"수퍼 리더십"},{"id":"2","text":"카리스마 리더십"},{"id":"3","text":"변혁적 리더십"},{"id":"4","text":"서번트 리더십"}],"answer":"1","type":"mc","originalKey":"족보 이미지 명시 정답 1번","note":"사용자가 첨부한 2021-2 화면에서 문제·선지·정답 표시를 직접 판독했습니다.","review":"이미지 판독 · 직접 풀이","status":"solved","explanation":"수퍼 리더십은 구성원이 스스로 자신을 이끄는 셀프리더가 되도록 돕는다. 리더가 구성원을 통제하는 힘을 키우는 데 초점을 둔다는 설명은 반대다.","refs":[],"topic":"현대적 리더십","originalText":"부하들 스스로가 자신을 리드하도록 만드는 리더십은?","ready":true,"originalAnswer":"족보 이미지 명시 정답 1번"},{"id":"2021-2-13","source":"2021-2","no":13,"text":"리더십에 관한 설명으로 옳지 않은 것은?","options":[{"id":"1","text":"수퍼 리더십은 리더가 종업원을 관리하고 통제할 수 있는 힘과 기술을 가지도록 하는 데 초점을 둔다."},{"id":"2","tex
