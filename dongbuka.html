 가는 자세로 임해야 한다."},{"id":"4","text":"2030년과 2050년 한국의 미래를 전망하는 장기적 안목으로 일본과 한일관계를 재조명해야 한다."}],"answer":"3","type":"mc","originalText":"고조되는 미중 전략경쟁의 파고 속에서 새로운 발상으로 한일 관계를 재건축할 때 요구 되는 바람직한 자세가 아닌 것은?","originalAnswer":"원본에 정답 표시 없음","review":"강의노트 대조","status":"solved","ready":true,"explanation":"대일외교는 특수한 양자관계에만 한정할 수 없다. 지역·글로벌 전략 및 한미일 등 다층적 협력의 관점에서 접근해야 한다.\n검토 근거: 동북아12-3_과거사문제_미래.pptx · 3쪽","note":"PDF 줄바꿈으로 분리된 단어의 공백만 정리했습니다.","refs":[],"topic":"한일관계","contentRevision":1},{"id":"dongbuka-2024-1-final-16","source":"2024-1 기말","no":16,"text":"일본은 아시아 최초의 근대화 국가로서 내셔널리즘과 민주주의, 저출산 고령화 사회, 환경문제 등을 가장 먼저 경험한, 따라서 타국에 교훈을 줄 수 있는 ( ) 선진국이다.","options":[{"id":"A","text":"종합"},{"id":"B","text":"과제"},{"id":"C","text":"생활"},{"id":"D","text":"복지"}],"answer":"B","type":"mc","originalText":"일본은 아시아 최초의 근대화 국가로서 내셔널리즘과 민주주의, 저출산 고령화 사회, 환 경문제 등을 가장 먼저 경험한, 따라서 타국에 교훈을 줄 수 있는 ( ) 선진국이다.","originalAnswer":"원본에 정답 표시 없음","review":"강의노트 대조","status":"solved","ready":true,"explanation":"저출산·고령화 등 공통 과제를 먼저 경험하여 해법과 교훈을 제공하는 ‘과제 선진국’을 의미한다.\n검토 근거: 12주차_3교시_과거사문제와 한일관계의 미래비전.pptx · 3쪽","note":"PDF 줄바꿈으로 분리된 단어의 공백만 정리했습니다.","refs":[],"topic":"한일관계","contentRevision":1},{"id":"dongbuka-2024-1-final-17","source":"2024-1 기말","no":17,"text":"양자협정들의 내용과 자유화의 일정에 차이가 날수록 FTA의 장점이 줄어들고, 대신 복잡한 원산지 규정 등으로 인한 거래비용이 증가하는 것을 ( ) 효과라고 한다.","options":[{"id":"1","text":"당구공"},{"id":"2","text":"누들보울"},{"id":"3","text":"도미노"},{"id":"4","text":"밴드웨건"}],"answer":"2","type":"mc","originalText":"양자협정들의 내용과 자유화의 일정에 차이가 날수록 FTA의 장점이 줄어들고, 대신 복 잡한 원산지 규정 등으로 인한 거래비용이 증가하는 것을 ( ) 효과라고 한다.","originalAnswer":"원본에 정답 표시 없음","review":"공식 자료 대조","status":"solved","ready":true,"explanation":"여러 FTA의 상이한 규칙과 원산지 기준이 얽혀 기업의 준수 비용을 높이는 현상을 누들보울 효과라고 한다.","note":"PDF 줄바꿈으로 분리된 단어의 공백만 정리했습니다.","refs":["adb"],"topic":"통상·경제협력","contentRevision":1},{"id":"dongbuka-2024-1-final-22","source":"2024-1 기말","no":22,"text":"전후 일본의 소극적 안보외교의 제도적 틀에 포함되지 않는 것은 무엇인가?","options":[{"id":"A","text":"미일안보체제"},{"id":"B","text":"수출통제법"},{"id":"C","text":"비핵 3원칙"},{"id":"D","text":"일본국헌법 제9조"}],"answer":"B","type":"mc","originalText":"전후 일본의 소극적 안보외교의 제도적 틀에 포함되지 않는 것은 무엇인가?","originalAnswer":"원본에 정답 표시 없음","review":"강의노트 대조","status":"solved","ready":true,"explanation":"강의의 제도적 틀은 헌법 제9조·전수방위, 비핵 3원칙, 무기수출 3원칙, 미일안보체제, 문민통제이다. 선택지의 수출통제법은 해당 목록에 없다.\n검토 근거: 동북아9-1_일본의 안보외교.pptx · 9쪽","note":"PDF 줄바꿈으로 분리된 단어의 공백만 정리했습니다.","refs":[],"topic":"일본 안보외교","contentRevision":1},{"id":"dongbuka-2024-1-final-25","source":"2024-1 기말","no":25,"text":"탈냉전 후 한일관계의 성격과 양상의 변화에 대한 기술로서 적합하지 않은 것은?","options":[{"id":"1","text":"한일 양국은 과거사, 영토문제로 인해 여전히 첨예한 대립과 갈등의 국면을 벗어나지 못하고 있다."},{"id":"2","text":"탈냉전 이후의 한일 안보관계는 냉전시대에 비해 복잡한 양상을 보이고 있다."},{"id":"3","text":"한일 양국이 다루어야 할 협력과 갈등의 영역이 양국간 관계의 범주를 넘어서 지역적, 세계적 차원으로 확대되고 있다."},{"id":"4","text":"한일 정치인 간의 비공식 채널이 강화된 것과는 달리, 시민사회나 지방 자치제 간의 교류는 감소했다."}],"answer":"4","type":"mc","originalText":"탈냉전 후 한일관계의 성격과 양상의 변화에 대한 기술로서 적합하지 않은 것은?","originalAnswer":"원본에 정답 표시 없음","review":"강의노트 대조","status":"solved","ready":true,"explanation":"강의는 정치인 간 채널은 약화된 반면 시민사회·지방자치체 교류는 확대되었다고 설명한다. 4번은 이를 반대로 서술했다.\n검토 근거: 동북아12-1_구조전환.pptx · 9쪽","note":"PDF 줄바꿈으로 분리된 단어의 공백만 정리했습니다.","refs":[],"topic":"한일관계","contentRevision":1},{"id":"dongbuka-2024-1-final-26","source":"2024-1 기말","no":26,"text":"CMI 및 CMI 다자화(CMIM)에 대한 기술 중 바르지 못한 것은?","options":[{"id":"1","text":"위기 국가는 일정액을 넘는 부분에 대해서는 IMF와 협의 후 CMIM의 신용을 할당받아야 하며 IMF의 이행조건을 수용해야 한다."},{"id":"2","text":"2010년 3월 CMI 다자화(CMIM) 협정이 발효되었다."},{"id":"3","text":"2008년 글로벌 금융위기 시 유동성 위기에 직면한 국가들이 CMI를 적극적으로 활용했다."},{"id":"4","text":"2014년 7월 신용규모를 2400억 달러로 증액하는 협정 개정안이 발효되었다."}],"answer":"3","type":"mc","originalText":"CMI 및 CMI 다자화(CMIM)에 대한 기술 중 바르지 못한 것은?","originalAnswer":"원본에 정답 표시 없음","review":"강의노트 대조","status":"solved","ready":true,"explanation":"2008년 위기 때 CMI가 적극 활용되었다는 서술은 틀리다. 강의는 미발동과 제도의 실효성 문제를 다룬다.\n검토 근거: 1교시_동아시아 공동체의 분수령.pptx · 12쪽","note":"PDF 줄바꿈으로 분리된 단어의 공백만 정리했습니다.","refs":[],"topic":"통상·경제협력","contentRevision":1},{"id":"dongbuka-2024-1-final-27","source":"2024-1 기말","no":27,"text":"동아시아지역 안보에 있어서는 미국과의 ( ) 시스템을 중심으로 한 양자주의적 협력관계가 기본 틀을 이루고 있다.","options":[{"id":"A","text":"동심원"},{"id":"B","text":"허브앤스포크"},{"id":"C","text":"확장억지"},{"id":"D","text":"집단방위"}],"answer":"B","type":"mc","originalText":"동아시아지역 안보에 있어서는 미국과의 ( ) 시스템을 중심으로 한 양자주의적 협력관 계가 기본 틀을 이루고 있다.","originalAnswer":"원본에 정답 표시 없음","review":"강의노트 대조","status":"solved","ready":true,"explanation":"미국을 중심으로 개별 동맹국을 연결하는 양자 동맹망은 허브앤스포크이다.\n검토 근거: 동북아7-2_비전의 충돌.pptx · 12쪽","note":"PDF 줄바꿈으로 분리된 단어의 공백만 정리했습니다.","refs":[],"topic":"동아시아 지역협력","contentRevision":1},{"id":"dongbuka-2024-1-final-28","source":"2024-1 기말","no":28,"text":"‘동아시아비전그룹(EAVG)’과 ‘동아시아스터디그룹(EASG)’이 제출한 보고서에서 제안된 트랙2(반관반민)의 동아시아 싱크탱크 네트워크는 무엇인가?","options":[{"id":"A","text":"ERPD"},{"id":"B","text":"AMRO"},{"id":"C","text":"NEAT"},{"id":"D","text":"ERIA"}],"answer":"C","type":"mc","originalText":"‘동아시아비전그룹(EAVG)’과 ‘동아시아스터디그룹(EASG)’이 제출한 보고서에서 제안된 트 랙2(반관반민)의 동아시아 싱크탱크 네트워크는 무엇인가?","originalAnswer":"원본에 정답 표시 없음","review":"강의노트 대조","status":"solved","ready":true,"explanation":"EAVG·EASG 보고서에서 제안된 동아시아 싱크탱크 네트워크는 NEAT이다.\n검토 근거: 동북아8-1_중일경쟁.pptx · 10쪽","note":"PDF 줄바꿈으로 분리된 단어의 공백만 정리했습니다.","refs":[],"topic":"동아시아 지역협력","contentRevision":1},{"id":"dongbuka-2024-1-final-32","source":"2024-1 기말","no":32,"text":"아베 신조 전 총리의 이름을 딴 ‘아베노믹스(Abenomics)’ 경제정책에 포함되지 않는 것은 무엇인가?","options":[{"id":"A","text":"대담한 양적완화"},{"id":"B","text":"기동적 재정지출"},{"id":"C","text":"성장전략"},{"id":"D","text":"유연한 환율조정"}],"answer":"D","type":"mc","originalText":"아베 신조 전 총리의 이름을 딴 ‘아베노믹스(Abenomics)’ 경제정책에 포함되지 않는 것 은 무엇인가?","originalAnswer":"원본에 정답 표시 없음","review":"강의노트 대조","status":"solved","ready":true,"explanation":"아베노믹스의 세 축은 금융완화, 재정지출, 성장전략이다. 유연한 환율조정은 세 축에 포함되지 않는다.\n검토 근거: 동북아10-1_도전요인.pptx · 6쪽","note":"PDF 줄바꿈으로 분리된 단어의 공백만 정리했습니다.","refs":[],"topic":"통상·경제협력","contentRevision":1},{"id":"dongbuka-2024-1-final-33","source":"2024-1 기말","no":33,"text":"한일관계에 있어 과거사문제에 대한 접근법에 관한 설명으로 적절하지 않은 것은 무엇인가?","options":[{"id":"1","text":"대일 외교 어젠다는 위안부 등 역사문제 이외에도 대북 공조, 외교안보협력, 경제협력, 사회문화 교류 분야에서의 공조, 협력 등 중요한 영역이 존재한다는 사실을 고려해야 한다."},{"id":"2","text":"냉철한 국익의 계산과 철저한 전략적 사고로 대일 외교를 정립해야 하며 그 기반은 일본의 리얼리티를 제대로 읽는데서 출발해야 한다."},{"id":"3","text":"한일관계에서 역사 문제와 비 역사 쟁점(안보, 경제 등)은 분리하지 않고 통합적으로 다루는 것이 효과적이다."},{"id":"4","text":"민주국가에서 국민여론은 중시되어야 하나 국민 정서, 대중의 감정에 휩쓸리는 대일 과거사 외교의 함정에 빠져서는 안 된다."}],"answer":"3","type":"mc","originalText":"한일관계에 있어 과거사문제에 대한 접근법에 관한 설명으로 적절하지 않은 것은 무엇 인가?","originalAnswer":"원본에 정답 표시 없음","review":"강의노트 대조","status":"solved","ready":true,"explanation":"강의는 역사 쟁점과 안보·경제 등 비역사 쟁점을 분리하여 각 영역의 논리에 맞게 다루도록 제시한다. 따라서 통합적으로 다룬다는 3번은 부적절하다.\n검토 근거: 동북아12-3_과거사문제_미래.pptx · 5쪽","note":"PDF 줄바꿈으로 분리된 단어의 공백만 정리했습니다.","refs":[],"topic":"한일관계","contentRevision":1},{"id":"dongbuka-2024-1-final-35","source":"2024-1 기말","no":35,"text":"미국이 일본의 ( ) 행사를 용인한 것은 안보 차원의 실용적 결정으로 일본의 보수세력과 이해관계가 합치한 결과라고 볼 수 있다.","options":[{"id":"1","text":"개별적 자위권"},{"id":"2","text":"무력"},{"id":"3","text":"거부권"},{"id":"4","text":"집단적 자위권"}],"answer":"4","type":"mc","originalText":"미국이 일본의 ( ) 행사를 용인한 것은 안보 차원의 실용적 결정으로 일본의 보수세력 과 이해관계가 합치한 결과라고 볼 수 있다.","originalAnswer":"원본에 정답 표시 없음","review":"강의노트 대조","status":"solved","ready":true,"explanation":"미국의 안보상 필요와 일본 보수세력의 이해가 합치한 것은 집단적 자위권 행사 용인이다.\n검토 근거: 동북아9-2_미일동맹.pptx · 20쪽","note":"PDF 줄바꿈으로 분리된 단어의 공백만 정리했습니다.","refs":[],"topic":"일본 안보외교","contentRevision":1},{"id":"dongbuka-2024-1-final-36","source":"2024-1 기말","no":36,"text":"일본에서는 2008년 북경올림픽, 리먼 쇼크, 2010년 센카쿠 열도 분쟁을 거치면서 중국의 부상을 염두에 둔 ( ) 지역 인식이 자리잡기 시작했다.","options":[{"id":"1","text":"유라시아"},{"id":"2","text":"동아시아"},{"id":"3","text":"인도태평양"},{"id":"4","text":"아시아태평양"}],"answer":"3","type":"mc","originalText":"일본에서는 2008년 북경올림픽, 리먼 쇼크, 2010년 센카쿠 열도 분쟁을 거치면서 중국 의 부상을 염두에 둔 ( ) 지역 인식이 자리잡기 시작했다.","originalAnswer":"원본에 정답 표시 없음","review":"강의노트 대조","status":"solved","ready":true,"explanation":"강의는 이 사건들을 거치며 중국의 부상을 고려한 인도태평양 지역 인식이 태동했다고 function shuffle(arr){let a=[...arr];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function sameAnswer(a,b,type){if(type==='multi')return JSON.stringify(String(a).split(',').filter(Boolean).sort())===JSON.stringify(String(b).split(',').filter(Boolean).sort());return String(a??'').trim().toLowerCase().replace(/\s+/g,'')===String(b??'').trim().toLowerCase().replace(/\s+/g,'')}

function home(){let ready=data.questions.filter(isReady),done=ready.filter(q=>study.history[q.id]?.attempts),wrong=ready.filter(q=>study.history[q.id]?.lastCorrect===false);$('#app').innerHTML=`<span class="eyebrow">동북아와 한일관계</span><h1>오늘도, 한 문제씩 확실하게.</h1><p class="muted">족보별로 골라 풀고, 틀린 개념을 다시 확인하세요.<br>정답과 직접 풀이, 검토 근거는 답안을 제출한 뒤에 보여줍니다.</p><div class="layout"><section><section class="card"><div class="row"><h2>내 챕터 <span class="tag">${sources().length}</span></h2><button onclick="selectAll()">전체 선택 / 해제</button></div>${sources().map(s=>{const arr=data.questions.filter(q=>q.source===s);return `<div class="chapter"><input type="checkbox" aria-label="${esc(s)} 선택" data-source="${esc(s)}" ${selected.has(s)?'checked':''}><div><h3>${esc(sourceName(s))}</h3><span class="tag">${arr.filter(isReady).length}문항 출제 가능</span> <span class="tag warning">${arr.filter(q=>!isReady(q)).length}문항 확인 대기</span></div><button data-manage="${esc(s)}">문항 관리</button></div>`}).join('')}<footer>선택한 챕터 안에서 텍스트 유사도 90% 이상 또는 직접 등록한 중복문제는 한 번만 출제합니다. 정답 확인이 끝난 객관식 문항만 출제합니다.</footer></section><div class="alert"><strong>강의노트 검증 완료</strong> · 객관식 23문항 중 22문항을 출제합니다. 원본 12번은 선지 오류로 보류했습니다. <button onclick="go('review')">검토 현황 보기</button></div><div class="stats"><div class="stat"><span class="number">${ready.length}</span><span class="muted">출제 가능 문항</span></div><div class="stat"><span class="number">${done.length}<small style="font-size:16px"> / ${ready.length}</small></span><span class="muted">풀어 본 문항</span></div><div class="stat"><span class="number">${wrong.length}</span><span class="muted">최근 오답</span></div></div></section><aside><section class="card"><span class="eyebrow">TEST SETTINGS</span><h2>이번 시험 범위</h2><label for="topic">학습 주제</label><select id="topic"><option value="">모든 주제</option>${[...new Set(data.questions.map(q=>q.topic))].map(t=>`<option>${esc(t)}</option>`).join('')}</select><label for="count">출제 문항 수</label><input id="count" type="number" min="1" step="1" value="" autocomplete="off" placeholder="비워 두면 전체"><p class="small muted">원하는 문항 수를 입력하세요. 비워 두면 전체 문항을 출제합니다.</p><div class="check"><input id="mixed" type="checkbox" checked><label for="mixed">문제 순서 섞기</label></div><div class="check"><input id="choices" type="checkbox" checked><label for="choices">객관식 선지 섞기</label></div><div class="check"><input id="unseen" type="checkbox"><label for="unseen">아직 안 푼 문제만</label></div><button class="primary full" onclick="start()">문제 풀기 시작</button><p class="small muted">선택한 챕터의 검증된 객관식만 출제합니다.</p></section><section class="card stack"><h3>이어지는 복습</h3><button onclick="start('wrong')" ${wrong.length?'':'disabled'}>틀린 문제 다시 풀기 (${wrong.length})</button>${study.exam&&!study.exam.finished?'<button onclick="go(\'exam\')">풀던 문제 이어하기</button>':''}<button onclick="filter.status='pending';go('review')">검증 보류 ${data.questions.length-ready.length}개 보기</button></section></aside></div>`;
 document.querySelectorAll('[data-source]').forEach(el=>el.onchange=()=>{el.checked?selected.add(el.dataset.source):selected.delete(el.dataset.source);save();});document.querySelectorAll('[data-manage]').forEach(el=>el.onclick=()=>{filter.source=el.dataset.manage;filter.status='';go('bank')});}
function selectAll(){selected=selected.size===sources().length?new Set():new Set(sources());save();home()}

function duplicateKey(q){
 const norm=v=>String(v??'').normalize('NFKC').toLowerCase().replace(/\s+/g,'').replace(/[.,，。!?？！“”"'‘’]/g,'');
 const opts=(q.options||[]).map(o=>norm(o.text));
 const answers=q.type==='short'?norm(q.answer):String(q.answer??'').split(',').map(id=>{const o=(q.options||[]).find(o=>String(o.id)===id.trim());return o?norm(o.text):'id:'+id.trim()}).sort();
 return JSON.stringify([q.type,norm(q.text),opts.slice().sort(),answers,q.image||'']);
}

function sourceName(s){return (data.sourceNames||{})[s]||s}
function renameSource(s){const name=prompt('챕터 이름',sourceName(s));if(!name?.trim())return;data.sourceNames=data.sourceNames||{};const before={...data.sourceNames};data.sourceNames[s]=name.trim();if(!save(true)){data.sourceNames=before;return}render()}
function normalizedText(q){return [q.text,...(q.options||[]).map(o=>o.text).sort()].join(' ').normalize('NFKC').toLowerCase().replace(/\s+/g,'')}
function textSimilarity(a,b){if(a===b)return 1;if(!a.length||!b.length)return 0;if(Math.min(a.length,b.length)/Math.max(a.length,b.length)<.9)return 0;let prev=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){const row=[i];for(let j=1;j<=b.length;j++)row[j]=Math.min(row[j-1]+1,prev[j]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));prev=row}return 1-prev[b.length]/Math.max(a.length,b.length)}
let duplicateCache=null;
function uniqueQuestions(pool){
 const signature=JSON.stringify([data.questions.map(q=>[q.id,q.type,q.text,q.options,q.answer,q.image]),data.manualDuplicates,data.sourceNames]);
 if(duplicateCache?.signature===signature)return duplicateCache.groups.map(g=>{const members=pool.filter(q=>g.includes(q.id));return members.length?{...members[0],duplicateIds:g,duplicateCount:g.length,duplicateSources:[...new Set(data.questions.filter(q=>g.includes(q.id)).map(q=>sourceName(q.source)))]}:null}).filter(Boolean);
 const all=data.questions,parents=new Map(all.map(q=>[q.id,q.id]));
 function root(id){while(parents.get(id)!==id){id=parents.get(id)}return id}
 function join(a,b){if(parents.has(a)&&parents.has(b))parents.set(root(b),root(a))}
 for(const group of data.manualDuplicates||[])for(const id of group.slice(1))join(group[0],id);
 const texts=all.map(normalizedText);
 for(let i=0;i<all.length;i++)for(let j=i+1;j<all.length;j++)if(duplicateKey(all[i])===duplicateKey(all[j])||textSimilarity(texts[i],texts[j])>=.9)join(all[i].id,all[j].id);
 const fullGroups=new Map();for(const q of all){const key=root(q.id);if(!fullGroups.has(key))fullGroups.set(key,[]);fullGroups.get(key).push(q.id)}duplicateCache={signature,groups:[...fullGroups.values()]};return uniqueQuestions(pool);
 const groups=new Map();for(const q of pool){if(!parents.has(q.id))continue;const key=root(q.id);if(!groups.has(key))groups.set(key,[]);groups.get(key).push(q)}
 return [...groups.values()].map(group=>({...group[0],duplicateIds:group.map(q=>q.id),duplicateCount:group.length,duplicateSources:[...new Set(group.map(q=>sourceName(q.source)))]}));
}
function sanitizeExam(){const ex=study.exam;if(!ex)return;const current=ex.items[ex.index]?.q.id;const valid=ex.items.filter(i=>data.questions.some(q=>q.id===i.q.id&&selected.has(q.source))&&!(data.removedQuestionIds||[]).includes(i.q.id));const groups=uniqueQuestions(valid.map(i=>i.q));ex.items=groups.map(q=>({...valid.find(i=>i.q.id===q.id),q}));if(!ex.items.length){study.exam=null;save();return}ex.index=Math.max(0,ex.items.findIndex(i=>i.q.id===current));save()}
function duplicateList(){
 const groups=uniqueQuestions(data.questions).filter(q=>q.duplicateCount>1).sort((a,b)=>a.text.localeCompare(b.text,'ko'));
 $('#app').innerHTML='<h1>중복케이스 목록</h1><p class="muted">문제와 선지의 텍스트 유사도 90% 이상 또는 직접 등록한 문항입니다. 한 시험에서 그룹별 한 문항만 출제합니다.</p>'+groups.map(q=>'<section class="card"><h3>'+esc(q.text)+'</h3><span class="tag">'+q.duplicateCount+'문항</span>'+q.duplicateIds.map(id=>{const x=data.questions.find(x=>x.id===id);return '<p>'+esc(sourceName(x.source))+' · '+esc(x.no)+'번<br>'+esc(x.text)+'</p>'}).join('')+'</section>').join('')+(groups.length?'':'<p>등록된 중복케이스가 없습니다.</p>');
}
function openDuplicatePicker(){
 const current=study.exam?.items[study.exam.index]?.q;if(!current)return;
 let dialog=document.getElementById('duplicate-picker');if(!dialog){dialog=document.createElement('dialog');dialog.id='duplicate-picker';document.body.append(dialog)}
 const candidates=data.questions.filter(q=>q.id!==current.id).sort((a,b)=>textSimilarity(normalizedText(current),normalizedText(b))-textSimilarity(normalizedText(current),normalizedText(a)));
 dialog.innerHTML='<h2>중복문제 등록</h2><p>'+esc(current.text)+'</p><input id="duplicate-search" placeholder="문제 제목 검색" aria-label="문제 제목 검색"><div id="duplicate-candidates" style="max-height:45vh;overflow:auto">'+candidates.map(q=>'<label class="check"><input type="checkbox" value="'+esc(q.id)+'"><span>'+esc(q.text)+'<br><small>'+esc(sourceName(q.source))+' · '+esc(q.no)+'번</small></span></label>').join('')+'</div><button id="duplicate-save" class="primary">같은 중복케이스로 등록</button> <button id="duplicate-close">닫기</button>';
 dialog.querySelector('#duplicate-search').oninput=e=>dialog.querySelectorAll('label').forEach(l=>l.hidden=!l.textContent.includes(e.target.value));
 dialog.querySelector('#duplicate-close').onclick=()=>dialog.close();
 dialog.querySelector('#duplicate-save').onclick=()=>{const ids=[...dialog.querySelectorAll('input[type=checkbox]:checked')].map(x=>x.value);if(!ids.length)return toast('같은 문제를 선택하세요.');const before=structuredClone(data.manualDuplicates||[]);data.manualDuplicates=[...before,[current.id,...ids]];if(!save(true)){data.manualDuplicates=before;return}dialog.close();exam();toast('중복케이스 등록 완료 · 현재 시험의 중복 문항도 제외했습니다.');};dialog.showModal();
}
function duplicateBadge(q){return q.duplicateCount>1?'<div class="repeat-important" role="note"><strong>★ 중요 · 반복 출제 '+q.duplicateCount+'회</strong><div>선택 범위에서 겹치는 문항을 한 번만 출제합니다.</div><small>'+q.duplicateSources.map(esc).join(' · ')+'</small></div>':''}

function start(mode){let pool=data.questions.filter(q=>isReady(q)&&selected.has(q.source)&&(!$('#topic').value||q.topic===$('#topic').value));if(mode==='wrong')pool=pool.filter(q=>study.history[q.id]?.lastCorrect===false);else if($('#unseen').checked)pool=pool.filter(q=>!study.history[q.id]?.attempts);pool=uniqueQuestions(pool);if(!pool.length)return toast('선택한 조건에 맞는 문항이 없습니다.');const countText=$('#count').value.trim();const count=countText===''?pool.length:Number(countText);if(!Number.isInteger(count)||count<1||count>pool.length)return toast('중복 제외 후 출제 가능한 문항은 '+pool.length+'개입니다. 1~'+pool.length+' 사이의 정수로 입력하세요.');if(study.exam&&!study.exam.finished&&!confirm('진행 중인 문제 세트를 새 세트로 바꿀까요? 이미 채점한 기록은 유지됩니다.'))return;let mixed=$('#mixed').checked,choice=$('#choices').checked;pool=(mixed?shuffle(pool):pool).slice(0,count);study.exam={index:0,finished:false,items:pool.map(q=>({q:structuredClone(q),options:q.type==='ox'?q.options:choice?shuffle(q.options):q.options,answer:q.type==='multi'?[]:'',revealed:false,graded:false,correct:null}))};save();go('exam')}
function exam(){sanitizeExam();const ex=study.exam;if(!ex)return go('home');const item=ex.items[ex.index],q=item.q;$('#app').innerHTML=`<div class="row"><div><span class="eyebrow">${esc(q.topic)}</span><h1>문제 ${ex.index+1}<span class="muted" style="font-size:22px"> / ${ex.items.length}</span></h1></div><button onclick="go('home')">나중에 이어하기</button></div><div class="layout"><section class="card"><div class="row"><span class="tag">${q.type==='ox'?'OX':q.type==='short'?'단답형 · 자가 채점':q.type==='multi'?'복수 선택':'객관식'}</span><span class="small muted">${esc(q.source)} · ${esc(q.no)}번</span></div><div class="progress"><i style="width:${(ex.index+1)/ex.items.length*100}%"></i></div><button onclick="openDuplicatePicker()">중복문제</button>${duplicateBadge(q)}<div class="question">${esc(q.text)}</div>${q.image?`<img class="qimage" src="${esc(q.image)}" alt="문제 참고 이미지" onclick="zoom(this.src)">`:''}${q.type==='short'?`<label for="shortanswer">내 답안</label><textarea id="shortanswer" rows="4" ${item.revealed?'disabled':''}>${esc(item.answer)}</textarea>`:item.options.map((o,i)=>{let chosen=q.type==='multi'?item.answer.includes(o.id):item.answer===o.id,correct=item.revealed&&String(q.answer).split(',').includes(o.id);return `<button class="option ${chosen?'selected':''} ${correct?'correct':item.revealed&&chosen?'wrong':''}" data-choice="${esc(o.id)}" ${item.revealed?'disabled':''} aria-pressed="${chosen}"><b>${q.type==='ox'?esc(o.id):i+1}</b><span>${q.type==='ox'?(o.id==='O'?'맞다':'아니다'):esc(o.text)}</span></button>`}).join('')}${item.revealed?`${item.graded?`<h3 class="${item.correct?'good':'bad'}">${item.correct?'정답입니다':'다시 복습해 보세요'}</h3>`:''}${explain(q)}${q.type==='short'&&!item.graded?'<p>내 답안과 비교하여 채점하세요.</p><button onclick="gradeSelf(true)">정답으로 기록</button> <button onclick="gradeSelf(false)">오답으로 기록</button>':''}`:''}<div class="row" style="margin-top:24px"><button onclick="move(-1)" ${ex.index===0?'disabled':''}>이전 문제</button>${ex.index<ex.items.length-1?'<button onclick="move(1)">다음 문제</button>':'<button class="primary" onclick="finish()">전체 제출 · 채점</button>'}</div></section><aside class="card" style="align-self:start"><h2>문항 이동</h2><p class="muted small">${ex.items.filter(hasAnswer).length} / ${ex.items.length}문항 답변 완료</p><div class="navgrid">${ex.items.map((it,i)=>`<button class="${it.graded?(it.correct?'result-right':'result-wrong'):(hasAnswer(it)?'done':'')} ${i===ex.index?'active':''}" onclick="jump(${i})">${i+1}</button>`).join('')}</div><button class="full" style="margin-top:25px" onclick="finish()">${ex.submitted?'결과 보기':'전체 제출 · 채점'}</button></aside></div>`;document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{if(q.type==='multi'){let k=item.answer.indexOf(b.dataset.choice);if(k>=0)item.answer.splice(k,1);else item.answer.push(b.dataset.choice)}else item.answer=b.dataset.choice;save();exam()});if($('#shortanswer'))$('#shortanswer').oninput=e=>{item.answer=e.target.value;save()};}
function record(item,correct){if(item.graded)return;item.graded=true;item.correct=correct;let h=study.history[item.q.id]||{attempts:0,correct:0};h.attempts++;h.correct+=correct?1:0;h.lastCorrect=correct;h.lastAt=new Date().toISOString();study.history[item.q.id]=h;save()}
function check(){let i=study.exam.items[study.exam.index];if(!i.answer||Array.isArray(i.answer)&&!i.answer.length)return toast('답안을 먼저 입력하거나 선택해 주세요.');i.revealed=true;if(i.q.type!=='short')record(i,sameAnswer(Array.isArray(i.answer)?i.answer.join(','):i.answer,i.q.answer,i.q.type));save();exam()}
function gradeSelf(ok){let i=study.exam.items[study.exam.index];record(i,ok);exam()}
function move(n){jump(study.exam.index+n)}function jump(n){study.exam.index=n;save();exam();window.scrollTo(0,0)}
function hasAnswer(i){return Array.isArray(i.answer)?i.answer.length>0:String(i.answer??'').trim().length>0}
function finish(){const ex=study.exam;if(ex.submitted)return go('result');const missing=ex.items.filter(i=>!hasAnswer(i)).length;if(missing&&!confirm(missing+'문항이 미응답입니다. 미응답은 오답으로 처리하고 제출할까요?'))return;for(const item of ex.items){item.revealed=true;if(!item.graded&&(item.q.type!=='short'||!hasAnswer(item)))record(item,hasAnswer(item)&&sameAnswer(Array.isArray(item.answer)?item.answer.join(','):item.answer,item.q.answer,item.q.type));}ex.submitted=true;ex.finished=true;save();go('result')}
function gradeResult(index,ok){const item=study.exam.items[index];if(!study.exam.submitted||item.q.type!=='short'||item.graded)return;record(item,ok);result()}
function result(){let ex=study.exam,sc=ex.items.filter(i=>i.correct===true).length,done=ex.items.filter(i=>i.graded).length;$('#app').innerHTML=`<span class="eyebrow">학습 결과</span><h1>오늘의 기록</h1><section class="card"><div class="row"><div><span class="number">${sc} / ${done}</span><p class="muted">채점한 문항 기준 · 전체 ${ex.items.length}문항 중 ${ex.items.length-done}개 미채점</p></div><button class="primary" onclick="go('home')">학습 홈</button></div><button onclick="go('exam')">문제 다시 확인하기</button><label class="check"><input id="wrong-only" type="checkbox" ${ex.wrongOnly?'checked':''} onchange="study.exam.wrongOnly=this.checked;save();result()"> 틀린 문제만 보기 (${ex.items.filter(it=>it.graded&&it.correct===false).length})</label></section><section class="card">${ex.items.map((it,i)=>({it,i})).filter(({it})=>!ex.wrongOnly||(it.graded&&it.correct===false)).map(({it,i})=>`<div class="listitem ${it.graded&&it.correct===false?'result-wrong':''}"><div class="row"><span class="tag ${it.correct===false?'warning':''}">${!it.graded?'미채점':it.correct?'정답':'오답'}</span><button onclick="study.exam.index=${i};go('exam')">${i+1}번 보기</button></div><p>${esc(it.q.text)}</p>${!it.graded&&it.q.type==='short'?`<div class="answerbox"><p><b>내 답안:</b> ${esc(it.answer)}</p><p><b>정답:</b> ${esc(answerText(it.q))}</p><button onclick="gradeResult(${i},true)">정답으로 기록</button> <button onclick="gradeResult(${i},false)">오답으로 기록</button></div>`:''}</div>`).join('')||'<p class="empty">틀린 문제가 없습니다.</p>'}</section>`}
function list(){let review=view==='review';$('#app').innerHTML=`<span class="eyebrow">${review?'정답과 근거를 함께':'내가 관리하는 족보'}</span><div class="row"><h1>${review?'답안 검토 기록':filter.source?esc(sourceName(filter.source)):'문항 관리'}</h1><div>${!review&&filter.source?'<button onclick="renameSource(filter.source)">이름 변경</button> ':''}<button class="primary" onclick="edit(null)">문항 추가</button></div></div><p class="muted">${review?'강의노트와 공식 자료를 대조해 정답을 검증했습니다. 해설에서 근거를 확인할 수 있으며, 보류 문항은 자동 출제하지 않습니다.':'문제·선지·정답·해설을 수정할 수 있습니다. 변경 내용은 이 브라우저에 저장됩니다.'}</p>${review?`<details class="card"><summary><strong>자료 반영 현황 — 검증 근거와 보류 사유</strong></summary><div class="tablewrap"><table><thead><tr><th>파일</th><th>반영 상태</th></tr></thead><tbody>${data.coverage.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.state)}</td></tr>`).join('')}</tbody></table></div></details>`:''}<div class="searchbar"><input id="search" aria-label="문항 검색" placeholder="문제 내용·해설 검색" value="${esc(filter.text)}"><select id="sourcefilter" aria-label="족보 필터"><option value="">모든 족보</option>${sources().map(s=>`<option value="${esc(s)}" ${s===filter.source?'selected':''}>${esc(sourceName(s))}</option>`).join('')}</select><select id="statefilter" aria-label="검토 상태"><option value="">모든 상태</option><option value="pending" ${filter.status==='pending'?'selected':''}>검증 보류</option><option value="ready" ${filter.status==='ready'?'selected':''}>출제 가능</option><option value="correction" ${filter.status==='correction'?'selected':''}>족보 수정</option><option value="wrong" ${filter.status==='wrong'?'selected':''}>최근 오답</option></select></div><div id="listitems" class="card"></div>`;$('#search').oninput=e=>{filter.text=e.target.value;listitems()};$('#sourcefilter').onchange=e=>{filter.source=e.target.value;list()};$('#statefilter').onchange=e=>{filter.status=e.target.value;listitems()};listitems()}
function listitems(){let arr=data.questions.filter(q=>(!filter.text||(q.text+' '+q.explanation).includes(filter.text))&&(!filter.source||q.source===filter.source)&&(!filter.status||(filter.status==='ready'?isReady(q):filter.status==='pending'?!isReady(q):filter.status==='correction'?q.review.includes('수정'):study.history[q.id]?.lastCorrect===false)));$('#listitems').innerHTML=`<p class="muted">${arr.length}개 항목</p>${arr.map(q=>`<div class="listitem"><div class="row">${tag(q)}<span class="small muted">${esc(q.source)} · ${esc(q.no)}번</span></div><p class="title">${esc(q.text)}</p><details><summary>선지·답안·검토 근거 보기</summary>${q.image?`<img class="qimage" src="${esc(q.image)}" alt="문제 이미지" onclick="zoom(this.src)">`:''}${q.options.map((o,i)=>`<p class="small">${i+1}. ${esc(o.text)}</p>`).join('')}${explain(q)}</details><button data-edit="${esc(q.id)}">문항 편집</button></div>`).join('')||'<div class="empty">검색 조건에 맞는 문항이 없습니다.</div>'}`;document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(b.dataset.edit))}
function edit(id){editing=id?structuredClone(data.questions.find(q=>q.id===id)):{id:crypto.randomUUID(),no:'추가',source:'내 문항',topic:'리더십의 기초',type:'mc',text:'',options:[{id:'1',text:''},{id:'2',text:''},{id:'3',text:''},{id:'4',text:''}],answer:null,explanation:'',ready:false,refs:[],note:'',originalAnswer:'사용자 추가'};const q=editing;$('#editor').innerHTML=`<div class="row"><h2>문항 편집</h2><button onclick="$('#editor').close()" aria-label="편집 닫기">닫기</button></div><div class="fields"><div><label for="esource">족보 / 단원 이름</label><input id="esource" value="${esc(q.source)}"></div><div><label for="etype">유형</label><select id="etype">${[['mc','객관식'],['multi','복수 선택'],['ox','OX'],['short','단답형 · 자가 채점']].map(([v,n])=>`<option value="${v}" ${q.type===v?'selected':''}>${n}</option>`).join('')}</select></div></div><label for="etext">문제 내용</label><textarea id="etext" rows="4">${esc(q.text)}</textarea><div id="optioneditor"></div><label for="enote">해설 / 검토 기록</label><textarea id="enote" rows="4">${esc(q.explanation)}</textarea><label for="eimage">문제 이미지 추가 (PNG / JPG / WebP, 1MB 이하)</label><input id="eimage" type="file" accept="image/png,image/jpeg,image/webp">${q.image?'<button onclick="editing.image=null;toast(\'이미지 제거가 선택되었습니다. 저장하면 반영됩니다.\')">기존 이미지 제거</button>':''}<div class="check"><input type="checkbox" id="eready" ${q.ready?'checked':''}><label for="eready">내용과 정답을 확인했으며 출제를 허용합니다</label></div><p class="muted small">수정하면 검토 상태는 ‘사용자 수정’으로 바뀝니다. 자동 검증 완료로 처리하지 않습니다.</p><div id="editerror" class="bad" role="alert"></div><div class="editor-actions">${data.questions.some(x=>x.id===q.id)?'<button class="danger" onclick="deleteQuestion()">문항 삭제</button>':''}<button onclick="$('#editor').close()">취소</button><button class="primary" onclick="saveEdit()">저장</button></div>`;optionEditor();$('#etype').onchange=()=>{editing.type=$('#etype').value;editing.answer=null;if(editing.type==='ox')editing.options=[{id:'O',text:'O'},{id:'X',text:'X'}];else if(editing.type!=='short')editing.options=[1,2,3,4].map(i=>({id:String(i),text:''}));optionEditor()};$('#eimage').onchange=async e=>{let f=e.target.files[0];if(!f)return;if(f.size>1024*1024||!['image/png','image/jpeg','image/webp'].includes(f.type)){toast('PNG/JPG/WebP, 1MB 이하 파일을 선택해 주세요.');return}editing.image=await new Promise(resolve=>{let r=new FileReader;r.onload=()=>resolve(r.result);r.readAsDataURL(f)})};$('#editor').showModal()}
function deleteQuestion(){const id=editing?.id;const q=data.questions.find(x=>x.id===id);if(!q)return;if(!confirm(q.source+' '+q.no+'번 문항을 삭제할까요? 학습 기록도 삭제되며, 이 문항이 포함된 진행 중 시험은 종료됩니다.'))return;const oldData=structuredClone(data),oldStudy=structuredClone(study);data.removedQuestionIds=[...new Set([...(data.removedQuestionIds||[]),id])];data.questions=data.questions.filter(x=>x.id!==id);delete study.history[id];if(study.exam?.items.some(i=>i.q.id===id))study.exam=null;if(!save(true)){data=oldData;study=oldStudy;save(true);return;}if(!sources().includes(q.source)){selected.delete(q.source);if(filter.source===q.source)filter.source='';}$('#editor').close();render();toast('문항을 삭제했습니다.');}
function optionEditor(){let q=editing;$('#optioneditor').innerHTML=q.type==='short'?`<label for="eshort">정답 / 채점 기준</label><textarea id="eshort" rows="3">${esc(q.answer||'')}</textarea>`:`<label>선지 · 왼쪽 선택란으로 정답 지정</label><div class="editor-options">${q.options.map((o,i)=>`<div class="editor-option"><input name="eanswer" aria-label="${i+1}번 정답" type="${q.type==='multi'?'checkbox':'radio'}" value="${esc(o.id)}" ${String(q.answer||'').split(',').includes(o.id)?'checked':''}><input data-option="${esc(o.id)}" aria-label="${i+1}번 선지" value="${esc(o.text)}" ${q.type==='ox'?'readonly':''}></div>`).join('')}</div>${q.type==='ox'?'':'<button style="margin-top:12px" onclick="addOption()">선지 추가</button>'}`}
function addOption(){editing.options=Array.from(document.querySelectorAll('[data-option]')).map(i=>({id:i.dataset.option,text:i.value}));editing.answer=Array.from(document.querySelectorAll('[name=eanswer]:checked')).map(i=>i.value).join(',');editing.options.push({id:String(editing.options.length+1),text:''});optionEditor()}
function saveEdit(){let q=editing;q.text=$('#etext').value.trim();q.source=$('#esource').value.trim();q.explanation=$('#enote').value.trim();q.ready=$('#eready').checked;q.type=$('#etype').value;if(q.type==='short'){q.options=[];q.answer=$('#eshort').value.trim()}else{q.options=Array.from(document.querySelectorAll('[data-option]')).map(i=>({id:i.dataset.option,text:i.value.trim()}));q.answer=Array.from(document.querySelectorAll('[name=eanswer]:checked')).map(i=>i.value).join(',')}if(!q.text||!q.source)return $('#editerror').textContent='문제 내용과 족보 이름을 입력하세요.';if(q.options.some(o=>!o.text))return $('#editerror').textContent='빈 선지 내용을 채워 주세요.';if(q.ready&&!q.answer)return $('#editerror').textContent='출제 허용 전에 정답을 지정하세요.';q.answer=q.answer||null;q.review='사용자 수정';q.status=q.ready?'user':'pending';q.refs=[];const idx=data.questions.findIndex(x=>x.id===q.id);if(idx<0)data.questions.push(q);else data.questions[idx]=q;selected.add(q.source);const ok=save(true);$('#editor').close();render();if(ok)toast('문항을 저장했습니다.')}
function zoom(src){$('#lightbox img').src=src;$('#lightbox').showModal()}
function download(name,body,type){const url=URL.createObjectURL(new Blob([body],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportHTML(){const copy=document.documentElement.cloneNode(true);copy.querySelector('#app').innerHTML='';copy.querySelector('#editor').innerHTML='';copy.querySelectorAll('dialog').forEach(d=>d.removeAttribute('open'));copy.querySelector('#toast').hidden=true;copy.querySelector('#bank-data').textContent=JSON.stringify(data).replace(/</g,'\\u003c');download('dongbuka-question-bank.html','<!doctype html>\n'+copy.outerHTML,'text/html;charset=utf-8');toast('수정된 문항을 포함한 실행 HTML을 내보냈습니다. 학습 기록은 JSON 백업에 포함됩니다.')}
function validData(d){return d&&Array.isArray(d.questions)&&d.questions.every(q=>q&&typeof q.id==='string'&&typeof q.text==='string'&&typeof q.source==='string'&&['mc','multi','ox','short'].includes(q.type)&&Array.isArray(q.options)&&q.options.every(o=>typeof o.id==='string'&&typeof o.text==='string')&&(q.answer===null||typeof q.answer==='string')&&(!q.image||/^data:image\/(png|jpeg|webp);base64,/.test(q.image)))&&new Set(d.questions.map(q=>q.id)).size===d.questions.length}
function backup(){$('#app').innerHTML=`<span class="eyebrow">학습 자료 보관</span><h1>내 문제은행 백업</h1><div class="layout"><section class="card stack"><h2>파일로 내보내기</h2><p class="muted">HTML은 문제은행을 실행하는 파일입니다. JSON 백업에는 수정 문항과 학습 기록이 모두 들어 있습니다.</p><button class="primary" onclick="exportHTML()">실행 HTML 내려받기</button><button onclick="download('dongbuka-backup.json',JSON.stringify({data,study},null,2),'application/json')">문항 + 학습 기록 JSON 백업</button><footer>저장은 기기·브라우저별로 구분됩니다. 다른 기기에서는 JSON 백업을 가져오세요.</footer></section><section class="card"><h2>백업 가져오기</h2><p class="muted">현재 자료와 학습 기록을 백업 내용으로 교체합니다.</p><label for="importfile">JSON 백업 선택</label><input type="file" id="importfile" accept=".json,application/json"></section></div>`;$('#importfile').onchange=async e=>{try{let f=e.target.files[0];if(!f)return;let value=JSON.parse(await f.text());if(!validData(value.data)||!value.study?.history)throw Error('올바른 동북아 백업 파일이 아닙니다.');if(!confirm('현재 문항과 학습 기록을 이 백업으로 교체할까요?'))return;data={...value.data,version:initial.version,refs:initial.refs,coverage:value.data.coverage||initial.coverage};study={history:value.study.history,exam:null};selected=new Set(sources());save(true);go('home');toast('백업을 가져왔습니다.')}catch(e){toast('가져오기 실패: '+e.message)}}}
document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>go(b.dataset.nav));go('home');
</script><script>(()=>{const bar=document.getElementById('subject-bar'),button=document.getElementById('subject-toggle'),menu=document.getElementById('subject-drawer');function close(){menu.hidden=true;button.setAttribute('aria-expanded','false')}button.addEventListener('click',()=>{const open=menu.hidden;menu.hidden=!open;button.setAttribute('aria-expanded',String(open))});document.addEventListener('click',e=>{if(!bar.contains(e.target))close()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!menu.hidden){close();button.focus()}})})();</script></body></html>
