ion":"표현 전환의 방향은 ‘전략’에서 ‘구상’으로이다. 문장은 이를 반대로 서술했다.\n검토 근거: 6-3 일한","originalAnswer":"원본에 정답 표시 없음","note":"PDF 줄바꿈으로 분리된 단어의 공백을 정리했습니다.","refs":[],"topic":"동북아와 한일관계","contentRevision":1},{"id":"dongbuka-2024-1-final-8","source":"2024-1 기말","no":8,"text":"중국과의 안보경쟁적 요소가 강한 미국의 FOIP에 비해 일본의 FOIP는 포섭성을 중시하고, 개발협력 및 경제외교의 요소가 강하다고 할 수 있다.","options":[{"id":"O","text":"참"},{"id":"X","text":"거짓"}],"type":"ox","answer":"O","ready":true,"status":"solved","review":"자료 대조","explanation":"일본 FOIP가 포섭성과 개발협력·경제외교를 중시한다는 강의 설명이다.\n검토 근거: 6-3 일한","originalAnswer":"원본에 정답 표시 없음","note":"PDF 줄바꿈으로 분리된 단어의 공백을 정리했습니다.","refs":[],"topic":"동북아와 한일관계","contentRevision":1},{"id":"dongbuka-2024-1-final-9","source":"2024-1 기말","no":9,"text":"1993년 8월 당시 일본 관방장관이 일본군 위안부에 대한 일본군의 관여와 강제성을 인정한 담화는 무엇인가?","options":[{"id":"A","text":"아베 담화"},{"id":"B","text":"무라야마 담화"},{"id":"C","text":"고노 담화"},{"id":"D","text":"간 담화"}],"answer":"C","type":"mc","originalText":"1993년 8월 당시 일본 관방장관이 일본군 위안부에 대한 일본군의 관여와 강제성을 인 정한 담화는 무엇인가?","originalAnswer":"원본에 정답 표시 없음","review":"강의노트 대조","status":"solved","ready":true,"explanation":"1993년 관방장관 고노 요헤이가 발표한 고노 담화이다.\n검토 근거: 동북아12-2_과거사문제.pptx · 10쪽","note":"PDF 줄바꿈으로 분리된 단어의 공백만 정리했습니다.","refs":[],"topic":"한일관계","contentRevision":1},{"id":"dongbuka-2024-1-final-10","source":"2024-1 기말","no":10,"text":"2000년대 이후 일본에서의 3차 한류붐은 미증유의 코로나 팬데믹으로 인한 스테이홈을 계기로 OTT 서비스를 통해 드라마나 영화를 부담없이 즐기는 팬층이 폭발적으로 증가하면서 만들어졌다.","options":[{"id":"O","text":"참"},{"id":"X","text":"거짓"}],"type":"ox","answer":"X","ready":true,"status":"solved","review":"자료 대조","explanation":"코로나19·OTT와 관련된 것은 제3차가 아니라 제4차 한류붐이다.\n검토 근거: 한국국제문화교류진흥원: 일본 한류 심층분석","originalAnswer":"원본에 정답 표시 없음","note":"PDF 줄바꿈으로 분리된 단어의 공백을 정리했습니다.","refs":["hallyu"],"topic":"동북아와 한일관계","contentRevision":1},{"id":"dongbuka-2024-1-final-11","source":"2024-1 기말","no":11,"text":"일본은 동아시아를 ‘인도 태평양’으로 인식하여 구성국 확대를 모색하는 지역협력전략을 추진하고 있다.","options":[{"id":"O","text":"참"},{"id":"X","text":"거짓"}],"type":"ox","answer":"O","ready":true,"status":"solved","review":"자료 대조","explanation":"일본은 인도태평양 등 확대된 지역 개념을 통해 구성국 확대를 모색한다.\n검토 근거: 6-3 일한","originalAnswer":"원본에 정답 표시 없음","note":"PDF 줄바꿈으로 분리된 단어의 공백을 정리했습니다.","refs":[],"topic":"동북아와 한일관계","contentRevision":1},{"id":"dongbuka-2024-1-final-12","source":"2024-1 기말","no":12,"text":"신중상주의 통상정책에 대한 비판의 초점이라고 할 수 없는 것은 무엇인가?","options":[{"id":"1","text":"합리적인 경제행위자와 경쟁적 시장이라는 가정 자체가 비현실적이다."},{"id":"2","text":"권력의 추구와 부의 추구는 서로 갈등을 일으킬 수 없다."},{"id":"3","text":"무역이 비록 동등하지 않을지라도 상호이득을 가져올 수 있다는 점을 간과한다."},{"id":"4","text":"강력하고 간섭주의적인 국가가 반드시 경제발전을 보장하지는 않는다."}],"answer":null,"type":"mc","originalText":"신중상주의 통상정책에 대한 비판의 초점이라고 할 수 없는 것은 무엇인가?","originalAnswer":"원본에 정답 표시 없음","review":"재검토 완료 · 원문 확인 필요","status":"pending","ready":false,"explanation":"원문 오류로 출제를 보류한다. 1번은 자유주의에 대한 비판이다. 강의에서 신중상주의 비판은 ‘권력의 추구와 부의 추구는 서로 갈등을 일으킬 수도 있다’인데, 원문 2번은 ‘일으킬 수 없다’로 되어 있어 2번도 비판에 해당하지 않는다. 의도된 답은 1번으로 보이지만 단일 정답을 확정하지 않는다.\n검토 근거: 동북아9-3_통상외교.pptx · 7쪽","note":"원문과 선지를 변경하지 않음. 1·2번 복수 해석 가능.","refs":[],"topic":"통상·경제협력","contentRevision":2},{"id":"dongbuka-2024-1-final-13","source":"2024-1 기말","no":13,"text":"주권의 강조를 다자주의 원리와 접목한 ( )은/는 ASEAN 결성 당시부터 핵심 조직원리로서 ASEAN적 방식을 구성하는 중요한 요소이다.","options":[{"id":"A","text":"주권동등성"},{"id":"B","text":"비공식주의"},{"id":"C","text":"보편주의"},{"id":"D","text":"불간섭주의"}],"answer":"D","type":"mc","originalText":"주권의 강조를 다자주의 원리와 접목한 ( )은/는 ASEAN 결성 당시부터 핵심 조직원리 로서 ASEAN적 방식을 구성하는 중요한 요소이다.","originalAnswer":"원본에 정답 표시 없음","review":"강의노트 대조","status":"solved","ready":true,"explanation":"강의는 주권 강조와 다자주의를 접목한 ASEAN의 핵심 원리를 불간섭주의로 명시한다. 이전 잠정 답안 A를 D로 정정했다.\n검토 근거: 동북아7-2_비전의 충돌.pptx · 9쪽","note":"PDF 줄바꿈으로 분리된 단어의 공백만 정리했습니다.","refs":[],"topic":"동아시아 지역협력","contentRevision":1},{"id":"dongbuka-2024-1-final-14","source":"2024-1 기말","no":14,"text":"베이징 컨센서스는 2004년 골드만 삭스의 고문이며 중국 칭화대 겸직교수인 라모(Joshua Cooper Ramo)가 처음 개념화한 것으로 중국이 주도하는 ‘권위주의 체제하의 시장경제 발전’을 일컫는다.","options":[{"id":"O","text":"참"},{"id":"X","text":"거짓"}],"type":"ox","answer":"O","ready":true,"status":"solved","review":"자료 대조","explanation":"강의는 라모가 2004년 개념화한 권위주의 체제하 시장경제 발전모델로 설명한다.\n검토 근거: 6-2 중","originalAnswer":"원본에 정답 표시 없음","note":"PDF 줄바꿈으로 분리된 단어의 공백을 정리했습니다.","refs":[],"topic":"동북아와 한일관계","contentRevision":1},{"id":"dongbuka-2024-1-final-15","source":"2024-1 기말","no":15,"text":"고조되는 미중 전략경쟁의 파고 속에서 새로운 발상으로 한일 관계를 재건축할 때 요구되는 바람직한 자세가 아닌 것은?","options":[{"id":"1","text":"배타적 민족주의 시각에서 탈피해야 한다."},{"id":"2","text":"한미일 네트워크 짜기의 이면에 존재하는 중국문제에 대해 균형 있는 접근이 필요하다."},{"id":"3","text":"대일정책에 있어 지역적, 지구적 차원이 아니라 특수한 양자 관계 차원에서 공통과제를 해결해 가는 자세로 임해야 한다."},{"id":"4","text":"2030년과 2050년 한국의 미래를 전망하는 장기적 안목으로 일본과 한일관계를 재조명해야 한다."}],"answer":"3","type":"mc","originalText":"고조되는 미중 전략경쟁의 파고 속에서 새로운 발상으로 한일 관계를 재건축할 때 요구 되는 바람직한 자세가 아닌 것은?","originalAnswer":"원본에 정답 표시 없음","review":"강의노트 대조","status":"solved","ready":true,"explanation":"대일외교는 특수한 양자관계에만 한정할 수 없다. 지역·글로벌 전략 및 한미일 등 다층적 협력의 관점에서 접근해야 한다.\n검토 근거: 동북아12-3_과거사문제_미래.pptx · 3쪽","note":"PDF 줄바꿈으로 분리된 단어의 공백만 정리했습니다.","refs":[],"topic":"한일관계","contentRevision":1},{"id":"dongbuka-2024-1-final-16","source":"2024-1 기말","no":16,"text":"일본은 아시아 최초의 근대화 국가로서 내셔널리즘과 민주주의, 저출산 고령화 사회, 환경문제 등을 가장 먼저 경험한, 따라서 타국에 교훈을 줄 수 있는 ( ) 선진국이다.","options":[{"id":"A","text":"종합"},{"id":"B","text":"과제"},{"id":"C","text":"생활"},{"id":"D","text":"복지"}],"answer":"B","type":"mc","originalText":"일본은 아시아 최초의 근대화 국가로서 내셔널리즘과 민주주의, 저출산 고령화 사회, 환 경문제 등을 가장 먼저 경험한, 따라서 타국에 교훈을 줄 수 있는 ( ) 선진국이다.","originalAnswer":"원본에 정답 표시 없음","review":"강의노트 대조","status":"solved","ready":true,"explanation":"저출산·고령화 등 공통 과제를 먼저 경험하여 해법과 교훈을 제공하는 ‘과제 선진국’을 의미한다.\n검토 근거: 12주차_3교시_과거사문제와 한일관계의 미래비전.pptx · 3쪽","note":"PDF 줄바꿈으로 분리된 단어의 공백만 정리했습니다.","refs":[],"topic":"한일관계","contentRevision":1},{"id":"dongbuka-2024-1-final-17","source":"2024-1 기말","no":17,"text":"양자협정들의 내용과 자유화의 일정에 차이가 날수록 FTA의 장점이 줄어들고, 대신 복잡한 원산지 규정 등으로 인한 거래비용이 증가하는 것을 ( ) 효과라고 한다.","options":[{"id":"1","text":"당구공"},{"id":"2","text":"누들보울"},{"id":"3","text":"도미노"},{"id":"4","text":"밴드웨건"}],"answer":"2","type":"mc","originalText":"양자협정들의 내용과 자유화의 일정에 차이가 날수록 FTA의 장점이 줄어들고, 대신 복 잡한 원산지 규정 등으로 인한 거래비용이 증가하는 것을 ( ) 효과라고 한다.","originalAnswer":"원본에 정답 표시 없음","review":"공식 자료 대조","status":"solved","ready":true,"explanation":"여러 FTA의 상이한 규칙과 원산지 기준이 얽혀 기업의 준수 비용을 높이는 현상을 누들보울 효과라고 한다.","note":"PDF 줄바꿈으로 분리된 단어의 공백만 정리했습니다.","refs":["adb"],"topic":"통상·경제협력","contentRevision":1},{"id":"dongbuka-2024-1-final-18","source":"2024-1 기말","no":18,"text":"동아시아 협력체의 심화단계에서 중일 양국의 다른 이해관계와 비전의 충돌에 의해 상호협력과 경쟁 및 견제가 공존함으로써 지역통합의 의미있는 진전을 어렵게 하고 있다. (참/ 거짓)","options":[{"id":"O","text":"참"},{"id":"X","text":"거짓"}],"type":"ox","answer":"O","ready":true,"status":"solved","review":"자료 대조","explanation":"심화단계에서는 중일의 비전 충돌과 경쟁이 통합을 저해한다.\n검토 근거: 8-1 중일경쟁","originalAnswer":"원본에 정답 표시 없음","note":"PDF 줄바꿈으로 분리된 단어의 공백을 정리했습니다.","refs":[],"topic":"동북아와 한일관계","contentRevision":1},{"id":"dongbuka-2024-1-final-19","source":"2024-1 기말","no":19,"text":"냉전 종결 이후 한국에서는 1991년 8월 김복동 할머니가 위안부 피해자임을 최초로 공개 증언함으로써 ‘일본군위안부’ 문제가 제기되었고 한일 간의 외교문제로 발전하였다.","options":[{"id":"O","text":"참"},{"id":"X","text":"거짓"}],"type":"ox","answer":"X","ready":true,"status":"solved","review":"자료 대조","explanation":"최초 공개 증언자는 김복동이 아니라 김학순이다.\n검토 근거: 12주차 2교시 과거사문제와 한일관계의 현주소","originalAnswer":"원본에 정답 표시 없음","note":"PDF 줄바꿈으로 분리된 단어의 공백을 정리했습니다.","refs":[],"topic":"동북아와 한일관계","contentRevision":1},{"id":"dongbuka-2024-1-final-20","source":"2024-1 기말","no":20,"text":"다자주의 분업체제는 협력 틀의 중복이나 협력의 피로 같은 부정적 효과도 있지만, 보다 촘촘한 협력 네트워크가 형성되어 효과적 대처가 가능하다는 긍정적 측면도 있다.","options":[{"id":"O","text":"참"},{"id":"X","text":"거짓"}],"type":"ox","answer":"X","ready":true,"status":"solved","review":"자료 대조","explanation":"협력 틀의 중복·피로와 촘촘한 네트워크의 양면성은 ‘다자주의의 다원적 공존’에 관한 설명이다. 기능을 나누는 분업체제와 구별해야 한다.\n검토 근거: 8-2 문제점과 시나리오","originalAnswer":"원본에 정답 표시 없음","note":"PDF 줄바꿈으로 분리된 단어의 공백을 정리했습니다.","refs":[],"topic":"동북아와 한일관계","contentRevision":1},{"id":"dongbuka-2024-1-final-21","source":"2024-1 기말","no":21,"text":"일본 정부는 2014년 4월 특정 조건을 만족하면 무기 수출을 허용하는 ‘방위 장비이전 3원칙’을 각의 결정한 바 있다.","options":[{"id":"O","text":"참"},{"id":"X","text":"거짓"}],"type":"ox","answer":"O","ready":true,"status":"solved","review":"자료 대조","explanation":"2014년 4월 방위장비이전 3원칙으로 전환하여 일정 조건에서 수출을 허용했다.\n검토 근거: 9-1 일본의 안보외교","originalAnswer":"원본에 정답 표시 없음","note":"PDF 줄바꿈으로 분리된 단어의 공백을 정리했습니다.","refs":[],"topic":"동북아와 한일관계","contentRevision":1},{"id":"dongbuka-2024-1-final-22","source":"2024-1 기말","no":22,"text":"전후 일본의 소극적 안보외교의 제도적 틀에 포함되지 않는 것은 무엇인가?","options":[{"id":"A","text":"미일안보체제"},{"id":"B","text":"수출통제법"},{"id":"C","text":"비핵 3원칙"},{"id":"D","text":"일본국헌법 제9조"}],"answer":"B","type":"mc","originalText":"전후 일본의 소극적 안보외교의 제도적 틀에 포함되지 않는 것은 무엇인가?","originalAnswer":"원본에 정답 표시 없음","review":"강의노트 대조","status":"solved","ready":true,"explanation":"강의의 제도적 틀은 헌법 제9조·전수방위, 비핵 3원칙, 무기수출 3원칙, 미일안보체제, 문민통제이다. 선택지의 수출통제법은 해당 목록에 없다.\n검토 근거: 동북아9-1_일본의 안보외교.pptx · 9쪽","note":"PDF 줄바꿈으로 분리된 단어의 공백만 정리했습니다.","refs":[],"topic":"일본 안보외교","contentRevision":1},{"id":"dongbuka-2024-1-final-23","source":"2024-1 기말","no":23,"text":"한일기본조약의 체결 과정은 기본적으로 냉전논리가 경제논리와 과거사 청산논리를 압도하는 방식으로 전개되었다.","options":[{"id":"O","text":"참"},{"id":"X","text":"거짓"}],"type":"ox","answer":"O","ready":true,"status":"solved","review":"자료 대조","explanation":"국교정상화는 냉전기 반공·안보 논리가 우선하는 구조에서 추진되었다.\n검토 근거: 12주차 1교시 한일관계의 구조전환","originalAnswer":"원본에 정답 표시 없음","note":"PDF 줄바꿈으로 분리된 단어의 공백을 정리했습니다.","refs":[],"topic":"동북아와 한일관계","contentRevision":1},{"id":"dongbuka-2024-1-final-24","source":"2024-1 기말","no":24,"text":"규칙 기반 국제질서를 통해 중국의 강압적이고 때로는 약탈적인 행동을 제어하고 미국의 일방주의 및 자국중심주의 추세를 저지하며 중견국의 역할 공간을 넓혀주는 장을 마련하기 위해서는 일본과 협력할 수밖에 없다.","options":[{"id":"O","text":"참"},{"id":"X","text":"거짓"}],"type":"ox","answer":"O","ready":true,"status":"solved","review":"자료 대조","explanation":"규칙 기반 질서와 중견국 협력 관점에서 대일협력이 필요하다는 강의 취지에 부합한다.\n검토 근거: 12주차 3교시 과거사문제와 한일관계의 미래비전","originalAnswer":"원본에 정답 표시 없음","note":"PDF 줄바꿈으로 분리된 단어의 공백을 정리했습니다.","refs":[],"topic":"동북아와 한일관계","contentRevision":1},{"id":"dongbuka-2024-1-final-25","source":"2024-1 기말","no":25,"text":"탈냉전 후 한일관계의 성격과 양상의 변화에 대한 기술로서 적합하지 않은 것은?","options":[{"id":"1","text":"한일 양국은 과거사, 영토문제로 인해 여전히 첨예한 대립과 갈등의 국면을 벗어나지 못하고 있다."},{"id":"2","text":"탈냉전 이후의 한일 안보관계는 냉전시대에 비해 복잡한 양상을 보이고 있다."},{"id":"3","text":"한일 양국이 다루어야 할 협력과 갈등의 영역이 양국간 관계의 범주를 넘어서 지역적, 세계적 차원으로 확대되고 있다."},{"id":"4","text":"한일 정치인 간의 비공식 채널이 강화된 것과는 달리, 시민사회나 지방 자치제 간의 교류는 감소했다."}],"answer":"4","type":"mc","originalText":"탈냉전 후 한일관계의 성격과 양상의 변화에 대한 기술로서 적합하지 않은 것은?","originalAnswer":"원본에 정답 표시 없음","review":"강의노트 대조","status":"solved","ready":true,"explanation":"강의는 정치인 간 채널은 약화된 반면 시민사회·지방자치체 교류는 확대되었다고 설명한다. 4번은 이를 반대로 서술했다.\n검토 근거: 동북아12-1_구조전환.pptx · 9쪽","note":"PDF 줄바꿈으로 분리된 단어의 공백만 정리했습니다.","refs":[],"topic":"한일관계","contentRevision":1},{"id":"dongbuka-2024-1-final-26","source":"2024-1 기말","no":26,"text":"CMI 및 CMI 다자화(CMIM)에 대한 기술 중 바르지 못한 것은?","options":[{"id":"1","text":"위기 국가는 일정액을 넘는 부분에 대해서는 IMF와 협의 후 CMIM의 신용을 할당받아야 하며 IMF의 이행조건을 수용해야 한다."},{"id":"2","text":"2010년 3월 CMI 다자화(CMIM) 협정이 발효되었다."},{"id":"3","text":"2008년 글로벌 금융위기 시 유동성 위기에 직면한 국가들이 CMI를 적극적으로 활용했다."},{"id":"4","text":"2014년 7월 신용규모를 2400억 달러로 증액하는 협정 개정안이 발효되었다."}],"answer":"3","type":"mc","originalText":"CMI 및 CMI 다자화(CMIM)에 대한 기술 중 바르지 못한 것은?","originalAnswer":"원본에 정답 표시 없음","review":"강의노트 대조","status":"solved","ready":true,"explanation":"2008년 위기 때 CMI가 적극 활용되었다는 서술은 틀리다. 강의는 미발동과 제도의 실효성 문제를 다룬다.\n검토 근거: 1교시_동아시아 공동체의 분수령.pptx · 12쪽","note":"PDF 줄바꿈으로 분리된 단어의 공백만 정리했습니다.","refs":[],"topic":"통상·경제협력","contentRevision":1},{"id":"dongbuka-2024-1-final-27","source":"2024-1 기말","no":27,"text":"동아시아지역 안보에 있어서는 미국과의 ( ) 시스템을 중심으로 한 양자주의적 협력관계가 기본 틀을 이루고 있다.","options":[{"id":"A","text":"동심원"},{"id":"B","text":"허브앤스포크"},{"id":"C","text":"확장억지"},{"id":"D","text":"집단방위"}],"answer":"B","type":"mc","originalText":"동아시아지역 안보에 있어서는 미국과의 ( ) 시스템을 중심으로 한 양자주의적 협력관 계가 기본 틀을 이루고 있다.","originalAnswer":"원본에 정답 표시 없음","review":"강의노트 대조","status":"solved","ready":true,"explanation":"미국을 중심으로 개별 동맹국을 연결하는 양자 동맹망은 허브앤스포크이다.\n검토 근거: 동북아7-2_비전의 충돌.pptx · 12쪽","note":"PDF 줄바꿈으로 분리된 단어의 공백만 정리했습니다.","refs":[],"topic":"동아시아 지역협력","contentRevision":1},{"id":"dongbuka-2024-1-final-28","source":"2024-1 기말","no":28,"text":"‘동아시아비전그룹(EAVG)’과 ‘동아시아스터디그룹(EASG)’이 제출한 보고서에서 제안된 트랙2(반관반민)의 동아시아 싱크탱크 네트워크는 무엇인가?","options":[{"id":"A","text":"ERPD"},{"id":"B","text":"AMRO"},{"id":"C","text":"NEAT"},{"id":"D","text":"ERIA"}],"answer":"C","type":"mc","originalText":"‘동아시아비전그룹(EAVG)’과 ‘동아시아스터디그룹(EASG)’이 제출한 보고서에서 제안된 트 랙2(반관반민)의 동아시아 싱크탱크 네트워크는 무엇인가?","originalAnswer":"원본에 정답 표시 없음","review":"강의노트 대조","status":"solved","ready":true,"explanation":"EAVG·EASG 보고서에서 제안된 동아시아 싱크탱크 네트워크는 NEAT이다.\n검토 근거: 동북아8-1_중일경쟁.pptx · 10쪽","note":"PDF 줄바꿈으로 분리된 단어의 공백만 정리했습니다.","refs":[],"topic":"동아시아 지역협력","contentRevision":1},{"id":"dongbuka-2024-1-final-29","source":"2024-1 기말","no":29,"text":"2010년 7월 베트남에서 개최된 ASEAN 외상회담에서 미국과 캐나다는 EAS 정식 회원국으로 초청이 결정되었고, 2011년부터 정식 회원국으로 참여하고 있다.","options":[{"id":"O","text":"참"},{"id":"X","text":"거짓"}],"type":"ox","answer":"X","ready":true,"status":"solved","review":"자료 대조","explanation":"미국과 함께 초청되어 2011년 참여한 국가는 캐나다가 아니라 러시아이다.\n검토 근거: 7-3 권력지형과 리더십","originalAnswer":"원본에 정답 표시 없음","note":"PDF 줄바꿈으로 분리된 단어의 공백을 정리했습니다.","refs":[],"topic":"동북아와 한일관계","contentRevision":1},{"id":"dongbuka-2024-1-final-30","source":"2024-1 기말","no":30,"text":"중국의 비중을 줄여가면서 차이나+1을 서둘러 추진하는 것은 공급망 리스크에 대한 적절한 대응책 중의 하나라고 할 수 있다.","options":[{"id":"O","text":"참"},{"id":"X","text":"거짓"}],"type":"ox","answer":"O","ready":true,"status":"solved","review":"자료 대조","explanation":"중국 이외 국가로 공급망을 분산하는 차이나+1을 대응 전략으로 제시한다.\n검토 근거: 10-1 도전요인","originalAnswer":"원본에 정답 표시 없음","note":"PDF 줄바꿈으로 분리된 단어의 공백을 정리했습니다.","refs":[],"topic":"동북아와 한일관계","contentRevision":1},{"id":"dongbuka-2024-1-final-31","source":"2024-1 기말","no":31,"text":"EAS는 동아시아 협력사업을 주축으로 APT는 전략적 대화체로서의 역할을 설정함으로써 분업적 구조를 이루고 있다.","options":[{"id":"O","text":"참"},{"id":"X","text":"거짓"}],"type":"ox","answer":"X","ready":true,"status":"solved","review":"자료 대조","explanation":"역할을 반대로 서술했다. APT는 실질적 협력사업, EAS는 전략적 대화를 맡는다.\n검토 근거: 8-3 협력의 방향성","originalAnswer":"원본에 정답 표시 없음","note":"PDF 줄바꿈으로 분리된 단어의 공백을 정리했습니다.","refs":[],"topic":"동북아와 한일관계","contentRevision":1},{"id":"dongbuka-2024-1-final-32","source":"2024-1 기말","no":32,"text":"아베 신조 전 총리의 이름을 딴 ‘아베노믹스(Abenomics)’ 경제정책에 포함되지 않는 것은 무엇인가?","options":[{"id":"A","text":"대담한 양적완화"},{"id":"B","text":"기동적 재정지출"},{"id":"C","text":"성장전략"},{"id":"D","text":"유연한 환율조정"}],"answer":"D","type":"mc","originalText":"아베 신조 전 총리의 이름을 딴 ‘아베노믹스(Abenomics)’ 경제정책에 포함되지 않는 것 은 무엇인가?","originalAnswer":"원본에 정답 표시 없음","review":"강의노트 대조","status":"solved","ready":true,"explanation":"아베노믹스의 세 축은 금융완화, 재정지출, 성장전략이다. 유연한 환율조정은 세 축에 포함되지 않는다.\n검토 근거: 동북아10-1_도전요인.pptx · 6쪽","note":"PDF 줄바꿈으로 분리된 단어의 공백만 정리했습니다.","refs":[],"topic":"통상·경제협력","contentRevision":1},{"id":"dongbuka-2024-1-final-33","source":"2024-1 기말","no":33,"text":"한일관계에 있어 과거사문제에 대한 접근법에 관한 설명으로 적절하지 않은 것은 무엇인가?","options":[{"id":"1","text":"대일 외교 어젠다는 위안부 등 역사문제 이외에도 대북 공조, 외교안보협력, 경제협력, 사회문화 교류 분야에서의 공조, 협력 등 중요한 영역이 존재한다는 사실을 고려해야 한다."},{"id":"2","text":"냉철한 국익의 계산과 철저한 전략적 사고로 대일 외교를 정립해야 하며 그 기반은 일본의 리얼리티를 제대로 읽는데서 출발해야 한다."},{"id":"3","text":"한일관계에서 역사 문제와 비 역사 쟁점(안보, 경제 등)은 분리하지 않고 통합적으로 다루는 것이 효과적이다."},{"id":"4","text":"민주국가에서 국민여론은 중시되어야 하나 국민 정서, 대중의 감정에 휩쓸리는 대일 과거사 외교의 함정에 빠져서는 안 된다."}],"answer":"3","type":"mc","originalText":"한일관계에 있어 과거사문제에 대한 접근법에 관한 설명으로 적절하지 않은 것은 무엇 인가?","originalAnswer":"원본에 정답 표시 없음","review":"강의노트 대조","status":"solved","ready":true,"explanation":"강의는 역사 쟁점과 안보·경제 등 비역사 쟁점을 분리하여 각 영역의 논리에 맞게 다루도록 제시한다. 따라서 통합적으로 다룬다는 3번은 부적절하다.\n검토 근거: 동북아12-3_과거사문제_미래.pptx · 5쪽","note":"PDF 줄바꿈으로 분리된 단어의 공백만 정리했습니다.","refs":[],"topic":"한일관계","contentRevision":1},{"id":"dongbuka-2024-1-final-34","source":"2024-1 기말","no":34,"text":"중국은 미국을 향해 상호 신뢰를 바탕으로 영토 문제 등 핵심 이익을 존중하자는 ‘신형대국 관계’ 전략을 표방했으며 미국의 인도태평양 전략과 일본의 적극적 평화주의가 이와 부합한다고 판단하고 있다.","options":[{"id":"O","text":"참"},{"id":"X","text":"거짓"}],"type":"ox","answer":"X","ready":true,"status":"solved","review":"자료 대조","explanation":"미국의 인도태평양 전략과 일본의 적극적 평화주의는 중국과 전략적으로 경쟁하는 측면이 있다.\n검토 근거: 6-1 미; 6-2 중","originalAnswer":"원본에 정답 표시 없음","note":"PDF 줄바꿈으로 분리된 단어의 공백을 정리했습니다.","refs":[],"topic":"동북아와 한일관계","contentRevision":1},{"id":"dongbuka-2024-1-final-35","source":"2024-1 기말","no":35,"text":"미국이 일본의 ( ) 행사를 용인한 것은 안보 차원의 실용적 결정으로 일본의 보수세력과 이해관계가 합치한 결과라고 볼 수 있다.","options":[{"id":"1","text":"개별적 자위권"},{"id":"2","text":"무력"},{"id":"3","text":"거부권"},{"id":"4","text":"집단적 자위권"}],"answer":"4","type":"mc","originalText":"미국이 일본의 ( ) 행사를 용인한 것은 안보 차원의 실용적 결정으로 일본의 보수세력 과 이해관계가 합치한 결과라고 볼 수 있다.","originalAnswer":"원본에 정답 표시 없음","review":"강의노트 대조","status":"solved","ready":true,"explanation":"미국의 안보상 필요와 일본 보수세력의 이해가 합치한 것은 집단적 자위권 행사 용인이다.\n검토 근거: 동북아9-2_미일동맹.pptx · 20쪽","note":"PDF 줄바꿈으로 분리된 단어의 공백만 정리했습니다.","refs":[],"topic":"일본 안보외교","contentRevision":1},{"id":"dongbuka-2024-1-final-36","source":"2024-1 기말","no":36,"text":"일본에서는 2008년 북경올림픽, 리먼 쇼크, 2010년 센카쿠 열도 분쟁을 거치면서 중국의 부상을 염두에 둔 ( ) 지역 인식이 자리잡기 시작했다.","options":[{"id":"1","text":"유라시아"},{"id":"2","text":"동아시아"},{"id":"3","text":"인도태평양"},{"id":"4","text":"아시아태평양"}],"answer":"3","type":"mc","originalText":"일본에서는 2008년 북경올림픽, 리먼 쇼크, 2010년 센카쿠 열도 분쟁을 거치면서 중국 의 부상을 염두에 둔 ( ) 지역 인식이 자리잡기 시작했다.","originalAnswer":"원본에 정답 표시 없음","review":"강의노트 대조","status":"solved","ready":true,"explanation":"강의는 이 사건들을 거치며 중국의 부상을 고려한 인도태평양 지역 인식이 태동했다고 설명한다.\n검토 근거: 동북아6-3_일한.pptx · 4쪽","note":"PDF 줄바꿈으로 분리된 단어의 공백만 정리했습니다.","refs":[],"topic":"동아시아 지역협력","contentRevision":1},{"id":"dongbuka-2024-1-final-37","source":"2024-1 기말","no":37,"text":"다음 중 역내포괄적 경제동반자협정(RCEP) 참가(서명)국이 아닌 나라는 어디인가?","options":[{"id":"A","text":"호주"},{"id":"B","text":"뉴질랜드"},{"id":"C","text":"일본"},{"id":"D","text":"인도"}],"answer":"D","type":"mc","originalText":"다음 중 역내포괄적 경제동반자협정(RCEP) 참가(서명)국이 아닌 나라는 어디인가?","originalAnswer":"원본에 정답 표시 없음","review":"공식 자료 대조","status":"solved","ready":true,"explanation":"2020년 RCEP 서명국에는 호주·뉴질랜드·일본이 포함된다. 인도는 협상에서 이탈하여 서명하지 않았다.","note":"PDF 줄바꿈으로 분리된 단어의 공백만 정리했습니다.","refs":["rcep"],"topic":"통상·경제협력","contentRevision":1},{"id":"dongbuka-2024-1-final-38","source":"2024-1 기말","no":38,"text":"일본정부는 위안부 문제를 포함하여 한일 간 재산 및 청구권 문제는 1965년 일한 청구권 경제협력협정에서 ‘완전히 그리고 최종적으로 해결’되었고 어떠한 주장도 할 수 없다는 입장을 견지하고 있다.","options":[{"id":"O","text":"참"},{"id":"X","text":"거짓"}],"type":"ox","answer":"O","ready":true,"status":"solved","review":"자료 대조","explanation":"청구권협정으로 문제가 해결되었다는 일본 정부의 입장을 서술한 것이다. 그 입장 자체에 대한 법적 동의를 의미하지 않는다.\n검토 근거: 12-2 과거사문제","originalAnswer":"원본에 정답 표시 없음","note":"PDF 줄바꿈으로 분리된 단어의 공백을 정리했습니다.","refs":[],"topic":"동북아와 한일관계","contentRevision":1},{"id":"dongbuka-2024-1-final-39","source":"2024-1 기말","no":39,"text":"1986년 미일 반도체 협정 체결 등을 계기로 당시 반도체 메모리 분야에서 시장을 석권하였던 일본이 미일 반도체 협정이라는 제약에 묶여 한국, 대만의 ‘catch-up’을 허용하게 되었다.","options":[{"id":"O","text":"참"},{"id":"X","text":"거짓"}],"type":"ox","answer":"O","ready":true,"status":"solved","review":"자료 대조","explanation":"강의는 미일 반도체 협정이 일본의 경쟁력을 제약하고 한국·대만의 추격을 허용한 계기라고 설명한다.\n검토 근거: 9-3 통상외교","originalAnswer":"원본에 정답 표시 없음","note":"PDF 줄바꿈으로 분리된 단어의 공백을 정리했습니다.","refs":[],"topic":"동북아와 한일관계","contentRevision":1},{"id":"dongbuka-2024-1-final-40","source":"2024-1 기말","no":40,"text":"하토야마 유키오의 동아시아공동체론의 원형은 쿠덴호프 칼레르기(Nikolaus von Coudenhove-Kalergi)의 ( ) 사상과 유럽통합론(Pan Europe)이다.","options":[{"id":"A","text":"공동체"},{"id":"B","text":"화평"},{"id":"C","text":"공영"},{"id":"D","text":"우애"}],"answer":"D","type":"mc","originalText":"하토야마 유키오의 동아시아공동체론의 원형은 쿠덴호프 칼레르기(Nikolaus von Coude nhove-Kalergi)의 ( ) 사상과 유럽통합론(Pan Europe)이다.","originalAnswer":"원본에 정답 표시 없음","review":"강의노트 대조","status":"solved","ready":true,"explanation":"하토야마의 공동체론은 칼레르기의 우애 사상과 유럽통합론을 원형으로 한다.\n검토 근거: 동북아6-3_일한.pptx · 8쪽","note":"PDF 줄바꿈으로 분리된 단어의 공백만 정리했습니다.","refs":[],"topic":"동아시아 지역협력","contentRevision":1},{"id":"dongbuka-2024-1-final-41","source":"2024-1 기말","no":41,"text": ],"topic":"동북아와 한일관계","contentRevision":1},{"id":"dongbuka-2025-1-final-12","source":"2025-1 기말","no":12,"text":"일본의 소극적 안보외교는 평화헌법 제9조와 (      )정책을 핵심으로 한다.","options":[{"id":"1","text":"적극적 평화주의"},{"id":"2","text":"국방자위력"},{"id":"3","text":"자주적 재무장"},{"id":"4","text":"대동아공영론"},{"id":"5","text":"전수방위"}],"type":"mc","answer":"5","ready":true,"status":"solved","review":"자료 대조","explanation":"헌법 제9조와 전수방위정책이 핵심이다.\n검토 근거: 9-1 일본의 안보외교","originalAnswer":"사진의 선택 표시는 응시 답안이며, 정답 여부를 별도로 검증함","note":"사진을 전사하고 불필요한 줄바꿈·중복 표시만 정리했습니다.","refs":[],"topic":"동북아와 한일관계","contentRevision":1},{"id":"dongbuka-2025-1-final-13","source":"2025-1 기말","no":13,"text":"중국과의 안보경쟁적 요소가 강한 미국의 FOIP에 비해 일본의 FOIP는 포섭성을 중시하고, 개발협력 및 경제외교의 요소가 강하다고 할 수 있다.","options":[{"id":"O","text":"참"},{"id":"X","text":"거짓"}],"type":"ox","answer":"O","ready":true,"status":"solved","review":"자료 대조","explanation":"강의의 미·일 FOIP 비교와 일치한다.\n검토 근거: 6-3 일한","originalAnswer":"사진의 선택 표시는 응시 답안이며, 정답 여부를 별도로 검증함","note":"사진을 전사하고 불필요한 줄바꿈·중복 표시만 정리했습니다.","refs":[],"topic":"동북아와 한일관계","contentRevision":1},{"id":"dongbuka-2025-1-final-14","source":"2025-1 기말","no":14,"text":"1985년 플라자합의는 일본 엔화의 (      )을 유도하였으며, 이는 일본 수출기업에 큰 영향을 미쳤다.","options":[{"id":"1","text":"평가절상"},{"id":"2","text":"통화량 증가"},{"id":"3","text":"평가절하"},{"id":"4","text":"내수진작"},{"id":"5","text":"시장확대"}],"type":"mc","answer":"1","ready":true,"status":"solved","review":"자료 대조","explanation":"플라자합의는 달러 평가절하와 엔화 평가절상을 유도했다.\n검토 근거: 9-3 통상외교","originalAnswer":"사진의 선택 표시는 응시 답안이며, 정답 여부를 별도로 검증함","note":"사진을 전사하고 불필요한 줄바꿈·중복 표시만 정리했습니다.","refs":[],"topic":"동북아와 한일관계","contentRevision":1},{"id":"dongbuka-2025-1-final-15","source":"2025-1 기말","no":15,"text":"동아시아에는 경제협력에 비해 실질적인 안보협력체가 부재하며, ARF나 6자회담은 상징적 성격이 강하다.","options":[{"id":"O","text":"참"},{"id":"X","text":"거짓"}],"type":"ox","answer":"O","ready":true,"status":"solved","review":"자료 대조","explanation":"동아시아 전체 단위의 실질적 공식 안보협력체가 부재하다는 강의 취지에 부합한다. ARF와 6자회담은 각각 대화체·하위지역 협의체이다.\n검토 근거: 7-3 권력지형과 리더십","originalAnswer":"사진의 선택 표시는 응시 답안이며, 정답 여부를 별도로 검증함","note":"사진을 전사하고 불필요한 줄바꿈·중복 표시만 정리했습니다.","refs":[],"topic":"동북아와 한일관계","contentRevision":1},{"id":"dongbuka-2025-1-final-16","source":"2025-1 기말","no":16,"text":"1997년 미일 방위협력 지침 개정은 일본의 (      ) 역할 확대를 가능하게 했다.","options":[{"id":"1","text":"집단자위권"},{"id":"2","text":"직접공격"},{"id":"3","text":"평화유지군"},{"id":"4","text":"전수방위"},{"id":"5","text":"후방지원"}],"type":"mc","answer":"5","ready":true,"status":"solved","review":"자료 대조","explanation":"미군에 대한 일본의 후방지원 범위를 주변지역 유사시로 확대했다.\n검토 근거: 9-2 미일동맹","originalAnswer":"사진의 선택 표시는 응시 답안이며, 정답 여부를 별도로 검증함","note":"사진을 전사하고 불필요한 줄바꿈·중복 표시만 정리했습니다.","refs":[],"topic":"동북아와 한일관계","contentRevision":1},{"id":"dongbuka-2025-1-final-17","source":"2025-1 기말","no":17,"text":"한일 국교 정상화 이후, 1990년대 이전까지 한일의원연맹과 같은 공식적 채널 이외에도 한일협력위원회나 한일친선협회 등의 다양한 비공식적 채널이 존재하여 양국 간의 갈등사안이 정치쟁점화 되기 이전에 사전에 막후에서 조정, 타협되었다.","options":[{"id":"O","text":"참"},{"id":"X","text":"거짓"}],"type":"ox","answer":"O","ready":true,"status":"solved","review":"자료 대조","explanation":"강의의 공식·비공식 채널과 막후 조정 설명에 일치한다.\n검토 근거: 12-1 구조전환","originalAnswer":"사진의 선택 표시는 응시 답안이며, 정답 여부를 별도로 검증함","note":"사진을 전사하고 불필요한 줄바꿈·중복 표시만 정리했습니다.","refs":[],"topic":"동북아와 한일관계","contentRevision":1},{"id":"dongbuka-2025-1-final-18","source":"2025-1 기말","no":18,"text":"2015년 한일 위안부 합의에서 한국 정부는 관련 단체와의 협의 등을 통해 소녀상 문제가 적절히 해결되도록 노력하기로 하였다.","options":[{"id":"O","text":"참"},{"id":"X","text":"거짓"}],"type":"ox","answer":"O","ready":true,"status":"solved","review":"공식 원문 검증·문구 수정","explanation":"정답: 참. 2015년 12월 28일 한일 외교장관 공동발표의 한국 측 발표 2항에는 관련 단체와의 협의 등을 통해 소녀상 문제가 적절히 해결되도록 노력한다는 내용이 있다. 해결 노력의 표명과 소녀상 철거 또는 해결 결과 자체의 보장은 구별해야 한다. 원문의 ‘해결을 공식적으로 약속’이라는 표현만으로 참·거짓을 단정하지 않고, 합의문에 맞춘 수정 문장을 출제한다.","originalAnswer":"사진의 선택 표시는 응시 답안이며, 정답 여부를 별도로 검증함","note":"원문: 2015년 한일 위안부 합의에서 한국 정부는 소녀상 문제 해결을 공식적으로 약속하였다.\n수정 이유: 해결 노력과 결과 보장을 혼동할 수 있는 표현을 공식 합의문에 맞춰 명확히 함. 정답 O는 수정 문장에 대한 답이며 원본 시험의 공식 정답 확인을 뜻하지 않음.","refs":["agreement"],"topic":"동북아와 한일관계","contentRevision":2,"originalText":"2015년 한일 위안부 합의에서 한국 정부는 소녀상 문제 해결을 공식적으로 약속하였다."},{"id":"dongbuka-2025-1-final-19","source":"2025-1 기말","no":19,"text":"다음 중 2015년 한일 위안부 합의에 일본 측이 표명한 내용이 아닌 것은?","options":[{"id":"1","text":"10억엔 규모의 재단 자금 제공"},{"id":"2","text":"문제의 최종적 및 불가역적 해결 확인"},{"id":"3","text":"소녀상 철거에 대한 일본 정부의 요구"},{"id":"4","text":"국제사회에서 상호 비난 자제"},{"id":"5","text":"위안부 피해자에 대한 사죄와 반성"}],"type":"mc","answer":"3","ready":true,"status":"solved","review":"자료 대조","explanation":"공식 발표의 일본 측 표명사항에는 철거 요구가 명시되지 않았다. 소녀상 우려와 해결 노력은 한국 측 표명 부분에 있다.\n검토 근거: 12-2 과거사문제","originalAnswer":"사진의 선택 표시는 응시 답안이며, 정답 여부를 별도로 검증함","note":"사진을 전사하고 불필요한 줄바꿈·중복 표시만 정리했습니다.","refs":["agreement"],"topic":"동북아와 한일관계","contentRevision":1},{"id":"dongbuka-2025-1-final-20","source":"2025-1 기말","no":20,"text":"동아시아 협력체들 중 CMI(치앙마이 이니셔티브)는 글로벌 금융위기에서 역내 국가들의 외환위기 대응에 매우 효과적인 역할을 수행했다.","options":[{"id":"O","text":"참"},{"id":"X","text":"거짓"}],"type":"ox","answer":"X","ready":true,"status":"solved","review":"자료 대조","explanation":"2008년 위기에 CMI는 활용되지 않았고 IMF 연계 등 실효성 문제가 드러났다.\n검토 근거: 10-2 과제","originalAnswer":"사진의 선택 표시는 응시 답안이며, 정답 여부를 별도로 검증함","note":"사진을 전사하고 불필요한 줄바꿈·중복 표시만 정리했습니다.","refs":[],"topic":"동북아와 한일관계","contentRevision":1},{"id":"dongbuka-2025-1-final-21","source":"2025-1 기말","no":21,"text":"미국이 일본의 (      ) 행사를 용인한 것은 안보 차원의 실용적 결정으로 일본의 보수세력과 이해관계가 합치한 결과라고 할 수 있다.","options":[{"id":"1","text":"거부권"},{"id":"2","text":"개별적 자위권"},{"id":"3","text":"무력"},{"id":"4","text":"집단적 자위권"}],"type":"mc","answer":"4","ready":true,"status":"solved","review":"자료 대조","explanation":"집단적 자위권의 행사 용인이다.\n검토 근거: 9-2 미일동맹","originalAnswer":"사진의 선택 표시는 응시 답안이며, 정답 여부를 별도로 검증함","note":"사진을 전사하고 불필요한 줄바꿈·중복 표시만 정리했습니다.","refs":[],"topic":"동북아와 한일관계","contentRevision":1},{"id":"dongbuka-2025-1-final-22","source":"2025-1 기말","no":22,"text":"EAS(동아시아정상회의)는 2005년 16개국으로 시작되었으며, 미국과 러시아는 처음부터 정회원국으로 참여했다.","options":[{"id":"O","text":"참"},{"id":"X","text":"거짓"}],"type":"ox","answer":"X","ready":true,"status":"solved","review":"자료 대조","explanation":"미국과 러시아는 2011년부터 참여했다.\n검토 근거: 7-3 권력지형과 리더십","originalAnswer":"사진의 선택 표시는 응시 답안이며, 정답 여부를 별도로 검증함","note":"사진을 전사하고 불필요한 줄바꿈·중복 표시만 정리했습니다.","refs":[],"topic":"동북아와 한일관계","contentRevision":1},{"id":"dongbuka-2025-1-final-23","source":"2025-1 기말","no":23,"text":"미중 전략경쟁 심화에 따른 국제통상질서 변화에 대한 설명으로 옳지 않은 것은?","options":[{"id":"1","text":"공급망의 민주화가 새로운 기준이 되었다."},{"id":"2","text":"반도체·AI 등이 통상전략의 중심이다."},{"id":"3","text":"디지털 주권이 무역규범의 핵심 변수로 부상하였다."},{"id":"4","text":"기술 중심 통상 패러다임이 부상하였다."},{"id":"5","text":"WTO 중심의 다자주의가 강화되고 있다."}],"type":"mc","answer":"5","ready":true,"status":"solved","review":"자료 대조","explanation":"강의가 설명하는 경제안보 중심 공급망 재편과 질서의 분절화·소다자 협력 확산에 반하는 서술이다.\n검토 근거: 10주차 2교시 공생을 위한 동아시아 경제질서: 과제","originalAnswer":"사진의 선택 표시는 응시 답안이며, 정답 여부를 별도로 검증함","note":"사진을 전사하고 불필요한 줄바꿈·중복 표시만 정리했습니다.","refs":[],"topic":"동북아와 한일관계","contentRevision":1},{"id":"dongbuka-2025-1-final-24","source":"2025-1 기말","no":24,"text":"동아시아협력의 형성 단계에서는 중일경쟁이 FTA 체결을 촉진하는 긍정적 역할을 하기도 했다.","options":[{"id":"O","text":"참"},{"id":"X","text":"거짓"}],"type":"ox","answer":"O","ready":true,"status":"solved","review":"자료 대조","explanation":"중국의 대ASEAN FTA 추진이 일본 등의 경쟁적 FTA 추진을 촉진했다.\n검토 근거: 8-1 중일경쟁","originalAnswer":"사진의 선택 표시는 응시 답안이며, 정답 여부를 별도로 검증함","note":"사진을 전사하고 불필요한 줄바꿈·중복 표시만 정리했습니다.","refs":[],"topic":"동북아와 한일관계","contentRevision":1},{"id":"dongbuka-2025-1-final-25","source":"2025-1 기말","no":25,"text":"동아시아 지역주의가 실질적인 공동체로 발전하지 못한 주요 요인 중 하나는 인식공동체의 발전 결여이다.","options":[{"id":"O","text":"참"},{"id":"X","text":"거짓"}],"type":"ox","answer":"O","ready":true,"status":"solved","review":"자료 대조","explanation":"심도 있는 인식공동체 발전의 결여가 강의에 제시된다.\n검토 근거: 6-1 미","originalAnswer":"사진의 선택 표시는 응시 답안이며, 정답 여부를 별도로 검증함","note":"사진을 전사하고 불필요한 줄바꿈·중복 표시만 정리했습니다.","refs":[],"topic":"동북아와 한일관계","contentRevision":1},{"id":"dongbuka-2025-1-final-26","source":"2025-1 기말","no":26,"text":"기시다 정권의 ‘새로운 일본형 자본주의’는 일본을 포함한 세계 각국이 추진해 온 신자유주의 노선에 대한 반작용의 결과물이라고 할 수 ext":"다층적 네트워크 형성을 통한 대응력 강화"},{"id":"5","text":"특정 지역에 집중된 단일 체제 강조"}],"type":"mc","answer":"5","ready":true,"status":"solved","review":"자료 대조","explanation":"여러 협력체의 병존과 촘촘한 네트워크를 인정하는 구상이다.\n검토 근거: 8-2 문제점과 시나리오","originalAnswer":"사진의 선택 표시는 응시 답안이며, 정답 여부를 별도로 검증함","note":"사진을 전사하고 불필요한 줄바꿈·중복 표시만 정리했습니다.","refs":[],"topic":"동북아와 한일관계","contentRevision":1},{"id":"dongbuka-2025-1-final-38","source":"2025-1 기말","no":38,"text":"한일 간 제도적 협력 강화를 위해서는 (      ) 플랫폼을 활용한 경제안보 대화의 정례화가 요구된다.","options":[{"id":"1","text":"OECD"},{"id":"2","text":"G7"},{"id":"3","text":"UNCTAD"},{"id":"4","text":"IPEF"},{"id":"5","text":"WTO"}],"type":"mc","answer":"4","ready":true,"status":"solved","review":"자료 대조","explanation":"선택지 중 공급망 등 경제안보 협력을 제도화하는 직접적인 틀은 IPEF이다. 강의에서 한일의 IPEF 공급망 협력을 다룬다.\n검토 근거: 10주차 2교시 공생을 위한 동아시아 경제질서: 과제","originalAnswer":"사진의 선택 표시는 응시 답안이며, 정답 여부를 별도로 검증함","note":"사진을 전사하고 불필요한 줄바꿈·중복 표시만 정리했습니다.","refs":[],"topic":"동북아와 한일관계","contentRevision":1},{"id":"dongbuka-2025-1-final-39","source":"2025-1 기말","no":39,"text":"(      )은/는 국적과 문화의 차이를 넘어 과학적 방법론을 공유하는 자연과학자의 집단을 가리키는 용어였으나 1990년대에 들어와 세계적 문제에 대한 국제적 정책 협조를 설명하는 개념으로 그 의미가 확대되었다.","options":[{"id":"1","text":"정책커뮤니티"},{"id":"2","text":"사회네트워크"},{"id":"3","text":"NGO"},{"id":"4","text":"인식공동체"}],"type":"mc","answer":"4","ready":true,"status":"solved","review":"자료 대조","explanation":"공통 지식과 방법론을 갖춘 국제적 전문가 네트워크이다.\n검토 근거: 6-1 미","originalAnswer":"사진의 선택 표시는 응시 답안이며, 정답 여부를 별도로 검증함","note":"사진을 전사하고 불필요한 줄바꿈·중복 표시만 정리했습니다.","refs":[],"topic":"동북아와 한일관계","contentRevision":1},{"id":"dongbuka-2025-1-final-40","source":"2025-1 기말","no":40,"text":"일본은 일본 정부를 상대로 한 일본군 ‘위안부’ 피해자의 손해배상 소송에서, ‘(      )’ 원칙을 근거로 한국 법원의 재판권을 부인하고 배상 판결을 수용할 수 없다는 입장을 밝혔다.","options":[{"id":"1","text":"포괄면책"},{"id":"2","text":"동반책임"},{"id":"3","text":"국가면제"},{"id":"4","text":"최혜국대우"},{"id":"5","text":"이중보상금지"}],"type":"mc","answer":"3","ready":true,"status":"solved","review":"공식 원문 검증·문구 수정","explanation":"정답: ③ 국가면제. 일본 외무성의 2023년 11월 23일 발표는 일본 정부를 상대로 한 위안부 피해자 소송에서 국가면제 원칙 적용을 부정한 서울고등법원 판결에 반대한다는 일본 정부의 입장을 명시한다. 이는 일본의 주장에 관한 설명이며 한국 법원의 판단과는 구별된다. 원문의 ‘강제징용 피해자 배상’은 일본 기업 상대 강제동원 배상 소송과 일본 국가 상대 위안부 소송을 혼동하므로 소송 대상을 바로잡았다.","originalAnswer":"사진의 선택 표시는 응시 답안이며, 정답 여부를 별도로 검증함","note":"원문: 일본은 강제징용 피해자 배상과 관련하여, ‘(      )’ 원칙에 따라 한국 법원의 판결을 인정하지 않고 있다.\n수정 이유: 국가면제가 쟁점인 일본 정부 상대 위안부 손해배상 소송으로 대상 수정. 정답 ③은 수정 문장에 대한 답이며 원본 시험의 공식 정답 확인을 뜻하지 않음.","refs":["stateImmunity"],"topic":"동북아와 한일관계","contentRevision":2,"originalText":"일본은 강제징용 피해자 배상과 관련하여, ‘(      )’ 원칙에 따라 한국 법원의 판결을 인정하지 않고 있다."},{"id":"dongbuka-2025-1-final-41","source":"2025-1 기말","no":41,"text":"일본에서는 2008년 북경올림픽, 리먼 쇼크, 2010년 센카쿠 열도 분쟁을 거치면서 중국의 부상을 염두에 둔 (      ) 지역 인식이 자리잡기 시작했다.","options":[{"id":"1","text":"동아시아"},{"id":"2","text":"인도태평양"},{"id":"3","text":"아시아태평양"},{"id":"4","text":"유라시아"}],"type":"mc","answer":"2","ready":true,"status":"solved","review":"자료 대조","explanation":"중국 부상을 고려한 인도태평양 인식의 태동이다.\n검토 근거: 6-3 일한","originalAnswer":"사진의 선택 표시는 응시 답안이며, 정답 여부를 별도로 검증함","note":"사진을 전사하고 불필요한 줄바꿈·중복 표시만 정리했습니다.","refs":[],"topic":"동북아와 한일관계","contentRevision":1},{"id":"dongbuka-2025-1-final-42","source":"2025-1 기말","no":42,"text":"다음 중 중국이 주장하는 ‘베이징 컨센서스(Beijing Consensus)’의 특징으로 적절하지 않은 것은?","options":[{"id":"1","text":"민주주의와 자유시장경제의 확대를 중시한다"},{"id":"2","text":"워싱턴 컨센서스를 대체하는 개도국 모델로 부상했다"},{"id":"3","text":"유교적 가치와 국가 주도의 발전 모델을 포함한다"},{"id":"4","text":"정부의 역할과 규제가 상대적으로 강조된다"},{"id":"5","text":"조화롭고 지속 가능한 발전을 강조한다"}],"type":"mc","answer":"1","ready":true,"status":"solved","review":"자료 대조","explanation":"정치적 자유화를 강요하지 않는 국가 주도 발전모델이다.\n검토 근거: 6-2 중","originalAnswer":"사진의 선택 표시는 응시 답안이며, 정답 여부를 별도로 검증함","note":"사진을 전사하고 불필요한 줄바꿈·중복 표시만 정리했습니다.","refs":[],"topic":"동북아와 한일관계","contentRevision":1},{"id":"dongbuka-2025-1-final-43","source":"2025-1 기말","no":43,"text":"2000년 9월 태국 탁신 총리가 ASEAN+3 체제를 넘어 아시아 전역과 중동을 아우르는 협력 달성을 위해 제안했고 2002년 6월 창설된 국제기구는 무엇인가?","options":[{"id":"1","text":"GCC"},{"id":"2","text":"ACD"},{"id":"3","text":"ASEM"},{"id":"4","text":"SAARC"}],"type":"mc","answer":"2","ready":true,"status":"solved","review":"자료 대조","explanation":"아시아협력대화(ACD)이다.\n검토 근거: 7-1 도전과 대응","originalAnswer":"사진의 선택 표시는 응시 답안이며, 정답 여부를 별도로 검증함","note":"사진을 전사하고 불필요한 줄바꿈·중복 표시만 정리했습니다.","refs":[],"topic":"동북아와 한일관계","contentRevision":1},{"id":"dongbuka-2025-1-final-44","source":"2025-1 기말","no":44,"text":"일본은 아시아 최초의 근대화 국가로서 내셔널리즘과 민주주의, 저출산 고령화 사회, 환경문제 등을 가장 먼저 경험한, 따라서 타국에 교훈을 줄 수 있는 (      ) 선진국이다.","options":[{"id":"1","text":"복지"},{"id":"2","text":"종합"},{"id":"3","text":"과제"},{"id":"4","text":"생활"}],"type":"mc","answer":"3","ready":true,"status":"solved","review":"자료 대조","explanation":"공통 과제를 먼저 경험한 과제 선진국이다.\n검토 근거: 12주차 3교시 과거사문제와 한일관계의 미래비전","originalAnswer":"사진의 선택 표시는 응시 답안이며, 정답 여부를 별도로 검증함","note":"사진을 전사하고 불필요한 줄바꿈·중복 표시만 정리했습니다.","refs":[],"topic":"동북아와 한일관계","contentRevision":1},{"id":"dongbuka-2025-1-final-45","source":"2025-1 기말","no":45,"text":"다음 중 일본이 주장해온 동아시아 지역 구상의 주요 키워드로 보기 어려운 것은?","options":[{"id":"1","text":"자유와 번영의 호"},{"id":"2","text":"민주주의 안보 다이아몬드"},{"id":"3","text":"자유롭고 열린 인도태평양(FOIP)"},{"id":"4","text":"열린 지역주의"},{"id":"5","text":"유교 문화권 연대"}],"type":"mc","answer":"5","ready":true,"status":"solved","review":"자료 대조","explanation":"유교 문화권의 가치를 내세운 발전관은 중국 구상에 해당한다.\n검토 근거: 6-2 중; 6-3 일한","originalAnswer":"사진의 선택 표시는 응시 답안이며, 정답 여부를 별도로 검증함","note":"사진을 전사하고 불필요한 줄바꿈·중복 표시만 정리했습니다.","refs":[],"topic":"동북아와 한일관계","contentRevision":1},{"id":"dongbuka-2025-1-final-46","source":"2025-1 기말","no":46,"text":"동아시아 협력체 간 기능 분업을 바탕으로 조화를 추구하는 체제를 (      )라/이라 한다.","options":[{"id":"1","text":"지역 다핵구조"},{"id":"2","text":"제도적 다위니즘"},{"id":"3","text":"전략적 다자주의"},{"id":"4","text":"다자주의 분업체제"},{"id":"5","text":"보편주의 구조"}],"type":"mc","answer":"4","ready":true,"status":"solved","review":"자료 대조","explanation":"협력체별 기능 분담을 통한 조화는 다자주의 분업체제이다.\n검토 근거: 8-3 협력의 방향성","originalAnswer":"사진의 선택 표시는 응시 답안이며, 정답 여부를 별도로 검증함","note":"사진을 전사하고 불필요한 줄바꿈·중복 표시만 정리했습니다.","refs":[],"topic":"동북아와 한일관계","contentRevision":1},{"id":"dongbuka-2025-1-final-47","source":"2025-1 기말","no":47,"text":"냉전 종결 이후 한국에서는 1991년 8월 이용수 할머니가 위안부 피해자임을 최초로 공개 증언함으로써 ‘일본군위안부’ 문제가 제기되었고 한일간의 외교문제로 발전하였다.","options":[{"id":"O","text":"참"},{"id":"X","text":"거짓"}],"type":"ox","answer":"X","ready":true,"status":"solved","review":"자료 대조","explanation":"1991년 8월 최초 공개 증언자는 김학순이다.\n검토 근거: 12주차 2교시 과거사문제와 한일관계의 현주소","originalAnswer":"사진의 선택 표시는 응시 답안이며, 정답 여부를 별도로 검증함","note":"사진을 전사하고 불필요한 줄바꿈·중복 표시만 정리했습니다.","refs":[],"topic":"동북아와 한일관계","contentRevision":1},{"id":"dongbuka-2025-1-final-48","source":"2025-1 기말","no":48,"text":"ASEAN은 동아시아 협력체에서 ‘(      )’ 역할을 자임하며 주요 협의체(EAS, APT 등)를 조직하고 회의를 연쇄적으로 개최한다.","options":[{"id":"1","text":"방관자"},{"id":"2","text":"공동대표"},{"id":"3","text":"견인차(driver’s seat)"},{"id":"4","text":"중재자"},{"id":"5","text":"권위자"}],"type":"mc","answer":"3","ready":true,"status":"solved","review":"자료 대조","explanation":"ASEAN의 견인차 역할과 연쇄적 회의 개최에 관한 설명이다.\n검토 근거: 7-3 권력지형과 리더십","originalAnswer":"사진의 선택 표시는 응시 답안이며, 정답 여부를 별도로 검증함","note":"사진을 전사하고 불필요한 줄바꿈·중복 표시만 정리했습니다.","refs":[],"topic":"동북아와 한일관계","contentRevision":1},{"id":"dongbuka-2025-1-final-49","source":"2025-1 기말","no":49,"text":"다음 중 1980년대 일본의 안보외교에 영향을 준 배경으로 적절하지 않은 것은?","options":[{"id":"1","text":"국제사회의 ‘안보 무임승차’ 비판"},{"id":"2","text":"미국의 방위 부담 분담 요구"},{"id":"3","text":"전후세대의 성장과 패전 체험의 희석"},{"id":"4","text":"일본 국내 여론의 군사화 지지 확산"},{"id":"5","text":"미일동맹의 신뢰성에 대한 의문"}],"type":"mc","answer":"4","ready":true,"status":"solved","review":"자료 대조","explanation":"강의의 표현은 방위력 증강에 대한 저항 약화와 국제공헌론의 대두이다. 이를 여론의 군사화 지지 확산으로 단정한 4번은 과도하다.\n검토 근거: 9-1 일본의 안보외교","originalAnswer":"사진의 선택 표시는 응시 답안이며, 정답 여부를 별도로 검증함","note":"사진을 전사하고 불필요한 줄바꿈·중복 표시만 정리했습니다.","refs":[],"topic":"동북아와 한일관계","contentRevision":1},{"id":"dongbuka-2025-1-final-50","source":"2025-1 기말","no":50,"text":"‘동아시아비전그룹’(EAVG)과 ‘동아시아스터디그룹’(EASG)이 제출한 보고서에서 제안된 트랙2(반관반민)의 동아시아 싱크탱크 네트워크는 무엇인가?","options":[{"id":"1","text":"ERPD"},{"id":"2","text":"ERIA"},{"id":"3","text":"AMRO"},{"id":"4","text":"NEAT"}],"type":"mc","answer":"4","ready":true,"status":"solved","review":"자료 대조","explanation":"동아시아 싱크탱크 네트워크는 NEAT이다.\n검토 근거: 8-1 중일경쟁","originalAnswer":"사진의 선택 표시는 응시 답안이며, 정답 여부를 별도로 검증함","note":"사진을 전사하고 불필요한 줄바꿈·중복 표시만 정리했습니다.","refs":[],"topic":"동북아와 한일관계","contentRevision":1},{"year":2020,"no":4,"text":"동아시아 지역에서 있어 안보와 경제영역의 협력체제에 존재하는 스탠더드의 불일치는 양자주의적 협력이 더디게 발전한 중요한 요인 중의 하나이다.","type":"ox","options":[{"id":"O","text":"참"},{"id":"X","text":"거짓"}],"id":"dongbuka-2020-final-4","source":"2020-1 기말","originalText":"동아시아 지역에서 있어 안보와 경제영역의 협력체제에 존재하는 스탠더드의 불일치는 양자주의적 협력이 더디게 발전한 중요한 요인 중의 하나이다.","originalAnswer":"족보 기재 답안은 별도 검증 대상으로 취급","contentRevision":1,"refs":[],"topic":"동북아와 한일관계","note":"20 족보 모음.docx와 20-1 기말.pdf의 동일 연도·문항을 통합했습니다. 순서나열형과 선지 없는 객관식은 제외했습니다.","answer":"X","ready":true,"status":"solved","review":"강의·자료 대조","explanation":"안보·경제 영역의 불일치는 ‘다자주의적’ 협력 발전을 제약했다. (7-3 권력지형과 리더십)"},{"year":2020,"no":5,"text":"한일 안보관계는 미국을 매개로 한 잠재적 협력관계의 성격을 여전히 유지하면서도, 탈냉전 후 동아시아 국가 간에 새롭게 전개되고 있는 다자간 세력균형 게임의 일부로서 의미를 갖게 되었다.","type":"ox","options":[{"id":"O","text":"참"},{"id":"X","text":"거짓"}],"id":"dongbuka-2020-final-5","source":"2020-1 기말","originalText":"한일 안보관계는 미국을 매개로 한 잠재적 협력관계의 성격을 여전히 유지하면서도, 탈냉전 후 동아시아 국가 간에 새롭게 전개되고 있는 다자간 세력균형 게임의 일부로서 의미를 갖게 되었다.","originalAnswer":"족보 기재 답안은 별도 검증 대상으로 취급","contentRevision":1,"refs":[],"topic":"동북아와 한일관계","note":"20 족보 모음.docx와 20-1 기말.pdf의 동일 연도·문항을 통합했습니다. 순서나열형과 선지 없는 객관식은 제외했습니다.","answer":"O","ready":true,"status":"solved","review":"강의·자료 대조","explanation":"미국을 매개로 한 잠재적 협력과 탈냉전 다자간 세력균형 게임의 일부라는 이중성이다. (12-1 구조전환 12쪽)"},{"year":2020,"no":6,"text":"2011년 8월, 한국의 헌법재판소는 위안부 피해자 배상과 관련하여, “한국 정부가 일본과 대외 교섭을 하지 않은 것은 위헌”이라는 판결을 내린 바 있다.","type":"ox","options":[{"id":"O","text":"참"},{"id":"X","text":"거짓"}],"id":"dongbuka-2020-final-6","source":"2020-1 기말","originalText":"2011년 8월, 한국의 헌법재판소는 위안부 피해자 배상과 관련하여, “한국 정부가 일본과 대외 교섭을 하지 않은 것은 위헌”이라는 판결을 내린 바 있다. xt":"참"},{"id":"X","text":"거짓"}],"type":"ox","id":"dongbuka-2021-final-3","source":"2021 기말","originalText":"제도적 다위니즘(지역협력체간의 무한경쟁과 적자생존)은 APT를 대신하여 EAS의 활성화를 바라는 중국적 시각이 담긴 주장이다.","originalAnswer":"족보 기재 답안은 별도 검증 대상으로 취급","contentRevision":1,"refs":[],"topic":"동북아와 한일관계","note":"20 족보 모음.docx와 20-1 기말.pdf의 동일 연도·문항을 통합했습니다. 순서나열형과 선지 없는 객관식은 제외했습니다.","answer":"X","ready":true,"status":"solved","review":"강의·자료 대조","explanation":"APT보다 EAS의 활성화를 원하는 시각은 중국이 아니라 일본 쪽이다. (8-2 문제점과 시나리오)"},{"year":2021,"no":4,"text":"한일관계는 1998년 ‘한일 파트너십 공동선언'을 계기로 제2차 세계대전 이후 최고의 전성기를 경험했으나, 그 이후에는 악화 일로를 걷고 있다고 할 수 있다.","options":[{"id":"O","text":"참"},{"id":"X","text":"거짓"}],"type":"ox","id":"dongbuka-2021-final-4","source":"2021 기말","originalText":"한일관계는 1998년 ‘한일 파트너십 공동선언'을 계기로 제2차 세계대전 이후 최고의 전성기를 경험했으나, 그 이후에는 악화 일로를 걷고 있다고 할 수 있다.","originalAnswer":"족보 기재 답안은 별도 검증 대상으로 취급","contentRevision":2,"refs":[],"topic":"동북아와 한일관계","note":"20 족보 모음.docx와 20-1 기말.pdf의 동일 연도·문항을 통합했습니다. 순서나열형과 선지 없는 객관식은 제외했습니다.","answer":null,"ready":false,"status":"pending","review":"재검토 완료 · 원문 확인 필요","explanation":"동북아12-2·12-3 강의는 2010년대~2021년 무렵의 구조적 악화와 역사갈등을 설명한다. 그러나 문항의 ‘그 이후’가 1998년 이후 전체 기간인지, 전성기가 끝난 뒤 특정 기간인지 불명확하다. 일시적 관계개선까지 부정하는 문장으로 볼지에 따라 답이 달라져 원문 기준시점·출제 의도 확인이 필요하다."},{"year":2021,"no":5,"text":"글로벌 무역에서 동아시아의 지속적인 부상과 진정한 교역대국으로서 중국의 등장에도 불구하고, 글로벌 금융 거래의 중심은 동방으로 이동하지 않았다.","options":[{"id":"O","text":"참"},{"id":"X","text":"거짓"}],"type":"ox","id":"dongbuka-2021-final-5","source":"2021 기말","originalText":"글로벌 무역에서 동아시아의 지속적인 부상과 진정한 교역대국으로서 중국의 등장에도 불구하고, 글로벌 금융 거래의 중심은 동방으로 이동하지 않았다.","originalAnswer":"족보 기재 답안은 별도 검증 대상으로 취급","contentRevision":2,"refs":[],"topic":"동북아와 한일관계","note":"20 족보 모음.docx와 20-1 기말.pdf의 동일 연도·문항을 통합했습니다. 순서나열형과 선지 없는 객관식은 제외했습니다.","answer":null,"ready":false,"status":"pending","review":"재검토 완료 · 원문 확인 필요","explanation":"업로드된 강의노트의 금융협력·CMI 부분과 대조했으나 ‘글로벌 금융 거래의 중심’의 기준 지표와 시점을 특정하는 대목은 확인되지 않았다. 족보에는 X 표시가 있지만, 무역 중심의 이동과 금융 중심의 이동은 동일하지 않으므로 그 표시만으로 정답을 확 ,"note":"20 족보 모음.docx와 20-1 기말.pdf의 동일 연도·문항을 통합했습니다. 순서나열형과 선지 없는 객관식은 제외했습니다.","answer":"C","ready":true,"status":"solved","review":"강의·자료 대조","explanation":"우애(fraternity) 사상과 범유럽 통합론이 원형이다. (6-3 일본 지역구상 8쪽)"},{"year":2021,"no":9,"text":"APT와 EAS로 이분화된 동아시아 협력체제를 놓고 일본과 연합한 신입멤버와 일부 기존멤버 사이에 묘한 신경전이 전개되었다.","options":[{"id":"O","text":"참"},{"id":"X","text":"거짓"}],"type":"ox","id":"dongbuka-2021-final-9","source":"2021 기말","originalText":"APT와 EAS로 이분화된 동아시아 협력체제를 놓고 일본과 연합한 신입멤버와 일부 기존멤버 사이에 묘한 신경전이 전개되었다.","originalAnswer":"족보 기재 답안은 별도 검증 대상으로 취급","contentRevision":1,"refs":[],"topic":"동북아와 한일관계","note":"20 족보 모음.docx와 20-1 기말.pdf의 동일 연도·문항을 통합했습니다. 순서나열형과 선지 없는 객관식은 제외했습니다.","answer":"O","ready":true,"status":"solved","review":"강의·자료 대조","explanation":"APT·EAS 공존 과정에서 기존회원과 일본과 연합한 신입회원의 경쟁도 나타났다. (7-3 권력지형과 리더십)"},{"year":2021,"no":10,"text":"동아시아 공동체 구축 노력이 난관에 직면하게 된 원인과 그 양상이라고 할 수 없는 것은?","options":[{"id":"A","text":"지역주의와 보편적 가치의 충돌"},{"id":"B","text":"중일경쟁"},{"id":"C","text":"양자주의적 동맹구조와 다자주의적 협력체제의 충돌"},{"id":"D","text":"두 개의 지역 개념과 정체성 문제"}],"type":"mc","id":"dongbuka-2021-final-10","source":"2021 기말","originalText":"동아시아 공동체 구축 노력이 난관에 직면하게 된 원인과 그 양상이라고 할 수 없는 것은?","originalAnswer":"족보 기재 답안은 별도 검증 대상으로 취급","contentRevision":1,"refs":[],"topic":"동북아와 한일관계","note":"20 족보 모음.docx와 20-1 기말.pdf의 동일 연도·문항을 통합했습니다. 순서나열형과 선지 없는 객관식은 제외했습니다.","answer":"A","ready":true,"status":"solved","review":"강의·자료 대조","explanation":"강의의 세 갈등은 두 지역 개념, 국가주권과 보편적 가치, 양자동맹과 다자협력이다. ‘지역주의와 보편적 가치’는 해당 항목의 정확한 표현이 아니다. (7-2 비전의 충돌 3쪽)"},{"year":2021,"no":11,"text":"일본은 아시아 최초의 근대화 국가로서 내셔널리즘과 민주주의, 저출산 고령화 사회, 환경문제 등을 가장 먼저 경험한, 따라서 타국에 교훈을 줄 수 있는 ( ) 선진국이다.","options":[{"id":"A","text":"복지"},{"id":"B","text":"생활"},{"id":"C","text":"종합"},{"id":"D","text":"과제"}],"type":"mc","id":"dongbuka-2021-final-11","source":"2021 기말","originalText":"일본은 아시아 최초의 근대화 국가로서 내셔널리즘과 민주주의, 저출산 고령화 사회, 환경문제 등을 가장 먼저 경험한, 따라서 타국에 교훈을 줄 수 있는 ( ) 선진국이다.","originalAnswer":"족보 기재 답안은 별도 검증 대상으로 취급","contentRevision":1,"refs":[],"topic":"동북아와 한일관계","note":"20 족보 모음.docx와 20-1 기말.pdf의 동일 연도·문항을 통합했습니다. 순서나열형과 선지 없는 객관식은 제외했습니다.","answer":"D","ready":true,"status":"solved","review":"강의·자료 대조","explanation":"일본은 사회·경제적 과제를 먼저 경험한 ‘과제선진국’으로 설명된다. (10-2 과제 14쪽)"},{"year":2021,"no":12,"text":"중국은 미국을 향해 상호 신뢰를 바탕으로 영토 문제 등 핵심 이익을 존중하자는 ‘신형 대국 관계' 전략을 표방했으며, 미국의 인도-태평양 전략과 일본의 적극적 평화주의가 이와 부합한다고 판단하고 있다.","options":[{"id":"O","text":"참"},{"id":"X","text":"거짓"}],"type":"ox","id":"dongbuka-2021-final-12","source":"2021 기말","originalText":"중국은 미국을 향해 상호 신뢰를 바탕으로 영토 문제 등 핵심 이익을 존중하자는 ‘신형 대국 관계' 전략을 표방했으며, 미국의 인도-태평양 전략과 일본의 적극적 평화주의가 이와 부합한다고 판단하고 있다.","originalAnswer":"족보 기재 답안은 별도 검증 대상으로 취급","contentRevision":1,"refs":[],"topic":"동북아와 한일관계","note":"20 족보 모음.docx와 20-1 기말.pdf의 동일 연도·문항을 통합했습니다. 순서나열형과 선지 없는 객관식은 제외했습니다.","answer":"X","ready":true,"status":"solved","review":"강의·자료 대조","explanation":"미·일의 인도태평양·적극적 평화주의와 중국의 전략은 상충하는 측면이 있다. (6-2 중국; 6-3 일본 지역구상)"},{"year":2021,"no":13,"text":"일본의 FTA 정책을 추진하도록 촉진한 대외적 요인으로 옳지 않은 것은?","options":[{"id":"1","text":"중국의 부상으로 대표되는 동아시아 지역의 구조적 변화에 대한 전략적 대응의 필요성"},{"id":"2","text":"아시아 금융위기 이후 지역주의 제도화의 필요성"},{"id":"3","text":"WTO 무역 자유화 협상의 난항"},{"id":"4","text":"CMI 다자화"}],"type":"mc","id":"dongbuka-2021-final-13","source":"2021 기말","originalText":"일본의 FTA 정책을 추진하도록 촉진한 대외적 요인으로 옳지 않은 것은?","originalAnswer":"족보 기재 답안은 별도 검증 대상으로 취급","contentRevision":1,"refs":[],"topic":"동북아와 한일관계","note":"20 족보 모음.docx와 20-1 기말.pdf의 동일 연도·문항을 통합했습니다. 순서나열형과 선지 없는 객관식은 제외했습니다.","answer":"4","ready":true,"status":"solved","review":"강의·자료 대조","explanation":"강의의 촉진 요인은 WTO 협상 난항·아시아 위기 이후 제도화·중국 부상에 대한 대응이며 CMI 다자화는 해당 목록에 없다. (11-1 일본FTA 10쪽)"},{"year":2021,"no":14,"text":"양자협정들의 내용과 자유화의 일정에 차이가 날수록 FTA의 장점이 줄어들고, 대신 복잡한 원산지 규정 등으로 인한 거래비용이 증가하는 것을 ( ) 효과라고 한다.","options":[{"id":"1","text":"당구공"},{"id":"2","text":"누들볼"},{"id":"3","text":"밴드웨건"},{"id":"4","text":"도미노"}],"type":"mc","id":"dongbuka-2021-final-14","source":"2021 기말","originalText":"양자협정들의 내용과 자유화의 일정에 차이가 날수록 FTA의 장점이 줄어들고, 대신 복잡한 원산지 규정 등으로 인한 거래비용이 증가하는 것을 ( ) 효과라고 한다.","originalAnswer":"족보 기재 답안은 별도 검증 대상으로 취급","contentRevision":1,"refs":[],"topic":"동북아와 한일관계","note":"20 족보 모음.docx와 20-1 기말.pdf의 동일 연도·문항을 통합했습니다. 순서나열형과 선지 없는 객관식은 제외했습니다.","answer":"2","ready":true,"status":"solved","review":"강의·자료 대조","explanation":"복잡한 원산지 규정 등으로 거래비용이 커지는 누들 보울 효과다. (10-2 과제 8쪽)"},{"year":2021,"no":16,"text":"한일관계에 있어 과거사문제에 대한 접근법에 관한 설명으로 적절하지 않은 것은?","options":[{"id":"1","text":"냉철한 국익의 계산과 철저한 전략적 사고로 대일 외교를 정립해야 하며 그 기반은 일본의 리얼리티를 제대로 읽는 데서 출발해야 한다."},{"id":"2","text":"대일 외교 어젠다는 위안부 등 역사문제 이외에도 대북 공조, 외교안보 협력, 경제 협력, 사회문화 교류 분야에서의 공조, 협력 등 중요한 영역이 존재한다는 사실을 고려해야 한다."},{"id":"3","text":"민주국가에서 국민여론은 중시되어야 하나 국민 정서, 대중의 감정에 휩쓸리는 대일 과거사 외교의 함정에 빠져서는 안 된다."},{"id":"4","text":"한일관계에서 역사 문제와 비 역사 쟁점(안보, 경쟁 등)은 분리하지 않고 통합적으로 다루는 것이 효과적이다."}],"type":"mc","id":"dongbuka-2021-final-16","source":"2021 기말","originalText":"한일관계에 있어 과거사문제에 대한 접근법에 관한 설명으로 적절하지 않은 것은?","originalAnswer":"족보 기재 답안은 별도 검증 대상으로 취급","contentRevision":1,"refs":[],"topic":"동북아와 한일관계","note":"20 족보 모음.docx와 20-1 기말.pdf의 동일 연도·문항을 통합했습니다. 순서나열형과 선지 없는 객관식은 제외했습니다.","answer":"4","ready":true,"status":"solved","review":"강의·자료 대조","explanation":"역사와 비역사 쟁점은 각각의 논리에 맞게 분리해서 다루어야 한다는 접근이다. (12-3 과거사문제·미래 5쪽)"},{"year":2021,"no":17,"text":"신중상주의적 통상정책에 대한 비판의 초점이라고 할 수 없는 것은 무엇인가?","options":[{"id":"A","text":"권력의 추구와 부의 추구는 서로 갈등을 일으킬 수도 있다."},{"id":"B","text":"무역이 비록 동등하지는 않을지라도 상호이득을 가져올 수 있다는 점을 간과한다."},{"id":"C","text":"합리적인 경제행위자와 경쟁적 시장이라는 가정 자체가 비현실적이다."},{"id":"D","text":"강력하고 간섭주의적인 국가가 반드시 경제발전을 보장하지 않는다."}],"type":"mc","id":"dongbuka-2021-final-17","source":"2021 기말","originalText":"신중상주의적 통상정책에 대한 비판의 초점이라고 할 수 없는 것은 무엇인가?","originalAnswer":"족보 기재 답안은 별도 검증 대상으로 취급","contentRevision":1,"refs":[],"topic":"동북아와 한일관계","note":"20 족보 모음.docx와 20-1 기말.pdf의 동일 연도·문항을 통합했습니다. 순서나열형과 선지 없는 객관식은 제외했습니다.","answer":"C","ready":true,"status":"solved","review":"강의·자료 대조","explanation":"합리적 경제행위자와 경쟁적 시장 가정에 대한 비판은 자유주의 비판이다. (9-3 통상외교 5~7쪽)"},{"year":2021,"no":18,"text":"CMI 하의 통화 스와프 협정에 입각하여 실천적인 지역통화협정을 가능하게 하기 위해서는 IMF링크를 더욱 강화해야 한다.","options":[{"id":"O","text":"참"},{"id":"X","text":"거짓"}],"type":"ox","id":"dongbuka-2021-final-18","source":"2021 기말","originalText":"CMI 하의 통화 스와프 협정에 입각하여 실천적인 지역통화협정을 가능하게 하기 위해서는 IMF링크를 더욱 강화해야 한다.","originalAnswer":"족보 기재 답안은 별도 검증 대상으로 취급","contentRevision":1,"refs":["cmim"],"topic":"동북아와 한일관계","note":"20 족보 모음.docx와 20-1 기말.pdf의 동일 연도·문항을 통합했습니다. 순서나열형과 선지 없는 객관식은 제외했습니다.","answer":"X","ready":true,"status":"solved","review":"강의·자료 대조","explanation":"IMF 링크를 철폐하거나 비연계 비율을 높여 제약을 줄여야 한다. 강화를 주장한 문장은 거짓이다. (10-3 전략 12~13쪽)"},{"year":2021,"no":19,"text":"동아시아 협력체의 심화 단계에서 중일 양국의 다른 이해관계와 비전의 충돌에 의해 상호 협력과 경쟁 및 견제가 공존함으로써 지역통합의 의미있는 진전을 어렵게 하고 있다.","options":[{"id":"O","text":"참"},{"id":"X","text":"거짓"}],"type":"ox","id":"dongbuka-2021-final-19","source":"2021 기말","originalText":"동아시아 협력체의 심화 단계에서 중일 양국의 다른 이해관계와 비전의 충돌에 의해 상호 협력과 경쟁 및 견제가 공존함으로써 지역통합의 의미있는 진전을 어렵게 하고 있다.","originalAnswer":"족보 기재 답안은 별도 검증 대상으로 취급","contentRevision":1,"refs":[],"topic":"동북아와 한일관계","note":"20 족보 모음.docx와 20-1 기말.pdf의 동일 연도·문항을 통합했습니다. 순서나열형과 선지 없는 객관식은 제외했습니다.","answer":"O","ready":true,"status":"solved","review":"강의·자료 대조","explanation":"심화 단계에서는 중일의 이해관계·비전 충돌이 통합을 제약한다. (8-1 중일경쟁)"},{"year":2021,"no":20,"text":"CMI 및 CMI의 다자화(CMIM)에 대한 기술 중 바르지 못한 것은?","options":[{"id":"A","text":"2012년 신용규모를 2,400억 달러로 확대하고 의결권 배분을 정했다."},{"id":"B","text":"2008년 글로벌 금융위기 시 위기에 직면한 국가들이 CMI를 이용하지 않았다."},{"id":"C","text":"위기국가는 일정액을 넘는 부분에 대해서는 IMF와 협의 후 CMIM의 신용을 할당받아야 하며 IMF의 이행조건을 수용해야 한다."},{"id":"D","text":"2008년 CMI 다자화 합의가 발효했다."}],"type":"mc","id":"dongbuka-2021-final-20","source":"2021 기말","originalText":"CMI 및 CMI의 다자화(CMIM)에 대한 기술 중 바르지 못한 것은?","originalAnswer":"족보 기재 답안은 별도 검증 대상으로 취급","contentRevision":1,"refs":["cmim"],"topic":"동북아와 한일관계","note":"20 족보 모음.docx와 20-1 기말.pdf의 동일 연도·문항을 통합했습니다. 순서나열형과 선지 없는 객관식은 제외했습니다.","answer":"D","ready":true,"status":"solved","review":"강의·자료 대조","explanation":"CMIM 최초 협정 발효는 2008년이 아니라 2010년 3월 24일이다. (ASEAN+3 공식 설명; 10-3 전략)"},{"year":2021,"no":21,"text":"일본이 집단적 자위권을 발동할 경우 본토에 대한 공격 이외의 상황에도 자위대가 개입하게 되어 평화헌법의 ( ) 원칙에 어긋난다는 내각법제국의 헌법 해석이었다.","options":[{"id":"A","text":"교전권 방기"},{"id":"B","text":"전력불보유"},{"id":"C","text":"전수방위"},{"id":"D","text":"자위권"}],"type":"mc","id":"dongbuka-2021-final-21","source":"2021 기말","originalText":"일본이 집단적 자위권을 발동할 경우 본토에 대한 공격 이외의 상황에도 자위대가 개입하게 되어 평화헌법의 ( ) 원칙에 어긋난다는 내각법제국의 헌법 해석이었다.","originalAnswer":"족보 기재 답안은 별도 검증 대상으로 취급","contentRevision":1,"refs":[],"topic":"동북아와 한일관계","note":"20 족보 모음.docx와 20-1 기말.pdf의 동일 연도·문항을 통합했습니다. 순서나열형과 선지 없는 객관식은 제외했습니다.","answer":"C","ready":true,"status":"solved","review":"강의·자료 대조","explanation":"당시의 헌법해석과 관련하여 강의에서 제시하는 원칙은 전수방위다. 이후 제한적 집단적 자위권 용인과 구분한다. (9-1 일본의 안보외교 16쪽)"},{"year":2021,"no":22,"text":"일대일로에서 ‘일대(一帶)'는 동남아시아와 유럽·아프리카로 이어지는 '해상 실크로드'를, '일로(一路)'는 중앙아시아와 유럽을 연결하는 ‘육상 실크로드'를 의미한다.","options":[{"id":"O","text":"참"},{"id":"X","text":"거짓"}],"type":"ox","id":"dongbuka-2021-final-22","source":"2021 기말","originalText":"일대일로에서 ‘일대(一帶)'는 동남아시아와 유럽·아프리카로 이어지는 '해상 실크로드'를, '일로(一路)'는 중앙아시아와 유럽을 연결하는 ‘육상 실크로드'를 의미한다.","originalAnswer":"족보 기재 답안은 별도 검증 대상으로 취급","contentRevision":1,"refs":[],"topic":"동북아와 한일관계","note":"20 족보 모음.docx와 20-1 기말.pdf의 동일 연도·문항을 통합했습니다. 순서나열형과 선지 없는 객관식은 제외했습니다.","answer":"X","ready":true,"status":"solved","review":"강의·자료 대조","explanation":"일대는 육상 실크로드 경제벨트, 일로는 해상 실크로드다. (6-1 미국 지역구상 16쪽)"},{"year":2021,"no":23,"text":"탈냉전 후 한일관계의 성격과 양상의 변화에 대한 기술로서 적합하지 않은 것은?","options":[{"id":"A","text":"한일 양국이 다루어야 할 협력과 갈등의 영역이 양국 간 관계의 범주를 넘어서 지역적, 세계적 차원으로 확대되고 있다."},{"id":"B","text":"탈냉전 이후의 한일 안보관계는 냉전시대에 비해 복잡한 양상을 보이고 있다."},{"id":"C","text":"한일 정치인 간의 비공식 채널이 강화된 것과는 달리, 시민사회나 지방 자치체 간의 교류는 감소했다."},{"id":"D","text":"한일 양국은 과거사, 영토문제로 여전히 첨예한 대립과 갈등의 국면으로 치닫고 있다."}],"type":"mc","id":"dongbuka-2021-final-23","source":"2021 기말","originalText":"탈냉전 후 한일관계의 성격과 양상의 변화에 대한 기술로서 적합하지 않은 것은?","originalAnswer":"족보 기재 답안은 별도 검증 대상으로 취급","contentRevision":1,"refs":[],"topic":"동북아와 한일관계","note":"20 족보 모음.docx와 20-1 기말.pdf의 동일 연도·문항을 통합했습니다. 순서나열형과 선지 없는 객관식은 제외했습니다.","answer":"C","ready":true,"status":"solved","review":"강의·자료 대조","explanation":"정치인 간 채널은 약화된 반면 시민사회·지방 차원의 교류는 확대되었다. (12-1 구조전환)"},{"year":2021,"no":24,"text":"2010년 7월 베트남에서 개최된 ASEAN 외상회담에서 미국과 캐나다는 EAS 정식 회원국으로 초청이 결정되었고, 2011년부터 정식 회원국으로 참여하고 있다.","options":[{"id":"O","text":"참"},{"id":"X","text":"거짓"}],"type":"ox","id":"dongbuka-2021-final-24","source":"2021 기말","originalText":"2010년 7월 베트남에서 개최된 ASEAN 외상회담에서 미국과 캐나다는 EAS 정식 회원국으로 초청이 결정되었고, 2011년부터 정식 회원국으로 참여하고 있다.","originalAnswer":"족보 기재 답안은 별도 검증 대상으로 취급","contentRevision":1,"refs":[],"topic":"동북아와 한일관계","note":"20 족보 모음.docx와 20-1 기말.pdf의 동일 연도·문항을 통합했습니다. 순서나열형과 선지 없는 객관식은 제외했습니다.","answer":"X","ready":true,"status":"solved","review":"강의·자료 대조","explanation":"2011년 신규 참가국은 미국과 러시아이며 캐나다가 아니다. (7-1 도전과 대응 4쪽)"},{"year":2021,"no":25,"text":"베이징 컨센서스는 미국 국제경제연구소의 존 윌리엄슨 선임연구원이 처음 개념화한 것으로 중국이 주도하는 '권위주의 체제하의 시장경제 발전'을 일컫는다.","options":[{"id":"O","text":"참"},{"id":"X","text":"거짓"}],"type":"ox","id":"dongbuka-2021-final-25","source":"2021 기말","originalText":"베이징 컨센서스는 미국 국제경제연구소의 존 윌리엄슨 선임연구원이 처음 개념화한 것으로 중국이 주도하는 '권위주의 체제하의 시장경제 발전'을 일컫는다.","originalAnswer":"족보 기재 답안은 별도 검증 대상으로 취급","contentRevision":1,"refs":[],"topic":"동북아와 한일관계","note":"20 족보 모음.docx와 20-1 기말.pdf의 동일 연도·문항을 통합했습니다. 순서나열형과 선지 없는 객관식은 제외했습니다.","answer":"X","ready":true,"status":"solved","review":"강의·자료 대조","explanation":"베이징 컨센서스는 조슈아 쿠퍼 라모가 제시했다. 존 윌리엄슨은 워싱턴 컨센서스와 관련된 인물이다. (6-2 중국 지역구상)"},{"year":2021,"no":26,"text":"아베 신조(安倍晋三) 전 총리의 이름을 딴 '아베노믹스(Abenomics)' 경제정책에 포함되지 않는 것은 무엇인가?","options":[{"id":"A","text":"대담한 양적완화"},{"id":"B","text":"유연한 환율조정"},{"id":"C","text":"성장전략"},{"id":"D","text":"기동적 재정지출"}],"type":"mc","id":"dongbuka-2021-final-26","source":"2021 기말","originalText":"아베 신조(安倍晋三) 전 총리의 이름을 딴 '아베노믹스(Abenomics)' 경제정책에 포함되지 않는 것은 무엇인가 형과 선지 없는 객관식은 제외했습니다.","answer":"C","ready":true,"status":"solved","review":"강의·자료 대조","explanation":"미국의 실용적 안보 판단과 일본 보수세력의 이해가 합치한 것은 집단적 자위권 행사 용인이다. (9-2 미일동맹)"},{"year":2021,"no":39,"text":"전후 전통적 일본외교의 3대 특징으로 ( ), 소극안보, 경제우선을 들 수 있다.","options":[{"id":"A","text":"대북견제"},{"id":"B","text":"비무장중립"},{"id":"C","text":"반중노선"},{"id":"D","text":"친미주의"}],"type":"mc","id":"dongbuka-2021-final-39","source":"2021 기말","originalText":"전후 전통적 일본외교의 3대 특징으로 ( ), 소극안보, 경제우선을 들 수 있다.","originalAnswer":"족보 기재 답안은 별도 검증 대상으로 취급","contentRevision":1,"refs":[],"topic":"동북아와 한일관계","note":"20 족보 모음.docx와 20-1 기말.pdf의 동일 연도·문항을 통합했습니다. 순서나열형과 선지 없는 객관식은 제외했습니다.","answer":"D","ready":true,"status":"solved","review":"강의·자료 대조","explanation":"친미주의·소극안보·경제우선이 전후 일본외교의 세 특징이다. (9-1 일본의 안보외교 8쪽)"},{"year":2021,"no":40,"text":"도광양회는 시진핑이 추진하고 있는 외교노선으로 칼집에 빛을 감추고 어둠속에서 은밀하게 힘을 기른다는 의미이다.","options":[{"id":"O","text":"참"},{"id":"X","text":"거짓"}],"type":"ox","id":"dongbuka-2021-final-40","source":"2021 기말","originalText":"도광양회는 시진핑이 추진하고 있는 외교노선으로 칼집에 빛을 감추고 어둠속에서 은밀하게 힘을 기른다는 의미이다.","originalAnswer":"족보 기재 답안은 별도 검증 대상으로 취급","contentRevision":1,"refs":[],"topic":"동북아와 한일관계","note":"20 족보 모음.docx와 20-1 기말.pdf의 동일 연도·문항을 통합했습니다. 순서나열형과 선지 없는 객관식은 제외했습니다.","answer":"X","ready":true,"status":"solved","review":"강의·자료 대조","explanation":"도광양회는 덩샤오핑 시기의 노선이다. (6-2 중국 지역구상 8쪽)"},{"year":2021,"no":41,"text":"한국과 일본과의 악순환 관계에 영향을 미친 요인 중 하나는 한일이 서로 다른 대응 방식으로 일본은 심정 중심, 한국은 사리 중심으로 대응하는 경향에서 찾을 수 있다.","options":[{"id":"O","text":"참"},{"id":"X","text":"거짓"}],"type":"ox","id":"dongbuka-2021-final-41","source":"2021 기말","originalText":"한국과 일본과의 악순환 관계에 영향을 미친 요인 중 하나는 한일이 서로 다른 대응 방식으로 일본은 심정 중심, 한국은 사리 중심으로 대응하는 경향에서 찾을 수 있다.","originalAnswer":"족보 기재 답안은 별도 검증 대상으로 취급","contentRevision":1,"refs":[],"topic":"동북아와 한일관계","note":"20 족보 모음.docx와 20-1 기말.pdf의 동일 연도·문항을 통합했습니다. 순서나열형과 선지 없는 객관식은 제외했습니다.","answer":"X","ready":true,"status":"solved","review":"강의·자료 대조","explanation":"강의의 대비는 일본의 사리 중심·한국의 심정 중심 대응이며 원문은 반대다. (12-3 과거사문제·미래 6쪽)"},{"year":2021,"no":42,"text":"일본정부의 문화교류정책에 대한 설명 중에서 적절한 것은?","options":[{"id":"A","text":"전전에는 문화가 경제의 보조수단으로 이해되었고, 전후 군사와 결합되어 이해되었다."},{"id":"B","text":"일본 대외문화정책의 변화에 있어 문화는 다른 요소의 부수적인 위치에서 그 자체가 다른 것과 대등하게 자립하는 위치로 바뀌어왔다."},{"id":"C","text":"일본이 취해 온 대외 문화교류 정책의 대상국가는 중국, 동남아, 유럽, 미국 등의 순서로 일본의 경제적 의존 정도에 의해 결정되어왔다."},{"id":"D","text":"일본의 문화교류정책은 1990년대 일본의 대외 경제진출에 수반되어 발생하는 마찰을 해소시키기 위한 수단으로서 본격화되었다."}],"type":"mc","id":"dongbuka-2021-final-42","source":"2021 기말","originalText":"일본정부의 문화교류정책에 대한 설명 중에서 적절한 것은?","originalAnswer":"족보 기재 답안은 별도 검증 대상으로 취급","contentRevision":1,"refs":["culturalDiplomacy"],"topic":"동북아와 한일관계","note":"20 족보 모음.docx와 20-1 기말.pdf의 동일 연도·문항을 통합했습니다. 순서나열형과 선지 없는 객관식은 제외했습니다.","answer":"B","ready":true,"status":"solved","review":"강의·자료 대조","explanation":"문화가 군사·경제의 보조 위치에서 독자적인 외교 수단으로 부상했다는 설명이다. 1970년대 문화외교 강화와도 부합한다. (일본 외교청서 1972; 족보 문화교류 정리)"},{"year":2021,"no":43,"text":"TAC 가입 문제의 경우 동아시아 협력체의 형성 단계에서 중일 양국의 경쟁이 긍정적 결과를 낳은 사례이다.","options":[{"id":"O","text":"참"},{"id":"X","text":"거짓"}],"type":"ox","id":"dongbuka-2021-final-43","source":"2021 기말","originalText":"TAC 가입 문제의 경우 동아시아 협력체의 형성 단계에서 중일 양국의 경쟁이 긍정적 결과를 낳은 사례이다.","originalAnswer":"족보 기재 답안은 별도 검증 대상으로 취급","contentRevision":1,"refs":[],"topic":"동북아와 한일관계","note":"20 족보 모음.docx와 20-1 기말.pdf의 동일 연도·문항을 통합했습니다. 순서나열형과 선지 없는 객관식은 제외했습니다.","answer":"O","ready":true,"status":"solved","review":"강의·자료 대조","explanation":"TAC 가입 경쟁은 협력체 형성 단계에서 참여 확대를 촉진했다. (8-1 중일경쟁)"},{"year":2021,"no":44,"text":"한일 안보관계는 미국을 매개로 한 잠재적 협력관계의 성격을 여전히 유지하면서도, 탈냉전후 동아시아 국가 간에 새롭게 전개되고 있는 다자간 세력균형 게임의 일부로서 의미를 갖게 되었다.","options":[{"id":"O","text":"참"},{"id":"X","text":"거짓"}],"type":"ox","id":"dongbuka-2021-final-44","source":"2021 기말","originalText":"한일 안보관계는 미국을 매개로 한 잠재적 협력관계의 성격을 여전히 유지하면서도, 탈냉전후 동아시아 국가 간에 새롭게 전개되고 있는 다자간 세력균형 게임의 일부로서 의미를 갖게 되었다.","originalAnswer":"족보 기재 답안은 별도 검증 대상으로 취급","contentRevision":1,"refs":[],"topic":"동북아와 한일관계","note":"20 족보 모음.do no":42,"text":"일본경제의 저성장 국면으로의 이행, 미국의 시혜적 헤게모니의 종언과 시장개방 압력 등의 환경 변화로 인하여 일본의 성장산업부문과 쇠퇴산업부문간의 잠재적 이해대립이 정치적으로 가시화되었고, 이 양자간의 정치적 균열로 인해 자민당의 장기지배가 동요했던 현상은 () 정당의 딜레마에서 기인했다고 할 수 있다.","options":[{"id":"1","text":"포괄"},{"id":"2","text":"보수"},{"id":"3","text":"중도"},{"id":"4","text":"통합"}],"type":"mc","id":"dongbuka-2019-final-42","source":"2019-1 기말","originalText":"일본경제의 저성장 국면으로의 이행, 미국의 시혜적 헤게모니의 종언과 시장개방 압력 등의 환경 변화로 인하여 일본의 성장산업부문과 쇠퇴산업부문간의 잠재적 이해대립이 정치적으로 가시화되었고, 이 양자간의 정치적 균열로 인해 자민당의 장기지배가 동요했던 현상은 () 정당의 딜레마에서 기인했다고 할 수 있다.","originalAnswer":"족보 기재 답안은 별도 검증 대상으로 취급","contentRevision":1,"refs":[],"topic":"동북아와 한일관계","note":"20 족보 모음.docx와 20-1 기말.pdf의 동일 연도·문항을 통합했습니다. 순서나열형과 선지 없는 객관식은 제외했습니다.","answer":"1","ready":true,"status":"solved","review":"강의·자료 대조","explanation":"성장산업과 쇠퇴산업을 함께 대표하는 포괄정당의 딜레마다. (9-3 통상외교 18쪽)"},{"year":2019,"no":43,"text":"전후 일본의 소극적 안보외교의 제도적 틀에 포함되지 않는 것은 무엇인가?","options":[{"id":"1","text":"일본국헌법 제9조"},{"id":"2","text":"비핵 3원칙"},{"id":"3","text":"수출통제법"},{"id":"4","text":"미일안보체제"}],"type":"mc","id":"dongbuka-2019-final-43","source":"2019-1 기말","originalText":"전후 일본의 소극적 안보외교의 제도적 틀에 포함되지 않는 것은 무엇인가?","originalAnswer":"족보 기재 답안은 별도 검증 대상으로 취급","contentRevision":1,"refs":[],"topic":"동북아와 한일관계","note":"20 족보 모음.docx와 20-1 기말.pdf의 동일 연도·문항을 통합했습니다. 순서나열형과 선지 없는 객관식은 제외했습니다.","answer":"3","ready":true,"status":"solved","review":"강의·자료 대조","explanation":"강의의 틀은 헌법 제9조·비핵 3원칙·무기수출 3원칙·미일안보체제·문민통제이며 수출통제법이 아니다. (9-1 일본의 안보외교 9쪽)"},{"year":2019,"no":44,"text":"신중상주의적 통상정책에 대한 비판의 초점이라고 할 수 없는 것은 무엇인가?","options":[{"id":"1","text":"무역이 비록 동등하지는 않을지라도 상호이득을 가져올 수 있다는 점을 간과한다."},{"id":"2","text":"권력의 추구와 부의 추구는 서로 갈등을 일으킬 수도 있다."},{"id":"3","text":"강력하고 간섭주의적인 국가가 반드시 경제발전을 보장하지 않는다."},{"id":"4","text":"합리적인 경제행위자와 경쟁적 시장이라는 가정 자체가 비현실적이다."}],"type":"mc","id":"dongbuka-2019-final-44","source":"2019-1 기말","originalText":"신중상주의적 통상정책에 대한 비판의 초점이라고 할 수 없는 것은 무엇인가?","originalAnswer":"족보 기재 답안은 별도 검증 대상으로 취급","contentRevision":1,"refs":[],"topic":"동북아와 한일관계","note":"20 족보 모음.docx와 20-1 기말.pdf의 동일 연도·문항을 통합했습니다. 순서나열형과 선지 없는 객관식은 제외했습니다.","answer":"4","ready":true,"status":"solved","review":"강의·자료 대조","explanation":"합리적 경제행위자와 경쟁적 시장 가정에 대한 비판은 자유주의 비판이다. (9-3 통상외교 5~7쪽)"},{"year":2019,"no":45,"text":"한일FTA의 저해요인과 촉진요인에 대한 기술로 적절하지 않은 것은?","options":[{"id":"1","text":"무역이 비록 동등하지는 않을지라도 상호이득을 가져올 수 있다는 점을 간과한다."},{"id":"2","text":"권력의 추구와 부의 추구는 서로 갈등을 일으킬 수도 있다."},{"id":"3","text":"강력하고 간섭주의적인 국가가 반드시 경제발전을 보장하지 않는다."},{"id":"4","text":"합리적인 경제행위자와 경쟁적 시장이라는 가정 자체가 비현실적이다."}],"type":"mc","id":"dongbuka-2019-final-45","source":"2019-1 기말","originalText":"한일FTA의 저해요인과 촉진요인에 대한 기술로 적절하지 않은 것은?","originalAnswer":"족보 기재 답안은 별도 검증 대상으로 취급","contentRevision":2,"refs":[],"topic":"동북아와 한일관계","note":"20 족보 모음.docx와 20-1 기말.pdf의 동일 연도·문항을 통합했습니다. 순서나열형과 선지 없는 객관식은 제외했습니다.","answer":null,"ready":false,"status":"pending","review":"재검토 완료 · 원문 확인 필요","explanation":"질문은 한일FTA 촉진·저해 요인을 묻지만 선지는 앞 문항의 신중상주의 비판과 같다. 문제·선지 불일치로 출제 보류."},{"year":2019,"no":46,"text":"21세기 신시대 한일관계의 미래비전에 관한 기술 중 적절하지 않은 것은?","options":[{"id":"1","text":"장기적으로 미일 양국을 중심으로 동아시아 공동체를 실현시켜 갈 것을 요구하고 있다."},{"id":"2","text":"한일관계는 미중 양강 구도 속에 낀 양국관계의 양상으로 전개되고 있다."},{"id":"3","text":"한일의 긴밀한 협력관계는 미국, 중국과의 우호협력 관계의 발전과 모순되지 않는다."},{"id":"4","text":"한중일 3국 협력의 틀은 한일간 공생· 공영 네트워크의 구축에 필수 불가결한 요소이다."}],"type":"mc","id":"dongbuka-2019-final-46","source":"2019-1 기말","originalText":"21세기 신시대 한일관계의 미래비전에 관한 기술 중 적절하지 않은 것은?","originalAnswer":"족보 기재 답안은 별도 검증 대상으로 취급","contentRevision":1,"refs":[],"topic":"동북아와 한일관계","note":"20 족보 모음.docx와 20-1 기말.pdf의 동일 연도·문항을 통합했습니다. 순서나열형과 선지 없는 객관식은 제외했습니다.","answer":"1","ready":true,"status":"solved","review":"강의·자료 대조","explanation":"미래비전의 협력 중심은 ‘한일’이며 ‘미일’이 아니다. (12-3 과거사문제·미래)"},{"year":2019,"no":47,"text":"탈냉전 후 한일관계의 성격과 양상의 변화에 대한 기술로서 적합하지 않은 것은?","options":[{"id":"1","text":"한일 정치인 간의 비공식 채널이 강화된 것과는 달리, 시민사회나 지방 자치체 간의 교류는 감소했다."},{"id":"2","text":"한일 양국은 과거사, 영토문제로 여전히 첨예한 대립과 갈등의 국면으로 치닫고 있다."},{"id":"3","text":"한일 양국이 다루어야 할 협력과 갈등의 영역이 양국간 관계의 범주를 넘어서 지역적, 세계적 차원으로 확대되고 있다."},{"id":"4","text":"탈냉전 이후의 한일 안보관계는 냉전시대에 비해 복잡한 양상을 보이고 있다."}],"type":"mc","id":"dongbuka-2019-final-47","source":"2019-1 기말","originalText":"탈냉전 후 한일관계의 성격과 양상의 변화에 대한 기술로서 적합하지 않은 것은?","originalAnswer":"족보 기재 답안은 별도 검증 대상으로 취급","contentRevision":1,"refs":[],"topic":"동북아와 한일관계","note":"20 족보 모음.docx와 20-1 기말.pdf의 동일 연도·문항을 통합했습니다. 순서나열형과 선지 없는 객관식은 제외했습니다.","answer":"1","ready":true,"status":"solved","review":"강의·자료 대조","explanation":"정치인 간 채널은 약화된 반면 시민사회·지방 차원의 교류는 확대되었다. (12-1 구조전환)"},{"year":2019,"no":48,"text":"일본정부의 문화교류정책에 대한 설명 중에서 적절한 것은?","options":[{"id":"1","text":"일본의 문화교류정책은 1970년대 일본의 대외 경제진출에 수반되어 발생하는 마찰을 해소시키기 위한 수단으로서 본격화되었다."},{"id":"2","text":"일본 대외문화정책의 변화에 있어 문화는 그 자체가 다른 것과 대등하게 자립하는 위치로부터 다른 요소의 부수적인 위치로 바뀌어왔다."},{"id":"3","text":"전전에는 문화가 경제의 보조수단으로 이해되었고, 전후 군사와 결합되어 이해되었다."},{"id":"4","text":"일본이 취해 온 대외 문화교류 정책의 대상국가는 중국, 동남아, 유럽, 미국 등의 순서로 일본의 경제적 의존 정도에 의해 결정되어왔다."}],"type":"mc","id":"dongbuka-2019-final-48","source":"2019-1 기말","originalText":"일본정부의 문화교류정책에 대한 설명 중에서 적절한 것은?","originalAnswer":"족보 기재 답안은 별도 검증 대상으로 취급","contentRevision":1,"refs":["culturalDiplomacy"],"topic":"동북아와 한일관계","note":"20 족보 모음.docx와 20-1 기말.pdf의 동일 연도·문항을 통합했습니다. 순서나열형과 선지 없는 객관식은 제외했습니다.","answer":"1","ready":true,"status":"solved","review":"강의·자료 대조","explanation":"1970년대 경제진출에 따른 마찰과 상호이해 부족을 완화하기 위해 문화외교가 강화되었다. 국제교류기금은 1972년 설립되었다. (일본 외교청서 1972)"},{"year":2019,"no":49,"text":"CMI 및 CMI의 다자화(CMIM)에 대한 기술 중 바르지 못한 것은?","options":[{"id":"1","text":"2008년 글로벌 금융위기 시 위기에 직면한 국가들이 CMI를 이용하지 않았다."},{"id":"2","text":"2009년 CMI 다자화 주요 쟁점에 합의했다."},{"id":"3","text":"2012년 신용규모를 3.600억 달러로 확대하고 의결권 배분을 정했다."},{"id":"4","text":"위기국가는 일정액을 넘는 부분에 대해서는 IMF와 협의 후 CMIM의 신용을 할당받아야 하며 IMF의 이행조건을 수용해야 한다."}],"type":"mc","id":"dongbuka-2019-final-49","source":"2019-1 기말","originalText":"CMI 및 CMI의 다자화(CMIM)에 대한 기술 중 바르지 못한 것은?","originalAnswer":"족보 기재 답안은 별도 검증 대상으로 취급","contentRevision":1,"refs":["cmim"],"topic":"동북아와 한일관계","note":"20 족보 모음.docx와 20-1 기말.pdf의 동일 연도·문항을 통합했습니다. 순서나열형과 선지 없는 객관식은 제외했습니다.","answer":"3","ready":true,"status":"solved","review":"강의·자료 대조","explanation":"2012년 합의한 규모는 3,600억이 아니라 2,400억 달러다. 개정협정 발효는 2014년이다. (10-2 과제 7쪽; ASEAN 공식 자료)"},{"year":2019,"no":50,"text":"()은/는 '동아시아비전그룹'(EAVG)과 '동아시아스터디그룹'(EASG)이 제출한 보고서에서 제안된 트랙2(반관반민)의 동아시아 싱크탱크 네트워크이다.","options":[{"id":"1","text":"NEAT"},{"id":"2","text":"ERPD"},{"id":"3","text":"AMRO"},{"id":"4","text":"ERIA"}],"type":"mc","id":"dongbuka-2019-final-50","source":"2019-1 기말","originalText":"()은/는 '동아시아비전그룹'(EAVG)과 '동아시아스터디그룹'(EASG)이 제출한 보고서에서 제안된 트랙2(반관반민)의 동아시아 싱크탱크 네트워크이다.","originalAnswer":"족보 기재 답안은 별도 검증 대상으로 취급","contentRevision":1,"refs":[],"topic":"동북아와 한일관계","note":"20 족보 모음.docx와 20-1 기말.pdf의 동일 연도·문항을 통합했습니다. 순서나열형과 선지 없는 객관식은 제외했습니다.","answer":"1","ready":true,"status":"solved","review":"강의·자료 대조","explanation":"동아시아 싱크탱크 네트워크는 NEAT이다. (8-1 중일경쟁)"},{"year":2022,"no":7,"text":"( )은/는 국적과 문화의 차이를 넘어 과학적 방법론을 공유하는 자연과학자의 집단을 가리키는 용어였으나 1990년대에 들어와 세계적 문제에 대한 국제적 정책 협조를 설명하는 개념으로 그 의미가 확대되었다.","options":[{"id":"A","text":"정책 커뮤니티"},{"id":"B","text":"인식 공동체"},{"id":"C","text":"NGO"},{"id":"D","text":"사회네트워크"}],"type":"mc","id":"dongbuka-2022-compilation-p1-7-1","source":"2022 족보·정리","originalText":"( )은/는 국적과 문화의 차이를 넘어 과학적 방법론을 공유하는 자연과학자의 집단을 가리키는 용어였으나 1990년대에 들어와 세계적 문제에 대한 국제적 정책 협조를 설명하는 개념으로 그 의미가 확대되었다.","originalAnswer":"족보 기재 답안은 별도 검증 대상으로 취급","contentRevision":1,"refs":[],"topic":"동북아와 한일관계","note":"22 족보+정리.pdf 1쪽, 원문 7번. 주차별로 모은 기출 정리이므로 2022년 단일 시험으로 단정하지 않습니다. 같은 파일에서 반복된 동일 문항은 한 번만 등록했습니다.","answer":"B","ready":true,"status":"solved","review":"강의·자료 대조","explanation":"전문가 네트워크인 인식공동체(epistemic community)다. (6-1 미국 지역구상 6쪽)","sourcePage":1},{"year":2022,"no":12,"text":"일대일로에서 ‘일대(一帶)'는 동남아시아와 유럽·아프리카로 이어지는 '해상 실크로드'를, '일로(一路)'는 중앙아시아와 유럽을 연결하는 ‘육상 실크로드'를 의미한다.","options":[{"id":"O","text":"참"},{"id":"X","text":"거짓"}],"type":"ox","id":"dongbuka-2022-compilation-p1 inalText":"핵무기 제조에 전용될 수 있다는 이유로 일본에는 재처리 시설이 한군데도 없다.","originalAnswer":"족보 기재 답안은 별도 검증 대상으로 취급","contentRevision":1,"refs":["reprocessing"],"topic":"동북아와 한일관계","note":"22 족보+정리.pdf 4쪽, 원문 20번. 주차별로 모은 기출 정리이므로 2022년 단일 시험으로 단정하지 않습니다. 같은 파일에서 반복된 동일 문항은 한 번만 등록했습니다.","answer":"X","ready":true,"status":"solved","review":"강의·자료 대조","explanation":"일본에는 도카이·롯카쇼 등 재처리시설이 있다. 상업가동 여부와 시설 존재를 구분해야 한다. (일본원연 재처리시설 설명)","sourcePage":4},{"year":2022,"no":16,"text":"한일관계에 있어 과거사문제에 대한 접근법에 관한 설명으로 적절하지 않은 것은?","options":[{"id":"1","text":"냉철한 국익의 계산과 철저한 전략적 사고로 대일 외교를 정립해야 하며 그 기반은 일본의 리얼리티를 제대로 읽는 데서 출발해야 한다."},{"id":"2","text":"대일 외교 어젠다는 위안부 등 역사문제 이외에도 대북 공조, 외교안보 협력, 경제 협력, 사회문화 교류 분야에서의 공조, 협력 등 중요한 영역이 존재한다는 사실을 고려해야 한다."},{"id":"3","text":"민주국가에서 국민여론은 중시되어야 하나 국민 정서, 대중의 감정에 휩쓸리는 대일 과거사 외교의 함정에 빠져서는 안 된다."},{"id":"4","text":"한일관계에서 역사 문제와 비 역사 쟁점(안보, 경쟁 등)은 분리하지 않고 통합적으로 다루는 것이 효과적이다."}],"type":"mc","id":"dongbuka-2022-compilation-p4-16-39","source":"2022 족보·정리","originalText":"한일관계에 있어 과거사문제에 대한 접근법에 관한 설명으로 적절하지 않은 것은?","originalAnswer":"족보 기재 답안은 별도 검증 대상으로 취급","contentRevision":1,"refs":[],"topic":"동북아와 한일관계","note":"22 족보+정리.pdf 4쪽, 원문 16번. 주차별로 모은 기출 정리이므로 2022년 단일 시험으로 단정하지 않습니다. 같은 파일에서 반복된 동일 문항은 한 번만 등록했습니다.","answer":"4","ready":true,"status":"solved","review":"강의·자료 대조","explanation":"역사와 비역사 쟁점은 각각의 논리에 맞게 분리해서 다루어야 한다는 접근이다. (12-3 과거사문제·미래 5쪽)","sourcePage":4},{"year":2022,"no":31,"text":"9.11 테러 이후 21세기 글로벌 안보위협의 주체와 안보위협요인 변화에 대한 설명으로 적절하지 않은 것은?","options":[{"id":"1","text":"비국가적 안보 위협의 증대"},{"id":"2","text":"전통적 안보 위협의 부상"},{"id":"3","text":"범지구적 테러조직의 네트워크화 가능"},{"id":"4","text":"소형무기 및 대량살상무기의 확산 가능성 증대"}],"type":"mc","id":"dongbuka-2022-compilation-p4-31-40","source":"2022 족보·정리","originalText":"9.11 테러 이후 21세기 글로벌 안보위협의 주체와 안보위협요인 변화에 대한 설명으로 적절하지 않은 것은?","originalAnswer":"족보 기재 답안은 별도 검증 대상으로 취급","contentRevision":1,"refs":[],"topic":"동북아와 한일관계","note":"22 족보+정리.pdf 4쪽, 원문 31번. 주차별로 모은 기출 정리이므로 2022년 단일 시험으로 단정하지 않습니다. 같은 파일에서 반복된 동일 문항은 한 번
