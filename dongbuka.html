조수단으로 이해되었고, 전후 군사와 결합되어 이해되었다."},{"id":"4","text":"일본이 취해 온 대외 문화교류 정책의 대상국가는 중국, 동남아, 유럽, 미국 등의 순서로 일본의 경제적 의존 정도에 의해 결정되어왔다."}],"type":"mc","id":"dongbuka-2022-compilation-p7-48-67","source":"2022 족보·정리","originalText":"일본정부의 문화교류정책에 대한 설명 중에서 적절한 것은?","originalAnswer":"족보 기재 답안은 별도 검증 대상으로 취급","contentRevision":1,"refs":["culturalDiplomacy"],"topic":"동북아와 한일관계","note":"22 족보+정리.pdf 7쪽, 원문 48번. 주차별로 모은 기출 정리이므로 2022년 단일 시험으로 단정하지 않습니다. 같은 파일에서 반복된 동일 문항은 한 번만 등록했습니다.","answer":"1","ready":true,"status":"solved","review":"강의·자료 대조","explanation":"1970년대 경제진출에 따른 마찰과 상호이해 부족을 완화하기 위해 문화외교가 강화되었다. 국제교류기금은 1972년 설립되었다. (일본 외교청서 1972)","sourcePage":7},{"year":2022,"no":46,"text":"21세기 신시대 한일관계의 미래비전에 관한 기술 중 적절하지 않은 것은?","options":[{"id":"1","text":"장기적으로 미일 양국을 중심으로 동아시아 공동체를 실현시켜 갈 것을 요구하고 있다."},{"id":"2","text":"한일관계는 미중 양강 구도 속에 낀 양국관계의 양상으로 전개되고 있다."},{"id":"3","text":"한일의 긴밀한 협력관계는 미국, 중국과의 우호협력 관계의 발전과 모순되지 않는다."},{"id":"4","text":"한중일 3국 협력의 틀은 한일간 공생· 공영 네트워크의 구축에 필수 불가결한 요소이다."}],"type":"mc","id":"dongbuka-2022-compilation-p8-46-68","source":"2022 족보·정리","originalText":"21세기 신시대 한일관계의 미래비전에 관한 기술 중 적절하지 않은 것은?","originalAnswer":"족보 기재 답안은 별도 검증 대상으로 취급","contentRevision":1,"refs":[],"topic":"동북아와 한일관계","note":"22 족보+정리.pdf 8쪽, 원문 46번. 주차별로 모은 기출 정리이므로 2022년 단일 시험으로 단정하지 않습니다. 같은 파일에서 반복된 동일 문항은 한 번만 등록했습니다.","answer":"1","ready":true,"status":"solved","review":"강의·자료 대조","explanation":"미래비전의 협력 중심은 ‘한일’이며 ‘미일’이 아니다. (12-3 과거사문제·미래)","sourcePage":8},{"year":2022,"no":1,"text":"'한일터널'의 건설은 조선시대 신사유람단의 통행로인 바닷길을 육로의 형태로 복원하는 의미를 지니고 있다.","options":[{"id":"O","text":"참"},{"id":"X","text":"거짓"}],"type":"ox","id":"dongbuka-2022-compilation-p8-1-69","source":"2022 족보·정리","originalText":"'한일터널'의 건설은 조선시대 신사유람단의 통행로인 바닷길을 육로의 형태로 복원하는 의미를 지니고 있다.","originalAnswer":"족보 기재 답안은 별도 검증 대상으로 취급","contentRevision":1,"refs":[],"topic":"동북아와 한일관계","note":"22 족보+정리.pdf 8쪽, 원문 1번. 주차별로 모은 기출 정리이므로 2022년 단일 시험으로 단정하지 않습니다. 같은 파일에서 반복된 동일 문항은 한 번만 등록했습니다.","answer":"X","ready":true,"status":"solved","review":"강의·자료 대조","explanation":"조선통신사의 통행로와 문화교류를 가리키는 맥락이다. 신사유람단과 구분한다. (조선통신사 기록·유네스코)","sourcePage":8},{"year":2022,"no":6,"text":"'한일터널'이 완공되면 일본이 갖는 유라시아 횡단 루트의 기·종점으로서의 입지를 상실하고, 그 대신 부산이 유라시아 교통망의 거점이 되어 이익을 향유할 것이라는 분석이 있다.","options":[{"id":"O","text":"참"},{"id":"X","text":"거짓"}],"type":"ox","id":"dongbuka-2022-compilation-p8-6-70","source":"2022 족보·정리","originalText":"'한일터널'이 완공되면 일본이 갖는 유라시아 횡단 루트의 기·종점으로서의 입지를 상실하고, 그 대신 부산이 유라시아 교통망의 거점이 되어 이익을 향유할 것이라는 분석이 있다.","originalAnswer":"족보 기재 답안은 별도 검증 대상으로 취급","contentRevision":2,"refs":["tunnelReview"],"topic":"동북아와 한일관계","note":"22 족보+정리.pdf 8쪽, 원문 6번. 주차별로 모은 기출 정리이므로 2022년 단일 시험으로 단정하지 않습니다. 같은 파일에서 반복된 동일 문항은 한 번만 등록했습니다.","answer":"X","ready":true,"status":"solved","review":"강의·근거자료 재검증 완료","explanation":"문항은 터널 반대론의 주체를 뒤바꿨다. 해당 우려는 부산의 유라시아 철도 기·종점 기능이 일본으로 이전될 수 있다는 것이다. 일본이 기·종점 지위를 잃고 부산이 대신 얻는다는 설명이 아니다. 이는 특정 분석의 논지를 확인한 것이며 실제 사업 편익의 확정적 예측은 아니다.\n검토 근거: 한일터널 연구자료의 찬반론 중 국토개발 측면.","sourcePage":8},{"year":2022,"no":11,"text":"한일기술협력의 패턴은 ‘북북형'에서 민간협력단계를 거쳐 '남북형'으로 이동될 것으로 전망된다.","options":[{"id":"O","text":"참"},{"id":"X","text":"거짓"}],"type":"ox","id":"dongbuka-2022-compilation-p8-11-71","source":"2022 족보·정리","originalText":"한일기술협력의 패턴은 ‘북북형'에서 민간협력단계를 거쳐 '남북형'으로 이동될 것으로 전망된다.","originalAnswer":"족보 기재 답안은 별도 검증 대상으로 취급","contentRevision":2,"refs":["technologyLecture"],"topic":"동북아와 한일관계","note":"22 족보+정리.pdf 8쪽, 원문 11번. 주차별로 모은 기출 정리이므로 2022년 단일 시험으로 단정하지 않습니다. 같은 파일에서 반복된 동일 문항은 한 번만 등록했습니다.","answer":"X","ready":true,"status":"solved","review":"강의·근거자료 재검증 완료","explanation":"협력의 방향을 거꾸로 쓴 문장이다. 일본의 기술을 이전받는 남북형 협력에서 민간협력을 거쳐, 양국의 기술 격차 축소에 따른 북북형 공동연구·기술협력으로 이동한다.\n검토 근거: 동북아11-3_한일FTA의 경쟁력 격차 축소·남북형 협력 요구 절제 설명, 공개 강의자료의 ‘복합공생을 위한 한일기술협력’.","sourcePage":8},{"year":2022,"no":8,"text":"글로벌 무역에서 동아시아의 지속적인 부상과 진정한 교역대국으로서 중국의 등장에도 불구하고, 글로벌 금융 거래의 중심은 동방으로 이동하지 않았다.","options":[{"id":"O","text":"참"},{"id":"X","text":"거짓"}],"type":"ox","id":"dongbuka-2022-compilation-p8-8-72","source":"2022 족보·정리","originalText":"글로벌 무역에서 동아시아의 지속적인 부상과 진정한 교역대국으로서 중국의 등장에도 불구하고, 글로벌 금융 거래의 중심은 동방으로 이동하지 않았다.","originalAnswer":"족보 기재 답안은 별도 검증 대상으로 취급","contentRevision":2,"refs":[],"topic":"동북아와 한일관계","note":"22 족보+정리.pdf 8쪽, 원문 8번. 주차별로 모은 기출 정리이므로 2022년 단일 시험으로 단정하지 않습니다. 같은 파일에서 반복된 동일 문항은 한 번만 등록했습니다.","answer":null,"ready":false,"status":"pending","review":"재검토 완료 · 원문 확인 필요","explanation":"업로드된 강의노트의 금융협력·CMI 부분과 대조했으나 ‘글로벌 금융 거래의 중심’의 기준 지표와 시점을 특정하는 대목은 확인되지 않았다. 족보에는 X 표시가 있지만, 무역 중심의 이동과 금융 중심의 이동은 동일하지 않으므로 그 표시만으로 정답을 확정할 수 없다. 해당 명제가 나온 강의 슬라이드 또는 교수자 답안 확인이 필요하다.","sourcePage":8},{"year":2022,"no":12,"text":"일본의 재정적자는 '55년 체제' 자민당 집권 하에서 이른바 '이익유도장치'를 통해 지방의 토건사업, 인프라 건설에 지나치게 많은 재정을 투입한 것에 유래한다.","options":[{"id":"O","text":"참"},{"id":"X","text":"거짓"}],"type":"ox","id":"dongbuka-2022-compilation-p8-12-73","source":"2022 족보·정리","originalText":"일본의 재정적자는 '55년 체제' 자민당 집권 하에서 이른바 '이익유도장치'를 통해 지방의 토건사업, 인프라 건설에 지나치게 많은 재정을 투입한 것에 유래한다.","originalAnswer":"족보 기재 답안은 별도 검증 대상으로 취급","contentRevision":2,"refs":["tunnelReview"],"topic":"동북아와 한일관계","note":"22 족보+정리.pdf 8쪽, 원문 12번. 주차별로 모은 기출 정리이므로 2022년 단일 시험으로 단정하지 않습니다. 같은 파일에서 반복된 동일 문항은 한 번만 등록했습니다.","answer":"O","ready":true,"status":"solved","review":"강의·근거자료 재검증 완료","explanation":"재정 악화의 역사적 요인에 대한 설명으로 참이다. 관련 연구는 55년 체제의 이익유도 정치와 공공사업 과다 지출을 원인 중 하나로 설명한다. 버블 붕괴 후 경기부양과 고령화에 따른 지출 증가도 함께 작용했으며, 공공사업만이 유일한 원인이라는 뜻은 아니다.\n검토 근거: 동북아10-1_도전요인(고령화·사회보장 지출), 한일터널 연구자료의 일본 재정 제약 부분.","sourcePage":8},{"year":2022,"no":27,"text":"세계경제의 침체 속에서 한일은 동아시아 생산 네트워크를 더욱 활성화하여 산업경쟁력을 제고하고 역내 내수시장을 확보해야 하는 과제를 안고 있다.","options":[{"id":"O","text":"참"},{"id":"X","text":"거짓"}],"type":"ox","id":"dongbuka-2022-compilation-p8-27-74","source":"2022 족보·정리","originalText":"세계경제의 침체 속에서 한일은 동아시아 생산 네트워크를 더욱 활성화하여 산업경쟁력을 제고하고 역내 내수시장을 확보해야 하는 과제를 안고 있다.","originalAnswer":"족보 기재 답안은 별도 검증 대상으로 취급","contentRevision":1,"refs":[],"topic":"동북아와 한일관계","note":"22 족보+정리.pdf 8쪽, 원문 27번. 주차별로 모은 기출 정리이므로 2022년 단일 시험으로 단정하지 않습니다. 같은 파일에서 반복된 동일 문항은 한 번만 등록했습니다.","answer":"O","ready":true,"status":"solved","review":"강의·자료 대조","explanation":"국제 생산네트워크를 활성화하고 역내 경쟁력·경제적 활력을 높이는 것은 한일의 협력 과제다. (10-3 전략 6~9쪽)","sourcePage":8},{"year":2022,"no":38,"text":"일본은 동아시아를 '인도-태평양'으로 인식하여 구성국 확대를 모색하는 지역협력전략을 추진하고 있다.","options":[{"id":"O","text":"참"},{"id":"X","text":"거짓"}],"type":"ox","id":"dongbuka-2022-compilation-p8-38-75","source":"2022 족보·정리","originalText":"일본은 동아시아를 '인도-태평양'으로 인식하여 구성국 확대를 모색하는 지역협력전략을 추진하고 있다.","originalAnswer":"족보 기재 답안은 별도 검증 대상으로 취급","contentRevision":1,"refs":[],"topic":"동북아와 한일관계","note":"22 족보+정리.pdf 8쪽, 원문 38번. 주차별로 모은 기출 정리이므로 2022년 단일 시험으로 단정하지 않습니다. 같은 파일에서 반복된 동일 문항은 한 번만 등록했습니다.","answer":"O","ready":true,"status":"solved","review":"강의·자료 대조","explanation":"일본은 광역 동아시아·인도태평양 인식으로 지역구상의 범위를 확장했다. (6-3 일본 지역구상 3쪽)","sourcePage":8},{"id":"dongbuka-2022-compilation-extra-1","source":"2022 족보·정리","year":2022,"no":1,"text":"한국전쟁 기간 내 일본은 후방지원의 기지역할을 했지만, 전쟁 이후에는 ‘평화국가’나 ‘기지국가’가 아니며 ‘국방국가’라고 볼 수 있다.","originalText":"한국전쟁 기간 내 일본은 후방지원의 기지역할을 했지만, 전쟁 이후에는 ‘평화국가’나 ‘기지국가’가 아니며 ‘국방국가’라고 볼 수 있다.","options":[{"id":"O","text":"참"},{"id":"X","text":"거짓"}],"type":"ox","answer":"X","ready":true,"status":"solved","review":"강의·자료 대조","explanation":"전후 일본은 평화헌법·전수방위와 미일동맹의 기지 제공이라는 틀로 설명된다. ‘국방국가’로 단정한 설명은 맞지 않는다. (9-1 일본의 안보외교)","contentRevision":1,"refs":[],"topic":"동북아와 한일관계","sourcePage":8,"note":"22 족보+정리.pdf 8쪽 하단 1번."},{"id":"dongbuka-2022-compilation-extra-2","source":"2022 족보·정리","year":2022,"no":2,"text":"북일 국교교섭 회담의 주요 쟁점 세 가지는 식민지 지배 청산문제, 북핵/미사일문제, KEDO 시스템문제였다.","originalText":"북일 국교교섭 회담의 주요 쟁점 세 가지는 식민지 지배 청산문제, 북핵/미사일문제, KEDO 시스템문제였다.","options":[{"id":"O","text":"참"},{"id":"X","text":"거짓"}],"type":"ox","answer":"X","ready":true,"status":"solved","review":"강의·자료 대조","explanation":"주요 쟁점은 과거 청산, 핵·미사일, 일본인 납치 문제다. KEDO 시스템문제로 바꾼 문장은 틀리다. (일본 외무성 북일관계 개요)","contentRevision":1,"refs":["dprk"],"topic":"동북아와 한일관계","sourcePage":8,"note":"22 족보+정리.pdf 8쪽 하단 2번."},{"id":"dongbuka-2022-compilation-extra-3","source":"2022 족보·정리","year":2022,"no":3,"text":"90년대 이후 한일관계의 동아시아화가 더욱 진전되어서 ASEAN+3(한중일), 한반도에너지개발기구(KEDO), 6자회담 등 다자간 협력의 장이 동아시아 차원으로 더욱 확대되고 많아졌다.","originalText":"90년대 이후 한일관계의 동아시아화가 더욱 진전되어서 ASEAN+3(한중일), 한반도에너지개발기구(KEDO), 6자회담 등 다자간 협력의 장이 동아시아 차원으로 더욱 확대되고 많아졌다.","options":[{"id":"O","text":"참"},{"id":"X","text":"거짓"}],"type":"ox","answer":"O","ready":true,"status":"solved","review":"강의·자료 대조","explanation":"탈냉전 후 한일의 협력·갈등 영역이 양자관계에서 지역적 다자협력으로 확대되었다. 문항의 ‘90년대 이후’는 2000년대의 APT·6자회담 전개도 포괄한다. (12-1 구조전환)","contentRevision":1,"refs":[],"topic":"동북아와 한일관계","sourcePage":8,"note":"22 족보+정리.pdf 8쪽 하단 3번."},{"id":"dongbuka-2020-midterm-1","source":"2020-1 중간 퀴즈","no":1,"text":"미국은 대만의 안전보장을 위해 1979년 4월 국내법인 대만여행법(Taiwan Travel Act)을 제정했다.","originalText":"미국은 대만의 안전보장을 위해 1979년 4월 국내법인 대만여행법(Taiwan Travel Act)을 제정했다.","answer":"X","type":"ox","options":[{"id":"O","text":"참"},{"id":"X","text":"거짓"}],"ready":true,"status":"solved","review":"공식 자료 대조","explanation":"1979년의 법은 대만관계법(Taiwan Relations Act)이다. 대만여행법은 2018년 법이다. (미국 정부 법령 원문)","note":"20-1 기말.pdf 끝부분의 중간고사 퀴즈. 4·5번은 선지 없는 빈칸형이므로 제외.","refs":["taiwanRelations","taiwanTravel"],"contentRevision":1,"topic":"동북아와 한일관계"},{"id":"dongbuka-2020-midterm-2","source":"2020-1 중간 퀴즈","no":2,"text":"동아시아 지역개념은 역사, 가치, 정체성보다 실용적이고 물질적인 관점에서 실질적인 문제해결을 중심으로 정의되고 있다.","originalText":"동아시아 지역개념은 역사, 가치, 정체성보다 실용적이고 물질적인 관점에서 실질적인 문제해결을 중심으로 정의되고 있다.","answer":"X","type":"ox","options":[{"id":"O","text":"참"},{"id":"X","text":"거짓"}],"ready":true,"status":"solved","review":"강의·근거자료 재검증 완료","explanation":"강의는 동아시아 담론을 역사·가치·문화적 동질성·정체성과 공동체 형성의 당위성을 중심으로 설명한다. 이를 실용적·물질적 문제 해결만을 중심으로 정의한다는 설명은 부적절하다.\n검토 근거: 동북아1-1_동아시아 정체성 담론, 동북아1-2_동아시아 정체성 담론의 역사적 배경과 실체.","note":"20-1 기말.pdf 끝부분의 중간고사 퀴즈. 4·5번은 선지 없는 빈칸형이므로 제외.","refs":[],"contentRevision":2,"topic":"동북아와 한일관계"},{"id":"dongbuka-2020-midterm-3","source":"2020-1 중간 퀴즈","no":3,"text":"일본은 서구와 대등한 세력으로 부상하는 과정에서 서구에 배제되어 저항적 태도를 취할 때는 이른바 ‘대동아공영권’과 같은 비전을 제시하는 태도를 보였다.","originalText":"일본은 서구와 대등한 세력으로 부상하는 과정에서 서구에 배제되어 저항적 태도를 취할 때는 이른바 ‘대동아공영권’과 같은 비전을 제시하는 태도를 보였다.","answer":"O","type":"ox","options":[{"id":"O","text":"참"},{"id":"X","text":"거짓"}],"ready":true,"status":"solved","review":"강의·근거자료 재검증 완료","explanation":"강의는 일본이 서구에 동화하려 할 때 탈아입구를, 서구로부터 배제되어 저항하려 할 때 아시아인의 동원과 연대를 내세운 대동아공영권을 제시했다고 설명한다.\n검토 근거: 동북아1-1.pptx ‘개념의 타자성과 주변성’.","note":"20-1 기말.pdf 끝부분의 중간고사 퀴즈. 4·5번은 선지 없는 빈칸형이므로 제외.","refs":[],"contentRevision":2,"topic":"동북아와 한일관계"},{"id":"dongbuka-2022-compilation-image-geese-2","source":"2022 족보·정리","no":2,"type":"mc","text":"안행형(雁行型, flying geese model) 발전모델에 대한 설명 중 바르지 못한 것은?","options":[{"id":"1","text":"안행형 발전 모델은 1930년대 섬유산업의 동태적 발전과정을 연구한 아카마쓰(赤松要)에 의해 소개되었음."},{"id":"2","text":"1970년대의 고지마(小島清)를 거쳐 일본에서 시작되는 동아시아의 산업발전과정을 설명."},{"id":"3","text":"일본에서 경쟁력이 저하된 산업이 동아시아의 다음 단계에 있는 국가로 이전되고 거기서 다시 경쟁력이 저하되면 다음 단계의 국가로 이전하는 사다리 모델이다."},{"id":"4","text":"일대일로에서 일대를 해로라고 하고 일로를 육로라고 한다."}],"answer":"4","ready":true,"status":"solved","review":"강의·공식 자료 검증 완료","explanation":"안행형은 산업의 순차적 이전과 추격 발전을 설명한다. 4번은 별개 구상인 일대일로에 대한 설명이며 방향도 반대다. 일대는 육상 실크로드 경제벨트, 일로는 해상 실크로드를 뜻한다.\n검토 근거: 동북아1-1.pptx의 안행형 발전모델 설명, Kojima(2000), 중국 국무원 2015년 일대일로 행동계획.","note":"22 족보+정리.pdf 마지막 이미지 부분의 추가 사진에서 선별. 하이픈으로 나열된 네 선지를 번호로 정리했으며, 정답 표시와 해설 메모는 선지에서 분리했습니다.","originalAnswer":"사진의 표시와 독립적으로 검증","refs":["geeseResearch","briPlan"],"topic":"동아시아 경제발전","contentRevision":1,"originalText":"안행형(雁行型, flying geese model) 발전모델에 대한 설명 중 바르지 못한 것은?"}],"refs":{"adb":["ADB: 누들보울 효과","https://www.adb.org/publications/asian-noodle-bowl-it-serious-business"],"rcep":["일본 외무성: RCEP 서명국","https://www.mofa.go.jp/policy/other/bluebook/2021/en_html/chapter3/c030102.html"],"hallyu":["한국국제문화교류진흥원: 제4차 한류","https://welcon.kocca.kr/ko/info/trend/1942992"],"festival":["일본 외무성: 2005년 한일교류축제","https://www.mofa.go.jp/mofaj/gaiko/bluebook/2006/html/h2/h2_1_11.html"],"agreement":["2015년 한일 외교장관 공동발표","https://www.mofa.go.jp/a_o/na/kr/page4e_000364.html"],"politicalNetwork":["박철희, 정치네트워크의 부침으로 본 한일 협력과 갈등, 197쪽","https://ijs.snu.ac.kr/en/publications/korean_journal_of_japanese_studies?articleidx=158&mode=download"],"stateImmunity":["일본 외무성: 위안부 피해자 소송 관련 국가면제 주장(2023.11.23)","https://www.mofa.go.jp/press/release/press1e_000488.html"],"constitutional":["헌법재판소: 2006헌마788 결정","https://www.ccourt.go.kr/site/kor/ex/bbs/View.do?bcIdx=941596&cbIdx=1106"],"reprocessing":["일본원연: 재처리시설","https://www.jnfl.co.jp/en/business/reprocessing/"],"cmim":["ASEAN+3: CMIM 개요·2010년 발효","https://aseanplusthree.asean.org/about-cmim/"],"amroHistory":["AMRO 공식 연혁","https://www.amro-asia.org/wp-content/uploads/2019/04/AMRO-AR_History-of-AMRO.pdf"],"culturalDiplomacy":["일본 외교청서 1972: 국제문화교류","https://www.mofa.go.jp/policy/other/bluebook/1972/1972-2-7.htm"],"dprk":["일본 외무성: 북일관계 개요","https://www.mofa.go.jp/region/asia-paci/n_korea/relation.html"],"taiwanRelations":["미국 법령: 1979년 대만관계법","https://www.govinfo.gov/content/pkg/USCODE-2019-title22/html/USCODE-2019-title22-chap48-sec3301.htm"],"taiwanTravel":["미국 법령: 2018년 대만여행법","https://www.govinfo.gov/content/pkg/STATUTE-132/html/STATUTE-132-Pg341.htm"],"tunnelReview":["한일터널 관련 연구자료: 찬반론·재정 제약","https://www.jk-tunnel.or.jp/archive/jkt-shinbun-shoseki/shinbun-shoseki/jkt-ss-831.pdf"],"technologyLecture":["공개 강의자료: 복합공생을 위한 한일기술협력","https://www.scribd.com/document/1015190069/동북아13-2-일본-복사본"],"geeseResearch":["Kojima: The flying geese model (2000)","https://www.sciencedirect.com/science/article/pii/S1049007800000671"],"briPlan":["중국 국무원: 일대일로 행동계획(2015)","https://english.www.gov.cn/archive/publications/2015/03/30/content_281475080041500.htm"]},"coverage":[{"name":"2024-1 기말","state":"49문항 등록(객관식 23·진위 26), 48문항 검증 완료·1문항 보류. 12번은 선지 1·2가 모두 정답으로 해석되어 보류. 순서 나열형 42번 제외."},{"name":"2025-1 기말","state":"7~50번 44문항 등록(객관식 26·진위 18), 모두 출제 가능. 18·40번은 검증 후 수정한 문항으로 원문·수정 이유 보존. 1~6번 사진 미확인."},{"name":"검증 방식","state":"사진의 선택 표시는 정답으로 취급하지 않고 강의노트·공식 자료로 검증. 보류 문항은 자동 출제 제외."},{"name":"2019-1 기말","state":"50문항 등록(객관식 20·진위 30), 47문항 검증 완료·3문항 보류. 20-1 기말.pdf·20 족보 모음.docx의 동일 문항 통합."},{"name":"2020-1 기말","state":"30문항 등록(객관식 0·진위 30), 28문항 검증 완료·2문항 보류. 선지가 없는 객관식 20문항 제외. PDF·DOCX 동일 문항 통합."},{"name":"2021 기말","state":"49문항 등록(객관식 23·진위 26), 47문항 검증 완료·2문항 보류. 순서나열형 15번 제외. PDF·DOCX 동일 문항 통합."},{"name":"2022 족보·정리","state":"79문항 등록(객관식 30·진위 49), 76문항 검증 완료·3문항 보류. 1~8쪽의 번호 있는 문항 선별. 파일 내 반복 문항 통합. 순서나열형·선지 누락 문항 제외. 9~11쪽 추가 사진 확인 완료. 기존 문항은 중복 추가하지 않고 안행형 객관식 1문항 추가. 단답형·정리 메모 제외."},{"name":"2020-1 중간 퀴즈","state":"3문항 등록(객관식 0·진위 3), 3문항 검증 완료·0문항 보류. 20-1 기말.pdf에 부록으로 수록. 선지 없는 빈칸형 2문항 제외."}],"sourceNames":{},"removedQuestionIds":[],"manualDuplicates":[]}</script>
<script>
'use strict';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initial=JSON.parse($('#bank-data').textContent),KEY='dongbuka-bank-v1',SK='dongbuka-study-v1';
let data=structuredClone(initial),study={history:{},exam:null},view='home',editing=null;
try{let v=JSON.parse(localStorage.getItem(KEY)||'null');if(v?.version===initial.version&&Array.isArray(v.questions))data=v;let s=JSON.parse(localStorage.getItem(SK)||'null');if(s?.history)study=s;}catch(e){setTimeout(()=>toast('저장 자료를 불러오지 못했습니다. 기본 문항으로 열었습니다.'),100)}
data.removedQuestionIds=[...new Set([...(data.removedQuestionIds||[]),...(initial.removedQuestionIds||[])])];data.sourceNames={...(initial.sourceNames||{}),...(data.sourceNames||{})};data.manualDuplicates=data.manualDuplicates||[];
// Add new source questions while preserving locally edited questions and study records.
for(const incoming of initial.questions){if(!data.removedQuestionIds.includes(incoming.id)&&!data.questions.some(q=>q.id===incoming.id))data.questions.push(structuredClone(incoming));}

data.questions=data.questions.filter(q=>!data.removedQuestionIds.includes(q.id));
for(const incoming of initial.questions){const i=data.questions.findIndex(q=>q.id===incoming.id);if(i>=0&&(incoming.contentRevision||0)>(data.questions[i].contentRevision||0))data.questions[i]=structuredClone(incoming);}
if(study.exam?.items?.some(i=>data.removedQuestionIds.includes(i.q.id)||initial.questions.some(q=>q.id===i.q.id&&(q.contentRevision||0)>(i.q.contentRevision||0))))study.exam=null;
data.refs={...data.refs,...initial.refs};data.coverage=initial.coverage;
let selected=new Set(Array.isArray(study.selectedSources)?study.selectedSources:data.questions.map(q=>q.source)),filter={text:'',source:'',status:''};
const stateLabel=q=>q.review||(q.ready?'사용자 확인':'확인 대기');
const isReady=q=>q.ready&&q.answer!==null&&String(q.answer).trim()!=='';const isMarked=id=>Boolean(study.review&&study.review[id]);const needsReview=q=>study.history[q.id]?.lastCorrect===false||isMarked(q.id);function reviewButton(id){const on=isMarked(id);return `<button type="button" class="review-toggle" data-review="${esc(id)}" aria-pressed="${on}">${on?'★ 복습 표시됨':'☆ 복습하기'}</button>`}function toggleReview(id){study.review=study.review||{};if(study.review[id])delete study.review[id];else study.review[id]=new Date().toISOString();save();if(view==='bank'||view==='review'){const on=isMarked(id);document.querySelectorAll('[data-review]').forEach(b=>{if(b.dataset.review===id){b.setAttribute('aria-pressed',on);b.textContent=on?'★ 복습 표시됨':'☆ 복습하기'}})}else{const y=window.scrollY;render();window.scrollTo(0,y)}}document.addEventListener('click',e=>{const b=e.target.closest('[data-review]');if(b){e.preventDefault();toggleReview(b.dataset.review)}});
function toast(s){$('#toast').textContent=s;$('#toast').hidden=false;setTimeout(()=>$('#toast').hidden=true,5000)}
function save(bank=false){try{study.selectedSources=[...selected];if(bank)localStorage.setItem(KEY,JSON.stringify(data));localStorage.setItem(SK,JSON.stringify(study));return true}catch(e){toast('브라우저 저장에 실패했습니다. 백업 메뉴에서 파일을 내려받아 주세요.');return false}}
function shuffle(arr){let a=[...arr];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function sameAnswer(a,b,type){if(type==='multi')return JSON.stringify(String(a).split(',').filter(Boolean).sort())===JSON.stringify(String(b).split(',').filter(Boolean).sort());return String(a??'').trim().toLowerCase().replace(/\s+/g,'')===String(b??'').trim().toLowerCase().replace(/\s+/g,'')}
function sources(){return [...new Set(data.questions.map(q=>q.source))].sort((a,b)=>sourceName(a).localeCompare(sourceName(b),'ko',{numeric:true,sensitivity:'base'}))}
function tag(q){return `<span class="tag ${isReady(q)?'':'warning'}">${esc(stateLabel(q))}</span>`}
function answerText(q){if(q.answer===null)return '확정하지 않음';if(q.type==='short'||q.type==='ox')return q.answer;return String(q.answer).split(',').map(k=>q.options.find(o=>o.id===k)?.text||k).join(' / ')}
function reference(q){return(q.refs||[]).map(k=>data.refs[k]?`<a target="_blank" rel="noopener noreferrer" href="${esc(data.refs[k][1])}">${esc(data.refs[k][0])}</a>`:'').join(' · ')}
function explain(q){return `<div class="answerbox"><div class="row">${tag(q)}<span class="small muted">${esc(q.source)} · 원본 ${esc(q.no)}번</span></div><h3 style="margin-top:18px">${isReady(q)?'정답':'판단 / 잠정 답안'}: ${esc(answerText(q))}</h3><p>${esc(q.explanation)}</p><p class="small muted">족보 기록: ${esc(q.originalAnswer||'추가 문항')}</p>${q.note?`<details><summary>원본 주석 / 편집 기록</summary><p class="small">${esc(q.note)}</p></details>`:''}${reference(q)?`<p class="small">검토 근거: ${reference(q)}</p>`:''}</div>`}
function go(v){view=v;document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===v));render();window.scrollTo(0,0)}
function render(){if(view==='home')home();else if(view==='bank'||view==='review')list();else if(view==='exam')exam();else if(view==='result')result();else if(view==='duplicates')duplicateList();else backup()}
function home(){let ready=data.questions.filter(isReady),done=ready.filter(q=>study.history[q.id]?.attempts),wrong=ready.filter(q=>study.history[q.id]?.lastCorrect===false),marked=ready.filter(q=>isMarked(q.id)),reviewPool=ready.filter(needsReview);$('#app').innerHTML=`<span class="eyebrow">동북아와 한일관계</span><h1>오늘도, 한 문제씩 확실하게.</h1><p class="muted">족보별로 골라 풀고, 틀린 개념을 다시 확인하세요.<br>정답과 직접 풀이, 검토 근거는 답안을 제출한 뒤에 보여줍니다.</p><div class="layout"><section><section class="card"><div class="row"><h2>내 챕터 <span class="tag">${sources().length}</span></h2><button onclick="selectAll()">전체 선택 / 해제</button></div>${sources().map(s=>{const arr=data.questions.filter(q=>q.source===s);return `<div class="chapter"><input type="checkbox" aria-label="${esc(s)} 선택" data-source="${esc(s)}" ${selected.has(s)?'checked':''}><div><h3>${esc(sourceName(s))}</h3><span class="tag">${arr.filter(isReady).length}문항 출제 가능</span> <span class="tag warning">${arr.filter(q=>!isReady(q)).length}문항 확인 대기</span></div><button data-manage="${esc(s)}">문항 관리</button></div>`}).join('')}<footer>선택한 챕터 안에서 텍스트 유사도 90% 이상 또는 직접 등록한 중복문제는 한 번만 출제합니다. 정답 확인이 끝난 객관식·진위 문항만 출제합니다.</footer></section><div class="alert"><strong>객관식·진위 문항 검증</strong> · 2024-1 기말과 2025-1 기말(사진 7~50번)을 반영했습니다. 출제 가능한 문항은 ${ready.length}개이며, 중복 문항은 시험당 한 번만 출제합니다. <button onclick="go('review')">검토 현황 보기</button></div><div class="stats"><div class="stat"><span class="number">${ready.length}</span><span class="muted">출제 가능 문항</span></div><div class="stat"><span class="number">${done.length}<small style="font-size:16px"> / ${ready.length}</small></span><span class="muted">풀어 본 문항</span></div><div class="stat"><span class="number">${wrong.length}</span><span class="muted">최근 오답</span></div></div></section><aside><section class="card"><span class="eyebrow">TEST SETTINGS</span><h2>이번 시험 범위</h2><label for="topic">학습 주제</label><select id="topic"><option value="">모든 주제</option>${[...new Set(data.questions.map(q=>q.topic))].map(t=>`<option>${esc(t)}</option>`).join('')}</select><label for="count">출제 문항 수</label><input id="count" type="number" min="1" step="1" value="" autocomplete="off" placeholder="비워 두면 전체"><p class="small muted">원하는 문항 수를 입력하세요. 비워 두면 전체 문항을 출제합니다.</p><div class="check"><input id="mixed" type="checkbox" checked><label for="mixed">문제 순서 섞기</label></div><div class="check"><input id="choices" type="checkbox" checked><label for="choices">객관식 선지 섞기</label></div><div class="check"><input id="unseen" type="checkbox"><label for="unseen">아직 안 푼 문제만</label></div><button class="primary full" onclick="start()">문제 풀기 시작</button><p class="small muted">선택한 챕터의 검증된 문항만 출제합니다. 진위 선지는 항상 O(참), X(거짓) 순서입니다.</p></section><section class="card stack"><h3>이어지는 복습</h3><button onclick="start('wrong')" ${reviewPool.length?'':'disabled'}>오답·복습 문제 다시 풀기 (${reviewPool.length})</button><p class="small muted">최근 오답 ${wrong.length}개 · 복습 표시 ${marked.length}개. 문제를 풀 때 ‘☆ 복습하기’를 누르면 여기에 함께 담깁니다.</p>${study.exam&&!study.exam.finished?'<button onclick="go(\'exam\')">풀던 문제 이어하기</button>':''}<button onclick="filter.status='pending';go('review')">검증 보류 ${data.questions.length-ready.length}개 보기</button></section></aside></div>`;
 document.querySelectorAll('[data-source]').forEach(el=>el.onchange=()=>{el.checked?selected.add(el.dataset.source):selected.delete(el.dataset.source);save();});document.querySelectorAll('[data-manage]').forEach(el=>el.onclick=()=>{filter.source=el.dataset.manage;filter.status='';go('bank')});}
function selectAll(){selected=selected.size===sources().length?new Set():new Set(sources());save();home()}

function duplicateKey(q){
 const norm=v=>String(v??'').normalize('NFKC').toLowerCase().replace(/\s+/g,'').replace(/[.,，。!?？！“”"'‘’]/g,'');
 const opts=(q.options||[]).map(o=>norm(o.text));
 const answers=q.type==='short'?norm(q.answer):String(q.answer??'').split(',').map(id=>{const o=(q.options||[]).find(o=>String(o.id)===id.trim());return o?norm(o.text):'id:'+id.trim()}).sort();
 return JSON.stringify([q.type,norm(q.text),opts.slice().sort(),answers,q.image||'']);
}

function sourceName(s){return (data.sourceNames||{})[s]||s}
function renameSource(s){const name=prompt('챕터 이름',sourceName(s));if(!name?.trim())return;data.sourceNames=data.sourceNames||{};const before={...data.sourceNames};data.sourceNames[s]=name.trim();if(!save(true)){data.sourceNames=before;return}render()}
function normalizedText(q){return [q.text,...(q.options||[]).map(o=>o.text).sort()].join(' ').normalize('NFKC').toLowerCase().replace(/\s+/g,'')}
function textSimilarity(a,b){if(a===b)return 1;if(!a.length||!b.length)return 0;if(Math.min(a.length,b.length)/Math.max(a.length,b.length)<.9)return 0;let prev=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){const row=[i];for(let j=1;j<=b.length;j++)row[j]=Math.min(row[j-1]+1,prev[j]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));prev=row}return 1-prev[b.length]/Math.max(a.length,b.length)}
let duplicateCache=null;
function uniqueQuestions(pool){
 const signature=JSON.stringify([data.questions.map(q=>[q.id,q.type,q.text,q.options,q.answer,q.image]),data.manualDuplicates,data.sourceNames]);
 if(duplicateCache?.signature===signature)return duplicateCache.groups.map(g=>{const members=pool.filter(q=>g.includes(q.id));return members.length?{...members[0],duplicateIds:g,duplicateCount:g.length,duplicateSources:[...new Set(data.questions.filter(q=>g.includes(q.id)).map(q=>sourceName(q.source)))]}:null}).filter(Boolean);
 const all=data.questions,parents=new Map(all.map(q=>[q.id,q.id]));
 function root(id){while(parents.get(id)!==id){id=parents.get(id)}return id}
 function join(a,b){if(parents.has(a)&&parents.has(b))parents.set(root(b),root(a))}
 for(const group of data.manualDuplicates||[])for(const id of group.slice(1))join(group[0],id);
 const texts=all.map(normalizedText);
 for(let i=0;i<all.length;i++)for(let j=i+1;j<all.length;j++)if(duplicateKey(all[i])===duplicateKey(all[j])||(all[i].type===all[j].type&&all[i].answer!==null&&all[j].answer!==null&&answerText(all[i]).replace(/\s+/g,'')===answerText(all[j]).replace(/\s+/g,'')&&textSimilarity(texts[i],texts[j])>=.9))join(all[i].id,all[j].id);
 const fullGroups=new Map();for(const q of all){const key=root(q.id);if(!fullGroups.has(key))fullGroups.set(key,[]);fullGroups.get(key).push(q.id)}duplicateCache={signature,groups:[...fullGroups.values()]};return uniqueQuestions(pool);
 const groups=new Map();for(const q of pool){if(!parents.has(q.id))continue;const key=root(q.id);if(!groups.has(key))groups.set(key,[]);groups.get(key).push(q)}
 return [...groups.values()].map(group=>({...group[0],duplicateIds:group.map(q=>q.id),duplicateCount:group.length,duplicateSources:[...new Set(group.map(q=>sourceName(q.source)))]}));
}
function sanitizeExam(){const ex=study.exam;if(!ex)return;const current=ex.items[ex.index]?.q.id;const valid=ex.items.filter(i=>data.questions.some(q=>q.id===i.q.id&&selected.has(q.source))&&!(data.removedQuestionIds||[]).includes(i.q.id));const groups=uniqueQuestions(valid.map(i=>i.q));ex.items=groups.map(q=>({...valid.find(i=>i.q.id===q.id),q}));if(!ex.items.length){study.exam=null;save();return}ex.index=Math.max(0,ex.items.findIndex(i=>i.q.id===current));save()}
function duplicateList(){
 const groups=uniqueQuestions(data.questions).filter(q=>q.duplicateCount>1).sort((a,b)=>a.text.localeCompare(b.text,'ko'));
 $('#app').innerHTML='<h1>중복케이스 목록</h1><p class="muted">문제와 선지의 텍스트 유사도 90% 이상 또는 직접 등록한 문항입니다. 한 시험에서 그룹별 한 문항만 출제합니다.</p>'+groups.map(q=>'<section class="card"><h3>'+esc(q.text)+'</h3><span class="tag">'+q.duplicateCount+'문항</span>'+q.duplicateIds.map(id=>{const x=data.questions.find(x=>x.id===id);return '<p>'+esc(sourceName(x.source))+' · '+esc(x.no)+'번<br>'+esc(x.text)+'</p>'}).join('')+'</section>').join('')+(groups.length?'':'<p>등록된 중복케이스가 없습니다.</p>');
}
function openDuplicatePicker(){
 const current=study.exam?.items[study.exam.index]?.q;if(!current)return;
 let dialog=document.getElementById('duplicate-picker');if(!dialog){dialog=document.createElement('dialog');dialog.id='duplicate-picker';document.body.append(dialog)}
 const candidates=data.questions.filter(q=>q.id!==current.id).sort((a,b)=>textSimilarity(normalizedText(current),normalizedText(b))-textSimilarity(normalizedText(current),normalizedText(a)));
 dialog.innerHTML='<h2>중복문제 등록</h2><p>'+esc(current.text)+'</p><input id="duplicate-search" placeholder="문제 제목 검색" aria-label="문제 제목 검색"><div id="duplicate-candidates" style="max-height:45vh;overflow:auto">'+candidates.map(q=>'<label class="check"><input type="checkbox" value="'+esc(q.id)+'"><span>'+esc(q.text)+'<br><small>'+esc(sourceName(q.source))+' · '+esc(q.no)+'번</small></span></label>').join('')+'</div><button id="duplicate-save" class="primary">같은 중복케이스로 등록</button> <button id="duplicate-close">닫기</button>';
 dialog.querySelector('#duplicate-search').oninput=e=>dialog.querySelectorAll('label').forEach(l=>l.hidden=!l.textContent.includes(e.target.value));
 dialog.querySelector('#duplicate-close').onclick=()=>dialog.close();
 dialog.querySelector('#duplicate-save').onclick=()=>{const ids=[...dialog.querySelectorAll('input[type=checkbox]:checked')].map(x=>x.value);if(!ids.length)return toast('같은 문제를 선택하세요.');const before=structuredClone(data.manualDuplicates||[]);data.manualDuplicates=[...before,[current.id,...ids]];if(!save(true)){data.manualDuplicates=before;return}dialog.close();exam();toast('중복케이스 등록 완료 · 현재 시험의 중복 문항도 제외했습니다.');};dialog.showModal();
}
function duplicateBadge(q){return q.duplicateCount>1?'<div class="repeat-important" role="note"><strong>★ 중요 · 반복 출제 '+q.duplicateCount+'회</strong><div>선택 범위에서 겹치는 문항을 한 번만 출제합니다.</div><small>'+q.duplicateSources.map(esc).join(' · ')+'</small></div>':''}

function start(mode){let pool=data.questions.filter(q=>isReady(q)&&selected.has(q.source)&&(!$('#topic').value||q.topic===$('#topic').value));if(mode==='wrong')pool=pool.filter(needsReview);else if($('#unseen').checked)pool=pool.filter(q=>!study.history[q.id]?.attempts);pool=uniqueQuestions(pool);if(!pool.length)return toast('선택한 조건에 맞는 문항이 없습니다.');const countText=$('#count').value.trim();const count=countText===''?pool.length:Number(countText);if(!Number.isInteger(count)||count<1||count>pool.length)return toast('중복 제외 후 출제 가능한 문항은 '+pool.length+'개입니다. 1~'+pool.length+' 사이의 정수로 입력하세요.');if(study.exam&&!study.exam.finished&&!confirm('진행 중인 문제 세트를 새 세트로 바꿀까요? 이미 채점한 기록은 유지됩니다.'))return;let mixed=$('#mixed').checked,choice=$('#choices').checked;pool=(mixed?shuffle(pool):pool).slice(0,count);study.exam={index:0,finished:false,items:pool.map(q=>({q:structuredClone(q),options:q.type==='ox'?q.options:choice?shuffle(q.options):q.options,answer:q.type==='multi'?[]:'',revealed:false,graded:false,correct:null}))};save();go('exam')}
function exam(){sanitizeExam();const ex=study.exam;if(!ex)return go('home');const item=ex.items[ex.index],q=item.q;$('#app').innerHTML=`<div class="row"><div><span class="eyebrow">${esc(q.topic)}</span><h1>문제 ${ex.index+1}<span class="muted" style="font-size:22px"> / ${ex.items.length}</span></h1></div><button onclick="go('home')">나중에 이어하기</button></div><div class="layout"><section class="card"><div class="row"><span class="tag">${q.type==='ox'?'OX':q.type==='short'?'단답형 · 자가 채점':q.type==='multi'?'복수 선택':'객관식'}</span><span class="small muted">${esc(q.source)} · ${esc(q.no)}번</span></div><div class="progress"><i style="width:${(ex.index+1)/ex.items.length*100}%"></i></div><div class="review-actions"><button onclick="openDuplicatePicker()">중복문제</button>${reviewButton(q.id)}</div>${duplicateBadge(q)}<div class="question">${esc(q.text)}</div>${q.image?`<img class="qimage" src="${esc(q.image)}" alt="문제 참고 이미지" onclick="zoom(this.src)">`:''}${q.type==='short'?`<label for="shortanswer">내 답안</label><textarea id="shortanswer" rows="4" ${item.revealed?'disabled':''}>${esc(item.answer)}</textarea>`:item.options.map((o,i)=>{let chosen=q.type==='multi'?item.answer.includes(o.id):item.answer===o.id,correct=item.revealed&&String(q.answer).split(',').includes(o.id);return `<button class="option ${chosen?'selected':''} ${correct?'correct':item.revealed&&chosen?'wrong':''}" data-choice="${esc(o.id)}" ${item.revealed?'disabled':''} aria-pressed="${chosen}"><b>${q.type==='ox'?esc(o.id):i+1}</b><span>${q.type==='ox'?(o.id==='O'?'맞다':'아니다'):esc(o.text)}</span></button>`}).join('')}${item.revealed?`${item.graded?`<h3 class="${item.correct?'good':'bad'}">${item.correct?'정답입니다':'다시 복습해 보세요'}</h3>`:''}${explain(q)}${q.type==='short'&&!item.graded?'<p>내 답안과 비교하여 채점하세요.</p><button onclick="gradeSelf(true)">정답으로 기록</button> <button onclick="gradeSelf(false)">오답으로 기록</button>':''}`:''}<div class="row" style="margin-top:24px"><button onclick="move(-1)" ${ex.index===0?'disabled':''}>이전 문제</button>${ex.index<ex.items.length-1?'<button onclick="move(1)">다음 문제</button>':'<button class="primary" onclick="finish()">전체 제출 · 채점</button>'}</div></section><aside class="card" style="align-self:start"><h2>문항 이동</h2><p class="muted small">${ex.items.filter(hasAnswer).length} / ${ex.items.length}문항 답변 완료</p><div class="navgrid">${ex.items.map((it,i)=>`<button class="${it.graded?(it.correct?'result-right':'result-wrong'):(hasAnswer(it)?'done':'')} ${i===ex.index?'active':''} ${isMarked(it.q.id)?'marked':''}" onclick="jump(${i})">${i+1}</button>`).join('')}</div><button class="full" style="margin-top:25px" onclick="finish()">${ex.submitted?'결과 보기':'전체 제출 · 채점'}</button></aside></div>`;document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{if(q.type==='multi'){let k=item.answer.indexOf(b.dataset.choice);if(k>=0)item.answer.splice(k,1);else item.answer.push(b.dataset.choice)}else item.answer=b.dataset.choice;save();exam()});if($('#shortanswer'))$('#shortanswer').oninput=e=>{item.answer=e.target.value;save()};}
function record(item,correct){if(item.graded)return;item.graded=true;item.correct=correct;let h=study.history[item.q.id]||{attempts:0,correct:0};h.attempts++;h.correct+=correct?1:0;h.lastCorrect=correct;h.lastAt=new Date().toISOString();study.history[item.q.id]=h;save()}
function check(){let i=study.exam.items[study.exam.index];if(!i.answer||Array.isArray(i.answer)&&!i.answer.length)return toast('답안을 먼저 입력하거나 선택해 주세요.');i.revealed=true;if(i.q.type!=='short')record(i,sameAnswer(Array.isArray(i.answer)?i.answer.join(','):i.answer,i.q.answer,i.q.type));save();exam()}
function gradeSelf(ok){let i=study.exam.items[study.exam.index];record(i,ok);exam()}
function move(n){jump(study.exam.index+n)}function jump(n){study.exam.index=n;save();exam();window.scrollTo(0,0)}
function hasAnswer(i){return Array.isArray(i.answer)?i.answer.length>0:String(i.answer??'').trim().length>0}
function finish(){const ex=study.exam;if(ex.submitted)return go('result');const missing=ex.items.filter(i=>!hasAnswer(i)).length;if(missing&&!confirm(missing+'문항이 미응답입니다. 미응답은 오답으로 처리하고 제출할까요?'))return;for(const item of ex.items){item.revealed=true;if(!item.graded&&(item.q.type!=='short'||!hasAnswer(item)))record(item,hasAnswer(item)&&sameAnswer(Array.isArray(item.answer)?item.answer.join(','):item.answer,item.q.answer,item.q.type));}ex.submitted=true;ex.finished=true;save();go('result')}
function gradeResult(index,ok){const item=study.exam.items[index];if(!study.exam.submitted||item.q.type!=='short'||item.graded)return;record(item,ok);result()}
function result(){let ex=study.exam,sc=ex.items.filter(i=>i.correct===true).length,done=ex.items.filter(i=>i.graded).length;$('#app').innerHTML=`<span class="eyebrow">학습 결과</span><h1>오늘의 기록</h1><section class="card"><div class="row"><div><span class="number">${sc} / ${done}</span><p class="muted">채점한 문항 기준 · 전체 ${ex.items.length}문항 중 ${ex.items.length-done}개 미채점</p></div><button class="primary" onclick="go('home')">학습 홈</button></div><button onclick="go('exam')">문제 다시 확인하기</button><label class="check"><input id="wrong-only" type="checkbox" ${ex.wrongOnly?'checked':''} onchange="study.exam.wrongOnly=this.checked;save();result()"> 틀린 문제·복습 표시만 보기 (${ex.items.filter(it=>(it.graded&&it.correct===false)||isMarked(it.q.id)).length})</label></section><section class="card">${ex.items.map((it,i)=>({it,i})).filter(({it})=>!ex.wrongOnly||(it.graded&&it.correct===false)||isMarked(it.q.id)).map(({it,i})=>`<div class="listitem ${it.graded&&it.correct===false?'result-wrong':''}"><div class="row"><span class="tag ${it.correct===false?'warning':''}">${!it.graded?'미채점':it.correct?'정답':'오답'}</span><span class="review-actions">${reviewButton(it.q.id)}<button onclick="study.exam.index=${i};go('exam')">${i+1}번 보기</button></span></div><p>${esc(it.q.text)}</p>${!it.graded&&it.q.type==='short'?`<div class="answerbox"><p><b>내 답안:</b> ${esc(it.answer)}</p><p><b>정답:</b> ${esc(answerText(it.q))}</p><button onclick="gradeResult(${i},true)">정답으로 기록</button> <button onclick="gradeResult(${i},false)">오답으로 기록</button></div>`:''}</div>`).join('')||'<p class="empty">틀린 문제가 없습니다.</p>'}</section>`}
function list(){let review=view==='review';$('#app').innerHTML=`<span class="eyebrow">${review?'정답과 근거를 함께':'내가 관리하는 족보'}</span><div class="row"><h1>${review?'답안 검토 기록':filter.source?esc(sourceName(filter.source)):'문항 관리'}</h1><div>${!review&&filter.source?'<button onclick="renameSource(filter.source)">이름 변경</button> ':''}<button class="primary" onclick="edit(null)">문항 추가</button></div></div><p class="muted">${review?'강의노트와 공식 자료를 대조해 정답을 검증했습니다. 해설에서 근거를 확인할 수 있으며, 보류 문항은 자동 출제하지 않습니다.':'문제·선지·정답·해설을 수정할 수 있습니다. 변경 내용은 이 브라우저에 저장됩니다.'}</p>${review?`<details class="card"><summary><strong>자료 반영 현황 — 검증 근거와 보류 사유</strong></summary><div class="tablewrap"><table><thead><tr><th>파일</th><th>반영 상태</th></tr></thead><tbody>${data.coverage.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.state)}</td></tr>`).join('')}</tbody></table></div></details>`:''}<div class="searchbar"><input id="search" aria-label="문항 검색" placeholder="문제 내용·해설 검색" value="${esc(filter.text)}"><select id="sourcefilter" aria-label="족보 필터"><option value="">모든 족보</option>${sources().map(s=>`<option value="${esc(s)}" ${s===filter.source?'selected':''}>${esc(sourceName(s))}</option>`).join('')}</select><select id="statefilter" aria-label="검토 상태"><option value="">모든 상태</option><option value="pending" ${filter.status==='pending'?'selected':''}>검증 보류</option><option value="ready" ${filter.status==='ready'?'selected':''}>출제 가능</option><option value="correction" ${filter.status==='correction'?'selected':''}>족보 수정</option><option value="wrong" ${filter.status==='wrong'?'selected':''}>최근 오답</option><option value="marked" ${filter.status==='marked'?'selected':''}>복습 표시</option></select></div><div id="listitems" class="card"></div>`;$('#search').oninput=e=>{filter.text=e.target.value;listitems()};$('#sourcefilter').onchange=e=>{filter.source=e.target.value;list()};$('#statefilter').onchange=e=>{filter.status=e.target.value;listitems()};listitems()}
function listitems(){let arr=data.questions.filter(q=>(!filter.text||(q.text+' '+q.explanation).includes(filter.text))&&(!filter.source||q.source===filter.source)&&(!filter.status||(filter.status==='ready'?isReady(q):filter.status==='pending'?!isReady(q):filter.status==='correction'?q.review.includes('수정'):filter.status==='marked'?isMarked(q.id):study.history[q.id]?.lastCorrect===false)));$('#listitems').innerHTML=`<p class="muted">${arr.length}개 항목</p>${arr.map(q=>`<div class="listitem"><div class="row">${tag(q)}<span class="small muted">${esc(q.source)} · ${esc(q.no)}번</span></div><p class="title">${esc(q.text)}</p><details><summary>선지·답안·검토 근거 보기</summary>${q.image?`<img class="qimage" src="${esc(q.image)}" alt="문제 이미지" onclick="zoom(this.src)">`:''}${q.options.map((o,i)=>`<p class="small">${i+1}. ${esc(o.text)}</p>`).join('')}${explain(q)}</details><div class="review-actions"><button data-edit="${esc(q.id)}">문항 편집</button>${reviewButton(q.id)}</div></div>`).join('')||'<div class="empty">검색 조건에 맞는 문항이 없습니다.</div>'}`;document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(b.dataset.edit))}
function edit(id){editing=id?structuredClone(data.questions.find(q=>q.id===id)):{id:crypto.randomUUID(),no:'추가',source:'내 문항',topic:'리더십의 기초',type:'mc',text:'',options:[{id:'1',text:''},{id:'2',text:''},{id:'3',text:''},{id:'4',text:''}],answer:null,explanation:'',ready:false,refs:[],note:'',originalAnswer:'사용자 추가'};const q=editing;$('#editor').innerHTML=`<div class="row"><h2>문항 편집</h2><button onclick="$('#editor').close()" aria-label="편집 닫기">닫기</button></div><div class="fields"><div><label for="esource">족보 / 단원 이름</label><input id="esource" value="${esc(q.source)}"></div><div><label for="etype">유형</label><select id="etype">${[['mc','객관식'],['multi','복수 선택'],['ox','OX'],['short','단답형 · 자가 채점']].map(([v,n])=>`<option value="${v}" ${q.type===v?'selected':''}>${n}</option>`).join('')}</select></div></div><label for="etext">문제 내용</label><textarea id="etext" rows="4">${esc(q.text)}</textarea><div id="optioneditor"></div><label for="enote">해설 / 검토 기록</label><textarea id="enote" rows="4">${esc(q.explanation)}</textarea><label for="eimage">문제 이미지 추가 (PNG / JPG / WebP, 1MB 이하)</label><input id="eimage" type="file" accept="image/png,image/jpeg,image/webp">${q.image?'<button onclick="editing.image=null;toast(\'이미지 제거가 선택되었습니다. 저장하면 반영됩니다.\')">기존 이미지 제거</button>':''}<div class="check"><input type="checkbox" id="eready" ${q.ready?'checked':''}><label for="eready">내용과 정답을 확인했으며 출제를 허용합니다</label></div><p class="muted small">수정하면 검토 상태는 ‘사용자 수정’으로 바뀝니다. 자동 검증 완료로 처리하지 않습니다.</p><div id="editerror" class="bad" role="alert"></div><div class="editor-actions">${data.questions.some(x=>x.id===q.id)?'<button class="danger" onclick="deleteQuestion()">문항 삭제</button>':''}<button onclick="$('#editor').close()">취소</button><button class="primary" onclick="saveEdit()">저장</button></div>`;optionEditor();$('#etype').onchange=()=>{editing.type=$('#etype').value;editing.answer=null;if(editing.type==='ox')editing.options=[{id:'O',text:'O'},{id:'X',text:'X'}];else if(editing.type!=='short')editing.options=[1,2,3,4].map(i=>({id:String(i),text:''}));optionEditor()};$('#eimage').onchange=async e=>{let f=e.target.files[0];if(!f)return;if(f.size>1024*1024||!['image/png','image/jpeg','image/webp'].includes(f.type)){toast('PNG/JPG/WebP, 1MB 이하 파일을 선택해 주세요.');return}editing.image=await new Promise(resolve=>{let r=new FileReader;r.onload=()=>resolve(r.result);r.readAsDataURL(f)})};$('#editor').showModal()}
function deleteQuestion(){const id=editing?.id;const q=data.questions.find(x=>x.id===id);if(!q)return;if(!confirm(q.source+' '+q.no+'번 문항을 삭제할까요? 학습 기록도 삭제되며, 이 문항이 포함된 진행 중 시험은 종료됩니다.'))return;const oldData=structuredClone(data),oldStudy=structuredClone(study);data.removedQuestionIds=[...new Set([...(data.removedQuestionIds||[]),id])];data.questions=data.questions.filter(x=>x.id!==id);delete study.history[id];if(study.exam?.items.some(i=>i.q.id===id))study.exam=null;if(!save(true)){data=oldData;study=oldStudy;save(true);return;}if(!sources().includes(q.source)){selected.delete(q.source);if(filter.source===q.source)filter.source='';}$('#editor').close();render();toast('문항을 삭제했습니다.');}
function optionEditor(){let q=editing;$('#optioneditor').innerHTML=q.type==='short'?`<label for="eshort">정답 / 채점 기준</label><textarea id="eshort" rows="3">${esc(q.answer||'')}</textarea>`:`<label>선지 · 왼쪽 선택란으로 정답 지정</label><div class="editor-options">${q.options.map((o,i)=>`<div class="editor-option"><input name="eanswer" aria-label="${i+1}번 정답" type="${q.type==='multi'?'checkbox':'radio'}" value="${esc(o.id)}" ${String(q.answer||'').split(',').includes(o.id)?'checked':''}><input data-option="${esc(o.id)}" aria-label="${i+1}번 선지" value="${esc(o.text)}" ${q.type==='ox'?'readonly':''}></div>`).join('')}</div>${q.type==='ox'?'':'<button style="margin-top:12px" onclick="addOption()">선지 추가</button>'}`}
function addOption(){editing.options=Array.from(document.querySelectorAll('[data-option]')).map(i=>({id:i.dataset.option,text:i.value}));editing.answer=Array.from(document.querySelectorAll('[name=eanswer]:checked')).map(i=>i.value).join(',');editing.options.push({id:String(editing.options.length+1),text:''});optionEditor()}
function saveEdit(){let q=editing;q.text=$('#etext').value.trim();q.source=$('#esource').value.trim();q.explanation=$('#enote').value.trim();q.ready=$('#eready').checked;q.type=$('#etype').value;if(q.type==='short'){q.options=[];q.answer=$('#eshort').value.trim()}else{q.options=Array.from(document.querySelectorAll('[data-option]')).map(i=>({id:i.dataset.option,text:i.value.trim()}));q.answer=Array.from(document.querySelectorAll('[name=eanswer]:checked')).map(i=>i.value).join(',')}if(!q.text||!q.source)return $('#editerror').textContent='문제 내용과 족보 이름을 입력하세요.';if(q.options.some(o=>!o.text))return $('#editerror').textContent='빈 선지 내용을 채워 주세요.';if(q.ready&&!q.answer)return $('#editerror').textContent='출제 허용 전에 정답을 지정하세요.';q.answer=q.answer||null;q.review='사용자 수정';q.status=q.ready?'user':'pending';q.refs=[];const idx=data.questions.findIndex(x=>x.id===q.id);if(idx<0)data.questions.push(q);else data.questions[idx]=q;selected.add(q.source);const ok=save(true);$('#editor').close();render();if(ok)toast('문항을 저장했습니다.')}
function zoom(src){$('#lightbox img').src=src;$('#lightbox').showModal()}
function download(name,body,type){const url=URL.createObjectURL(new Blob([body],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportHTML(){const copy=document.documentElement.cloneNode(true);copy.querySelector('#app').innerHTML='';copy.querySelector('#editor').innerHTML='';copy.querySelectorAll('dialog').forEach(d=>d.removeAttribute('open'));copy.querySelector('#toast').hidden=true;copy.querySelector('#bank-data').textContent=JSON.stringify(data).replace(/</g,'\\u003c');download('dongbuka-question-bank.html','<!doctype html>\n'+copy.outerHTML,'text/html;charset=utf-8');toast('수정된 문항을 포함한 실행 HTML을 내보냈습니다. 학습 기록은 JSON 백업에 포함됩니다.')}
function validData(d){return d&&Array.isArray(d.questions)&&d.questions.every(q=>q&&typeof q.id==='string'&&typeof q.text==='string'&&typeof q.source==='string'&&['mc','multi','ox','short'].includes(q.type)&&Array.isArray(q.options)&&q.options.every(o=>typeof o.id==='string'&&typeof o.text==='string')&&(q.answer===null||typeof q.answer==='string')&&(!q.image||/^data:image\/(png|jpeg|webp);base64,/.test(q.image)))&&new Set(d.questions.map(q=>q.id)).size===d.questions.length}
function backup(){$('#app').innerHTML=`<span class="eyebrow">학습 자료 보관</span><h1>내 문제은행 백업</h1><div class="layout"><section class="card stack"><h2>파일로 내보내기</h2><p class="muted">HTML은 문제은행을 실행하는 파일입니다. JSON 백업에는 수정 문항과 학습 기록이 모두 들어 있습니다.</p><button class="primary" onclick="exportHTML()">실행 HTML 내려받기</button><button onclick="download('dongbuka-backup.json',JSON.stringify({data,study},null,2),'application/json')">문항 + 학습 기록 JSON 백업</button><footer>저장은 기기·브라우저별로 구분됩니다. 다른 기기에서는 JSON 백업을 가져오세요.</footer></section><section class="card"><h2>백업 가져오기</h2><p class="muted">현재 자료와 학습 기록을 백업 내용으로 교체합니다.</p><label for="importfile">JSON 백업 선택</label><input type="file" id="importfile" accept=".json,application/json"></section></div>`;$('#importfile').onchange=async e=>{try{let f=e.target.files[0];if(!f)return;let value=JSON.parse(await f.text());if(!validData(value.data)||!value.study?.history)throw Error('올바른 동북아 백업 파일이 아닙니다.');if(!confirm('현재 문항과 학습 기록을 이 백업으로 교체할까요?'))return;data={...value.data,version:initial.version,refs:initial.refs,coverage:value.data.coverage||initial.coverage};study={history:value.study.history,exam:null};selected=new Set(sources());save(true);go('home');toast('백업을 가져왔습니다.')}catch(e){toast('가져오기 실패: '+e.message)}}}
document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>go(b.dataset.nav));go('home');
</script><script>(()=>{const bar=document.getElementById('subject-bar'),button=document.getElementById('subject-toggle'),menu=document.getElementById('subject-drawer');function close(){menu.hidden=true;button.setAttribute('aria-expanded','false')}button.addEventListener('click',()=>{const open=menu.hidden;menu.hidden=!open;button.setAttribute('aria-expanded',String(open))});document.addEventListener('click',e=>{if(!bar.contains(e.target))close()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!menu.hidden){close();button.focus()}})})();</script></body></html>
