</script><script>const $=s=>document.querySelector(s), esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>crypto.randomUUID(), clone=x=>JSON.parse(JSON.stringify(x));
let db,bank,selected=new Set(),exam=null,currentChapter=null,editing=null,filterPending=false;
function questionIssue(q){
  if(!String(q.text||"").trim())return "문제 내용이 비어 있습니다.";
  if(!String(q.answer||"").trim())return "정답이 등록되지 않았습니다.";
  if(!["mc","ox","short"].includes(q.type))return "문제 유형을 선택해야 합니다.";
  if(q.type!=="short"){
    const opts=Array.isArray(q.options)?q.options:[];
    if(opts.length<2)return "선지가 2개 미만입니다.";
    if(opts.some(o=>!String(o.text||"").trim()))return "내용이 없는 선지가 있습니다.";
    if(new Set(opts.map(o=>o.id)).size!==opts.length)return "선지 기호가 중복되었습니다.";
    if(!opts.some(o=>o.id===q.answer))return "정답이 현재 선지 기호와 일치하지 않습니다.";
  }
  return "";
}
const ready=q=>Boolean(q.ready&&!questionIssue(q));
const pendingReason=q=>questionIssue(q)||"수정 내용은 저장되었지만 확인 완료 처리가 되지 않았습니다.";
async function completeChapter(){
  const c=currentChapter;
  const planned=c.questions.map(q=>({...q,answer:normalizeAnswer(q.answer,q.options||[],q.type)}));
  const eligible=planned.filter(q=>!questionIssue(q)&&!ready(q));
  const blocked=planned.filter(q=>questionIssue(q));
  const result=$("#completionresult");
  if(!eligible.length){
    result.textContent=blocked.length?"필수 내용이 빠진 문항이 "+blocked.length+"개 있습니다. 각 문항의 대기 사유를 확인해 주세요.":"모든 문항이 이미 출제 가능한 상태입니다.";
    return;
  }
  if(!confirm(c.name+"의 "+eligible.length+"문항을 검토 완료로 처리할까요? 문제·선지·정답과 필요한 도식까지 확인했다면 진행하세요. 내용이 빠진 "+blocked.length+"문항은 그대로 남습니다."))return;
  const before=c.questions;
  const button=$("#completechapter");button.disabled=true;
  c.questions=planned.map(q=>questionIssue(q)?q:{...q,ready:true});
  try{
    await save();
    manage(c.id);
    $("#completionresult").textContent=eligible.length+"문항을 확인 완료했습니다. 출제 가능 "+c.questions.filter(ready).length+"문항 · 확인 대기 "+c.questions.filter(q=>!ready(q)).length+"문항";
    notify("확인 완료 상태를 저장했습니다.");
  }catch(err){
    c.questions=before;button.disabled=false;
    result.textContent="저장 실패: "+err.message+" · 변경 전 상태를 유지했습니다.";
  }
}

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const n=new Uint32Array(1);let bound=Math.floor(4294967296/(i+1))*(i+1);do{crypto.getRandomValues(n)}while(n[0]>=bound);let j=n[0]%(i+1);[b[i],b[j]]=[b[j],b[i]];}return b}
function mixed(a){let b=shuffle(a);if(a.length>1&&a.every((x,i)=>x===b[i]))b.push(b.shift());return b}
function notify(s){$("#notice").textContent=s;$("#notice").style.display="block";setTimeout(()=>$("#notice").style.display="none",4500)}
function transact(mode,fn){return new Promise((resolve,reject)=>{const tx=db.transaction("data",mode),store=tx.objectStore("data");const req=fn(store);tx.oncomplete=()=>resolve(req?.result);tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)})}
async function save(){if(db)await transact("readwrite",s=>s.put(bank,"bank"))}
function refersToChoiceLabels(q){
  if(q.type!=="mc")return false;
  const ids=new Set(q.options.map(o=>String(o.id).toLowerCase()));
  const text=[q.text,...q.options.map(o=>o.text)].join(" ");
  const tokens=text.matchAll(/(?:^|[^A-Za-z0-9])([a-zA-Z])(?=$|[^A-Za-z0-9])/g);
  return [...tokens].some(m=>ids.has(m[1].toLowerCase()));
}
function prepareChoices(q){
  if(q.type==="ox")return ["O","X"].map(id=>({id,text:id,displayLabel:id}));
  if(q.type==="short")return [];
  const keep=q.keepLabels??refersToChoiceLabels(q);
  return mixed(q.options).map((o,i)=>({...o,displayLabel:keep?o.id:String.fromCharCode(97+i)}));
}
function answerLabel(q,id){
  if(q.type==="short")return id;
  return q.options.find(o=>o.id===id)?.displayLabel||id;
}
function snapshotBank(){
  const el=document.getElementById("portable-data");
  if(!el)return null;
  const parsed=JSON.parse(el.textContent);
  if(!parsed.bank||!Array.isArray(parsed.bank.chapters))throw Error("문제은행 내보내기 데이터가 올바르지 않습니다.");
  return parsed;
}
function portableJson(value){
  return JSON.stringify(value).replace(/</g,"\\u003c").replace(/\u2028/g,"\\u2028").replace(/\u2029/g,"\\u2029");
}
function exportPortable(){
  const copy=document.documentElement.cloneNode(true);
  copy.querySelector("#app").innerHTML="";
  const notice=copy.querySelector("#notice");notice.textContent="";notice.style.display="none";
  const dialog=copy.querySelector("#editor");dialog.removeAttribute("open");
  copy.querySelector("#editerror").textContent="";
  copy.querySelector("#answerchoices").innerHTML="";
  copy.querySelector("#portable-data")?.remove();
  copy.querySelectorAll("input").forEach(el=>{el.removeAttribute("value");el.removeAttribute("checked");el.removeAttribute("disabled")});
  copy.querySelectorAll("textarea").forEach(el=>el.textContent="");
  copy.querySelectorAll("button").forEach(el=>el.removeAttribute("disabled"));
  const payload=document.createElement("script");
  payload.id="portable-data";payload.type="application/json";
  payload.textContent=portableJson({id:uid(),bank:clone(bank)});
  copy.querySelector("head").appendChild(payload);
  const url=URL.createObjectURL(new Blob(["<!doctype html>\n"+copy.outerHTML],{type:"text/html;charset=utf-8"}));
  const a=document.createElement("a");a.href=url;a.download="my-question-bank.html";a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  notify("현재 문제·선지·정답·도식을 담은 실행 파일을 내보냈습니다. PDF 원본은 포함되지 않습니다.");
}

function applyChapterUpdate(target){
  const update=window.CHAPTER_UPDATE;
  if(!update||target.contentUpdates?.[update.version])return false;
  for(const incoming of update.chapters){
    const matches=target.chapters.filter(c=>c.id===incoming.id||c.name===incoming.name);
    if(!matches.length){target.chapters.push(clone(incoming));continue;}
    for(const existing of matches){
      const byNo=new Map(existing.questions.map(q=>[String(q.no),q]));
      for(const fresh of incoming.questions){
        const q=byNo.get(String(fresh.no));
        if(!q){existing.questions.push(clone(fresh));continue;}
        // Retain locally edited question text and options while applying the confirmed key and supplied image.
        q.answer=fresh.answer;q.note=fresh.note;q.ready=true;
        if(fresh.image)q.image=fresh.image;
        if(questionIssue(q))q.ready=false;
      }
    }
  }
  target.contentUpdates={...(target.contentUpdates||{}),[update.version]:true};
  return true;
}

async function boot(){
 const snapshot=snapshotBank();
 try{
   db=await new Promise((resolve,reject)=>{const r=indexedDB.open(snapshot?"chapter-bank-portable-"+snapshot.id:"chapter-bank-v1",1);r.onupgradeneeded=()=>r.result.createObjectStore("data");r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});
   bank=await transact("readonly",s=>s.get("bank"));
   if(!bank){bank=clone(snapshot?.bank||window.SEED);await save()}
 }catch(err){db=null;bank=bank||clone(snapshot?.bank||window.SEED)}
 if(!snapshot&&applyChapterUpdate(bank)){try{await save()}catch(err){notify("내용은 갱신했으나 자동 저장에 실패했습니다. 문제 포함 파일을 내보내 주세요.")}}
 const week11Version="week11-ch34-confirmed-v1";
 if(snapshot?.bank.contentUpdates?.[week11Version]&&!bank.contentUpdates?.[week11Version]){
   const incoming=snapshot.bank.chapters.find(c=>c.id==="ch34");
   if(incoming&&!bank.chapters.some(c=>c.id===incoming.id||c.name===incoming.name))bank.chapters.push(clone(incoming));
   bank.contentUpdates={...(bank.contentUpdates||{}),[week11Version]:true};
   try{await save()}catch(err){notify("추가한 문항의 자동 저장에 실패했습니다. 문제 포함 파일로 내보내 주세요.")}
 }
 bank.chapters.forEach(c=>selected.add(c.id));home();
 if(!db)notify("이 환경에서는 자동 저장을 사용할 수 없습니다. 시험은 가능하며, 수정 후 문제 포함 파일을 다시 내보내 주세요.");
}

function manage(id){currentChapter=bank.chapters.find(c=>c.id===id);const c=currentChapter;$("#app").innerHTML=`<button id="back">← 챕터 목록</button><h1>${esc(c.name)}</h1><div class="row"><p class="muted">정답을 추측하지 않고 원본에 표시된 답을 등록하세요.</p><div><button id="rename">이름 변경</button> <button id="original">PDF 원본 열기</button> <button class="primary" id="addq">＋ 문항 추가</button></div></div><section class="card"><div class="row"><div><b>출제 가능 ${c.questions.filter(ready).length}문항 · 확인 대기 ${c.questions.filter(q=>!ready(q)).length}문항</b><p class="muted">모두 검토했다면 아래 버튼으로 이 챕터의 확인 대기를 한 번에 해제하세요. 내용이나 정답이 빠진 문항은 사유와 함께 남습니다.</p></div><button class="primary" id="completechapter">이 챕터 확인 완료 처리</button></div><p id="completionresult" role="status"></p></section><label class="check"><input type="checkbox" id="pending" ${filterPending?"checked":""}> 확인 대기 문항만 보기</label><div class="card">${c.questions.filter(q=>!filterPending||!ready(q)).map(q=>`<div class="qline"><b>${esc(q.no)}</b><div><span class="tag ${ready(q)?"":"warning"}">${ready(q)?"출제 가능":"확인 대기"} · ${{mc:"객관식",ox:"O/X",short:"단답형"}[q.type]}</span><p>${esc(q.text)}</p>${!ready(q)?`<p class="bad">대기 사유: ${esc(pendingReason(q))}</p>`:""}<p class="answer-summary"><b>등록 정답:</b> ${esc(q.answer||"미등록")}${q.type!=="short"&&q.options.find(o=>o.id===q.answer)?" · "+esc(q.options.find(o=>o.id===q.answer).text):""}</p>${q.note?`<small class="muted">${esc(q.note)}</small>`:""}</div><button data-edit="${q.id}">정답 · 문항 수정</button></div>`).join("")||'<p class="empty">표시할 문항이 없습니다.</p>'}</div><button class="danger" id="deletechapter">챕터 삭제</button>`;$("#completechapter").onclick=completeChapter;$("#back").onclick=home;$("#pending").onchange=e=>{filterPending=e.target.checked;manage(id)};$("#rename").onclick=async()=>{const name=prompt("챕터 이름",c.name);if(name?.trim()){c.name=name.trim();await save();manage(id)}};$("#addq").onclick=()=>edit({id:uid(),no:c.questions.length+1,type:"mc",text:"",options:[],answer:"",ready:false});document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>edit(c.questions.find(q=>q.id===b.dataset.edit)));$("#original").onclick=async()=>{const blob=await transact("readonly",s=>s.get("pdf:"+id));if(!blob)return notify("이 챕터의 PDF는 아직 이 브라우저에 없습니다. 원본 PDF를 업로드해 주세요.");const url=URL.createObjectURL(blob);window.open(url,"_blank");setTimeout(()=>URL.revokeObjectURL(url),60000)};$("#deletechapter").onclick=async()=>{if(!confirm("이 챕터와 모든 문항을 삭제할까요?"))return;bank.chapters=bank.chapters.filter(x=>x.id!==id);selected.delete(id);await save();await transact("readwrite",s=>s.delete("pdf:"+id));home()}}
function editorOptions(){
  const type=$("#etype").value;
  if(type==="short")return [];
  if(type==="ox")return [{id:"O",text:"O"},{id:"X",text:"X"}];
  return $("#eopts").value.split("\n").filter(x=>x.trim()).map((line,i)=>{
    const m=line.match(/^\s*([a-zA-Z0-9]+)[.)]\s*(.*)$/);
    return {id:m?m[1]:String.fromCharCode(97+i),text:m?m[2]:line.trim()};
  });
}
function normalizeAnswer(answer,options,type){
  const a=String(answer||"").trim();
  if(type==="short")return a;
  const match=options.find(o=>o.id===a)||options.find(o=>o.id.toLowerCase()===a.toLowerCase());
  return match?match.id:a;
}
function renderAnswerEditor(){
  const type=$("#etype").value,options=editorOptions();
  const answer=normalizeAnswer($("#eanswer").value,options,type);
  $("#eanswer").value=answer;
  $("#optionslabel").hidden=type!=="mc";
  $("#shortanswerlabel").hidden=type!=="short";
  $("#answerhint").textContent=type==="short"?"아래 입력란에서 정답을 자유롭게 수정하세요.": "정답에 해당하는 선지를 누른 뒤 변경사항을 저장하세요.";
  $("#answerchoices").innerHTML=type==="short"?"":options.map((o,i)=>`<label class="answer-choice"><input type="radio" name="correct-answer" value="${esc(o.id)}" ${answer===o.id?"checked":""}><span><b>${esc(o.id)}${type==="mc"?".":""}</b> ${type==="mc"?esc(o.text):""}</span></label>`).join("");
  if(type==="mc"&&!options.length)$("#answerhint").textContent="위에 선지를 입력하면 정답 선택지가 나타납니다. 빈 정답은 확인 대기 상태로 저장할 수 있습니다.";
  document.querySelectorAll('input[name="correct-answer"]').forEach(input=>input.onchange=()=>{
    $("#eanswer").value=input.value;$("#editerror").textContent="";
  });
}

function start(qs,n){const old=exam?.qs.map(q=>q.id).join();let items=mixed(qs).slice(0,n);if(n>1&&items.map(q=>q.id).join()===old)items.push(items.shift());exam={qs:items.map(q=>({...clone(q),options:prepareChoices(q)})),answers:{},index:0,done:false};test()}
function test(){const ex=exam,q=ex.qs[ex.index],a=ex.answers[q.id];$("#app").innerHTML=`<div class="row"><span class="eyebrow">RANDOM TEST</span><button id="exit">시험 나가기</button></div><div class="progress"><i style="width:${(ex.index+1)/ex.qs.length*100}%"></i></div><div class="layout"><section class="card"><div class="row"><span class="tag">${esc(q.chapter)} · 원문 ${esc(q.no)}번</span><b>${ex.index+1} / ${ex.qs.length}</b></div><div class="question">${esc(q.text)}</div>${q.image?`<img class="qimage" src="${esc(q.image)}" alt="문제 도식">`:""}${q.type==="short"?`<label>답 입력<input id="short" autocomplete="off" value="${esc(a||"")}" placeholder="정답을 입력하세요"></label>`:q.options.map(o=>`<button class="option ${a===o.id?"selected":""}" data-answer="${esc(o.id)}"><b>${q.type==="ox"?"":esc(o.displayLabel||o.id)+"."}</b><span>${esc(o.text)}</span></button>`).join("")}<div class="row" style="margin-top:28px"><button id="prev" ${ex.index===0?"disabled":""}>← 이전</button><button id="next" ${ex.index===ex.qs.length-1?"disabled":""}>다음 →</button></div></section><aside class="card"><h2>답안 현황</h2><p id="answered" class="muted"></p><div class="navgrid">${ex.qs.map((x,i)=>`<button data-nav="${i}" class="${ex.answers[x.id]?"answered":""} ${ex.index===i?"active":""}">${i+1}</button>`).join("")}</div><button id="submit" class="primary full" style="margin-top:26px">답안 제출 · 채점</button><p class="muted">제출 전에는 정답이 표시되지 않습니다.</p></aside></div>`;const update=()=>$("#answered").textContent=Object.values(ex.answers).filter(Boolean).length+" / "+ex.qs.length+" 답변 완료";update();if($("#short"))$("#short").oninput=e=>{ex.answers[q.id]=e.target.value;update()};document.querySelectorAll("[data-answer]").forEach(b=>b.onclick=()=>{ex.answers[q.id]=b.dataset.answer;test()});document.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>{ex.index=Number(b.dataset.nav);test()});$("#prev").onclick=()=>{ex.index--;test()};$("#next").onclick=()=>{ex.index++;test()};$("#exit").onclick=()=>{if(confirm("시험을 종료하고 목록으로 const norm=s=>String(s||"").normalize("NFC").trim();
function normalizeResponse(value,q){let s=norm(value);if(q.type==="short"&&/^[A-Za-z0-9]+(?:, [A-Za-z0-9]+)+$/.test(q.answer))return s.replace(/[，、]/g,",").split(/[,\s]+/).filter(Boolean).map(x=>x.toLowerCase()).join(",");return s}
function correct(q){const value=normalizeResponse(exam.answers[q.id],q);return [q.answer,...(q.type==="short"?(q.answerAliases||[]):[])].some(a=>value===normalizeResponse(a,q))}
function results(){const ex=exam,wrong=ex.qs.filter(q=>!correct(q)),score=ex.qs.length-wrong.length;const show=(q,a)=>q.type==="short"?a:q.options.find(o=>o.id===a)?.text||"미응답";$("#app").innerHTML=`<div class="eyebrow">TEST COMPLETE</div><h1>이번 시험 결과</h1><div class="card"><div class="score">${Math.round(score/ex.qs.length*100)}<small style="font-size:22px">점</small></div><p>${ex.qs.length}문항 중 ${score}문항 정답 · ${wrong.length}문항 오답</p><div class="row"><button id="home">챕터 선택</button><div><button id="retrywrong" ${wrong.length?"":"disabled"}>오답만 다시 풀기</button> <button class="primary" id="retry">같은 범위 다시 섞기</button></div></div><p class="muted">단답형은 앞뒤 공백을 제외하고 등록된 정답 또는 허용된 대체 표현과 일치할 때 정답 처리합니다. 표현 차이는 아래에서 직접 정답 인정할 수 있습니다.</p></div>${ex.qs.map((q,i)=>`<details class="card" ${correct(q)?"":"open"}><summary><b class="${correct(q)?"good":"bad"}">${correct(q)?"정답":"오답"}</b> · ${esc(q.chapter)} 원문 ${esc(q.no)}번</summary><p>${esc(q.text)}</p><p>내 답: ${q.type!=="short"&&ex.answers[q.id]?esc(answerLabel(q,ex.answers[q.id]))+" · ":""}${esc(show(q,ex.answers[q.id])||"미응답")}</p><p class="good">정답: ${esc(answerLabel(q,q.answer))}${q.type==="short"?"":" · "+esc(show(q,q.answer))}</p>${q.type==="short"&&!correct(q)?`<button data-accept="${i}">이번 답안 정답 인정</button>`:""}</details>`).join("")}`;$("#home").onclick=home;$("#retry").onclick=()=>start(ex.qs,ex.qs.length);$("#retrywrong").onclick=()=>start(wrong,wrong.length);document.querySelectorAll("[data-accept]").forEach(b=>b.onclick=()=>{const q=ex.qs[Number(b.dataset.accept)];ex.answers[q.id]=q.answer;results()})}
async function importPDF(e){if(!db){notify("이 환경에서는 PDF 저장을 지원하지 않습니다. PC에서 등록한 뒤 문제 포함 파일로 옮겨 주세요.");return;}const file=e.target.files[0];if(!file)return;const name=$("#chaptername").value.trim()||file.name.replace(/\.pdf$/i,"");$("#uploadstatus").textContent="PDF를 읽고 있어요…";try{const pdfjs=await import("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs");pdfjs.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";const pdf=await pdfjs.getDocument({data:await file.arrayBuffer()}).promise;let blocks=[];for(let p=1;p<=pdf.numPages;p++){const page=await pdf.getPage(p),content=await page.getTextContent();const lines=[];for(const t of content.items){let row=lines.find(r=>Math.abs(r.y-t.transform[5])<3);if(!row){row={y:t.transform[5],items:[]};lines.push(row)}row.items.push({x:t.transform[4],str:t.str})}blocks.push(lines.sort((a,b)=>b.y-a.y).map(r=>r.items.sort((a,b)=>a.x-b.x).map(t=>t.str).join(" ")).join("\n"))}const text=blocks.join("\n"),chunks=text.split(/(?:^|\n)\s*(\d{1,3})[.)]?\s+(?=\S)/);const questions=[];for(let i=1;i<chunks.length;i+=2){let body=chunks[i+1]||"",answer="",m=body.match(/\(\s*([a-fA-FOXox])\s*\)/);if(m){answer=m[1];body=body.replace(m[0],"")}const split=body.split(/(?:^|\s)([a-f])[.)]\s+/);const options=[];for(let j=1;j<split.length;j+=2)options.push({id:split[j],text:split[j+1].trim()});const type=/O\s*\/\s*X|OX 문제/i.test(body)?"ox":options.length?"mc":"short";questions.push({id:uid(),no:chunks[i],type,text:split[0].trim(),options:type==="ox"?[{id:"O",text:"O"},{id:"X",text:"X"}]:options,answer:type==="ox"?answer.toUpperCase():answer.toLowerCase(),ready:false,note:"PDF 자동 추출 초안입니다. 원본 대조 후 정답과 줄바꿈·선지 순서를 확인하세요."})}const c={id:uid(),name,source:file.name,questions};await transact("readwrite",s=>s.put(file,"pdf:"+c.id));bank.chapters.push(c);selected.add(c.id);await save();manage(c.id);notify(questions.length?questions.length+"문항 초안이 생성되었습니다. 원문과 대조해 확정하세요.":"텍스트를 자동으로 나눌 수 없습니다. 원본을 보며 문항을 추가하세요.")}catch(err){$("#uploadstatus").textContent="PDF 자동 추출 실패: "+err.message+" · 인터넷 연결을 확인하거나 빈 챕터에 직접 등록해 주세요."}}
$("#brand").onclick=e=>{e.preventDefault();if(exam&&!exam.done&&!confirm("시험을 종료할까요?"))return;home()};
$("#portable").onclick=exportPortable;
$("#backup").onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify({format:"chapter-bank-v1",...bank},null,2)],{type:"application/json"}));const a=document.createElement("a");a.href=url;a.download="chapter-question-bank.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$("#restore").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(data.format!=="chapter-bank-v1"||!Array.isArray(data.chapters))throw Error("지원하지 않는 백업");for(const c of data.chapters){if(typeof c.name!=="string"||!Array.isArray(c.questions))throw Error("잘못된 챕터");for(const q of c.questions){if(typeof q.text!=="string"||typeof q.answer!=="string"||!["mc","ox","short"].includes(q.type)||!Array.isArray(q.options)||q.options.some(o=>typeof o.id!=="string"||typeof o.text!=="string")||(q.image&&!/^data:image\/(png|jpeg|webp|gif);base64,/.test(q.image)))throw Error("잘못된 문항")}}if(!confirm("백업의 챕터들을 현재 문제은행에 추가할까요?"))return;for(const c of data.chapters){c.id=uid();c.questions.forEach(q=>q.id=uid());bank.chapters.push(c);selected.add(c.id)}await save();home();notify("백업을 불러왔습니다.")}catch(err){notify("불러오기 실패: "+err.message)}e.target.value=""};
window.addEventListener("unhandledrejection",e=>notify("저장 또는 처리에 실패했습니다. 백업 후 다시 시도해 주세요."));boot().catch(e=>{$("#app").textContent="브라우저 저장소를 사용할 수 없습니다: "+e.message});
