html,body,#root{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}html,body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Oxygen,Ubuntu,Cantarell,Helvetica Neue,Arial,sans-serif!important}button,input,textarea,select{font-family:inherit}html{background-color:transparent}html.chatgptOled.dark,html.mobileSkybridge.dark{background-color:#000}@supports (font: -apple-system-body){html.mobileSkybridge{font:-apple-system-body}}html.desktopSkybridge.dark{background-color:#1e1e1e}html.transparentSkybridgeBackground,html.transparentSkybridgeBackground.dark{background-color:transparent}html.androidSkybridge,html.androidSkybridge body,html.androidSkybridge *{-webkit-tap-highlight-color:rgba(255,255,255,0)}html.androidSkybridge *::selection,html.androidSkybridge *::-moz-selection{background:#fff0;color:inherit}</style><script id="portable-data" type="application/json">{"id":"8c03bc01-27ed-49a2-a17b-4b6509b36bda","bank":{"chapters":[{"id":"ch16","name":"16장 · 발생, 줄기세포, 암","source":"8주차 개념확인 문제","questions":[{"id":"ch16-q1","no":1,"type":"short","text":"각각의 세포는 반드시 ______ 과정을 거쳐서 구조와 기능에 고유의 특성을 갖는다.","options":[],"answer":"세포분화","ready":true,"note":""},{"id":"ch16-q2","no":2,"type":"mc","text":"초기 발생과정에 영향을 주는 난자의 모계기원 물질들은?","options":[{"id":"a","text":"세포질 결정인자"},{"id":"b","text":"조직 특이적 단백질"},{"id":"c","text":"형태형성물질"}],"answer":"a","ready":true,"note":""},{"id":"ch16-q3","no":3,"type":"mc","text":"세포질 결정인자란?","options":[{"id":"a","text":"수정되지 않은 난자 안에 불균등하게 분포되어 있는 세포질 물질들"},{"id":"b","text":"종종 전사 조절에 관여한다."},{"id":"c","text":"보통 수정 후 초기 몇 번의 분열이 일어나는 동안 분리된다."},{"id":"d","text":"발달의 초기 단계의 방향성 결정에 도움을 주는, 모계기원의 조절인자"},{"id":"e","text":"모두 정답"}],"answer":"a","ready":true,"note":""},{"id":"ch16-q4","no":4,"type":"mc","text":"근육세포가 신경세포와 다르게 분화하는 이유는?","options":[{"id":"a","text":"서로 다른 유전자를 발현하기 때문"},{"id":"b","text":"서로 다른 유전자를 포함하기 때문"},{"id":"c","text":"서로 다른 유전암호를 사용하기 때문"},{"id":"d","text":"서로 다른 히스톤을 가지고 있기 때문"},{"id":"e","text":"서로 다른 리보솜을 가지고 있기 때문"}],"answer":"a","ready":true,"note":""},{"id":"ch16-q5","no":5,"type":"mc","text":"예정세포사(apoptosis)란?","options":[{"id":"a","text":"DNA 손상에 의한 반응으로 p53 단백질에 의해 시작되는 세포의 자살 프로그램"},{"id":"b","text":"전이 등으로 암세포가 몸 전체로 퍼져나가는 현상"},{"id":"c","text":"정상 세포를 암세포로 변형시키는 과정"},{"id":"d","text":"G 단백질이 과활성화된 상태로 되는 돌연변이"},{"id":"e","text":"점 돌연변이로 원발암유전자가 발암유전자로 변형되는 것"}],"answer":"a","ready":true,"note":""},{"id":"ch16-q6","no":6,"type":"mc","text":"예정세포사(apoptosis) 과정에 포함되지 않는 것은?","options":[{"id":"a","text":"DNA 분해"},{"id":"b","text":"세포소기관 해체"},{"id":"c","text":"세포의 용해"},{"id":"d","text":"식세포에 의한 세포 내용물의 소화"}],"answer":"c","ready":true,"note":""},{"id":"ch16-q7","no":7,"type":"mc","text":"척추동물에서 예정세포사(apoptosis)는 손과 발의 ______ 과정에 중요하다.","options":[{"id":"a","text":"결정"},{"id":"b","text":"분화"},{"id":"c","text":"유도"},{"id":"d","text":"형태형성"}],"answer":"d","ready":true,"note":""},{"id":"ch16-q8","no":8,"type":"mc","text":"동물의 패턴형성은 어떻게 일어나는가?","options":[{"id":"a","text":"형태형성물질의 밀도 기울기에 의해 세포가 받는 위치 정보에 따라"},{"id":"b","text":"모체의 난자 주변의 영양세포(nurse cell)에 의한 유도신호에 의해"},{"id":"c","text":"핵에서 염색질의 응축으로"},{"id":"d","text":"세포가 분화한 후 함께 이동해서 조직 또는 기관을 형성함으로써"},{"id":"e","text":"초기 몇 번의 유사분열에 의해"}],"answer":"a","ready":true,"note":""},{"id":"ch16-q9","no":9,"type":"mc","text":"호미오(homeo) 유전자란?","options":[{"id":"a","text":"암에서 발생하는 세포의 변화에 관련된다."},{"id":"b","text":"다른 유전자들을 조절함으로써 발생을 조화시킨다."},{"id":"c","text":"특정한 세포들에서만 발견된다."},{"id":"d","text":"바이러스에 의하여 세포에서 세포로 전달된 유전자를 말한다."},{"id":"e","text":"DNA를 복구하고 돌연변이를 방지한다."}],"answer":"b","ready":true,"note":""},{"id":"ch16-q10","no":10,"type":"mc","text":"호미오 유전자에서 발견되는 호미오박스(homeobox)의 특징은?","options":[{"id":"a","text":"유방암에서 흔히 발견되는 원발암유전자의 일종이다."},{"id":"b","text":"세포분열 속도를 증가시켜 암을 촉진한다."},{"id":"c","text":"오로지 포유류와 조류에서만 나타나는 특징적인 유전자다."},{"id":"d","text":"진화적으로 근연관계가 가까운 동물에서만 발견된다."},{"id":"e","text":"다양한 생물체에서 발견되지만 매우 유사해서 진화의 공통 유산으로 생각되고 있다."}],"answer":"e","ready":true,"note":""},{"id":"ch16-q11","no":11,"type":"mc","text":"사람의 호미오 유전자들이 발견되었지만, 아직 이들이 어떻게 사람의 형태를 형성하는지는 알려지지 않았다. 다른 동물에서의 호미오 유전자들의 기능을 고려할 때, 다음 중 사람의 호미오 유전자의 기능으로 가장 타당하게 생각되는 것은?","options":[{"id":"a","text":"피부와 머리색의 결정"},{"id":"b","text":"세포 대사율의 조절"},{"id":"c","text":"머리와 꼬리, 등과 앞의 결정"},{"id":"d","text":"개체의 성 결정"},{"id":"e","text":"세포분열의 정도와 시기의 결정"}],"answer":"c","ready":true,"note":""},{"id":"ch16-q12","no":12,"type":"mc","text":"다음 중 초파리 배아의 앞-뒤 축을 따라 기본 세분화를 나타내는 유전자는?","options":[{"id":"a","text":"호미오 유전자"},{"id":"b","text":"체절 형성 유전자"},{"id":"c","text":"난자-극성 유전자"},{"id":"d","text":"형태형성물질(morphogen)"}],"answer":"b","ready":true,"note":""},{"id":"ch16-q13","no":13,"type":"mc","text":"어떤 초파리 암컷은 두 개의 모계영향 유전자에 모두 돌연변이를 가지고 있다. 이 돌연변이에 의해 발생할 수 있는 결과는?","options":[{"id":"a","text":"이 암컷은 초기 배아 단계에서 발생을 멈춘다."},{"id":"b","text":"이 암컷의 자손 중 동형접합인 경우에만 돌연변이 표현형을 보인다."},{"id":"c","text":"이 암컷의 모든 자손은 유전자형에 상관없이 돌연변이 표현형을 보인다."},{"id":"d","text":"이 암컷의 수컷 자손만 돌연변이 표현형을 보인다."}],"answer":"c","ready":true,"note":""},{"id":"ch16-q14","no":14,"type":"mc","text":"Bicoid 단백질은 배아의 앞쪽에 고농도로 뒤쪽으로 갈수록 줄어드는 농도 기울기를 형성한다. bicoid mRNA를 배아의 뒤쪽 말단에 주입하면 어떤 일이 일어나겠는가?","options":[{"id":"a","text":"배아가 비정상적으로 큰 크기로 자란다."},{"id":"b","text":"배아의 날개와 다리가 추가로 자란다."},{"id":"c","text":"배아는 머리쪽이 발달하지 않고 죽는다."},{"id":"d","text":"배아의 양쪽에 머리 부위를 형성한다."}],"answer":"d","ready":true,"note":""},{"id":"ch16-q15","no":15,"type":"mc","text":"초파리 알에서 bicoid mRNA가 없으면 머리가 없고 양쪽에 모두 꼬리를 가진 유생이 된다. 이로부터 bicoid 유전자의 기능이 무엇이라고 유추할 수 있는가?","options":[{"id":"a","text":"머리 구조 형성에 관여한다."},{"id":"b","text":"꼬리 구조 형성에 관여한다."},{"id":"c","text":"난자의 극성을 결정한다."},{"id":"d","text":"배아의 등-배 축을 결정한다."}],"answer":"a","ready":true,"note":""},{"id":"ch16-q16","no":"16","type":"mc","text":"가상적인 배아에서 P 유전자를 활성화시키는데 모르포라 불리는 형태형성 물질이 고농도로 필요하고 Q 유전자는 중간 또는 그 이상의 농도, R 유전자는 모르포가 존재하기만 해도 활성화된다고 가정하자. 또 다른 종류의 형태형성 물질인 포겐은 중간 농도 이상 고농도가 존재하면 S 유전자는 활성화시키고 Q 유전자는 불활성화시킨다고 하자. 이때 모르포와 포겐이 배아의 각각 반대 편 끝에서 생성되어 확산된다고 하면 이 배아의 2번 지역에서는 어떤 유전자가 발현되겠는가? (농도는 생성된 곳에서 가장 높고 중간 지역에서 중간 농도를 보이고 반대편에서 낮은 농도를 갖는다고 가정하자.)","options":[{"id":"a","text":"유전자 P,Q,R,S"},{"id":"b","text":"유전자 P,Q,R"},{"id":"c","text":"유전자 Q,R"},{"id":"d","text":"유전자 R,S"},{"id":"e","text":"유전자 R"}],"answer":"d","ready":true,"note":"원본 3쪽의 도식 이미지를 추가한 뒤 사용하세요.","keepLabels":false,"image":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAYoAAACHCAYAAAAIlx56AAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAADsMAAA7DAcdvqGQAAE5XSURBVHhe7Z13eBXF+se/e3py0iB0YijSm9KLQNAAKk2KUgSlS1NB2qVclfgTBCkKSpEqIEgTAS8gCJIgXTqBEHoIISAh9fSy8/vj7szdLCcQyDkhhPk8D084O7Ozu1Pe952Zd2YEQggBh8PhcDg5oFJe4HA4HA5HDlcUHA6Hw3koXFFwOBwO56FwRcHhcDich8IVBYfD4XAeClcUHA6Hw3koXFFwOBwO56FwRcHhcDich8IVBYfD4XAeClcUHA6Hw3koXFFwOBwO56FwRcHhcDich+JRUYiiCL5XYO7g+cThcAo7HhUFJ/e4XC64XC7lZQ6Hwyk0eFQUKpUKgiAoL3M8wPOJw+EUdgR+HgWHw+FwHobHHgWHw+FwOJQC3aNwuVy4f/8+UlNTcefOHdjtdtjtdoiiyIZ8CCFPPPzjdrtBCIEoitmuq1QquN1u9lsQBHbN5XLB4XDA39+fxXG73dBoNFCr1ey3KIpwuVwwGAxwu92wWq0AALVazd7f398fKpUKTqcTVquV3U8IQWBgIFwuFwghMJvNUKlUEEURGo3mgQl0QRAgCALcbjfUajX7LpXqv3aASqViz5V/F0WlUkGlUmWbayGEQK/Xw+12w+l0QhAEOJ1O6HS6bPeKogiHwwGDwZDtusPhgCAI0Gq12eLRb5d/A81febharYbdbodWq2XOFSqVChqNBoIgwOFwsPt1Oh3LK/l1ANBqtezdCSFQq9Usr5T5+CiU761EFEVWT+h7K+sqZOUlv4+mLX+Gy+ViadLyp2E6nQ52u52VMYUQwvJCq9VCp9OxfKV1kqZB80Or1cJut7PrtNxdLle295S/v5KH5YsSQRCyPc/tdkOn0+WYX/L7KPIwQRBY3qjV6gfugxSfEAKn0wlRFKFWq7PlhVarhUqlgslkgp+fH1QqFSwWC8sLudyh+WU0GlGkSBEEBAQgLCwM5cuXxwsvvIAyZco80B6edQqUorBYLLh48SIOHTqE48eP48yZM7h58ybS09MhKoQ5h8MpnAiS4aC8JleUKmkelSoAvV4PjUYDk8mUTelAUhIGgyGbEqEKnUgGCFXebrc7W7r0XeSKnOJwOGCz2dhvSAq8SpUqaNKkCVq3bo2mTZsiPDychSvTeFYoEIri0KFD+Omnn/Cf//wHiYmJgKTha9asiWrVqqFixYooVaoUDAYDAgMDWSFSCxMAbDYbK2SVSsUsSUgWG7XyqEXpcDjgdDrhdrtRpEgREELgdruhUqmY5aHRaGA0GpkVQq1ZilqtZpXFYDCwXoVb6lFoNBpmtch7EvQd6LvRv/ReeaOglZ7e73K5oFars6WHHKy8h0HjBwQEYNasWdixYwdWrlyJ4sWLw263QxCEB74XkpVLLVxIDY5Cy0UJTQuS9Qgp7x6GvEHJ34Gm7+kave4pjF6j7yiPI/8/FQoUKnAESVDIyy43CFJZ0nzKKX/k0PeTfz+9j+a9/BuU30PjBgYGYunSpfj666+xZcsWVK5cmZWt4EEYK1G+F+3NeuqVQlYXckqX1nV5XsjfndYJ2naU6dAer7zd03ai1+uh ,"no":20,"type":"mc","text":"다음 중 동물 복제에 사용되는 과정은?","options":[{"id":"a","text":"성체 암컷 세포에서 미토콘드리아 DNA 사용"},{"id":"b","text":"골수에서 성체 줄기 세포의 복제 및 분화"},{"id":"c","text":"초기 배반포에서 분리한 세포를 대리모에 착상"},{"id":"d","text":"체세포 핵으로 치환된 난자를 대리모에 착상"}],"answer":"d","ready":true,"note":""},{"id":"ch16-q21","no":21,"type":"mc","text":"핵이식과정에서 공여세포의 핵이 이식되는 곳은?","options":[{"id":"a","text":"핵이 제거된 난자"},{"id":"b","text":"정상적인 난자에 이식하여 두 개의 핵이 융합되도록 한다."},{"id":"c","text":"다른 성체세포의 핵"},{"id":"d","text":"핵이 제거된 다른 성체세포"},{"id":"e","text":"난자와 수정될 때 사용되는 정자"}],"answer":"a","ready":true,"note":""},{"id":"ch16-q22","no":22,"type":"mc","text":"복제 동물은 종종 일찍 사망한다. 이에 대한 가장 적절한 설명은?","options":[{"id":"a","text":"전능성(totipotent) 줄기세포 대신 다능성(pluripotent) 줄기세포를 사용했기 때문"},{"id":"b","text":"DNA 메틸화가 완전히 초기화되지 않았기 때문"},{"id":"c","text":"전능성 줄기세포의 무한 복제 때문"},{"id":"d","text":"골수 기능 장애로 인한 비정상적인 면역 기능 때문"}],"answer":"b","ready":true,"note":""},{"id":"ch16-q23","no":23,"type":"mc","text":"다음 중 배아줄기세포에 대한 설명으로 옳지 않은 것은?","options":[{"id":"a","text":"실험실에서 배양하면 배아줄기세포는 무한 증식한다."},{"id":"b","text":"성체줄기세포는 배아줄기세포보다 배양해서 키우기 힘들다."},{"id":"c","text":"제대로 된 조건만 사용한다면 배아줄기세포가 특정 세포로 분화할 수 있도록 유전자 발현을 변화시킬 수 있다."},{"id":"d","text":"미래에는 환자의 핵으로부터 배아를 만들어낼 수 있고 그럼으로써 배아줄기세포를 모아서 조직이나 기관으로 분화시켜서 사용할 수 있게 될 것이다."},{"id":"e","text":"배아줄기세포는 분화되는 도중에 있는 세포들이어서 보통 몇몇 특정 세포로만 분화될 뿐이다."}],"answer":"e","ready":true,"note":""},{"id":"ch16-q24","no":"24","type":"ox","text":"(O/X 문제) 치료용 복제의 목적은 배아줄기세포를 생성하기 위함이다.","options":[{"id":"O","text":"O"},{"id":"X","text":"X"}],"answer":"O","ready":true,"note":"원본 정답란이 비어 있습니다. 정답 확인이 필요합니다.","keepLabels":false},{"id":"ch16-q25","no":25,"type":"mc","text":"생식적 복제와 치료용 복제의 차이점은?","options":[{"id":"a","text":"치료용 복제는 성체줄기세포를 사용한다."},{"id":"b","text":"치료용 복제는 생식적 복제와 초기 과정이 다르다."},{"id":"c","text":"치료용 복제는 대리모를 사용하지 않는다."},{"id":"d","text":"치료용 복제는 유도 다능성 줄기세포를 이용한다."},{"id":"e","text":"치료용 복제는 체세포 핵 치환기술을 사용하지 않는다."}],"answer":"c","ready":true,"note":""},{"id":"ch16-q26","no":26,"type":"mc","text":"다음 중 원발암유전자(proto-oncogene)의 돌연변이가 가져올 수 있는 결과는?","options":[{"id":"a","text":"종양 성장의 억제"},{"id":"b","text":"세포주기 억제"},{"id":"c","text":"세포 성장과 분열의 비정상적인 자극"},{"id":"d","text":"종양 크기 감소"}],"answer":"c","ready":true,"note":""},{"id":"ch16-q27","no":27,"type":"short","text":"많은 수의 원발암유전자는 세포분열을 촉진하는 단백질인 ______ 를(을) 암호화한다.","options":[],"answer":"성장인자","ready":true,"note":""},{"id":"ch16-q28","no":28,"type":"mc","text":"정상 유전자가 발암유전자로 전환될 수 있는 경우는?","options":[{"id":"a","text":"유전자 증폭으로 많은 복사체가 존재할 때"},{"id":"b","text":"정상적인 조절 부위로부터 제거되어 이동될 때"},{"id":"c","text":"더 많은 활성을 갖거나 저항성을 가진 단백질로 돌연변이가 일어날 때"},{"id":"d","text":"발현을 증가시킬 수 있는 조절 부위에 돌연변이가 일어날 때"},{"id":"e","text":"모두 정답"}],"answer":"e","ready":true,"note":""},{"id":"ch16-q29","no":29,"type":"mc","text":"원발암유전자는 암을 유발하는 발암유전자로 변할 수 있다. 진핵세포에 이러한 잠재적 시한폭탄이 존재하는 이유를 가장 잘 설명하는 것은?","options":[{"id":"a","text":"원발암유전자는 바이러스 감염에 의해 처음 발생했다."},{"id":"b","text":"원발암유전자는 정상 유전자의 돌연변이 형태이다."},{"id":"c","text":"원발암유전자는 진화과정에서 아직 퇴화되지 않은 유전자이다."},{"id":"d","text":"원발암유전자는 일반적으로 세포분열을 조절하는 데 도움이 된다."}],"answer":"d","ready":true,"note":""},{"id":"ch16-q30","no":30,"type":"mc","text":"다음 중 일반적으로 암을 촉진하는 것이 아닌 것은?","options":[{"id":"a","text":"세균이 전달하는 종양억제유전자"},{"id":"b","text":"성장인자를 암호화하는 원발암유전자의 돌연변이"},{"id":"c","text":"세포 성장을 저해하는 종양억제유전자의 불활성화"},{"id":"d","text":"ras 단백질을 비정상적으로 활성화시키는 돌연변이"}],"answer":"a","ready":true,"note":""},{"id":"ch16-q31","no":31,"type":"mc","text":"다음 중 암을 발생시킬 가능성이 가장 높은 것은?","options":[{"id":"a","text":"원발암유전자의 수 증가와 종양억제유전자의 불활성화"},{"id":"b","text":"원발암유전자의 고활성과 종양억제유전자의 활성화"},{"id":"c","text":"원발암유전자의 불활성화와 종양억제유전자의 수 증가"},{"id":"d","text":"원발암유전자와 종양억제유전자의 불활성화"},{"id":"e","text":"원발암유전자와 종양억제유전자의 고활성"}],"answer":"a","ready":true,"note":""},{"id":"ch16-q32","no":32,"type":"mc","text":"다음 중 종양 억제유전자를 올바르게 설명하는 것은?","options":[{"id":"a","text":"암세포에서 자주 과발현된다."},{"id":"b","text":"바이러스에 의해 세포에 도입된 암 유발 유전자이다."},{"id":"c","text":"DNA 복구에 관여하는 유전자들이 포함된다."},{"id":"d","text":"주로 세포주기를 촉진하는 단백질을 암호화한다."}],"answer":"c","ready":true,"note":""},{"id":"ch16-q33","no":33,"type":"mc","text":"다음 중 종양억제유전자가 암을 유발할 수 있는 경우는?","options":[{"id":"a","text":"양쪽 대립유전자의 돌연변이가 발생해 유전자의 산물인 단백질의 활성을 저하시킬 때"},{"id":"b","text":"양쪽 대립유전자 중 오로지 한쪽 유전자에만 돌연변이가 발생해 유전자의 산물인 단백질을 변화시킬 때"},{"id":"c","text":"부모로부터 돌연변이가 발생한 채로 유전됨으로써"},{"id":"d","text":"원발암유전자가 발암유전자가 됨으로써"},{"id":"e","text":"a와 d 모두 정답"}],"answer":"a","ready":true,"note":""},{"id":"ch16-q34","no":34,"type":"mc","text":"다음 중 p53 유전자의 특징이 아닌 것은?","options":[{"id":"a","text":"DNA 손상 시 여러 다른 유전자를 발현시킨다."},{"id":"b","text":"세포주기를 촉진한다."},{"id":"c","text":"DNA 손상을 복구할 수 없는 경우, 예정세포사(apoptosis)를 일으킨다."},{"id":"d","text":"정상세포에서 발현된다."}],"answer":"b","ready":true,"note":""},{"id":"ch16-q35","no":35,"type":"mc","text":"암에서 발견되는 p53 유전자의 돌연변이는 일반적으로 어떤 결과를 가져오는가?","options":[{"id":"a","text":"DNA 복구 활성화"},{"id":"b","text":"예정세포사 활성화"},{"id":"c","text":"p53 유전자의 사본 수 증가"},{"id":"d","text":"과도한 세포 성장"}],"answer":"d","ready":true,"note":""},{"id":"ch16-q36","no":36,"type":"mc","text":"암으로 발전하는 데는 많은 시간이 걸리는 이유는?","options":[{"id":"a","text":"발암유전자는 드물기 때문에"},{"id":"b","text":"주로 늙은 세포가 암으로 전환되므로"},{"id":"c","text":"몇몇 특정 돌연변이가 반드시 일어나야 하므로"},{"id":"d","text":"암세포는 매우 천천히 자라므로"}],"answer":"c","ready":true,"note":""},{"id":"ch16-q37","no":37,"type":"mc","text":"APC 유전자의 돌연변이와 가장 연관성이 높은 암의 유형은?","options":[{"id":"a","text":"대장암"},{"id":"b","text":"유방암"},{"id":"c","text":"위암"},{"id":"d","text":"폐암"}],"answer":"a","ready":true,"note":""},{"id":"ch16-q38","no":38,"type":"mc","text":"BRCA1과 BRCA2 유전자를 올바르게 설명하는 것은?","options":[{"id":"a","text":"돌연변이에 의해 발암유전자(oncogene)가 된다."},{"id":"b","text":"정상 유전자는 DNA 손상을 복구하는데 관여한다."},{"id":"c","text":"돌연변이를 가진 사람은 대장암 발생률이 증가한다."},{"id":"d","text":"대부분 암에서 이 유전자의 돌연변이가 발견된다."}],"answer":"b","ready":true,"note":""},{"id":"ch16-q39","no":39,"type":"mc","text":"다음 중 암 발생 위험 요소가 아닌 것은?","options":[{"id":"a","text":"지방이 많이 함유된 식사"},{"id":"b","text":"단백질이 많이 함유된 식사"},{"id":"c","text":"흡연"},{"id":"d","text":"자외선 노출"},{"id":"e","text":"음주"},{"id":"f","text":"X-선"}],"answer":"b","ready":true,"note":""},{"id":"ch16-q40","no":"40","type":"short","text":"자외선이나 흡연과 같이 암을 유발하는 물질들을 ______ (이)라 한다.","options":[],"answer":"발암원","ready":true,"note":"손글씨가 '발앙원'으로 추출되었습니다. 원문 판독을 확인하세요.","keepLabels":false}]},{"id":"ch32","name":"32장 · 동물의 내부환경","source":"9주차(32장) 개념확인 문제.pdf / 동일 내용 (1).pdf","questions":[{"id":"ch32-q1","no":1,"type":"short","text":"생물체의 구조와 각 부분에 대한 연구를 ______ (이)라고 정의하며, 생물체의 구조적 장치에 대한 기능을 연구하는 것을 ______ (이)라고 정의한다.","options":[],"answer":"해부학, 생리학","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다. 여러 답은 쉼표와 공백으로 구분하여 입력하세요.","sourcePage":1},{"id":"ch32-q2","no":2,"type":"short","text":"각 조직에 대한 설명을 \u003c보기>에서 고르시오.\n    \u003c보기>\n    A. 신체의 표면과 기관, 체내 강소를 싸고 선조직을 형성한다.\n    B. 뇌와 척수에서 발견되며, 이 조직의 세포는 신호를 매우 빠르게 먼 거리로 보낸다.\n    C. 엉성한 세포집단이 넓은 바탕물질에 분산되어 있다.\n    D. 특수화된 단백질이 있는 세포는 세포가 자극을 받으면 수축하는 구조로 배열된다.\n\n\n     (1) 근육조직 (____)           (3) 신경조직 (____)\n     (2) 상피조직 (____)           (4) 결합조직 (____)","options":[],"answer":"D, A, B, C","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다. 여러 답은 쉼표와 공백으로 구분하여 입력하세요.","sourcePage":1},{"id":"ch32-q3","no":3,"type":"mc","text":"다음 중 나머지 4개를 포함하고 있는 구조는 어느 것인가?","options":[{"id":"a","text":"조직"},{"id":"b","text":"세포"},{"id":"c","text":"기관"},{"id":"d","text":"개체"},{"id":"e","text":"기관계"}],"answer":"d","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다.","sourcePage":1},{"id":"ch32-q4","no":4,"type":"mc","text":"다음에서 결합조직에 관한 설명으로 맞지 않는 것은?","options":[{"id":"a","text":"기질 속의 섬유로 둘러싸인 여러 세포로 이루어져 있다."},{"id":"b","text":"뼈, 연골, 지방 몇 소성결합조직 같은 다양한 조직을 포합하고 있다."},{"id":"c","text":"다른 조직을 연결하고 지지한다."},{"id":"d","text":"여러 조직의 내벽과 외벽을 이루고 있다."},{"id":"e","text":"액상, 겔, 또는 견고한 기질을 가질 수 있다."}],"answer":"d","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다.","sourcePage":1},{"id":"ch32-q5","no":5,"type":"mc","text":"혈액이 ions":[{"id":"a","text":"근육조직"},{"id":"b","text":"신경조직"},{"id":"c","text":"결합조직"},{"id":"d","text":"상피조직"},{"id":"e","text":"모두 정답"}],"answer":"b","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다.","sourcePage":2},{"id":"ch32-q12","no":12,"type":"short","text":"활발한 신체 기능을 수행하기 위해 함께 작용하는 한 단위의 기관을 ______ (이)라고 정의한다.","options":[],"answer":"기관계","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다.","sourcePage":2},{"id":"ch32-q13","no":13,"type":"mc","text":"신체 기능을 조절하기 위해 혈관으로 화학 신호를 방출하는 것은?","options":[{"id":"a","text":"호흡계"},{"id":"b","text":"내분비계"},{"id":"c","text":"피부계"},{"id":"d","text":"신경계"},{"id":"e","text":"소화계"}],"answer":"b","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다.","sourcePage":2},{"id":"ch32-q14","no":14,"type":"mc","text":"모든 호르몬은","options":[{"id":"a","text":"내분비샘에서 생성된다."},{"id":"b","text":"지용성이다."},{"id":"c","text":"혈액의 표적 세포로 운반된다."},{"id":"d","text":"단백질 분자이다."},{"id":"e","text":"모든 표적 세포에서 동일한 생물학적 반응을 유도한다."}],"answer":"c","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다.","sourcePage":2},{"id":"ch32-q15","no":15,"type":"mc","text":"다음 중 내분비샘과 외분비샘이 모두 있는 기관은?","options":[{"id":"a","text":"뇌하수체"},{"id":"b","text":"갑상샘"},{"id":"c","text":"침샘"},{"id":"d","text":"부신"},{"id":"e","text":"췌장(이자)"}],"answer":"e","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다.","sourcePage":2},{"id":"ch32-q16","no":16,"type":"mc","text":"포유류의 분만과 출산 과정에서 자궁 근육의 수축은 옥시토신의 작용에 의해 강화된다. 이것은 다음 중 어떤 예에 해당하는가?","options":[{"id":"a","text":"양성되먹임(피드백) 작용"},{"id":"b","text":"음성되먹임(피드백) 작용"},{"id":"c","text":"뇌하수체 전엽의 자궁 수축 조절"},{"id":"d","text":"표적 세포에서 유전자 발현을 변화시키는 신호 전달"}],"answer":"a","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다.","sourcePage":2},{"id":"ch32-q17","no":17,"type":"mc","text":"혈액 내 칼슘농도를 높이는 호르몬은?","options":[{"id":"a","text":"칼시토닌"},{"id":"b","text":"멜라토닌"},{"id":"c","text":"갑상샘 호르몬"},{"id":"d","text":"부갑상샘 호르몬"}],"answer":"d","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다.","sourcePage":2},{"id":"ch32-q18","no":18,"type":"mc","text":"옥시토신과 항이뇨호르몬(ADH)을 합성하는 곳은?","options":[{"id":"a","text":"시상하부"},{"id":"b","text":"부신 속질"},{"id":"c","text":"부신 겉질"},{"id":"d","text":"뇌하수체 전엽"},{"id":"e","text":"뇌하수체 후엽"}],"answer":"a","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다.","sourcePage":2},{"id":"ch32-q19","no":19,"type":"mc","text":"멜라토닌을 생성하는 내분비샘은?","options":[{"id":"a","text":"시상하부"},{"id":"b","text":"송과샘"},{"id":"c","text":"부신 수질"},{"id":"d","text":"뇌하수체 후엽"},{"id":"e","text":"갑상샘"}],"answer":"b","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다.","sourcePage":2},{"id":"ch32-q20","no":20,"type":"mc","text":"비정상적으로 감소된 신체 성장(왜소증)은 다음 중 어느 기관에서 호르몬 분비가 감소한 결과이겠는가?","options":[{"id":"a","text":"신장"},{"id":"b","text":"췌장(이자)"},{"id":"c","text":"부신"},{"id":"d","text":"뇌하수체 후엽"},{"id":"e","text":"뇌하수체 전엽"}],"answer":"e","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다.","sourcePage":2},{"id":"ch32-q21","no":21,"type":"mc","text":"시상하부에 대한 설명으로 틀린 것은?","options":[{"id":"a","text":"내분비 신호의 표적으로도 작용한다."},{"id":"b","text":"뇌하수체 후엽을 자극하여 호르몬 합성을 촉진시킨다."},{"id":"c","text":"세포에 호르몬 수용체를 가지고 있다."},{"id":"d","text":"대부분의 신경내분비 신호를 조절한다."}],"answer":"b","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다.","sourcePage":2},{"id":"ch32-q22","no":22,"type":"mc","text":"항상성이란?","options":[{"id":"a","text":"주위환경과의 물질교환"},{"id":"b","text":"모든 척추동물이 비슷한 방식으로 구성되었다는 생각"},{"id":"c","text":"구조와 기능의 상호작용"},{"id":"d","text":"비교적 일정한 내적환경을 유지하는 것"},{"id":"e","text":"신체의 일부가 조직, 기관, 기관계를 구성하기 위한 협동작용"}],"answer":"d","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다.","sourcePage":3},{"id":"ch32-q23","no":23,"type":"mc","text":"항상성의 예가 아닌 것은?","options":[{"id":"a","text":"민물고기가 많은 양의 희석된 오줌을 배출한다."},{"id":"b","text":"혈당이 낮으면 글루카곤이 분비되어 혈당을 높인다."},{"id":"c","text":"혈액의 삼투농도가 높으면 항이뇨호르몬 분비가 증가한다."},{"id":"d","text":"아기 cePage":4},{"id":"ch32-q30","no":30,"type":"mc","text":"대부분의 육상 무척추동물과 모든 양서류는?","options":[{"id":"a","text":"외부에서 열을 얻는 외온성이다."},{"id":"b","text":"체온을 37°C로 유지하기 위해 대사율을 변화시킨다."},{"id":"c","text":"축축한 체표면에서는 증발에 의해 항상 열을 잃는다."},{"id":"d","text":"환경 온도가 20°C 이하로 떨어지면 열을 내기 위해 더 활발해진다."}],"answer":"a","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다.","sourcePage":4},{"id":"ch32-q31","no":31,"type":"mc","text":"다음 동물에서 성장을 위한 에너지 수지의 %가 가장 높은 것은?","options":[{"id":"a","text":"온화한 숲에서 온 휜발새앙쥐"},{"id":"b","text":"열대 인도에서 온 비단뱀"},{"id":"c","text":"온화한 기후에서 온 사람"},{"id":"d","text":"남극에서 온 펭귄"},{"id":"e","text":"대부분의 에너지가 기초대사율을 유지하는 데 사용되기 때문에 모두가 동일할 것이다."}],"answer":"b","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다.","sourcePage":4},{"id":"ch32-q32","no":32,"type":"mc","text":"다음 중 열을 발산하기 위하여 사용되는 방법은?","options":[{"id":"a","text":"동면"},{"id":"b","text":"털이나 깃을 세워 공기를 포집"},{"id":"c","text":"표면 혈관의 확장"},{"id":"d","text":"표피 혈관의 수축"},{"id":"e","text":"말단부위에 있는 혈관 사이에서 역류열교환"}],"answer":"c","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다.","sourcePage":4},{"id":"ch32-q33","no":33,"type":"mc","text":"다음 중 동물과 환경 사이의 열 교환 속도를 증가시키는 것은?","options":[{"id":"a","text":"깃털"},{"id":"b","text":"혈관 수축"},{"id":"c","text":"신체 표면을 지나가는 바람"},{"id":"d","text":"역류열교환"}],"answer":"c","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다.","sourcePage":4},{"id":"ch32-q34","no":34,"type":"mc","text":"다음 중 역류교환이 아닌 것은?","options":[{"id":"a","text":"물고기 아가미에서 기체교환"},{"id":"b","text":"거위 다리의 동맥에서 정맥으로 열전달"},{"id":"c","text":"소장의 융모에서 모세혈관으로 영양분 흡수"},{"id":"d","text":"헨레고리와 주변 모세혈관 사이에서 NaCl 능동수송"}],"answer":"c","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다.","sourcePage":4},{"id":"ch32-q35","no":35,"type":"mc","text":"그림과 같은 동맥과 정맥의 역류 배열은 어떤 결과를 가져오는가?","options":[{"id":"a","text":"두 혈관의 혈액 사이의 온도 차이가 최소화된다."},{"id":"b","text":"열전달이 더 빠르게 일어난다."},{"id":"c","text":"발의 혈액이 복부의 혈액만큼 따뜻해진다."},{"id":" ext":"등장삼투성이다."}],"answer":"c","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다.","sourcePage":5},{"id":"ch32-q37","no":37,"type":"mc","text":"해수 어류(바닷물고기)는 어떻게 삼투조절을 하는가?","options":[{"id":"a","text":"아가미를 통해 물을 흡수"},{"id":"b","text":"아가미를 통해 염류를 흡수"},{"id":"c","text":"다량의 해수를 마시고 아가미에서 염류를 배출"},{"id":"d","text":"다량의 묽은 오줌을 배설"}],"answer":"c","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다.","sourcePage":5},{"id":"ch32-q38","no":38,"type":"mc","text":"실수로 바닷물에 넣어 죽은 담수 어류(민물고기)를 부검하였다. 그 결과 를 바르게 설명한 것은?","options":[{"id":"a","text":"삼투압에 의한 수분 손실로 세포 사멸과 장기 부전이 발생했다."},{"id":"b","text":"다량의 소금이 세포로 확산되어 세포가 부풀어 오르고 용해되었다."},{"id":"c","text":"고삼투압 환경에서 과도한 수분 제거로 신장이 손상되었다."},{"id":"d","text":"아가미가 소금으로 뒤덮여 가스 교환이 충분하지 않아 질식사했다."}],"answer":"a","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다.","sourcePage":5},{"id":"ch32-q39","no":39,"type":"mc","text":"질소 노폐물로 요산를 배설하면 어떤 이점이 있는가?","options":[{"id":"a","text":"요산은 물에 쉽게 용해된다."},{"id":"b","text":"합성하는데 에너지가 적게 소모된다."},{"id":"c","text":"물의 손실을 최대한 줄일 수 있다."},{"id":"d","text":"몸에서 더 많은 질소가 제거된다."}],"answer":"c","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다.","sourcePage":5},{"id":"ch32-q40","no":40,"type":"mc","text":"작고 고인 담수 웅덩이에서 자주 발견되는 아프리카 폐어는 질소노폐물 로 요소를 생성한다. 이러한 적응을 가장 잘 설명한 것은?","options":[{"id":"a","text":"요소는 암모니아보다 합성하는 데 에너지가 적게 든다."},{"id":"b","text":"작은 웅덩이는 독성 암모니아를 희석하기에 물이 충분하지 않다."},{"id":"c","text":"요소는 불용성 침전물을 형성한다."},{"id":"d","text":"요소는 폐어의 조직을 저장액으로 만든다."}],"answer":"b","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다.","sourcePage":5},{"id":"ch32-q41","no":41,"type":"mc","text":"동물에서 질소 노폐물은 다음 중 어떤 물질이 분해될 때 생성되는가?","options":[{"id":"a","text":"녹말과 셀룰로스"},{"id":"b","text":"트리아실글리세롤과 스테로이드"},{"id":"c","text":"단백질과 핵산"},{"id":"d","text":"인지질과 당지질"},{"id":"e","text":"지방산과 글리세롤"}],"answer":"c","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다.","sourcePage":5},{"id":"ch32-q42","no":42,"type":"short","text":"각 항목의 특징에 대한 설명을 \u003c보기>에서 고르시오.\n     \u003c보기>\n     A. 오줌이 신장을 떠나 이곳으로 간다.              C. 신장의 기능적 단위\n     B. 오줌이 여기에 저장된다.                    D. 오줌이 방광을 떠나 이곳으로 간다.\n\n\n     (1) 네프론 (____)   (2) 수뇨관 (____)     (3) 방광 (____)    (4) 요도 (____)","options":[],"answer":"C, A, B, D","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다. 여러 답은 쉼표와 공백으로 구분하여 입력하세요.","sourcePage":5},{"id":"ch32-q43","no":43,"type":"mc","text":"배설계는 체액의 ______ 양을 조절하는 동안 항상성, ______ 을 형성하여 배출하는데 중심 역할을 한다.","options":[{"id":"a","text":"오줌, 수분과 염"},{"id":"b","text":"혈액, 당"},{"id":"c","text":"분변, 혈액"},{"id":"d","text":"오줌, 당"},{"id":"e","text":"땀, 물과 당"}],"answer":"a","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다. 사용자가 지정한 정답을 채점 기준으로 적용했습니다.","sourcePage":5},{"id":"ch32-q44","no":44,"type":"mc","text":"다음 중 신장에서 일어나는 배설계의 기능을 순서대로 나열한 것은?","options":[{"id":"a","text":"재흡수, 여과, 분비, 배설"},{"id":"b","text":"분비, 배설 재흡수, 여과"},{"id":"c","text":"분비, 여과, 배설, 재흡수"},{"id":"d","text":"여과, 재흡수, 분비 배설"},{"id":"e","text":"여과, 재흡수, 배설 분비"}],"answer":"d","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다.","sourcePage":6},{"id":"ch32-q45","no":45,"type":"mc","text":"신장이 모든 신체 기관 중 대사율이 가장 높은 주된 이유는?","options":[{"id":"a","text":"신체의 과도한 지방을 저장하기 때문"},{"id":"b","text":"물에 대한 다양한 투과성의 막을 가지고 있기 때문"},{"id":"c","text":"광범위한 능동 수송 이온 펌프들이 작동하기 때문"},{"id":"d","text":"과도한 영양분을 배출하기 때문"}],"answer":"c","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다.","sourcePage":6},{"id":"ch32-q46","no":46,"type":"mc","text":"근위세뇨관과 원위세뇨관에서의 여과액 처리는","options":[{"id":"a","text":"혈장 단백질을 크기에 따라 분류한다."},{"id":"b","text":"암모니아를 독성이 적은 요소로 전환한다."},{"id":"c","text":"체액에서 pH의 항상성을 유지한다."},{"id":"d","text":"삼투압 균형을 위해 요소를 재흡수한다."}],"answer":"c","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다.","sourcePage":6},{"id":"ch32-q47","no":47,"type":"mc","text":"사람 체액의 정상적인 삼투압은 얼마인가?","options":[{"id":"a","text":"100 mOsm/L"},{"id":"b","text":"200 mOsm/L"},{"id":"c","text":"300 mOsm/L"},{"id":"d","text":"500 mOsm/L"}],"answer":"c","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다.","sourcePage":6},{"id":"ch32-q48","no":48,"type":"mc","text":"다음 중 항이뇨호르몬(ADH) 분비가 증가하는 경우는?","options":[{"id":"a","text":"순수한 물을 많이 마신 경우"},{"id":"b","text":"짠 음식을 많이 먹은 경우"},{"id":"c","text":"심한 설사로 염류와 물이 모두 손실된 경우"},{"id":"d","text":"알코올성 음료를 마신 경우"},{"id":"e","text":"혈압이 비정상적으로 높아진 경우"}],"answer":"b","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다. 사용자가 지정한 정답을 채점 기준으로 적용했습니다.","sourcePage":6},{"id":"ch32-q49","no":49,"type":"mc","text":"항이뇨호르몬(ADH)은 어떻게 작용하는가?","options":[{"id":"a","text":"수송 단백질을 통해 포도당의 재흡수를 자극한다."},{"id":"b","text":"세포막이 물을 더 잘 투과하도록 만드는 효소의 합성을 촉진한다."},{"id":"c","text":"막에 불포화 지방산을 함유한 인지질이 더 많이 포함되도록 한다."},{"id":"d","text":"집합관 상피세포의 아쿠아포린 수를 일시적으로 증가시킨다."},{"id":"e","text":"여과액이 네프론을 통과하는 속도를 감소시켜 물의 재흡수를 증가시킨다."}],"answer":"d","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다.","sourcePage":6},{"id":"ch32-q50","no":50,"type":"mc","text":"엑스터시로 알려진 불법 약물인 MDMA를 복용하면 체온 상승으로 물을 많이 마시게 된다. 또한 MDMA는 항이뇨호르몬(ADH) 생성을 증가시킨 다. 이럴 경우 어떤 증상이 발생하겠는가?","options":[{"id":"a","text":"혈압이 상승하고 묽은 오줌이 생성된다."},{"id":"b","text":"혈압이 상승하고 농축된 오줌이 생성된다."},{"id":"c","text":"혈압이 감소하고 묽은 오줌이 생성된다."},{"id":"d","text":"혈압 감소하고 농축된 오줌이 생성된다."}],"answer":"b","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다.","sourcePage":6}]},{"id":"ch33","name":"33장 · 동물의 영양","source":"10주차(33장) 개념확인 문제(1).pdf","questions":[{"id":"ch33-q1","no":1,"type":"mc","text":"신체에 저장된 물질 중 가장 에너지가 풍부한 것은?","options":[{"id":"a","text":"지방조직의 지방"},{"id":"b","text":"혈액 내 포도당"},{"id":"c","text":"근육세포의 단백질"},{"id":"d","text":"간의 글리코겐"}],"answer":"a","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다."},{"id":"ch33-q2","no":2,"type":"mc","text":"일부 동물이 필수영양소를 요구하는 이유는?","options":[{"id":"a","text":"그 동물들만이 그 영양소를 사용하기 때문"},{"id":"b","text":"중요한 고분자를 합성하는데 필요한 단위체이기 때문"},{"id":"c","text":"해당 영양소를 합성할 수 없기 때문"},{"id":"d","text":"영양소가 필수 조효소이기 때문"},{"id":"e","text":"특정 음식에만 포함되어 있기 때문"}],"answer":"c","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다."},{"id":"ch33-q3","no":3,"type":"mc","text":"어떤 아미노산은 필수아미노산이 아니다. 그 이유는 무엇인가?","options":[{"id":"a","text":"동물의 체내에서 합성할 수 있기 때문"},{"id":"b","text":"동물이 생합성에 사용하지 않는 아미노산이기 때문"},{"id":"c","text":"필요한 양이 극히 적기 때문"},{"id":"d","text":"소화관에서 쉽게 흡수되지 않기 때문"}],"answer":"a","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다."},{"id":"ch33-q4","no":4,"type":"short","text":"대부분 비타민은 물질대사를 하는 ______ 의 보조기능을 한다.","options":[],"answer":"효소","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다."},{"id":"ch33-q5","no":5,"type":"mc","text":"다음 중 지용성 비타민으로만 묶은 것은?","options":[{"id":"a","text":"비타민 A, C, E"},{"id":"b","text":"비타민 A, D, K"},{"id":"c","text":"비타민 B, D, E"},{"id":"d","text":"비타민 B, E, K"},{"id":"e","text":"비타민 C, D, K"}],"answer":"b","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다."},{"id":"ch33-q6","no":6,"type":"mc","text":"다음에서 필수 영양소가 아닌 것은?","options":[{"id":"a","text":"철분"},{"id":"b","text":"포도당, 단당류"},{"id":"c","text":"메티오닌(아미노산)"},{"id":"d","text":"Na⁺"},{"id":"e","text":"판토텐산(pantothenic acid, 비타민)"}],"answer":"b","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다."},{"id":"ch33-q7","no":7,"type":"mc","text":"왜 채식주의자는 식품에 다양한 단백질원을 조합하거나 계란이나 우유 같은 일부 동물 식품을 섭취해야 하는가?","options":[{"id":"a","text":"충분한 칼로리 섭취를 유지하기 위해서"},{"id":"b","text":"충분한 비타민 섭취를 위해서"},{"id":"c","text":"모든 필수 지방산 섭취를 유지하기 위해서"},{"id":"d","text":"음식물에 대한 흥미를 돋우기 위해서"},{"id":"e","text":"모든 필수 아미노산을 공급하기 위해서"}],"answer":"e","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다."},{"id":"ch33-q8","no":8,"type":"mc","text":"다음 중 비타민에 대한 설명으로 옳은 것은?","options":[{"id":"a","text":"장내세균이 만들 수 있다."},{"id":"b","text":"한 종에서 다른 종 간의 비타민 요구가 같다."},{"id":"c","text":"간에 많은 양이 저장되어 있다."},{"id":"d","text":"보조인자로 작용하는 적은 양이 필요한 무기 영양소이다."},{"id":"e","text":"매일 대체되어야 하는 수용성 물질이다."}],"answer":"d","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다. 사용자가 지정한 정답을 채점 기준으로 적용했습니다."},{"id":"ch33-q9","no":9,"type":"mc","text":"표는 종합비타민 보충제의 함량과 일일 권장량(% DV)이다.\n\n보충제 / % DV\n비타민 A 70 / 비타민 C 100 / 비타민 D 100 / 비타민 E 150 / 비타민 K 13 / 비타민 B1 100\n비타민 B2 100 / 엽산 100 / 비타민 B12 417 / 칼슘 20 / 인 5 / 요오드 100\n마그네슘 25 / 아연 100 / 구리 100 / 크로뮴 125 / 몰리브덴 100 / 철 0\n\n이 보충제에 함유된 일부 비타민과 미네랄의 함량이 100% 미만인 이유를 가장 잘 설명하는것은?","options":[{"id":"a","text":"더 첨가하는 것이 화학적으로 불가능하기 때문이다."},{"id":"b","text":"이러한 비타민과 미네랄은 너무 커서 100%에 도달하지 못한다."},{"id":"c","text":"비타민 A와 K와 같은 지용성 비타민을 과다 복용하는 것은 위험하며, 일부 미네랄은 음식에서 충분히 많이 존재한다."},{"id":"d","text":"이러한 보충제는 건강한 식품을 섭취하지 못한 사람들을 위한 것이다."}],"answer":"c","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다."},{"id":"ch33-q10","no":10,"type":"short","text":"각 용어에 가장 적합한 정의를 \u003c보기>에서 고르시오.\n     \u003c보기>\n     A. 식(食) (= 먹음, eating)\n     B. 음식물을 상대적으로 작은 영양물질로 분해\n     C. 체세포에 의한 작은 영양물질의 섭취\n     D. 음식물의 소화되지 않은 물질 폐기\n\n\n     (1) 제거(elimination) (____)            (3) 섭취(ingestion)    (____)\n     (2) 흡수(absorption) (____)            (4) 소화(digestion)    (____)","options":[],"answer":"D, C, A, B","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다. 소문항 (1)~(4)의 기호를 쉼표와 공백으로 구분해 입력하세요."},{"id":"ch33-q11","no":11,"type":"mc","text":"다음에서 음식물 처리의 네 단계를 순서대로 나열한 것은?","options":[{"id":"a","text":"섭취 → 소화 → 흡수 → 배설"},{"id":"b","text":"소화 → 섭취 → 흡수 → 배설"},{"id":"c","text":"섭취 → 흡수 → 배설 → 소화"},{"id":"d","text":"섭취 → 소화 → 배설 → 흡수"},{"id":"e","text":"흡수 → 소화 → 섭취 → 배설"}],"answer":"a","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다."},{"id":"ch33-q12","no":12,"type":"ox","text":"(O/X 문제) 기계적 소화는 효소에 의한 음식물의 화학적 분해이다.","options":[{"id":"O","text":"O"},{"id":"X","text":"X"}],"answer":"X","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다."},{"id":"ch33-q13","no":13,"type":"mc","text":"탄수화물의 소화와 단백질의 소화는 모두","options":[{"id":"a","text":"동일한 효소에 의해 촉매된다."},{"id":"b","text":"가수분해 반응이다."},{"id":"c","text":"pH를 낮추기 위해 염산이 필요하다."},{"id":"d","text":"에너지원으로 ATP가 필요하다."}],"answer":"b","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다."},{"id":"ch33-q14","no":14,"type":"mc","text":"위수강에 비해 완전 소화관의 장점은 무엇인가?","options":[{"id":"a","text":"세포 외 소화가 필요 없다."},{"id":"b","text":"특수 기능을 가진 특성화된 부분으로 나뉜다."},{"id":"c","text":"더 다양한 소화 효소를 분비할 수 있다."},{"id":"d","text":"광범위한 분기(branching)가 가능하다."},{"id":"e","text":"세포 내 소화를 촉진한다."}],"answer":"b","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다."},{"id":"ch33-q15","no":15,"type":"mc","text":"음식물이 새의 소화관을 통과하는 순서를 바르게 나열한 것은?","options":[{"id":"a","text":"입 → 식도 → 소낭 → 위 → 모래주머니 → 장 → 항문"},{"id":"b","text":"입 → 식도 → 모래주머니 → 소낭 → 위 → 장 → 항문"},{"id":"c","text":"입 → 식도 → 위 → 소낭 → 모래주머니 → 장 → 항문"},{"id":"d","text":"입 → 식도 → 소낭 → 모래주머니 → 위 → 장 → 항문"}],"answer":"a","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다."},{"id":"ch33-q16","no":16,"type":"mc","text":"무엇이 음식물 덩어리를 식도에서 위로 이동시키는가?","options":[{"id":"a","text":"중력"},{"id":"b","text":"구강에 비해 복강의 낮은 압력"},{"id":"c","text":"횡격막의 수축과 위의 괄약근이 열림"},{"id":"d","text":"평활근의 수축과 이완에 의한 연동운동"},{"id":"e","text":"섬모운동"}],"answer":"d","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다."},{"id":"ch33-q17","no":17,"type":"short","text":"침의 ______ 는(은) 입에서 녹말을 분해한다.","options":[],"answer":"아밀라아제","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다."},{"id":"ch33-q18","no":18,"type":"short","text":"위 안팎으로 물질의 이동을 조절하는 고리형 근육을 ______ (이)라 한다.","options":[],"answer":"괄약근","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다."},{"id":"ch33-q19","no":19,"type":"mc","text":"소화기관 중 하나인 위에서 위산(pH 2)의 역할이 아닌 것은?","options":[{"id":"a","text":"펩시노겐을 펩신으로 바꾼다."},{"id":"b","text":"섭취한 음식물에 있는 세균을 죽인다."},{"id":"c","text":"단백질을 변성시켜 펩타이드 결합을 노출시킨다."},{"id":"d","text":"고기나 식물의 세포들을 서로 붙들어주는 세포외 기질을 파괴한다."},{"id":"e","text":"지질을 녹여 소화효소가 잘 작용하도록 한다."}],"answer":"e","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다."},{"id":"ch33-q20","no":20,"type":"mc","text":"다음 중 위장의 주요 기능이 아닌 것은?","options":[{"id":"a","text":"저장"},{"id":"b","text":"염산(HCl) 생산"},{"id":"c","text":"영양소 흡수"},{"id":"d","text":"소화효소 분비"}],"answer":"c","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다."},{"id":"ch33-q21","no":21,"type":"mc","text":"무엇이 위가 스스로 분해하는 것을 막는가?","options":[{"id":"a","text":"점액질 보호막이 위벽 세포와 위역간의 접촉을 제한한다."},{"id":"b","text":"신경과 호르몬이 음식물이 위에 머무는 동안 위액의 분비를 제한한다."},{"id":"c","text":"3일에 한 번 정도 손상이 일어나는 표피세포가 새로운 세포로 교체되 어야 한다."},{"id":"d","text":"a,b,c 모두 정답"},{"id":"e","text":"정답 없음"}],"answer":"d","ready":true,"keepLabels":true,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다. 사용자가 지정한 정답을 채점 기준으로 적용했습니다."},{"id":"ch33-q22","no":22,"type":"mc","text":"외분비성 췌장기능부전증(Exocrine Pancreatic Insufficiency, EPI) 진 단을 받은 사람은 지방, 단백질, 탄수화물을 소화하는 데 필요한 소화효 소들이 제대로 분비되지 않는다. 이 질환으로 인해 발생할 수 있는 결과 는 무엇이겠는가?","options":[{"id":"a","text":"체중 감소"},{"id":"b","text":"간문맥 확장"},{"id":"c","text":"연동운동 속도 증가"},{"id":"d","text":"담즙 생성 증가"}],"answer":"a","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다."},{"id":"ch33-q23","no":23,"type":"mc","text":"어떤 사람이 담낭을 제거하였고, 그 후 이 사람은 __________________.","options":[{"id":"a","text":"많은 양의 지방이 함유된 음식을 먹을 수 없었다."},{"id":"b","text":"단백질 소화에 문제가 있었다."},{"id":"c","text":"단당류와 이당류는 먹을 수 있지만 다당류는 먹을 수 없었다."},{"id":"d","text":"음식물을 많은 양의 물과 함께 먹어야 했다."},{"id":"e","text":"아미노산을 보충할 필요가 있었다."}],"answer":"a","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다."},{"id":"ch33-q24","no":24,"type":"mc","text":"지방의 흡수가 탄수화물의 흡수와 다른 점은?","options":[{"id":"a","text":"지방을 소화하는 데는 효소가 필요하지 않다."},{"id":"b","text":"지방은 위장에서 흡수되는 반면 탄수화물은 소장에서 흡수된다."},{"id":"c","text":"탄수화물은 소화되기 전에 유화되어야 한다."},{"id":"d","text":"대부분의 흡수된 지방은 림프계로 먼저 들어간다."}],"answer":"d","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다."},{"id":"ch33-q25","no":25,"type":"mc","text":"사람에서 대부분 영양물질은 ______ 에 의해 흡수된다.","options":[{"id":"a","text":"위"},{"id":"b","text":"간"},{"id":"c","text":"소장"},{"id":"d","text":"대장"},{"id":"e","text":"췌장"}],"answer":"c","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다."},{"id":"ch33-q26","no":26,"type":"mc","text":"가장 다양한 소화효소는 ______ 에서 작용한다.","options":[{"id":"a","text":"대장"},{"id":"b","text":"구강"},{"id":"c","text":"위"},{"id":"d","text":"담낭"},{"id":"e","text":"소장"}],"answer":"e","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다."},{"id":"ch33-q27","no":27,"type":"mc","text":"보기 중에서 다음 문장에 적용할 수 없는 것은? ______ 를(을) 몸이 흡수하고 사용하기 위해서 ______ (으)로 가수분해되어야 한다.","options":[{"id":"a","text":"다당류, 단당류"},{"id":"b","text":"아미노산, 단백질"},{"id":"c","text":"지방, 글리세롤과 지방산"},{"id":"d","text":"이당류, 단당류"},{"id":"e","text":"녹말, 단당류"}],"answer":"b","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다."},{"id":"ch33-q28","no":28,"type":"mc","text":"영양분이 흡수된 후 혈액을 통해 먼저 ______ (으)로 운반된다.","options":[{"id":"a","text":"뇌"},{"id":"b","text":"췌장"},{"id":"c","text":"신장"},{"id":"d","text":"간"},{"id":"e","text":"대장"}],"answer":"d","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다."},{"id":"ch33-q29","no":29,"type":"mc","text":"왜 침에 있는 아말라아제는 십이지장에서 녹말을 분해하지 않는가?","options":[{"id":"a","text":"녹말이 맥아당(말토오스)으로 구강에서 완전히 분해되었다."},{"id":"b","text":"위의 산성 pH는 침의 아밀라아제를 변성시키고 펩신이 분해한다."},{"id":"c","text":"침의 아밀라아제는 침샘에서 생성되고 구강을 떠나지 않는다."},{"id":"d","text":"이자(췌장) 아말라아제가 십이지장 pH에서 더 효과적인 효소이다."},{"id":"e","text":"침의 아밀라아제는 글리코겐을 분해할 수 있지만 녹말은 분해할 수 없다."}],"answer":"b","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다."},{"id":"ch33-q30","no":30,"type":"mc","text":"간문맥은","options":[{"id":"a","text":"장의 모세혈관에 공급한다."},{"id":"b","text":"흡수된 영양분을 처리하기 위해 간으로 운반한다."},{"id":"c","text":"혈액을 간에서 심장으로 운반한다."},{"id":"d","text":"용모의 압축을 뽑아낸다."}],"answer":"b","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다."},{"id":"ch33-q31","no":31,"type":"mc","text":"융모(융털)가 무엇이며 무슨 일을 하는가?","options":[{"id":"a","text":"위의 주름으로 위의 확장이 일어나게 한다."},{"id":"b","text":"소화된 지방을 흡수하여 순환계로 이동시키는 림프계의 신장부위이다."},{"id":"c","text":"흡수를 위한 표면적을 넓히는 소장표면의 손가락 모양의 돌기이다."},{"id":"d","text":"소화를 위해 더 넓은 면적을 제공하는 소장표피로 현미경으로 볼 수 있는 돌기이다."},{"id":"e","text":"간문맥을 만들기 위해 연결하는 장 모세혈관의 돌기이다."}],"answer":"c","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다."},{"id":"ch33-q32","no":32,"type":"mc","text":"사람에서 대장의 주기능은?","options":[{"id":"a","text":"물의 흡수"},{"id":"b","text":"음식물의 소화"},{"id":"c","text":"독성물질의 분해"},{"id":"d","text":"영양분 흡수"},{"id":"e","text":"음식물이 소화되어 흡수되기 전에 보관"}],"answer":"a","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다."},{"id":"ch33-q33","no":33,"type":"mc","text":"변비를 일으킬 가능성이 가장 높은 물질은?","options":[{"id":"a","text":"식이섬유가 많이 포함된 물질"},{"id":"b","text":"대장에서 물 흡수를 촉진하는 물질"},{"id":"c","text":"대장을 통한 물질의 이동을 촉진하는 물질"},{"id":"d","text":"대장의 물 흡수를 감소시키는 물질"},{"id":"e","text":"연동운동을 촉진하는 물질"}],"answer":"b","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다."},{"id":"ch33-q34","no":34,"type":"short","text":"변이 배설될 때까지 저장하는 대장의 마지막 6인치를 ______ (이)라 한다.","options":[],"answer":"직장","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다."},{"id":"ch33-q35","no":35,"type":"short","text":"다음 물음에 해당하는 기관을 그림에서 고르시오.\n\n                                (1) 단백질이 처음 소화되기 시작하      (____)\n                                  는 곳은?\n\n                                (2) 고분자의 가수분해가 가장 많이      (____)\n                                  일어나는 곳은?\n\n                                (3) 가장 다양한 소화효소가 분비되      (____)\n                                  는 곳은?\n\n                                (4) 중탄산염이 풍부한 염기성 용액      (____)\n                                  이 분비된는 곳은?\n\n                                (5) 지방을 유화시키는 데 도움이       (____)\n                                      되는 물질을 생성하는 곳은?\n\n                                (6) 지방의 소화가 kJggg=="},{"id":"ch33-q40","no":40,"type":"mc","text":"다음 중 상대적으로 긴 맹장을 가진 동물은?","options":[{"id":"a","text":"육식동물"},{"id":"b","text":"초식동물"},{"id":"c","text":"잡식성동물"}],"answer":"b","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다."},{"id":"ch33-q41","no":41,"type":"mc","text":"식분증(자신의 배설물을 먹음)으로 대장에서 발효된 부산물을 다시 섭취 하여 영양분을 흡수하는 동물은?","options":[{"id":"a","text":"소와 같은 반추동물"},{"id":"b","text":"곤충과 같은 절지동물"},{"id":"c","text":"토끼와 같은 설치류"},{"id":"d","text":"다람쥐와 일부 설치류"},{"id":"e","text":"코끼리와 같은 대형 초식동물"}],"answer":"c","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다."},{"id":"ch33-q42","no":42,"type":"mc","text":"소와 같은 반추동물은","options":[{"id":"a","text":"인산을 얻기 위해 뿔이나 뼈를 먹는다."},{"id":"b","text":"셀룰로스를 소화시키는 데 미생물을 이용한다."},{"id":"c","text":"미생물에 의해 소화된 영양분을 섭취하기 위해 배설물을 먹는다."},{"id":"d","text":"맹장에 공생세균과 원생동물을 가지고 있다."},{"id":"e","text":"소화된 식물체로부터 모든 영양분을 얻는다."}],"answer":"b","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다."},{"id":"ch33-q43","no":43,"type":"mc","text":"젖소에게 항생제를 과다 투여하여 항생제가 위장에 들어갔다고 하면, 다 음 중 어떤 과정에 어려움이 생기겠는가?","options":[{"id":"a","text":"단백질 가수분해"},{"id":"b","text":"소변 생산"},{"id":"c","text":"우유 생산"},{"id":"d","text":"셀룰로스 소화"}],"answer":"d","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다."},{"id":"ch33-q44","no":44,"type":"short","text":"필수적인 신체활동 과정과 기본적인 몸의 기능을 유지하는 데 필요한 에너지량을 ______ (이)라 한다.","options":[],"answer":"기초대사량","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다."},{"id":"ch33-q45","no":45,"type":"short","text":"우리가 섭취하는 음식물 에너지의 60% 정도는 ______ (으)로 환경에 방출되어 잃어버린다.","options":[],"answer":"열","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다."},{"id":"ch33-q46","no":46,"type":"mc","text":"기초 대사율을 정확하게 측정하기에 가장 좋은 시간은?","options":[{"id":"a","text":"휴식 중이며 하루의 첫 번째 식사를 먹지 않았을 때"},{"id":"b","text":"휴식 중이며 하루의 첫 번째 식사를 방금 마쳤을 때"},{"id":"c","text":"무설탕 식사를 하고난 후"},{"id":"d","text":"최소 48시간 동안 물을 섭취하지 않았을 때"},{"id":"e","text":"30분간의 격렬한 운동을 하고난 후"}],"answer":"a","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다."},{"id":"ch33-q47","no":47,"type":"mc","text":"약 25세부터 기초 대사율(BMR)은 10년마다 약 2~6%씩 감소한다. 이에 대한 설명으로 가장 적절한 것은?","options":[{"id":"a","text":"신체가 휴식 중에 소모하는 칼로리의 양이 점점 증가하기 때문이다."},{"id":"b","text":"나이가 들면서 근육량이 감소하고 지방 수치가 증가하기 때문이다."},{"id":"c","text":"일일 칼로리 섭취량을 줄이지 않기 때문이다."},{"id":"d","text":"하루에 필요한 필수 아미노산과 필수 지방산 양이 줄어들기 때문이다."}],"answer":"b","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다."},{"id":"ch33-q48","no":48,"type":"mc","text":"동물이 평소에 필요로 하는 것보다 더 많은 에너지를 가진 물질을 섭취 하면, 여분의 에너지는 어떻게 되는가?","options":[{"id":"a","text":"대변으로 제거된다."},{"id":"b","text":"간에서 녹말로 저장된다."},{"id":"c","text":"간과 근육에서 글리코젠으로 저장된다."},{"id":"d","text":"산화되어 ATP로 전환된다."}],"answer":"c","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다."},{"id":"ch33-q49","no":49,"type":"mc","text":"탄수화물이 풍부한 식사를 한 후 포유류의 췌장(이자)에서 분비가 증가하 는 것은?","options":[{"id":"a","text":"글루카곤"},{"id":"b","text":"점액"},{"id":"c","text":"담즙산염"},{"id":"d","text":"인슐린"}],"answer":"d","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다."},{"id":"ch33-q50","no":50,"type":"mc","text":"일란성 쌍둥이 중 한명에게 제1형 당뇨병이 있으면 다른 쌍둥이는 약 50%의 확률로 제1형 당뇨병에 걸린다. 이를 가장 잘 설명하는 것은?","options":[{"id":"a","text":"유전적 요인이 제1형 당뇨병의 유일한 원인은 아니다."},{"id":"b","text":"제1형 당뇨병의 유전적 요인은 아직 다 밝혀지지 않았다."},{"id":"c","text":"나머지 50%는 제2형 당뇨병에 걸린다."},{"id":"d","text":"제1형 당뇨병 위험 요인이 제2형 당뇨병 위험 요인에 영향을 미친다."}],"answer":"a","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다."}]},{"id":"ch34","name":"34장 · 순환계와 기체교환","source":"11주차(34장) 개념확인 문제.pdf · 원문 50문항 / 17번 소문항 분리","questions":[{"id":"ch34-q1","no":1,"type":"mc","text":"순환계의 역할을 올바르게 설명한 것은?","options":[{"id":"a","text":"폐와 조직 사이의 온도 차이를 상쇄시킨다."},{"id":"b","text":"거리가 멀어짐에 따라 확산 속도가 느려지는 것을 보상한다."},{"id":"c","text":"신경계와 호흡계 사이의 신호전달을 매개한다."},{"id":"d","text":"태아가 최적의 체온을 유지하는데 필요하다."}],"answer":"b","ready":true,"keepLabels":false,"note":"사용자가 검수한 11주차 답안을 반영했습니다.","sourcePage":1},{"id":"ch34-q2","no":2,"type":"mc","text":"다음 중 개방순환계와 폐쇄순환계의 공통점이 아닌 것은?","options":[{"id":"a","text":"어떤 종류의 펌프장치는 혈액을 몸 전체로 이동하는데 도움을 준다."},{"id":"b","text":"순환혈액의 일부는 몸의 운동 결과이다."},{"id":"c","text":"혈액과 간질액은 서로 구분된다."},{"id":"d","text":"모든 조직은 순환하는 혈액과 근접하므로 양분과 노폐물의 교환이 일어난다."},{"id":"e","text":"이 모든 것이 개방순환계와 폐쇄순환계에 적용된다."}],"answer":"c","ready":true,"keepLabels":false,"note":"사용자가 검수한 11주차 답안을 반영했습니다.","sourcePage":1},{"id":"ch34-q3","no":3,"type":"mc","text":"혈액이 심장으로 돌아가지 않고 호흡 기관에서 신체 조직으로 직접 흐르는 동물은?","options":[{"id":"a","text":"양서류"},{"id":"b","text":"새"},{"id":"c","text":"물고기"},{"id":"d","text":"포유류"},{"id":"e","text":"파충류"}],"answer":"c","ready":true,"keepLabels":false,"note":"사용자가 검수한 11주차 답안을 반영했습니다.","sourcePage":1},{"id":"ch34-q4","no":4,"type":"mc","text":"심장의 구조가 2심방 1심실인 동물은?","options":[{"id":"a","text":"어류"},{"id":"b","text":"조류"},{"id":"c","text":"양서류"},{"id":"d","text":"포유류"}],"answer":"c","ready":true,"keepLabels":false,"note":"사용자가 검수한 11주차 답안을 반영했습니다.","sourcePage":1},{"id":"ch34-q5","no":5,"type":"mc","text":"기체교환 표면의 모세혈관과 신체순환의 모세혈관에서 혈압을 독립적으로 조절하기 위해 필요한 것은?","options":[{"id":"a","text":"개방 순환계"},{"id":"b","text":"폐쇄 순환계"},{"id":"c","text":"림프계"},{"id":"d","text":"두 개의 방으로 된 심장"},{"id":"e","text":"4개의 방으로 된 심장"}],"answer":"e","ready":true,"keepLabels":false,"note":"사용자가 검수한 11주차 답안을 반영했습니다.","sourcePage":1},{"id":"ch34-q6","no":6,"type":"mc","text":"다음 중 이중순환계에 대해 맞는 설명은?","options":[{"id":"a","text":"체순환을 할 때 혈액이 두 부분으로 분리된 곳으로 펌핑된다."},{"id":"b","text":"아가미에서 역류교환이 일어난다."},{"id":"c","text":"혈림프가 혈관으로 펌핑되어 몸의 공동(sinus)으로 순환한다."},{"id":"d","text":"혈액이 기체교환하는 곳으로 펌핑되고 돌아오는 혈액은 체혈관으로 펌핑된다."},{"id":"e","text":"심실은 반드시 2개이고 심방은 때로 2개이다."}],"answer":"d","ready":true,"keepLabels":false,"note":"사용자가 검수한 11주차 답안을 반영했습니다.","sourcePage":1},{"id":"ch34-q7","no":7,"type":"mc","text":"자연 선택이 조류와 포유류에서 이중순환의 진화를 선호한 이유는?","options":[{"id":"a","text":"파충류나 양서류보다 몸집이 크기 때문"},{"id":"b","text":"같은 크기의 파충류나 양서류보다 더 많은 에너지를 사용하기 때문"},{"id":"c","text":"파충류와 양서류보다 점성이 높은 혈액을 가지고 있기 때문"},{"id":"d","text":"파충류와 양서류만큼 공기에서 많은 산소를 얻을 수 없기 때문"}],"answer":"b","ready":true,"keepLabels":false,"note":"사용자가 검수한 11주차 답안을 반영했습니다.","sourcePage":1},{"id":"ch34-q8","no":8,"type":"mc","text":"다음 중 순환계의 주요 구성요소가 아닌 것은?","options":[{"id":"a","text":"혈관계"},{"id":"b","text":"순환액"},{"id":"c","text":"폐 또는 아가미"},{"id":"d","text":"중앙펌프"}],"answer":"c","ready":true,"keepLabels":false,"note":"사용자가 검수한 11주차 답안을 반영했습니다.","sourcePage":1},{"id":"ch34-q9","no":9,"type":"mc","text":"다음 중 사람의 순환계를 통해 혈액이 흐르는 순서를 옳게 나타낸 것은?","options":[{"id":"a","text":"좌심실 → 폐정맥 → 폐모세혈관 → 폐동맥 → 우심방"},{"id":"b","text":"좌심실 → 폐동맥 → 폐정맥 → 폐모세혈관 → 우심방"},{"id":"c","text":"우심실 → 폐정맥 → 폐모세혈관 → 폐동맥 → 우심방"},{"id":"d","text":"우심실 → 폐동맥 → 폐모세혈관 → 폐정맥 → 좌심방"},{"id":"e","text":"우심방 → 우심실 → 좌심방 → 폐모세혈관 → 우심실"}],"answer":"d","ready":true,"keepLabels":false,"note":"사용자가 검수한 11주차 답안을 반영했습니다.","sourcePage":2},{"id":"ch34-q10","no":10,"type":"mc","text":"다음 중 뇌에서 팔까지 혈액이 순환할 때 통과하지 않는 곳은?","options":[{"id":"a","text":"좌심방"},{"id":"b","text":"대동맥"},{"id":"c","text":"상대정맥"},{"id":"d","text":"폐정맥"},{"id":"e","text":"하대정맥"}],"answer":"e","ready":true,"keepLabels":false,"note":"사용자가 검수한 11주차 답안을 반영했습니다.","sourcePage":2},{"id":"ch34-q11","no":11,"type":"mc","text":"조직에서 혈액으로 방출된 이산화탄소가 폐를 통해 공기 중으로 나가는 경우, 통과하지 않는 곳은?","options":[{"id":"a","text":"폐동맥"},{"id":"b","text":"폐정맥"},{"id":"c","text":"우심방"},{"id":"d","text":"우심실"}],"answer":"b","ready":true,"keepLabels":false,"note":"사용자가 검수한 11주차 답안을 반영했습니다.","sourcePage":2},{"id":"ch34-q12","no":12,"type":"mc","text":"심장의 수축으로 나타나는 동맥의 율동적인 신장을 ______ (이)라 한다.","options":[{"id":"a","text":"고혈압"},{"id":"b","text":"심장잡음"},{"id":"c","text":"혈우병"},{"id":"d","text":"맥박"},{"id":"e","text":"이완기"}],"answer":"d","ready":true,"keepLabels":false,"note":"사용자가 검수한 11주차 답안을 반영했습니다.","sourcePage":2},{"id":"ch34-q13","no":13,"type":"mc","text":"다음 중 심박수를 증가시키는 것은?","options":[{"id":"a","text":"콜레스테롤의 증가"},{" <script>const raw = [
["각각의 세포는 반드시 ______ 과정을 거쳐서 구조와 기능에 고유의 특성을 갖는다.",[],"세포분화"],
["초기 발생과정에 영향을 주는 난자의 모계기원 물질들은?",["세포질 결정인자","조직 특이적 단백질","형태형성물질"],"a"],
["세포질 결정인자란?",["수정되지 않은 난자 안에 불균등하게 분포되어 있는 세포질 물질들","종종 전사 조절에 관여한다.","보통 수정 후 초기 몇 번의 분열이 일어나는 동안 분리된다.","발달의 초기 단계의 방향성 결정에 도움을 주는, 모계기원의 조절인자","모두 정답"],"a"],
["근육세포가 신경세포와 다르게 분화하는 이유는?",["서로 다른 유전자를 발현하기 때문","서로 다른 유전자를 포함하기 때문","서로 다른 유전암호를 사용하기 때문","서로 다른 히스톤을 가지고 있기 때문","서로 다른 리보솜을 가지고 있기 때문"],"a"],
["예정세포사(apoptosis)란?",["DNA 손상에 의한 반응으로 p53 단백질에 의해 시작되는 세포의 자살 프로그램","전이 등으로 암세포가 몸 전체로 퍼져나가는 현상","정상 세포를 암세포로 변형시키는 과정","G 단백질이 과활성화된 상태로 되는 돌연변이","점 돌연변이로 원발암유전자가 발암유전자로 변형되는 것"],"a"],
["예정세포사(apoptosis) 과정에 포함되지 않는 것은?",["DNA 분해","세포소기관 해체","세포의 용해","식세포에 의한 세포 내용물의 소화"],"c"],
["척추동물에서 예정세포사(apoptosis)는 손과 발의 ______ 과정에 중요하다.",["결정","분화","유도","형태형성"],"d"],
["동물의 패턴형성은 어떻게 일어나는가?",["형태형성물질의 밀도 기울기에 의해 세포가 받는 위치 정보에 따라","모체의 난자 주변의 영양세포(nurse cell)에 의한 유도신호에 의해","핵에서 염색질의 응축으로","세포가 분화한 후 함께 이동해서 조직 또는 기관을 형성함으로써","초기 몇 번의 유사분열에 의해"],"a"],
["호미오(homeo) 유전자란?",["암에서 발생하는 세포의 변화에 관련된다.","다른 유전자들을 조절함으로써 발생을 조화시킨다.","특정한 세포들에서만 발견된다.","바이러스에 의하여 세포에서 세포로 전달된 유전자를 말한다.","DNA를 복구하고 돌연변이를 방지한다."],"b"],
["호미오 유전자에서 발견되는 호미오박스(homeobox)의 특징은?",["유방암에서 흔히 발견되는 원발암유전자의 일종이다.","세포분열 속도를 증가시켜 암을 촉진한다.","오로지 포유류와 조류에서만 나타나는 특징적인 유전자다.","진화적으로 근연관계가 가까운 동물에서만 발견된다.","다양한 생물체에서 발견되지만 매우 유사해서 진화의 공통 유산으로 생각되고 있다."],"e"],
["사람의 호미오 유전자들이 발견되었지만, 아직 이들이 어떻게 사람의 형태를 형성하는지는 알려지지 않았다. 다른 동물에서의 호미오 유전자들의 기능을 고려할 때, 다음 중 사람의 호미오 유전자의 기능으로 가장 타당하게 생각되는 것은?",["피부와 머리색의 결정","세포 대사율의 조절","머리와 꼬리, 등과 앞의 결정","개체의 성 결정","세포분열의 정도와 시기의 결정"],"c"],
["다음 중 초파리 배아의 앞-뒤 축을 따라 기본 세분화를 나타내는 유전자는?",["호미오 유전자","체절 형성 유전자","난자-극성 유전자","형태형성물질(morphogen)"],"b"],
["어떤 초파리 암컷은 두 개의 모계영향 유전자에 모두 돌연변이를 가지고 있다. 이 돌연변이에 의해 발생할 수 있는 결과는?",["이 암컷은 초기 배아 단계에서 발생을 멈춘다.","이 암컷의 자손 중 동형접합인 경우에만 돌연변이 표현형을 보인다.","이 암컷의 모든 자손은 유전자형에 상관없이 돌연변이 표현형을 보인다.","이 암컷의 수컷 자손만 돌연변이 표현형을 보인다."],"c"],
["Bicoid 단백질은 배아의 앞쪽에 고농도로 뒤쪽으로 갈수록 줄어드는 농도 기울기를 형성한다. bicoid mRNA를 배아의 뒤쪽 말단에 주입하면 어떤 일이 일어나겠는가?",["배아가 비정상적으로 큰 크기로 자란다.","배아의 날개와 다리가 추가로 자란다.","배아는 머리쪽이 발달하지 않고 죽는다.","배아의 양쪽에 머리 부위를 형성한다."],"d"],
["초파리 알에서 bicoid mRNA가 없으면 머리가 없고 양쪽에 모두 꼬리를 가진 유생이 된다. 이로부터 bicoid 유전자의 기능이 무엇이라고 유추할 수 있는가?",["머리 구조 형성에 관여한다.","꼬리 구조 형성에 관여한다.","난자의 극성을 결정한다.","배아의 등-배 축을 결정한다."],"a"],
["가상적인 배아에서 P 유전자를 활성화시키는데 모르포라 불리는 형태형성 물질이 고농도로 필요하고 Q 유전자는 중간 또는 그 이상의 농도, R 유전자는 모르포가 존재하기만 해도 활성화된다고 가정하자. 또 다른 종류의 형태형성 물질인 포겐은 중간 농도 이상 고농도가 존재하면 S 유전자는 활성화시키고 Q 유전자는 불활성화시킨다고 하자. 이때 모르포와 포겐이 배아의 각각 반대 편 끝에서 생성되어 확산된다고 하면 이 배아의 2번 지역에서는 어떤 유전자가 발현되겠는가? (농도는 생성된 곳에서 가장 높고 중간 지역에서 중간 농도를 보이고 반대편에서 낮은 농도를 갖는다고 가정하자.)",["유전자 P,Q,R,S","유전자 P,Q,R","유전자 Q,R","유전자 R,S","유전자 R"],"d"],
["(O/X 문제) 한 개 식물세포로부터 유전적으로 동일한 수백 또는 수천의 복제물을 만들어 낼 수 있다.",["O","X"],"O"],
["개구리 난자의 핵을 파괴하고 올챙이 장 세포의 핵으로 치환하면 난자는 정상인 올챙이로 발생한다. 이 과정이 알려주는 것은?",["장의 세포는 완전히 분화되었다.","난자와 장세포 사이에는 차이가 거의 없다.","장의 세포는 완전한 유전자 세트를 갖추고 있다.","장세포는 분화하지 않았다.","개구리는 잃어버린 신체부위를 재생할 수 있다."],"c"],
["(O/X 문제) 세계 최초의 포유류 복제동물인 돌리는 유전적으로 난자 공여자와 같은 유전적 성향을 가지고 있다.",["O","X"],"X"],
["다음 중 동물 복제에 사용되는 과정은?",["성체 암컷 세포에서 미토콘드리아 DNA 사용","골수에서 성체 줄기 세포의 복제 및 분화","초기 배반포에서 분리한 세포를 대리모에 착상","체세포 핵으로 치환된 난자를 대리모에 착상"],"d"],
["핵이식과정에서 공여세포의 핵이 이식되는 곳은?",["핵이 제거된 난자","정상적인 난자에 이식하여 두 개의 핵이 융합되도록 한다.","다른 성체세포의 핵","핵이 제거된 다른 성체세포","난자와 수정될 때 사용되는 정자"],"a"],
["복제 동물은 종종 일찍 사망한다. 이에 대한 가장 적절한 설명은?",["전능성(totipotent) 줄기세포 대신 다능성(pluripotent) 줄기세포를 사용했기 때문","DNA 메틸화가 완전히 초기화되지 않았기 때문","전능성 줄기세포의 무한 복제 때문","골수 기능 장애로 인한 비정상적인 면역 기능 때문"],"b"],
["다음 중 배아줄기세포에 대한 설명으로 옳지 않은 것은?",["실험실에서 배양하면 배아줄기세포는 무한 증식한다.","성체줄기세포는 배아줄기세포보다 배양해서 키우기 힘들다.","제대로 된 조건만 사용한다면 배아줄기세포가 특정 세포로 분화할 수 있도록 유전자 발현을 변화시킬 수 있다.","미래에는 환자의 핵으로부터 배아를 만들어낼 수 있고 그럼으로써 배아줄기세포를 모아서 조직이나 기관으로 분화시켜서 사용할 수 있게 될 것이다.","배아줄기세포는 분화되는 도중에 있는 세포들이어서 보통 몇몇 특정 세포로만 분화될 뿐이다."],"e"],
["(O/X 문제) 치료용 복제의 목적은 배아줄기세포를 생성하기 위함이다.",["O","X"],""],
["생식적 복제와 치료용 복제의 차이점은?",["치료용 복제는 성체줄기세포를 사용한다.","치료용 복제는 생식적 복제와 초기 과정이 다르다.","치료용 복제는 대리모를 사용하지 않는다.","치료용 복제는 유도 다능성 줄기세포를 이용한다.","치료용 복제는 체세포 핵 치환기술을 사용하지 않는다."],"c"],
["다음 중 원발암유전자(proto-oncogene)의 돌연변이가 가져올 수 있는 결과는?",["종양 성장의 억제","세포주기 억제","세포 성장과 분열의 비정상적인 자극","종양 크기 감소"],"c"],
["많은 수의 원발암유전자는 세포분열을 촉진하는 단백질인 ______ 를(을) 암호화한다.",[],"성장인자"],
["정상 유전자가 발암유전자로 전환될 수 있는 경우는?",["유전자 증폭으로 많은 복사체가 존재할 때","정상적인 조절 부위로부터 제거되어 이동될 때","더 많은 활성을 갖거나 저항성을 가진 단백질로 돌연변이가 일어날 때","발현을 증가시킬 수 있는 조절 부위에 돌연변이가 일어날 때","모두 정답"],"e"],
["원발암유전자는 암을 유발하는 발암유전자로 변할 수 있다. 진핵세포에 이러한 잠재적 시한폭탄이 존재하는 이유를 가장 잘 설명하는 것은?",["원발암유전자는 바이러스 감염에 의해 처음 발생했다.","원발암유전자는 정상 유전자의 돌연변이 형태이다.","원발암유전자는 진화과정에서 아직 퇴화되지 않은 유전자이다.","원발암유전자는 일반적으로 세포분열을 조절하는 데 도움이 된다."],"d"],
["다음 중 일반적으로 암을 촉진하는 것이 아닌 것은?",["세균이 전달하는 종양억제유전자","성장인자를 암호화하는 원발암유전자의 돌연변이","세포 성장을 저해하는 종양억제유전자의 불활성화","ras 단백질을 비정상적으로 활성화시키는 돌연변이"],"a"],
["다음 중 암을 발생시킬 가능성이 가장 높은 것은?",["원발암유전자의 수 증가와 종양억제유전자의 불활성화","원발암유전자의 고활성과 종양억제유전자의 활성화","원발암유전자의 불활성화와 종양억제유전자의 수 증가","원발암유전자와 종양억제유전자의 불활성화","원발암유전자와 종양억제유전자의 고활성"],"a"],
["다음 중 종양 억제유전자를 올바르게 설명하는 것은?",["암세포에서 자주 과발현된다.","바이러스에 의해 세포에 도입된 암 유발 유전자이다.","DNA 복구에 관여하는 유전자들이 포함된다.","주로 세포주기를 촉진하는 단백질을 암호화한다."],"c"],
["다음 중 종양억제유전자가 암을 유발할 수 있는 경우는?",["양쪽 대립유전자의 돌연변이가 발생해 유전자의 산물인 단백질의 활성을 저하시킬 때","양쪽 대립유전자 중 오로지 한쪽 유전자에만 돌연변이가 발생해 유전자의 산물인 단백질을 변화시킬 때","부모로부터 돌연변이가 발생한 채로 유전됨으로써","원발암유전자가 발암유전자가 됨으로써","a와 d 모두 정답"],"a"],
["다음 중 p53 유전자의 특징이 아닌 것은?",["DNA 손상 시 여러 다른 유전자를 발현시킨다.","세포주기를 촉진한다.","DNA 손상을 복구할 수 없는 경우, 예정세포사(apoptosis)를 일으킨다.","정상세포에서 발현된다."],"b"],
["암에서 발견되는 p53 유전자의 돌연변이는 일반적으로 어떤 결과를 가져오는가?",["DNA 복구 활성화","예정세포사 활성화","p53 유전자의 사본 수 증가","과도한 세포 성장"],"d"],
["암으로 발전하는 데는 많은 시간이 걸리는 이유는?",["발암유전자는 드물기 때문에","주로 늙은 세포가 암으로 전환되므로","몇몇 특정 돌연변이가 반드시 일어나야 하므로","암세포는 매우 천천히 자라므로"],"c"],
["APC 유전자의 돌연변이와 가장 연관성이 높은 암의 유형은?",["대장암","유방암","위암","폐암"],"a"],
["BRCA1과 BRCA2 유전자를 올바르게 설명하는 것은?",["돌연변이에 의해 발암유전자(oncogene)가 된다.","정상 유전자는 DNA 손상을 복구하는데 관여한다.","돌연변이를 가진 사람은 대장암 발생률이 증가한다.","대부분 암에서 이 유전자의 돌연변이가 발견된다."],"b"],
["다음 중 암 발생 위험 요소가 아닌 것은?",["지방이 많이 함유된 식사","단백질이 많이 함유된 식사","흡연","자외선 노출","음주","X-선"],"b"],
["자외선이나 흡연과 같이 암을 유발하는 물질들을 ______ (이)라 한다.",[],"발앙원"]
];

:12,"type":"short","text":"활발한 신체 기능을 수행하기 위해 함께 작용하는 한 단위의 기관을 ______ (이)라고 정의한다.","options":[],"answer":"기관계","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다.","sourcePage":2},{"id":"ch32-q13","no":13,"type":"mc","text":"신체 기능을 조절하기 위해 혈관으로 화학 신호를 방출하는 것은?","options":[{"id":"a","text":"호흡계"},{"id":"b","text":"내분비계"},{"id":"c","text":"피부계"},{"id":"d","text":"신경계"},{"id":"e","text":"소화계"}],"answer":"b","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다.","sourcePage":2},{"id":"ch32-q14","no":14,"type":"mc","text":"모든 호르몬은","options":[{"id":"a","text":"내분비샘에서 생성된다."},{"id":"b","text":"지용성이다."},{"id":"c","text":"혈액의 표적 세포로 운반된다."},{"id":"d","text":"단백질 분자이다."},{"id":"e","text":"모든 표적 세포에서 동일한 생물학적 반응을 유도한다."}],"answer":"c","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다.","sourcePage":2},{"id":"ch32-q15","no":15,"type":"mc","text":"다음 중 내분비샘과 외분비샘이 모두 있는 기관은?","options":[{"id":"a","text":"뇌하수체"},{"id":"b","text":"갑상샘"},{"id":"c","text":"침샘"},{"id":"d","text":"부신"},{"id":"e","text":"췌장(이자)"}],"answer":"e","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다.","sourcePage":2},{"id":"ch32-q16","no":16,"type":"mc","text":"포유류의 분만과 출산 과정에서 자궁 근육의 수축은 옥시토신의 작용에 의해 강화된다. 이것은 다음 중 어떤 예에 해당하는가?","options":[{"id":"a","text":"양성되먹임(피드백) 작용"},{"id":"b","text":"음성되먹임(피드백) 작용"},{"id":"c","text":"뇌하수체 전엽의 자궁 수축 조절"},{"id":"d","text":"표적 세포에서 유전자 발현을 변화시키는 신호 전달"}],"answer":"a","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다.","sourcePage":2},{"id":"ch32-q17","no":17,"type":"mc","text":"혈액 내 칼슘농도를 높이는 호르몬은?","options":[{"id":"a","text":"칼시토닌"},{"id":"b","text":"멜라토닌"},{"id":"c","text":"갑상샘 호르몬"},{"id":"d","text":"부갑상샘 호르몬"}],"answer":"d","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다.","sourcePage":2},{"id":"ch32-q18","no":18,"type":"mc","text":"옥시토신과 항이뇨호르몬(ADH)을 합성하는 곳은?","options":[{"id":"a","text":"시상하부"},{"id":"b","text":"부신 속질"},{"id":"c","text":"부신 겉질"},{"id":"d","text":"뇌하수체 전엽"},{"id":"e","text":"뇌하수체 후엽"}],"answer":"a","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다.","sourcePage":2},{"id":"ch32-q19","no":19,"type":"mc","text":"멜라토닌을 생성하는 내분비샘은?","options":[{"id":"a","text":"시상하부"},{"id":"b","text":"송과샘"},{"id":"c","text":"부신 수질"},{"id":"d","text":"뇌하수체 후엽"},{"id":"e","text":"갑상샘"}],"answer":"b","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다.","sourcePage":2},{"id":"ch32-q20","no":20,"type":"mc","text":"비정상적으로 감소된 신체 성장(왜소증)은 다음 중 어느 기관에서 호르몬 분비가 감소한 결과이겠는가?","options":[{"id":"a","text":"신장"},{"id":"b","text":"췌장(이자)"},{"id":"c","text":"부신"},{"id":"d","text":"뇌하수체 후엽"},{"id":"e","text":"뇌하수체 전엽"}],"answer":"e","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다.","sourcePage":2},{"id":"ch32-q21","no":21,"type":"mc","text":"시상하부에 대한 설명으로 틀린 것은?","options":[{"id":"a","text":"내분비 신호의 표적으로도 작용한다."},{"id":"b","text":"뇌하수체 후엽을 자극하여 호르몬 합성을 촉진시킨다."},{"id":"c","text":"세포에 호르몬 수용체를 가지고 있다."},{"id":"d","text":"대부분의 신경내분비 신호를 조절한다."}],"answer":"b","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다.","sourcePage":2},{"id":"ch32-q22","no":22,"type":"mc","text":"항상성이란?","options":[{"id":"a","text":"주위환경과의 물질교환"},{"id":"b","text":"모든 척추동물이 비슷한 방식으로 구성되었다는 생각"},{"id":"c","text":"구조와 기능의 상호작용"},{"id":"d","text":"비교적 일정한 내적환경을 유지하는 것"},{"id":"e","text":"신체의 일부가 조직, 기관, 기관계를 구성하기 위한 협동작용"}],"answer":"d","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다.","sourcePage":3},{"id":"ch32-q23","no":23,"type":"mc","text":"항상성의 예가 아닌 것은?","options":[{"id":"a","text":"민물고기가 많은 양의 희석된 오줌을 배출한다."},{"id":"b","text":"혈당이 낮으면 글루카곤이 분비되어 혈당을 높인다."},{"id":"c","text":"혈액의 삼투농도가 높으면 항이뇨호르몬 분비가 증가한다."},{"id":"d","text":"아기가 젖을 빨면 옥시토신이 분비되어 젖 분비를 자극한다."}],"answer":"d","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다.","sourcePage":3},{"id":"ch32-q24","no":24,"type":"mc","text":"온도를 감지하여 난방기의 스위치를 켜거나 끄는 가정용 보일러의 일부 음성 피드백 기작을 무엇이라고 하나?","options":[{"id" "아가미를 통해 염류를 흡수"},{"id":"c","text":"다량의 해수를 마시고 아가미에서 염류를 배출"},{"id":"d","text":"다량의 묽은 오줌을 배설"}],"answer":"c","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다.","sourcePage":5},{"id":"ch32-q38","no":38,"type":"mc","text":"실수로 바닷물에 넣어 죽은 담수 어류(민물고기)를 부검하였다. 그 결과 를 바르게 설명한 것은?","options":[{"id":"a","text":"삼투압에 의한 수분 손실로 세포 사멸과 장기 부전이 발생했다."},{"id":"b","text":"다량의 소금이 세포로 확산되어 세포가 부풀어 오르고 용해되었다."},{"id":"c","text":"고삼투압 환경에서 과도한 수분 제거로 신장이 손상되었다."},{"id":"d","text":"아가미가 소금으로 뒤덮여 가스 교환이 충분하지 않아 질식사했다."}],"answer":"a","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다.","sourcePage":5},{"id":"ch32-q39","no":39,"type":"mc","text":"질소 노폐물로 요산를 배설하면 어떤 이점이 있는가?","options":[{"id":"a","text":"요산은 물에 쉽게 용해된다."},{"id":"b","text":"합성하는데 에너지가 적게 소모된다."},{"id":"c","text":"물의 손실을 최대한 줄일 수 있다."},{"id":"d","text":"몸에서 더 많은 질소가 제거된다."}],"answer":"c","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다.","sourcePage":5},{"id":"ch32-q40","no":40,"type":"mc","text":"작고 고인 담수 웅덩이에서 자주 발견되는 아프리카 폐어는 질소노폐물 로 요소를 생성한다. 이러한 적응을 가장 잘 설명한 것은?","options":[{"id":"a","text":"요소는 암모니아보다 합성하는 데 에너지가 적게 든다."},{"id":"b","text":"작은 웅덩이는 독성 암모니아를 희석하기에 물이 충분하지 않다."},{"id":"c","text":"요소는 불용성 침전물을 형성한다."},{"id":"d","text":"요소는 폐어의 조직을 저장액으로 만든다."}],"answer":"b","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다.","sourcePage":5},{"id":"ch32-q41","no":41,"type":"mc","text":"동물에서 질소 노폐물은 다음 중 어떤 물질이 분해될 때 생성되는가?","options":[{"id":"a","text":"녹말과 셀룰로스"},{"id":"b","text":"트리아실글리세롤과 스테로이드"},{"id":"c","text":"단백질과 핵산"},{"id":"d","text":"인지질과 당지질"},{"id":"e","text":"지방산과 글리세롤"}],"answer":"c","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다.","sourcePage":5},{"id":"ch32-q42","no":42,"type":"short","text":"각 항목의 특징에 대한 설명을 <보기>에서 고르시오.\n     <보기>\n     A. 오줌이 신장을 떠나 이곳으로 간다.              C. 신장의 기능적 단위\n     B. 오줌이 여기에 저장된다.                    D. 오줌이 방광을 떠나 이곳으로 간다.\n\n\n     (1) 네프론 (____)   (2) 수뇨관 (____)     (3) 방광 (____)    (4) 요도 (____)","options":[],"answer":"C, A, B, D","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다. 여러 답은 쉼표와 공백으로 구분하여 입력하세요.","sourcePage":5},{"id":"ch32-q43","no":43,"type":"mc","text":"배설계는 체액의 ______ 양을 조절하는 동안 항상성, ______ 을 형성하여 배출하는데 중심 역할을 한다.","options":[{"id":"a","text":"오줌, 수분과 염"},{"id":"b","text":"혈액, 당"},{"id":"c","text":"분변, 혈액"},{"id":"d","text":"오줌, 당"},{"id":"e","text":"땀, 물과 당"}],"answer":"a","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다. 사용자가 지정한 정답을 채점 기준으로 적용했습니다.","sourcePage":5},{"id":"ch32-q44","no":44,"type":"mc","text":"다음 중 신장에서 일어나는 배설계의 기능을 순서대로 나열한 것은?","options":[{"id":"a","text":"재흡수, 여과, 분비, 배설"},{"id":"b","text":"분비, 배설 재흡수, 여과"},{"id":"c","text":"분비, 여과, 배설, 재흡수"},{"id":"d","text":"여과, 재흡수, 분비 배설"},{"id":"e","text":"여과, 재흡수, 배설 분비"}],"answer":"d","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다.","sourcePage":6},{"id":"ch32-q45","no":45,"type":"mc","text":"신장이 모든 신체 기관 중 대사율이 가장 높은 주된 이유는?","options":[{"id":"a","text":"신체의 과도한 지방을 저장하기 때문"},{"id":"b","text":"물에 대한 다양한 투과성의 막을 가지고 있기 때문"},{"id":"c","text":"광범위한 능동 수송 이온 펌프들이 작동하기 때문"},{"id":"d","text":"과도한 영양분을 배출하기 때문"}],"answer":"c","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다.","sourcePage":6},{"id":"ch32-q46","no":46,"type":"mc","text":"근위세뇨관과 원위세뇨관에서의 여과액 처리는","options":[{"id":"a","text":"혈장 단백질을 크기에 따라 분류한다."},{"id":"b","text":"암모니아를 독성이 적은 요소로 전환한다."},{"id":"c","text":"체액에서 pH의 항상성을 유지한다."},{"id":"d","text":"삼투압 균형을 위해 요소를 재흡수한다."}],"answer":"c","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다.","sourcePage":6},{"id":"ch32-q47","no":47,"type":"mc","text":"사람 체액의 정상적인 삼투압은 얼마인가?","options":[{"id":"a","text":"100 mOsm/L"},{"id":"b","text":"200 mOsm/L"},{"id":"c","text":"300 mOsm/L"},{"id":"d","text":"500 mOsm/L"}],"answer":"c","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다.","sourcePage":6},{"id":"ch32-q48","no":48,"type":"mc","text":"다음 중 항이뇨호르몬(ADH) 분비가 증가하는 경우는?","options":[{"id":"a","text":"순수한 물을 많이 마신 경우"},{"id":"b","text":"짠 음식을 많이 먹은 경우"},{"id":"c","text":"심한 설사로 염류와 물이 모두 손실된 경우"},{"id":"d","text":"알코올성 음료를 마신 경우"},{"id":"e","text":"혈압이 비정상적으로 높아진 경우"}],"answer":"b","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다. 사용자가 지정한 정답을 채점 기준으로 적용했습니다.","sourcePage":6},{"id":"ch32-q49","no":49,"type":"mc","text":"항이뇨호르몬(ADH)은 어떻게 작용하는가?","options":[{"id":"a","text":"수송 단백질을 통해 포도당의 재흡수를 자극한다."},{"id":"b","text":"세포막이 물을 더 잘 투과하도록 만드는 효소의 합성을 촉진한다."},{"id":"c","text":"막에 불포화 지방산을 함유한 인지질이 더 많이 포함되도록 한다."},{"id":"d","text":"집합관 상피세포의 아쿠아포린 수를 일시적으로 증가시킨다."},{"id":"e","text":"여과액이 네프론을 통과하는 속도를 감소시켜 물의 재흡수를 증가시킨다."}],"answer":"d","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다.","sourcePage":6},{"id":"ch32-q50","no":50,"type":"mc","text":"엑스터시로 알려진 불법 약물인 MDMA를 복용하면 체온 상승으로 물을 많이 마시게 된다. 또한 MDMA는 항이뇨호르몬(ADH) 생성을 증가시킨 다. 이럴 경우 어떤 증상이 발생하겠는가?","options":[{"id":"a","text":"혈압이 상승하고 묽은 오줌이 생성된다."},{"id":"b","text":"혈압이 상승하고 농축된 오줌이 생성된다."},{"id":"c","text":"혈압이 감소하고 묽은 오줌이 생성된다."},{"id":"d","text":"혈압 감소하고 농축된 오줌이 생성된다."}],"answer":"b","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다.","sourcePage":6}]},{"id":"ch33","name":"33장 · 동물의 영양","source":"10주차(33장) 개념확인 문제(1).pdf","questions":[{"id":"ch33-q1","no":1,"type":"mc","text":"신체에 저장된 물질 중 가장 에너지가 풍부한 것은?","options":[{"id":"a","text":"지방조직의 지방"},{"id":"b","text":"혈액 내 포도당"},{"id":"c","text":"근육세포의 단백질"},{"id":"d","text":"간의 글리코겐"}],"answer":"a","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다."},{"id":"ch33-q2","no":2,"type":"mc","text":"일부 동물이 필수영양소를 요구하는 이유는?","options":[{"id":"a","text":"그 동물들만이 그 영양소를 사용하기 때문"},{"id":"b","text":"중요한 고분자를 합성하는데 필요한 단위체이기 때문"},{"id":"c","text":"해당 영양소를 합성할 수 없기 때문"},{"id":"d","text":"영양소가 필수 조효소이기 때문"},{"id":"e","text":"특정 음식에만 포함되어 있기 때문"}],"answer":"c","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다."},{"id":"ch33-q3","no":3,"type":"mc","text":"어떤 아미노산은 필수아미노산이 아니다. 그 이유는 무엇인가?","options":[{"id":"a","text":"동물의 체내에서 합성할 수 있기 때문"},{"id":"b","text":"동물이 생합성에 사용하지 않는 아미노산이기 때문"},{"id":"c","text":"필요한 양이 극히 적기 때문"},{"id":"d","text":"소화관에서 쉽게 흡수되지 않기 때문"}],"answer":"a","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다."},{"id":"ch33-q4","no":4,"type":"short","text":"대부분 비타민은 물질대사를 하는 ______ 의 보조기능을 한다.","options":[],"answer":"효소","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다."},{"id":"ch33-q5","no":5,"type":"mc","text":"다음 중 지용성 비타민으로만 묶은 것은?","options":[{"id":"a","text":"비타민 A, C, E"},{"id":"b","text":"비타민 A, D, K"},{"id":"c","text":"비타민 B, D, E"},{"id":"d","text":"비타민 B, E, K"},{"id":"e","text":"비타민 C, D, K"}],"answer":"b","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다."},{"id":"ch33-q6","no":6,"type":"mc","text":"다음에서 필수 영양소가 아닌 것은?","options":[{"id":"a","text":"철분"},{"id":"b","text":"포도당, 단당류"},{"id":"c","text":"메티오닌(아미노산)"},{"id":"d","text":"Na⁺"},{"id":"e","text":"판토텐산(pantothenic acid, 비타민)"}],"answer":"b","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다."},{"id":"ch33-q7","no":7,"type":"mc","text":"왜 채식주의자는 식품에 다양한 단백질원을 조합하거나 계란이나 우유 같은 일부 동물 식품을 섭취해야 하는가?","options":[{"id":"a","text":"충분한 칼로리 섭취를 유지하기 위해서"},{"id":"b","text":"충분한 비타민 섭취를 위해서"},{"id":"c","text":"모든 필수 지방산 섭취를 유지하기 위해서"},{"id":"d","text":"음식물에 대한 흥미를 돋우기 위해서"},{"id":"e","text":"모든 필수 아미노산을 공급하기 위해서"}],"answer":"e","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다."},{"id":"ch33-q8","no":8,"type":"mc","text":"다음 중 비타민에 대한 설명으로 옳은 것은?","options":[{"id":"a","text":"장내세균이 만들 수 있다."},{"id":"b","text":"한 종에서 다른 종 간의 비타민 요구가 같다."},{"id":"c","text":"간에 많은 양이 저장되어 있다."},{"id":"d","text":"보조인자로 작용하는 적은 양이 필요한 무기 영양소이다."},{"id":"e","text":"매일 대체되어야 하는 수용성 물질이다."}],"answer":"d","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다. 사용자가 지정한 정답을 채점 기준으로 적용했습니다."},{"id":"ch33-q9","no":9,"type":"mc","text":"표는 종합비타민 보충제의 함량과 일일 권장량(% DV)이다.\n\n보충제 / % DV\n비타민 A 70 / 비타민 C 100 / 비타민 D 100 / 비타민 E 150 / 비타민 K 13 / 비타민 B1 100\n비타민 B2 100 / 엽산 100 / 비타민 B12 417 / 칼슘 20 / 인 5 / 요오드 100\n마그네슘 25 / 아연 100 / 구리 100 / 크로뮴 125 / 몰리브덴 100 / 철 0\n\n이 보충제에 함유된 일부 비타민과 미네랄의 함량이 100% 미만인 이유를 가장 잘 설명하는것은?","options":[{"id":"a","text":"더 첨가하는 것이 화학적으로 불가능하기 때문이다."},{"id":"b","text":"이러한 비타민과 미네랄은 너무 커서 100%에 도달하지 못한다."},{"id":"c","text":"비타민 A와 K와 같은 지용성 비타민을 과다 복용하는 것은 위험하며, 일부 미네랄은 음식에서 충분히 많이 존재한다."},{"id":"d","text":"이러한 보충제는 건강한 식품을 섭취하지 못한 사람들을 위한 것이다."}],"answer":"c","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다."},{"id":"ch33-q10","no":10,"type":"short","text":"각 용어에 가장 적합한 정의를 <보기>에서 고르시오.\n     <보기>\n     A. 식(食) (= 먹음, eating)\n     B. 음식물을 상대적으로 작은 영양물질로 분해\n     C. 체세포에 의한 작은 영양물질의 섭취\n     D. 음식물의 소화되지 않은 물질 폐기\n\n\n     (1) 제거(elimination) (____)            (3) 섭취(ingestion)    (____)\n     (2) 흡수(absorption) (____)            (4) 소화(digestion)    (____)","options":[],"answer":"D, C, A, B","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다. 소문항 (1)~(4)의 기호를 쉼표와 공백으로 구분해 입력하세요."},{"id":"ch33-q11","no":11,"type":"mc","text":"다음에서 음식물 처리의 네 단계를 순서대로 나열한 것은?","options":[{"id":"a","text":"섭취 → 소화 → 흡수 → 배설"},{"id":"b","text":"소화 → 섭취 → 흡수 → 배설"},{"id":"c","text":"섭취 → 흡수 → 배설 → 소화"},{"id":"d","text":"섭취 → 소화 → 배설 → 흡수"},{"id":"e","text":"흡수 → 소화 → 섭취 → 배설"}],"answer":"a","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다."},{"id":"ch33-q12","no":12,"type":"ox","text":"(O/X 문제) 기계적 소화는 효소에 의한 음식물의 화학적 분해이다.","options":[{"id":"O","text":"O"},{"id":"X","text":"X"}],"answer":"X","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다."},{"id":"ch33-q13","no":13,"type":"mc","text":"탄수화물의 소화와 단백질의 소화는 모두","options":[{"id":"a","text":"동일한 효소에 의해 촉매된다."},{"id":"b","text":"가수분해 반응이다."},{"id":"c","text":"pH를 낮추기 위해 염산이 필요하다."},{"id":"d","text":"에너지원으로 ATP가 필요하다."}],"answer":"b","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다."},{"id":"ch33-q14","no":14,"type":"mc","text":"위수강에 비해 완전 소화관의 장점은 무엇인가?","options":[{"id":"a","text":"세포 외 소화가 필요 없다."},{"id":"b","text":"특수 기능을 가진 특성화된 부분으로 나뉜다."},{"id":"c","text":"더 다양한 소화 효소를 분비할 수 있다."},{"id":"d","text":"광범위한 분기(branching)가 가능하다."},{"id":"e","text":"세포 내 소화를 촉진한다."}],"answer":"b","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다."},{"id":"ch33-q15","no":15,"type":"mc","text":"음식물이 새의 소화관을 통과하는 순서를 바르게 나열한 것은?","options":[{"id":"a","text":"입 → 식도 → 소낭 → 위 → 모래주머니 → 장 → 항문"},{"id":"b","text":"입 → 식도 → 모래주머니 → 소낭 → 위 → 장 → 항문"},{"id":"c","text":"입 → 식도 → 위 → 소낭 → 모래주머니 → 장 → 항문"},{"id":"d","text":"입 → 식도 → 소낭 → 모래주머니 → 위 → 장 → 항문"}],"answer":"a","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다."},{"id":"ch33-q16","no":16,"type":"mc","text":"무엇이 음식물 덩어리를 식도에서 위로 이동시키는가?","options":[{"id":"a","text":"중력"},{"id":"b","text":"구강에 비해 복강의 낮은 압력"},{"id":"c","text":"횡격막의 수축과 위의 괄약근이 열림"},{"id":"d","text":"평활근의 수축과 이완에 의한 연동운동"},{"id":"e","text":"섬모운동"}],"answer":"d","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다."},{"id":"ch33-q17","no":17,"type":"short","text":"침의 ______ 는(은) 입에서 녹말을 분해한다.","options":[],"answer":"아밀라아제","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다."},{"id":"ch33-q18","no":18,"type":"short","text":"위 안팎으로 물질의 이동을 조절하는 고리형 근육을 ______ (이)라 한다.","options":[],"answer":"괄약근","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다."},{"id":"ch33-q19","no":19,"type":"mc","text":"소화기관 중 하나인 위에서 위산(pH 2)의 역할이 아닌 것은?","options":[{"id":"a","text":"펩시노겐을 펩신으로 바꾼다."},{"id":"b","text":"섭취한 음식물에 있는 세균을 죽인다."},{"id":"c","text":"단백질을 변성시켜 펩타이드 결합을 노출시킨다."},{"id":"d","text":"고기나 식물의 세포들을 서로 붙들어주는 세포외 기질을 파괴한다."},{"id":"e","text":"지질을 녹여 소화효소가 잘 작용하도록 한다."}],"answer":"e","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다."},{"id":"ch33-q20","no":20,"type":"mc","text":"다음 중 위장의 주요 기능이 아닌 것은?","options":[{"id":"a","text":"저장"},{"id":"b","text":"염산(HCl) 생산"},{"id":"c","text":"영양소 흡수"},{"id":"d","text":"소화효소 분비"}],"answer":"c","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다."},{"id":"ch33-q21","no":21,"type":"mc","text":"무엇이 위가 스스로 분해하는 것을 막는가?","options":[{"id":"a","text":"점액질 보호막이 위벽 세포와 위역간의 접촉을 제한한다."},{"id":"b","text":"신경과 호르몬이 음식물이 위에 머무는 동안 위액의 분비를 제한한다."},{"id":"c","text":"3일에 한 번 정도 손상이 일어나는 표피세포가 새로운 세포로 교체되 어야 한다."},{"id":"d","text":"a,b,c 모두 정답"},{"id":"e","text":"정답 없음"}],"answer":"d","ready":true,"keepLabels":true,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다. 사용자가 지정한 정답을 채점 기준으로 적용했습니다."},{"id":"ch33-q22","no":22,"type":"mc","text":"외분비성 췌장기능부전증(Exocrine Pancreatic Insufficiency, EPI) 진 단을 받은 사람은 지방, 단백질, 탄수화물을 소화하는 데 필요한 소화효 소들이 제대로 분비되지 않는다. 이 질환으로 인해 발생할 수 있는 결과 는 무엇이겠는가?","options":[{"id":"a","text":"체중 감소"},{"id":"b","text":"간문맥 확장"},{"id":"c","text":"연동운동 속도 증가"},{"id":"d","text":"담즙 생성 증가"}],"answer":"a","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다."},{"id":"ch33-q23","no":23,"type":"mc","text":"어떤 사람이 담낭을 제거하였고, 그 후 이 사람은 __________________.","options":[{"id":"a","text":"많은 양의 지방이 함유된 음식을 먹을 수 없었다."},{"id":"b","text":"단백질 소화에 문제가 있었다."},{"id":"c","text":"단당류와 이당류는 먹을 수 있지만 다당류는 먹을 수 없었다."},{"id":"d","text":"음식물을 많은 양의 물과 함께 먹어야 했다."},{"id":"e","text":"아미노산을 보충할 필요가 있었다."}],"answer":"a","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다."},{"id":"ch33-q24","no":24,"type":"mc","text":"지방의 흡수가 탄수화물의 흡수와 다른 점은?","options":[{"id":"a","text":"지방을 소화하는 데는 효소가 필요하지 않다."},{"id":"b","text":"지방은 위장에서 흡수되는 반면 탄수화물은 소장에서 흡수된다."},{"id":"c","text":"탄수화물은 소화되기 전에 유화되어야 한다."},{"id":"d","text":"대부분의 흡수된 지방은 림프계로 먼저 들어간다."}],"answer":"d","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다."},{"id":"ch33-q25","no":25,"type":"mc","text":"사람에서 대부분 영양물질은 ______ 에 의해 흡수된다.","options":[{"id":"a","text":"위"},{"id":"b","text":"간"},{"id":"c","text":"소장"},{"id":"d","text":"대장"},{"id":"e","text":"췌장"}],"answer":"c","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다."},{"id":"ch33-q26","no":26,"type":"mc","text":"가장 다양한 소화효소는 ______ 에서 작용한다.","options":[{"id":"a","text":"대장"},{"id":"b","text":"구강"},{"id":"c","text":"위"},{"id":"d","text":"담낭"},{"id":"e","text":"소장"}],"answer":"e","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다."},{"id":"ch33-q27","no":27,"type":"mc","text":"보기 중에서 다음 문장에 적용할 수 없는 것은? ______ 를(을) 몸이 흡수하고 사용하기 위해서 ______ (으)로 가수분해되어야 한다.","options":[{"id":"a","text":"다당류, 단당류"},{"id":"b","text":"아미노산, 단백질"},{"id":"c","text":"지방, 글리세롤과 지방산"},{"id":"d","text":"이당류, 단당류"},{"id":"e","text":"녹말, 단당류"}],"answer":"b","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다."},{"id":"ch33-q28","no":28,"type":"mc","text":"영양분이 흡수된 후 혈액을 통해 먼저 ______ (으)로 운반된다.","options":[{"id":"a","text":"뇌"},{"id":"b","text":"췌장"},{"id":"c","text":"신장"},{"id":"d","text":"간"},{"id":"e","text":"대장"}],"answer":"d","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다."},{"id":"ch33-q29","no":29,"type":"mc","text":"왜 침에 있는 아말라아제는 십이지장에서 녹말을 분해하지 않는가?","options":[{"id":"a","text":"녹말이 맥아당(말토오스)으로 구강에서 완전히 분해되었다."},{"id":"b","text":"위의 산성 pH는 침의 아밀라아제를 변성시키고 펩신이 분해한다."},{"id":"c","text":"침의 아밀라아제는 침샘에서 생성되고 구강을 떠나지 않는다."},{"id":"d","text":"이자(췌장) 아말라아제가 십이지장 pH에서 더 효과적인 효소이다."},{"id":"e","text":"침의 아밀라아제는 글리코겐을 분해할 수 있지만 녹말은 분해할 수 없다."}],"answer":"b","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다."},{"id":"ch33-q30","no":30,"type":"mc","text":"간문맥은","options":[{"id":"a","text":"장의 모세혈관에 공급한다."},{"id":"b","text":"흡수된 영양분을 처리하기 위해 간으로 운반한다."},{"id":"c","text":"혈액을 간에서 심장으로 운반한다."},{"id":"d","text":"용모의 압축을 뽑아낸다."}],"answer":"b","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다."},{"id":"ch33-q31","no":31,"type":"mc","text":"융모(융털)가 무엇이며 무슨 일을 하는가?","options":[{"id":"a","text":"위의 주름으로 위의 확장이 일어나게 한다."},{"id":"b","text":"소화된 지방을 흡수하여 순환계로 이동시키는 림프계의 신장부위이다."},{"id":"c","text":"흡수를 위한 표면적을 넓히는 소장표면의 손가락 모양의 돌기이다."},{"id":"d","text":"소화를 위해 더 넓은 면적을 제공하는 소장표피로 현미경으로 볼 수 있는 돌기이다."},{"id":"e","text":"간문맥을 만들기 위해 연결하는 장 모세혈관의 돌기이다."}],"answer":"c","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다."},{"id":"ch33-q32","no":32,"type":"mc","text":"사람에서 대장의 주기능은?","options":[{"id":"a","text":"물의 흡수"},{"id":"b","text":"음식물의 소화"},{"id":"c","text":"독성물질의 분해"},{"id":"d","text":"영양분 흡수"},{"id":"e","text":"음식물이 소화되어 흡수되기 전에 보관"}],"answer":"a","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다."},{"id":"ch33-q33","no":33,"type":"mc","text":"변비를 일으킬 가능성이 가장 높은 물질은?","options":[{"id":"a","text":"식이섬유가 많이 포함된 물질"},{"id":"b","text":"대장에서 물 흡수를 촉진하는 물질"},{"id":"c","text":"대장을 통한 물질의 이동을 촉진하는 물질"},{"id":"d","text":"대장의 물 흡수를 감소시키는 물질"},{"id":"e","text":"연동운동을 촉진하는 물질"}],"answer":"b","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다."},{"id":"ch33-q34","no":34,"type":"short","text":"변이 배설될 때까지 저장하는 대장의 마지막 6인치를 ______ (이)라 한다.","options":[],"answer":"직장","ready":true,"keepLabels":false,"note":"직접 풀이한 정답표를 사용자 확인 후 반영했습니다."},{"id":"ch33-q35","no":35,"type":"short","text":"다음 물음에 해당하는 기관을 그림에서 고르시오.\n\n                                (1) 단백질이 처음 소화되기 시작하      (____)\n                                  는 곳은?\n\n                                (2) 고분자의 가수분해가 가장 많이      (____)\n                                  일어나는 곳은?\n\n                                (3) 가장 다양한 소화효소가 분비되      (____)\n                                  는 곳은?\n\n                                (4) 중탄산염이 풍부한 염기성 용액      (____)\n                                  이 분비된는 곳은?\n\n                                (5) 지방을 유화시키는 데 도움이       (____)\n                                      되는 물질을 생성하는 곳은?\n\n                                (6) 지방의 소화가 주로 일어나는       (____)\n                                      곳은?\n\n                                (7) 물 흡수가 주로 일어나는 곳은?     (____)","options":[],"answer":"3, 4, 8, 8, 9, 4, 5","ready":true,"keepLabels":false,"note":"사용자가 제공한 원본 그림과 확인한 정답을 반영했습니다. 소문항 순서대로 그림의 번호를 입력하세요."
