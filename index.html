<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>과목별 문제은행</title><style>*{box-sizing:border-box}body{margin:0;background:#111a16;color:#edf5ef;font-family:system-ui,sans-serif}main{max-width:900px;margin:auto;padding:80px 24px}p{color:#b6cabe;line-height:1.7}h1{font-size:36px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;margin-top:40px}a{display:block;background:#20382b;border:1px solid #4a7159;border-radius:20px;padding:30px;color:inherit;text-decoration:none}a:hover{background:#2c4938}a:focus-visible{outline:3px solid #a3dfb8}h2{margin-top:0}small{color:#b6cabe}</style><style id="subject-menu-style">
.subject-bar{position:relative;background:#182d23;color:#fff;padding:10px 20px;z-index:1000;font-family:system-ui,sans-serif}
.subject-toggle{display:flex;align-items:center;gap:10px;background:transparent!important;color:#fff!important;border:1px solid #658172!important;border-radius:8px;padding:9px 12px;font-size:16px;cursor:pointer}
.subject-drawer[hidden]{display:none!important}.subject-drawer{position:absolute;top:100%;left:12px;width:min(300px,calc(100vw - 24px));padding:12px;background:#182d23;border:1px solid #658172;border-radius:0 0 12px 12px;box-shadow:0 12px 28px #0005;display:grid;gap:8px}
.subject-drawer a{display:block!important;margin:0!important;padding:14px 16px!important;border:1px solid #658172!important;border-radius:8px!important;background:#223e30!important;color:#fff!important;text-decoration:none!important;font-size:16px}
.subject-drawer a:hover,.subject-drawer a[aria-current="page"]{background:#39654e!important}
.subject-toggle:focus-visible,.subject-drawer a:focus-visible{outline:3px solid #b7efcf;outline-offset:3px}
</style></head><body><div class="subject-bar" id="subject-bar"><button type="button" class="subject-toggle" id="subject-toggle" aria-label="과목 메뉴" aria-expanded="false" aria-controls="subject-drawer"><span aria-hidden="true">☰</span> 과목 메뉴</button><nav class="subject-drawer" id="subject-drawer" aria-label="과목 이동" hidden><a href="./index.html?v=menu1" aria-current="page">전체 과목</a><a href="./biology.html?v=menu1">생명과학</a><a href="./maumri.html?v=menu1">마움리</a><a href="./dongbuka.html?v=20261121">동북아</a></nav></div><main><p>나의 학습 공간</p><h1>과목별 문제은행</h1><p>공부할 과목을 선택하세요.<br>문제 풀이와 문항 관리는 각 과목에서 이어갈 수 있습니다.</p><div class="grid"><a href="./biology.html?v=20261120-menu1"><h2>생명과학</h2><p>챕터별 문제 · 랜덤 시험 · 오답 복습</p><b>문제은행 열기</b></a><a href="./maumri.html?v=20261120-menu1"><h2>마움리</h2><p>첨부한 문제은행의 문제와 학습 기능</p><b>문제은행 열기</b></a><a href="./dongbuka.html?v=20261121"><h2>동북아</h2><p>동북아와 한일관계 · 객관식 족보 · 오답 복습</p><b>문제은행 열기</b></a></div><p><small>수정 내용과 학습 기록은 현재 브라우저에 저장됩니다.</small></p></main><script>(()=>{const bar=document.getElementById('subject-bar'),button=document.getElementById('subject-toggle'),menu=document.getElementById('subject-drawer');function close(){menu.hidden=true;button.setAttribute('aria-expanded','false')}button.addEventListener('click',()=>{const open=menu.hidden;menu.hidden=!open;button.setAttribute('aria-expanded',String(open))});document.addEventListener('click',e=>{if(!bar.contains(e.target))close()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!menu.hidden){close();button.focus()}})})();</script></body></html>
